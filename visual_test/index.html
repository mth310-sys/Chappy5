<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホールレイアウト / 正面俯瞰03</title><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#080c0f;color:#edf3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h2{margin:0 0 5px;font-size:18px}.note{margin:0 0 10px;color:#9eafb8;font-size:12px}.viewport{height:650px;overflow:auto;border:1px solid #3c4a51;border-radius:10px;background:#090d10;-webkit-overflow-scrolling:touch}.scene{position:relative;width:1300px;height:1050px;background:linear-gradient(#151b1e 0 13%,#1a2022 13% 100%);overflow:hidden}.floor{position:absolute;left:0;right:0;top:115px;bottom:0;background:linear-gradient(180deg,#303638 0,#202627 25%,#121718 100%);clip-path:polygon(19% 0,81% 0,100% 100%,0 100%)}.floor:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 129px,#58616435 130px,#58616435 131px),repeating-linear-gradient(0deg,transparent 0 89px,#5861642b 90px,#5861642b 91px);transform:perspective(650px) rotateX(58deg);transform-origin:50% 0}.backwall{position:absolute;left:247px;top:52px;width:806px;height:72px;background:linear-gradient(#343b3e,#14191b);border:2px solid #080b0c}.counterdesk{position:absolute;right:285px;top:72px;width:170px;height:52px;background:linear-gradient(#655f58,#302c28);border:2px solid #171513;display:grid;place-items:center;color:#d6ccc0;font-size:11px}.island{position:absolute;left:50%;width:1010px;margin-left:-505px;height:255px;filter:drop-shadow(0 20px 15px #000c)}.i1{top:215px}.i2{top:590px;transform:scale(.86);transform-origin:50% 0}.top{position:absolute;left:20px;top:0;width:970px;height:66px;background:linear-gradient(#60686a,#242a2c 52%,#0d1112);border:2px solid #070909;clip-path:polygon(4.5% 0,95.5% 0,100% 100%,0 100%)}.top:after{content:"反対面9台";position:absolute;right:22px;top:15px;color:#7f8d92;font-size:10px}.front{position:absolute;left:0;top:60px;width:1010px;height:190px;background:linear-gradient(#272d2f,#090c0d 61%,#030404);border:2px solid #040606;display:flex;overflow:hidden}.bay{position:relative;width:112.222px;height:190px;flex:0 0 112.222px;border-right:1px solid #3a4244}.header{position:absolute;left:3px;right:3px;top:3px;height:19px;background:linear-gradient(#818789,#24292b);border:1px solid #050707}.data{position:absolute;left:34px;top:5px;width:45px;height:22px;background:#071012;border:2px solid #566266;z-index:5}.mount{position:absolute;left:16px;top:29px;width:78px;height:106px;background:repeating-linear-gradient(135deg,#07090a 0 7px,#0b0e0f 7px 14px);border:2px solid #363d3f}.rail{position:absolute;left:95px;top:28px;width:4px;height:109px;background:linear-gradient(90deg,#111,#747c7e,#111)}.sand{position:absolute;left:99px;top:33px;width:12px;height:96px;background:linear-gradient(90deg,#080a0b,#4a5558,#111719);border:1px solid #687579}.sand:before{content:"";position:absolute;left:2px;right:2px;top:7px;height:15px;background:#0b282c;border:1px solid #596a6e}.counter{position:absolute;left:2px;right:2px;top:136px;height:20px;background:linear-gradient(#303638,#070909);border:1px solid #010202}.fascia{position:absolute;left:2px;right:2px;top:155px;height:31px;background:linear-gradient(#151819,#030404);border:1px solid #010202}.label{position:absolute;left:12px;bottom:7px;padding:3px 6px;background:#081014cc;border:1px solid #536167;border-radius:4px;color:#cbd5d9;font-size:10px}.aisleMark{position:absolute;left:50%;top:500px;width:820px;margin-left:-410px;text-align:center;color:#6f7b80;font-size:10px;letter-spacing:.18em;border-top:1px dashed #596469;padding-top:8px}.entrance{position:absolute;left:500px;top:930px;width:300px;height:72px;border:2px solid #566469;background:#12191c;display:grid;place-items:center;color:#9fb0b8}.legend{margin-top:10px;padding:9px 11px;background:#101820;border:1px solid #41545e;border-radius:7px;color:#b8c6cd;font-size:12px;line-height:1.55}</style></head><body><h2>ホールレイアウト / 正面俯瞰03</h2><div class="note">正面中央の視点を維持し、視点の高さだけ上げた確認版。</div><div class="viewport" id="vp" data-playtest-scroll><div class="scene"><div class="floor"></div><div class="backwall"></div><div class="counterdesk">景品カウンター</div><div class="island i1"><div class="top"></div><div class="front" id="front1"></div><div class="label">島 A / 18台</div></div><div class="aisleMark">MAIN AISLE</div><div class="island i2"><div class="top"></div><div class="front" id="front2"></div><div class="label">島 B / 18台</div></div><div class="entrance">ENTRANCE / 入口</div></div></div><div class="legend">正面は水平・左右のパースなし。上面と床だけを見せて、高い位置から正面を見下ろす。</div><script>const bay='<div class="bay"><div class="header"></div><div class="data"></div><div class="mount"></div><div class="rail"></div><div class="sand"></div><div class="counter"></div><div class="fascia"></div></div>';for(const id of ['front1','front2'])document.getElementById(id).innerHTML=bay.repeat(9);addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(1300-v.clientWidth)/2;v.scrollTop=80})</script></body></html>
