<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ノクターン・アクアリウム // Prototype</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#01060b;color:#eafaff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}body{display:grid;place-items:center;padding:10px;background:radial-gradient(circle at 50% 10%,#063854 0,#03111d 42%,#010407 100%)}.wrap{width:min(100%,430px)}.lab{text-align:center;font-size:10px;letter-spacing:.22em;color:#6cb5cf;margin-bottom:7px}.machine{position:relative;border-radius:30px 30px 22px 22px;padding:12px;background:linear-gradient(100deg,#0d2631,#a3dceb 7%,#153846 12%,#041019 22%,#041019 78%,#153846 88%,#a3dceb 93%,#0d2631);box-shadow:0 24px 70px #000,0 0 40px #1aa9d42b;border:1px solid #8dd4ea}.tube{position:absolute;top:80px;bottom:95px;width:18px;border-radius:20px;border:1px solid #78dffc66;background:linear-gradient(90deg,#ffffff1a,#2bd7ff44,#061c2b 75%);overflow:hidden;box-shadow:inset 0 0 12px #75eaff55}.tube.l{left:3px}.tube.r{right:3px}.bubble{position:absolute;width:5px;height:5px;border-radius:50%;background:#bdf6ffb8;animation:up 7s linear infinite}.bubble:nth-child(2){left:8px;animation-delay:-2.6s;animation-duration:9s}.bubble:nth-child(3){left:4px;animation-delay:-5s;animation-duration:6s}@keyframes up{from{transform:translateY(420px);opacity:0}15%{opacity:.9}to{transform:translateY(-10px);opacity:0}}.crown{text-align:center;padding:3px 0 8px}.title{font-family:serif;font-weight:800;font-size:27px;letter-spacing:.08em;color:#ddfbff;text-shadow:0 0 10px #48d7ff,0 0 28px #2468ff}.sub{font-size:9px;letter-spacing:.35em;color:#6bd9f7}.screen{position:relative;height:250px;overflow:hidden;border-radius:18px;border:2px solid #347b99;background:linear-gradient(#06314d,#0a2436 58%,#041017);box-shadow:inset 0 0 40px #000,0 0 22px #39d7ff33}.deep{position:absolute;inset:0;background:radial-gradient(circle at 50% 115%,#1095b4 0,transparent 35%),linear-gradient(180deg,#0b4564aa,transparent 50%)}.city{position:absolute;left:0;right:0;bottom:0;height:118px;background:linear-gradient(90deg,#07121b 3%,transparent 3% 9%,#07121b 9% 13%,transparent 13% 18%,#07121b 18% 26%,transparent 26% 34%,#07121b 34% 47%,transparent 47% 55%,#07121b 55% 63%,transparent 63% 74%,#07121b 74% 83%,transparent 83% 92%,#07121b 92%);clip-path:polygon(0 55%,5% 51%,9% 26%,13% 50%,18% 38%,22% 55%,28% 29%,33% 57%,39% 42%,45% 58%,50% 18%,56% 55%,63% 34%,70% 55%,75% 22%,80% 56%,86% 43%,92% 57%,96% 30%,100% 55%,100% 100%,0 100%);opacity:.88;filter:drop-shadow(0 0 5px #1dc8ff)}.jelly{position:absolute;width:42px;height:54px;left:67%;top:36px;filter:drop-shadow(0 0 11px #9cedff);animation:float 4.5s ease-in-out infinite}.jelly:before{content:"";position:absolute;width:42px;height:26px;border-radius:50% 50% 35% 35%;background:radial-gradient(circle at 40% 30%,#e8fdffdd,#64d8ff66 55%,#8a62ff44);border:1px solid #baf4ff}.jelly:after{content:"";position:absolute;left:8px;top:22px;width:26px;height:28px;border-left:2px solid #a4eaff99;border-right:2px solid #8ddfff88;border-radius:0 0 50% 50%}@keyframes float{50%{transform:translateY(13px) rotate(3deg)}}.memory{position:absolute;left:15px;top:17px;width:56px;height:56px;border-radius:50%;border:1px solid #71e1ff;background:radial-gradient(circle,#bff9ffcc 0 8%,#418eff66 22%,#a23cff44 45%,transparent 70%);box-shadow:0 0 20px #3ddcff;transition:.4s}.screen.shift .memory{transform:scale(1.35);filter:hue-rotate(55deg)}.hud{position:absolute;left:10px;right:10px;top:9px;display:flex;justify-content:flex-end;gap:8px;font-size:10px;color:#b7f4ff}.msg{position:absolute;left:13px;right:13px;bottom:12px;font-family:serif;font-size:14px;text-shadow:0 2px 7px #000}.glass{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,#ffffff10 0 12%,transparent 18% 64%,#ffffff08 74%,transparent 83%);mix-blend-mode:screen}.reelDeck{margin-top:8px;padding:10px;border-radius:14px;background:linear-gradient(#061017,#0c1b23);border:1px solid #28677f;box-shadow:inset 0 0 24px #000}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px;border-radius:10px;background:#020506}.reel{height:112px;overflow:hidden;border-radius:8px;background:linear-gradient(90deg,#8aa1a4,#eef5ec 24%,#fff 49%,#e8f4f2 74%,#879da2);box-shadow:inset 0 0 13px #28333a}.strip{height:100%;display:grid;grid-template-rows:repeat(3,1fr)}.reel.spin .strip{filter:blur(3px)}.sym{display:grid;place-items:center;font:900 21px serif;color:#153344;border-bottom:1px solid #8fa3a6;text-shadow:0 1px #fff}.sym.red{color:#b51b2f}.sym.blue{color:#13629b}.sym.gold{color:#806000}.controls{display:grid;grid-template-columns:65px 1fr 1fr 1fr 65px;gap:7px;align-items:center;padding-top:10px}.bet,.stop,.lever{border:0;color:#fff;font-weight:800;touch-action:manipulation;box-shadow:0 5px 11px #000,inset 0 2px 3px #ffffff22}.bet{height:44px;border-radius:11px;background:linear-gradient(#15475c,#07171f);font-size:10px}.lever{height:48px;border-radius:22px;background:radial-gradient(circle at 40% 30%,#5d7480,#0d171c 48%,#020405 72%);font-size:9px}.stop{height:55px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ff625d,#a20b18 55%,#4b0409 72%);font-size:11px}.stop:disabled,.lever:disabled{opacity:.35}.meters{display:flex;justify-content:space-between;padding:9px 5px 0;font:700 11px ui-monospace,monospace;color:#8edcf1}.memoryLog{margin-top:8px;border-radius:13px;padding:9px 12px;background:linear-gradient(90deg,#06141d,#0b2531);border:1px solid #275e73;font-size:10px;color:#8cc9dc;min-height:43px}.memoryLog b{color:#e4fbff}.foot{text-align:center;font-size:9px;color:#54727e;padding:8px}.machine.ripple{animation:ripple .35s ease}@keyframes ripple{50%{filter:brightness(1.25) saturate(1.25)}}
</style></head><body><div class="wrap"><div class="lab">YUSOSHA // BROWSER PROTOTYPE 0</div><main class="machine" id="machine"><div class="tube l"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div><div class="tube r"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div><div class="crown"><div class="title">ノクターン・アクアリウム</div><div class="sub">NOCTURNE AQUARIUM</div></div><section class="screen" id="screen"><div class="deep"></div><div class="city"></div><div class="memory"></div><div class="jelly"></div><div class="hud"><span>DEPTH <b id="depth">01</b></span><span>MEM <b id="mem">0</b>/3</span></div><div class="msg" id="msg">静かな海底都市。レバーで観測を始める。</div><div class="glass"></div></section><section class="reelDeck"><div class="reels" id="reels"></div><div class="controls"><button class="bet" id="bet">MAX<br>BET</button><button class="stop" data-i="0" disabled>Ⅰ</button><button class="stop" data-i="1" disabled>Ⅱ</button><button class="stop" data-i="2" disabled>Ⅲ</button><button class="lever" id="lever">LEVER</button></div><div class="meters"><span>CREDIT <b id="credit">50</b></span><span>BET <b id="betv">0</b></span><span>GAME <b id="game">0</b></span></div></section><div class="memoryLog" id="log"><b>OBSERVATION LOG</b><br>まだ記憶は観測されていない。</div></main><div class="foot">Prototype tuning only / no real-money gambling</div></div><script>
const sets=[['灯','泡','七','月','鍵','泡','灯','七'],['泡','月','灯','鍵','七','泡','月','灯'],['灯','七','泡','鍵','月','七','泡','灯']];let credit=50,bet=0,game=0,spinning=false,stopped=[true,true,true],mem=0,depth=1,timers=[];const $=s=>document.querySelector(s),reels=$('#reels'),machine=$('#machine'),screen=$('#screen');
function cl(s){return s==='七'?'red':s==='泡'?'blue':s==='灯'?'gold':''}function draw(i,o=Math.floor(Math.random()*sets[i].length)){const out=[];for(let j=0;j<3;j++){let s=sets[i][(o+j)%sets[i].length];out.push(`<div class="sym ${cl(s)}">${s}</div>`)}document.querySelectorAll('.reel')[i].querySelector('.strip').innerHTML=out.join('')}
for(let i=0;i<3;i++){reels.insertAdjacentHTML('beforeend','<div class="reel"><div class="strip"></div></div>');draw(i,i)}
function ui(){$('#credit').textContent=credit;$('#betv').textContent=bet;$('#game').textContent=game;$('#mem').textContent=mem;$('#depth').textContent=String(depth).padStart(2,'0');$('#lever').disabled=spinning||bet<3;document.querySelectorAll('.stop').forEach((b,i)=>b.disabled=!spinning||stopped[i])}
function tone(f,d=.06,type='sine',gain=.028){try{window.ac??=new AudioContext();const a=window.ac,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(gain,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
$('#bet').onclick=()=>{if(spinning||bet===3||credit<3)return;credit-=3-bet;bet=3;tone(190,.05,'sine');$('#msg').textContent='観測準備完了。';ui()};
$('#lever').onclick=()=>{if(spinning||bet<3)return;spinning=true;game++;stopped=[false,false,false];$('#msg').textContent='海の記憶が揺れている。';document.querySelectorAll('.reel').forEach((r,i)=>{r.classList.add('spin');timers[i]=setInterval(()=>draw(i),90)});tone(82,.18,'sine',.022);ui()};
function stop(i){if(!spinning||stopped[i])return;stopped[i]=true;clearInterval(timers[i]);document.querySelectorAll('.reel')[i].classList.remove('spin');draw(i);tone(220+i*55,.07,'triangle',.032);machine.classList.add('ripple');setTimeout(()=>machine.classList.remove('ripple'),360);const n=stopped.filter(Boolean).length;$('#msg').textContent=['','第一観測。光の位置を記録。','第二観測。何かが一致し始めた。','記憶を照合中……'][n];if(n===3)resolve();ui()}
document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>stop(+b.dataset.i));
function resolve(){const event=Math.random()<.42;if(event){mem=Math.min(3,mem+1);credit+=4;const lines=['誰かがこの広場で待っていた。','閉鎖された塔から、まだ信号が出ている。','少女の記憶と、街の記録が食い違っている。'];$('#log').innerHTML=`<b>OBSERVATION ${mem}</b><br>${lines[mem-1]||lines[2]}`;screen.classList.add('shift');tone(520,.18,'sine',.04);setTimeout(()=>screen.classList.remove('shift'),700);if(mem===3){depth++;mem=0;$('#msg').textContent='記憶が接続された。都市の景色が変わる。';document.documentElement.style.setProperty('filter','none');screen.style.filter=`hue-rotate(${depth*17}deg)`}else $('#msg').textContent='記憶片を観測した。'}else $('#msg').textContent='静かなゲーム。だが街は少しずつ違って見える。';spinning=false;bet=0;ui()}
ui();
</script></body></html>
