ransform:translateY(490px) scale(.65);opacity:0}12%{opacity:.86}to{transform:translateY(-18px) scale(1.1);opacity:0}}.crown{text-align:center;padding:2px 0 8px;position:relative}.crown:before,.crown:after{content:"";position:absolute;bottom:2px;width:31%;height:1px;background:linear-gradient(90deg,transparent,#83d9e7)}.crown:before{left:4%}.crown:after{right:4%;transform:scaleX(-1)}.title{font-family:"Yu Mincho",serif;font-weight:800;font-size:25px;letter-spacing:.075em;color:#e4fcff;text-shadow:0 0 8px #55e5ff,0 0 22px #2773e9}.sub{font-size:8px;letter-spacing:.36em;color:#75d9e9}.tankFrame{position:relative;padding:4px;clip-path:polygon(7% 0,93% 0,100% 5%,99% 94%,92% 100%,8% 100%,1% 94%,0 5%);background:linear-gradient(105deg,#274d58,#bdeef1 6%,#1b4e5b 12%,#03121a 20%,#062632 80%,#7cc8d1 94%,#244752);box-shadow:0 8px 17px #000,inset 0 0 0 1px #d6fcff55}.screen{position:relative;height:232px;overflow:hidden;border-radius:17px;background:linear-gradient(#073d59 0,#0a3042 50%,#06141d 100%);box-shadow:inset 0 0 48px #000,0 0 24px #46dfff26;transition:background .8s}.screen:before{content:"";position:absolute;z-index:14;inset:0;pointer-events:none;background:linear-gradient(112deg,#ffffff13 0 10%,transparent 17% 59%,#ffffff0e 64%,transparent 72%),radial-gradient(circle at 13% 3%,#fff2 0 2%,transparent 8%);mix-blend-mode:screen}.water{position:absolute;inset:-20% -12%;background:repeating-radial-gradient(ellipse at 50% 0,#8df1ff0d 0 1px,transparent 2px 16px);transform:perspective(280px) rotateX(66deg) translateY(-40%);opacity:.45;animation:water 8s linear infinite}@keyframes water{to{background-position:0 34px}}.far{position:absolute;inset:0;background:radial-gradient(circle at 50% 118%,rgba(40,202,224,var(--depthGlow)) 0,transparent 32%),linear-gradient(180deg,#0a4d6a55,transparent 52%);transform:translateY(var(--depthShift));transition:transform .9s}.cityBack{position:absolute;left:-4%;right:-4%;bottom:24px;height:93px;opacity:.35;filter:blur(1px) drop-shadow(0 0 6px le at 40% 30%,#ecffffdd,#65dcff6b 55%,#8a62ff44);border:1px solid #c8f8ff}.jelly:after{content:"";position:absolute;left:7px;top:20px;width:25px;height:29px;border-left:2px solid #b5efff88;border-right:2px solid #8be5ff77;border-radius:0 0 50% 50%}@keyframes float{50%{transform:translateY(12px) rotate(3deg)}}.zones{position:absolute;z-index:9;left:9px;right:9px;bottom:38px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;pointer-events:none}.zone{height:23px;display:grid;place-items:center;border-radius:50%;border:1px solid #7de8ff22;background:#06212d22;color:#a9ecf555;font-size:8px;letter-spacing:.08em;transition:.25s}.zone.active{border-color:#a8f4ffcc;background:#2bd6ff25;color:#eaffff;box-shadow:0 0 13px #2edbff88,inset 0 0 10px #49dfff30;transform:translateY(-2px)}.hud{position:absolute;right:9px;top:8px;z-index:11;display:flex;gap:7px;font-size:9px;color:#c1f4ff}.lens{position:absolute;left:12px;top:76px;z-index:11;padding:5px 7px;border-radius:999px;border:1px solid #8beeff4d;background:#021019c7;color:#bff6ff;font-size:8px;letter-spacing:.05em}.msg{position:absolute;z-index:11;left:13px;right:13px;bottom:10px;font-family:"Yu Mincho",serif;font-size:13px;text-shadow:0 2px 7px #000,0 0 9px #000}.particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#d8ffffaa 0 1px,transparent 1.5px),radial-gradient(circle,#83eaff66 0 1px,transparent 1.5px);background-size:49px 57px,73px 81px;background-position:7px 9px,31px 21px;animation:drift 12s linear infinite;opacity:.35}@keyframes drift{to{background-position:7px -48px,31px -60px}}.glass{position:absolute;z-index:13;inset:0;pointer-events:none;border-radius:15px;box-shadow:inset 8px 0 14px #fff1,inset -10px 0 18px #0004,inset 0 0 1px 1px #baf7ff55}.depthRing{height:12px;margin:-3px 10px 0;border-radius:50%;border:1px solid #7de9f25c;background:radial-gradient(ellipse,#63e9ff23 0 22%,#071920 23% 45%,transparent 48%);box-shadow:0 0 15px #26c7df2e;transform:perspective(100px) rotateX(70deg)}.reelDeck{position:relative;margin:0 3px;padding:9px;border-radius:14px 14px 22px 22px;background:linear-gradient(#06141b,#0e242c 50%,#041016);border:1px solid #397c8c;box-shadow:0 8px 20px #000,inset 0 0 26px #000}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:9px;background:#010506;box-shadow:inset 0 6px 14px #000}.reel{position:relative;height:106px;overflow:hidden;border-radius:5px;background:linear-gradient(90deg,#789498,#e8f5f2 15%,#fff 47%,#eaf6f3 77%,#70898e);box-shadow:inset 4px 0 6px #0005,inset -4px 0 6px #0005,0 0 0 1px #43646a;transition:.2s}.reel:after{content:"";position:absolute;left:0;right:0;top:33.3%;height:33.3%;border-top:1px solid #8fb3b855;border-bottom:1px solid #56767b55;box-shadow:inset 0 7px 10px #fff3,inset 0 -7px 10px #0002;pointer-events:none}.reel.lensPick{transform:translateY(-2px);box-shadow:0 0 0 2px #80eaff,0 0 19px #37dcff88,inset 4px 0 6px #0005,inset -4px 0 6px #0005}.strip{height:100%;display:grid;grid-template-rows:repeat(3,1fr)}.reel.spin .strip{filter:blur(2.7px) contrast(.9)}.sym{display:grid;place-items:center;font:900 21px "Yu Mincho",serif;color:#183a46;border-bottom:1px solid #91a7aa;text-shadow:0 1px #fff}.sym.red{color:#ac2639}.sym.blue{color:#1b6492}.sym.gold{color:#806315}.controls{display:grid;grid-template-columns:64px 1fr 1fr 1fr 64px;gap:7px;align-items:center;padding-top:9px}.bet,.stop,.lever{border:0;color:#fff;font-weight:800;touch-action:manipulation;transition:transform .06s,filter .12s;box-shadow:0 5px 11px #000,inset 0 2px 3px #ffffff2d}.bet:active,.stop:active,.lever:active{transform:translateY(2px);filter:brightness(1.15)}.bet{height:42px;border-radius:11px;background:linear-gradient(#1d5869,#0a2530 57%,#031116);font-size:9px;border:1px solid #4c8898}.lever{height:47px;border-radius:22px;background:radial-gradient(circle at 38% 27%,#729099,#1a3037 44%,#030708 72%);font-size:8px;border:1px solid #64808a}.stop{height:54px;border-radius:50%;background:radial-gradient(circle at 38% 27%,#ff7169,#bd1727 46%,#6f0711 69%,#300207 75%);font-size:11px;border:2px solid #d3a6aa;box-shadow:0 5px 11px #000,inset 0 2px 4px #fff6,0 0 0 2px #3e2528}.stop:disabled,.lever:disabled{opacity:.32;filter:saturate(.45)}.meters{display:flex;justify-content:space-between;padding:8px 5px 0;font:700 10px ui-monospace,monospace;color:#9fdcea}.memoryLog{position:relative;margin:7px 4px 0;padding:9px 12px 10px;border-radius:10px 10px 18px 18px;background:linear-gradient(90deg,#06151d,#0b2c38 48%,#06151d);border:1px solid #2e6d7b;font-size:9px;color:#8ec8d3;min-height:45px;box-shadow:inset 0 0 17px #000}.memoryLog:before{content:"";position:absolute;left:50%;top:-1px;width:76px;height:1px;transform:translateX(-50%);background:#8fefff;box-shadow:0 0 8px #54ddf3}.memoryLog b{color:#e9ffff;letter-spacing:.08em}.foot{text-align:center;font-size:8px;color:#54727e;padding:6px}.machine.ripple{animation:ripple .3s ease}@keyframes ripple{50%{filter:brightness(1.18) saturate(1.16)}}@media(max-width:380px){body{padding-left:4px;padding-right:4px}.machine{padding-left:13px;padding-right:13px}.screen{height:218px}.title{font-size:22px}.reel{height:100px}.controls{grid-template-columns:58px 1fr 1fr 1fr 58px;gap:5px}.stop{height:50px}.tube{width:19px}}@media(prefers-reduced-motion:reduce){.bubble,.jelly,.particles,.water,.machine.ripple{animation-duration:.1s}}
</style></head><body><div class="wrap"><div class="lab">YUSOSHA // VISUAL BUILD</div><main class="machine" id="machine"><div class="tube l"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div><div class="tube r"><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div><div class="crown"><div class="title">ノクターン・アクアリウム</div><div class="sub">NOCTURNE AQUARIUM</div></div><div class="tankFrame"><section class="screen" id="screen"><div class="water"></div><div class="far"></div><div class="cityBack"></div><div class="city"></div><div class="lights"></div><div class="particles"></div><div class="memory"></div><div class="jelly"></div><div class="zones"><div class="zone" data-zone="0">広場</div><div class="zone" data-zone="1">塔</div><div class="zone" data-zone="2">記録庫</div></div><div class="hud"><span>DEPTH <b id="depth">01</b></span><span>MEM <b id="mem">0</b>/3</span></div><div class="lens" id="lens">観測層：未選択</div><div class="msg" id="msg">静かな海底都市。MAX BETで観測準備。</div><div class="glass"></div></section></div><div class="depthRing"></div><section class="reelDeck"><div class="reels" id="reels"></div><div class="controls"><button class="bet" id="bet">MAX<br>BET</button><button class="stop" data-i="0" disabled>Ⅰ</button><button class="stop" data-i="1" disabled>Ⅱ</button><button class="stop" data-i="2" disabled>Ⅲ</button><button class="lever" id="lever">LEVER</button></div><div class="meters"><span>CREDIT <b id="credit">180</b></span><span>BET <b id="betv">0</b></span><span>GAME <b id="game">0</b></span></div></section><div class="memoryLog" id="log"><b>OBSERVATION LOG</b><br>最初に止めたリールが観測する場所を決める。</div></main><div class="foot">Prototype-only temporary tuning / no real-money gambling</div></div><script>
const strips=[['灯','泡','七','月','鍵','泡','灯','七'],['泡','月','灯','鍵','七','泡','月','灯'],['灯','七','泡','鍵','月','七','泡','灯']],lensNames=['広場','塔','記録庫'];let credit=180,bet=0,game=0,spinning=false,stopped=[true,true,true],mem=0,depth=1,timers=[],centers=['','',''],seq=[],lens=-1,found=new Set();const $=s=>document.querySelector(s),reels=$('#reels'),machine=$('#machine'),screen=$('#screen');function cl(s){return s==='七'?'red':s==='泡'?'blue':s==='灯'?'gold':''}function draw(i,o=Math.floor(Math.random()*strips[i].length)){const out=[];for(let j=0;j<3;j++){const s=strips[i][(o+j)%strips[i].length];out.push(`<div class="sym ${cl(s)}">${s}</div>`)}document.querySelectorAll('.reel')[i].querySelector('.strip').innerHTML=out.join('');return strips[i][(o+1)%strips[i].length]}for(let i=0;i<3;i++){reels.insertAdjacentHTML('beforeend','<div class="reel"><div class="strip"></div></div>');draw(i,i)}function ui(){$('#credit').textContent=credit;$('#betv').textContent=bet;$('#game').textContent=game;$('#mem').textContent=mem;$('#depth').textContent=String(depth).padStart(2,'0');$('#lever').disabled=spinning||bet<3;document.querySelectorAll('.stop').forEach((b,i)=>b.disabled=!spinning||stopped[i])}function setDepthVisual(){const shift=Math.min(18,(depth-1)*3);screen.style.setProperty('--depthShift',`${shift}px`);screen.style.setProperty('--depthGlow',String(Math.min(.72,.42+(depth-1)*.055)));screen.style.background=depth%2===0?'linear-gradient(#08364f 0,#092938 49%,#040f16 100%)':'linear-gradient(#073d59 0,#0a3042 50%,#06141d 100%)'}function tone(f,d=.06,type='sine',gain=.028){try{window.ac??=new AudioContext();const a=window.ac,o=a.createOscillator(),g=a.createGain();if(a.state==='suspended')a.resume();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(gain,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function selectZone(i){document.querySelectorAll('.zone').forEach((z,n)=>z.classList.toggle('active',n===i));$('#lens').textContent=`観測層：${lensNames[i]}`}$('#bet').onclick=()=>{if(spinning||bet===3||credit<3)return;credit-=3-bet;bet=3;tone(190,.05,'sine');$('#msg').textContent='観測準備完了。レバーで記憶層へ。';ui()};$('#lever').onclick=()=>{if(spinning||bet<3)return;spinning=true;game++;stopped=[false,false,false];centers=['','',''];seq=[];lens=-1;document.querySelectorAll('.zone').forEach(z=>z.classList.remove('active'));$('#lens').textContent='観測層：最初のSTOPで選択';$('#msg').textContent='どこを見る？ 最初のSTOPが観測場所になる。';document.querySelectorAll('.reel').forEach((r,i)=>{r.classList.remove('lensPick');r.classList.add('spin');timers[i]=setInterval(()=>draw(i),88)});tone(82,.18,'sine',.022);ui()};function stop(i){if(!spinning||stopped[i])return;const n=seq.length+1;stopped[i]=true;seq.push(i);clearInterval(timers[i]);const r=document.querySelectorAll('.reel')[i];r.classList.remove('spin');centers[i]=draw(i,Math.floor(Math.random()*strips[i].length));if(n===1){lens=i;r.classList.add('lensPick');selectZone(i);$('#msg').textContent=`${lensNames[i]}を観測。「${centers[i]}」が見えた。`}else if(n===2){$('#msg').textContent=`第二観測「${centers[i]}」。記憶が重なる。`}else{$('#msg').textContent=`第三観測「${centers[i]}」。照合中……`}tone(220+i*55,.07,'triangle',.032);machine.classList.add('ripple');setTimeout(()=>machine.classList.remove('ripple'),310);if(n===3)resolve();ui()}document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>stop(+b.dataset.i));function classify(){const c=centers,key=c.includes('鍵'),moon=c.includes('月'),lights=c.filter(x=>x==='灯').length,sevens=c.filter(x=>x==='七').length,bubbles=c.filter(x=>x==='泡').length;if(key&&lens===1)return['塔の信号','閉鎖塔の鍵と信号記録が同時に反応した。','tower',3];if(moon&&lens===2)return['少女の記録','月刻の記録に、少女の署名だけが二重に残る。','archive',3];if(lights>=2&&lens===0)return['待つ広場','灯りが二つ。誰かが同じ場所で待ち続けていた。','plaza',3];if(sevens>=2)return['赤い連結記録','同じ印が二つ。異なる時刻の記録が接続した。','seven',2];if(key&&moon)return['鍵と月','開かなかった扉の時刻だけが残っている。','keymoon',2];if(bubbles>=2)return['気泡の残響','声ではなく、浮上する気泡だけが記憶を運ぶ。','bubble',1];return['微かな残像',`${lensNames[lens]}に「${c.join('・')}」の痕跡。まだ意味は繋がらない。`,null,0]}function resolve(){const [name,text,id,strength]=classify();let fresh=false;if(id&&!found.has(id)){found.add(id);fresh=true;if(strength>=3)mem++}if(mem>=3){depth++;mem=0;found.clear();screen.classList.add('shift');setDepthVisual();tone(510,.26,'sine',.035);setTimeout(()=>screen.classList.remove('shift'),720);$('#log').innerHTML=`<b>DEPTH ${String(depth).padStart(2,'0')} // 都市層更新</b><br>三つの強い記憶が接続した。景色が一段近づく。`;$('#msg').textContent='都市が応答した。まだ下に層がある。'}else{if(fresh&&strength>=3){screen.classList.add('shift');setTimeout(()=>screen.classList.remove('shift'),520);tone(390,.17,'sine',.03)}credit+=strength;$('#log').innerHTML=`<b>${name}${fresh&&strength>=3?' // NEW MEMORY':''}</b><br>${text}`;$('#msg').textContent=strength>=3?'記憶が接続した。別の場所も観測してみる。':strength>=1?'痕跡を採取。次の照合へ。':'静けさが戻る。視点を変えれば意味が変わる。'}spinning=false;bet=0;ui()}setDepthVisual();ui();
</script></body></html>
