<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム</title><style>
:root{--aqua:#69e7ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#010407;color:#eaffff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow-x:hidden}button{font:inherit}body{display:grid;place-items:start center;padding:max(7px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom));background:radial-gradient(75% 38% at 50% 0,#0b516e 0,#042235 38%,#01060b 82%)}.wrap{width:min(100%,430px)}.machine{position:relative;isolation:isolate;padding:10px 17px 14px;border-radius:48px 48px 26px 26px;background:linear-gradient(101deg,#0b222b,#9fcbd1 4%,#244a54 8%,#07151d 16%,#051019 50%,#07151d 84%,#244a54 92%,#9fcbd1 96%,#0b222b);border:1px solid #82cedb;box-shadow:0 28px 78px #000,0 0 38px #19bce832,inset 0 0 0 2px #011018}.tube{position:absolute;top:68px;bottom:112px;width:22px;border-radius:16px;border:1px solid #9beaff70;background:linear-gradient(90deg,#ffffff18,#69e7ff42 35%,#0f5465aa 67%,#03141d);box-shadow:inset 0 0 14px #9af4ff58,0 0 14px #2fc6e12b;z-index:5}.tube.l{left:3px}.tube.r{right:3px}.crown{text-align:center;padding:2px 0 8px;position:relative}.title{font-family:"Yu Mincho",serif;font-weight:800;font-size:25px;letter-spacing:.075em;color:#e4fcff;text-shadow:0 0 8px #55e5ff,0 0 22px #2773e9}.sub{font-size:8px;letter-spacing:.36em;color:#75d9e9}.tankFrame{position:relative;padding:4px;background:linear-gradient(105deg,#274d58,#bdeef1 6%,#1b4e5b 12%,#03121a 20%,#062632 80%,#7cc8d1 94%,#244752);box-shadow:0 8px 17px #000,inset 0 0 0 1px #d6fcff55}.screen{position:relative;height:232px;overflow:hidden;border-radius:17px;background:linear-gradient(#073d59 0,#0a3042 50%,#06141d 100%);box-shadow:inset 0 0 48px #000,0 0 24px #46dfff26}.screen:before{content:"";position:absolute;z-index:14;inset:0;pointer-events:none;background:linear-gradient(112deg,#ffffff13 0 10%,transparent 17% 59%,#ffffff0e 64%,transparent 72%)}.water{position:absolute;inset:-20% -12%;background:repeating-radial-gradient(ellipse at 50% 0,#8df1ff0d 0 1px,transparent 2px 16px);transform:perspective(280px) rotateX(66deg) translateY(-40%);opacity:.45;animation:water 8s linear infinite}@keyframes water{to{background-position:0 34px}}.far{position:absolute;inset:0;background:radial-gradient(circle at 50% 118%,#28cae06b 0,transparent 32%),linear-gradient(180deg,#0a4d6a55,transparent 52%)}.cityBack{position:absolute;left:-4%;right:-4%;bottom:24px;height:93px;opacity:.35;filter:blur(1px) drop-shadow(0 0 6px #18acd1);background:repeating-linear-gradient(90deg,#0a2a35 0 9px,transparent 9px 19px);clip-path:polygon(0 50%,6% 41%,11% 52%,17% 27%,21% 54%,29% 42%,35% 55%,42% 24%,48% 52%,56% 35%,63% 55%,71% 21%,77% 52%,85% 37%,92% 56%,100% 43%,100% 100%,0 100%)}.city{position:absolute;left:-2%;right:-2%;bottom:0;height:114px;background:linear-gradient(90deg,#06131b 3%,transparent 3% 9%,#06131b 9% 13%,transparent 13% 18%,#06131b 18% 26%,transparent 26% 34%,#06131b 34% 47%,transparent 47% 55%,#06131b 55% 63%,transparent 63% 74%,#06131b 74% 83%,transparent 83% 92%,#06131b 92%);clip-path:polygon(0 55%,5% 51%,9% 26%,13% 50%,18% 38%,22% 55%,28% 29%,33% 57%,39% 42%,45% 58%,50% 18%,56% 55%,63% 34%,70% 55%,75% 22%,80% 56%,86% 43%,92% 57%,96% 30%,100% 55%,100% 100%,0 100%);opacity:.9;filter:drop-shadow(0 0 6px #1dc8ff)}.lights{position:absolute;left:8%;right:8%;bottom:26px;height:62px;opacity:.42;background:radial-gradient(circle at 8% 60%,#fff 0 1px,transparent 2px),radial-gradient(circle at 27% 35%,#67eaff 0 1px,transparent 2px),radial-gradient(circle at 51% 56%,#fff 0 1px,transparent 2px),radial-gradient(circle at 72% 31%,#8ef4ff 0 1px,transparent 2px),radial-gradient(circle at 92% 62%,#fff 0 1px,transparent 2px)}.jelly{position:absolute;width:39px;height:52px;left:68%;top:40px;filter:drop-shadow(0 0 11px #a7efff);animation:float 4.7s ease-in-out infinite;z-index:5}.jelly:before{content:"";position:absolute;width:39px;height:24px;border-radius:50% 50% 34% 34%;background:radial-gradient(circle at 40% 30%,#ecffffdd,#65dcff6b 55%,#8a62ff44);border:1px solid #c8f8ff}.jelly:after{content:"";position:absolute;left:7px;top:20px;width:25px;height:29px;border-left:2px solid #b5efff88;border-right:2px solid #8be5ff77;border-radius:0 0 50% 50%}@keyframes float{50%{transform:translateY(12px) rotate(3deg)}}.particles{position:absolute;inset:0;z-index:3;pointer-events:none;background-image:radial-gradient(circle,#d8ffffaa 0 1px,transparent 1.5px),radial-gradient(circle,#83eaff66 0 1px,transparent 1.5px);background-size:49px 57px,73px 81px;background-position:7px 9px,31px 21px;animation:drift 12s linear infinite;opacity:.35}@keyframes drift{to{background-position:7px -48px,31px -60px}}.glass{position:absolute;z-index:13;inset:0;pointer-events:none;border-radius:15px;box-shadow:inset 8px 0 14px #fff1,inset -10px 0 18px #0004,inset 0 0 1px 1px #baf7ff55}.depthRing{height:12px;margin:-3px 10px 0;border-radius:50%;border:1px solid #7de9f25c;background:radial-gradient(ellipse,#63e9ff23 0 22%,#071920 23% 45%,transparent 48%);box-shadow:0 0 15px #26c7df2e;transform:perspective(100px) rotateX(70deg)}.reelDeck{position:relative;margin:0 3px;padding:9px;border-radius:14px 14px 22px 22px;background:linear-gradient(#06141b,#0e242c 50%,#041016);border:1px solid #397c8c;box-shadow:0 8px 20px #000,inset 0 0 26px #000}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:5px;border-radius:9px;background:#010506;box-shadow:inset 0 6px 14px #000}.reel{position:relative;height:106px;overflow:hidden;border-radius:5px;background:linear-gradient(90deg,#789498,#e8f5f2 15%,#fff 47%,#eaf6f3 77%,#70898e);box-shadow:inset 4px 0 6px #0005,inset -4px 0 6px #0005,0 0 0 1px #43646a}.reel:after{content:"";position:absolute;left:0;right:0;top:33.3%;height:33.3%;border-top:1px solid #8fb3b855;border-bottom:1px solid #56767b55;box-shadow:inset 0 7px 10px #fff3,inset 0 -7px 10px #0002;pointer-events:none}.strip{height:100%;display:grid;grid-template-rows:repeat(3,1fr)}.reel.spin .strip{filter:blur(2.7px) contrast(.9)}.sym{display:grid;place-items:center;font:900 21px "Yu Mincho",serif;color:#183a46;border-bottom:1px solid #91a7aa;text-shadow:0 1px #fff}.sym.red{color:#ac2639}.sym.blue{color:#1b6492}.sym.gold{color:#806315}.controls{display:grid;grid-template-columns:64px 1fr 1fr 1fr 64px;gap:7px;align-items:center;padding-top:9px}.bet,.stop,.lever{border:0;color:#fff;font-weight:800;touch-action:manipulation;box-shadow:0 5px 11px #000,inset 0 2px 3px #ffffff2d}.bet{height:46px;border-radius:11px;background:linear-gradient(#1d5869,#0a2530 57%,#031116);font-size:9px;border:1px solid #4c8898}.lever{height:47px;border-radius:22px;background:radial-gradient(circle at 38% 27%,#729099,#1a3037 44%,#030708 72%);font-size:8px;border:1px solid #64808a}.stop{height:54px;min-width:44px;border-radius:50%;background:radial-gradient(circle at 38% 27%,#ff7169,#bd1727 46%,#6f0711 69%,#300207 75%);font-size:11px;border:2px solid #d3a6aa;box-shadow:0 5px 11px #000,inset 0 2px 4px #fff6,0 0 0 2px #3e2528}.stop:disabled,.lever:disabled{opacity:.32;filter:saturate(.45)}.meters{display:flex;justify-content:space-between;padding:8px 5px 0;font:700 10px ui-monospace,monospace;color:#9fdcea}@media(max-width:390px){body{padding-left:4px;padding-right:4px}.machine{padding-left:13px;padding-right:13px}.screen{height:218px}.title{font-size:22px}.reel{height:100px}.controls{grid-template-columns:50px repeat(3,minmax(44px,1fr)) 50px;gap:4px}.stop{width:100%;height:52px}.tube{width:19px}}@media(prefers-reduced-motion:reduce){.jelly,.particles,.water{animation-duration:.1s}}
</style></head><body><div class="wrap"><main class="machine" id="machine" data-core="pachislot-v1"><div class="tube l"></div><div class="tube r"></div><div class="crown"><div class="title">ノクターン・アクアリウム</div><div class="sub">NOCTURNE AQUARIUM</div></div><div class="tankFrame"><section class="screen" id="screen"><div class="water"></div><div class="far"></div><div class="cityBack"></div><div class="city"></div><div class="lights"></div><div class="particles"></div><div class="jelly"></div><div class="glass"></div></section></div><div class="depthRing"></div><section class="reelDeck"><div class="reels" id="reels"></div><div class="controls"><button class="bet" id="bet">MAX<br>BET</button><button class="stop" data-i="0" disabled>Ⅰ</button><button class="stop" data-i="1" disabled>Ⅱ</button><button class="stop" data-i="2" disabled>Ⅲ</button><button class="lever" id="lever">LEVER</button></div><div class="meters"><span>CREDIT <b id="credit">180</b></span><span>BET <b id="betv">0</b></span><span>GAME <b id="game">0</b></span></div></section></main></div><script>
const strips=[['灯','泡','七','月','鍵','泡','灯','七'],['泡','月','灯','鍵','七','泡','月','灯'],['灯','七','泡','鍵','月','七','泡','灯']];
let credit=180,bet=0,game=0,spinning=false,stopped=[true,true,true],timers=[],centers=['','',''];
const $=s=>document.querySelector(s),reels=$('#reels'),machine=$('#machine');
function symbolClass(s){return s==='七'?'red':s==='泡'?'blue':s==='灯'?'gold':''}
function draw(i,offset=Math.floor(Math.random()*strips[i].length)){const out=[];for(let j=0;j<3;j++){const s=strips[i][(offset+j)%strips[i].length];out.push(`<div class="sym ${symbolClass(s)}">${s}</div>`)}document.querySelectorAll('.reel')[i].querySelector('.strip').innerHTML=out.join('');return strips[i][(offset+1)%strips[i].length]}
for(let i=0;i<3;i++){reels.insertAdjacentHTML('beforeend','<div class="reel"><div class="strip"></div></div>');draw(i,i)}
function ui(){$('#credit').textContent=credit;$('#betv').textContent=bet;$('#game').textContent=game;$('#lever').disabled=spinning||bet<3;document.querySelectorAll('.stop').forEach((b,i)=>b.disabled=!spinning||stopped[i])}
function roleOf(symbols){const counts={};symbols.forEach(s=>counts[s]=(counts[s]||0)+1);const max=Math.max(...Object.values(counts));if(max===3)return{role:'TRIPLE',payout:9};if((counts['七']||0)>=2)return{role:'SEVEN_PAIR',payout:6};if(max===2)return{role:'PAIR',payout:3};if(symbols.includes('鍵')&&symbols.includes('月'))return{role:'KEY_MOON',payout:2};return{role:'MISS',payout:0}}
function resolveCore(){const result=roleOf(centers);credit+=result.payout;bet=0;spinning=false;machine.dataset.lastRole=result.role;machine.dataset.lastPayout=String(result.payout);machine.dispatchEvent(new CustomEvent('nocturne:core-result',{bubbles:true,detail:{symbols:[...centers],role:result.role,payout:result.payout,prototypeRule:true}}));ui()}
$('#bet').addEventListener('click',()=>{if(spinning||bet===3||credit<3)return;credit-=3-bet;bet=3;ui()});
$('#lever').addEventListener('click',()=>{if(spinning||bet<3)return;spinning=true;game++;stopped=[false,false,false];centers=['','',''];document.querySelectorAll('.reel').forEach((r,i)=>{r.classList.add('spin');timers[i]=setInterval(()=>draw(i),88)});ui()});
function stop(i){if(!spinning||stopped[i])return;stopped[i]=true;clearInterval(timers[i]);const r=document.querySelectorAll('.reel')[i];r.classList.remove('spin');centers[i]=draw(i,Math.floor(Math.random()*strips[i].length));if(stopped.every(Boolean))resolveCore();ui()}
document.querySelectorAll('.stop').forEach(b=>b.addEventListener('click',()=>stop(+b.dataset.i)));
ui();
</script></body></html>
