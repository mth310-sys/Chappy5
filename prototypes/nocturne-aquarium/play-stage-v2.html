<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Stage V2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="shell" src="./play-sound.html" title="ノクターン・アクアリウム"></iframe><script>(()=>{const shell=document.getElementById('shell');let installed=false,gameNo=0,stageIndex=0,stageGames=0,stageLength=9;const stages=[{name:'沈都外縁',tone:'outer'},{name:'月影広場',tone:'plaza'},{name:'玻璃の塔',tone:'tower'},{name:'深層記録庫',tone:'archive'}];function getDoc(){try{const a=shell.contentDocument,b=a&&a.getElementById('shell'),c=b&&b.contentDocument,d=c&&c.getElementById('game');return d&&d.contentDocument}catch(_){return null}}function install(){const d=getDoc();if(!d)return false;if(d.documentElement.dataset.stageV2==='2'){installed=true;return true}d.documentElement.dataset.stageV2='2';const st=d.createElement('style');st.textContent='.gr-observe,.vm-worldports,.vm-optics{display:none!important}.na-stage{position:absolute;z-index:20;left:50%;top:18px;transform:translateX(-50%);pointer-events:none;opacity:0;white-space:nowrap;font:700 13px/1.2 "Yu Mincho",serif;letter-spacing:.12em;color:#efffff;text-shadow:0 2px 10px #000,0 0 12px #70eaff}.na-stage.show{animation:naStageName 1.15s ease-out forwards}@keyframes naStageName{0%{opacity:0;transform:translate(-50%,5px)}18%{opacity:.92;transform:translate(-50%,0)}72%{opacity:.72}100%{opacity:0;transform:translate(-50%,-3px)}}.machine[data-stage-tone="plaza"] .screen{background:linear-gradient(#0a4a60,#0a3042 48%,#07151d)!important}.machine[data-stage-tone="tower"] .screen{background:linear-gradient(#123d57,#092638 48%,#06131d)!important}.machine[data-stage-tone="archive"] .screen{background:linear-gradient(#102843,#071d31 48%,#030b15)!important}.machine.stage-shift .tankFrame{animation:naStageShift .9s ease-out}@keyframes naStageShift{0%{filter:brightness(.62)}35%{filter:brightness(1.3)}100%{filter:brightness(1)}}.machine.na-whisper .lights{opacity:.68!important;filter:brightness(1.15)}.machine.na-whisper .jelly{filter:drop-shadow(0 0 15px #a7efff)}.machine.na-rise .screen{box-shadow:inset 0 0 52px #00131f,0 0 28px #5be9ff45!important}.machine.na-rise .cityBack{opacity:.52!important}.machine.na-rise .tube{box-shadow:inset 0 0 18px #c9ffff7a,0 0 18px #36dff255!important}.machine.na-omen .screen{animation:naOmen 1.15s ease-out}.machine.na-omen .city{filter:drop-shadow(0 0 11px #82efff)!important}.machine.na-omen .tube{box-shadow:inset 0 0 24px #e8ffffaa,0 0 24px #5ceaff88!important}@keyframes naOmen{0%{filter:brightness(.58)}16%{filter:brightness(1.22)}34%{filter:brightness(.76)}100%{filter:brightness(1)}}.machine.na-stop1 .tankFrame{box-shadow:0 8px 18px #000,inset 0 0 0 1px #b9ffff88,0 0 13px #46eaff55!important}.machine.na-stop2 .depthRing{filter:brightness(1.45);box-shadow:0 0 20px #79f1ff77!important}.machine.na-stop3 .screen:after{content:"";position:absolute;z-index:18;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,#dfffff44,transparent 34%);animation:naResolve .34s ease-out}@keyframes naResolve{from{opacity:.9;transform:scale(.72)}to{opacity:0;transform:scale(1.18)}}';d.head.appendChild(st);const screen=d.querySelector('.screen'),machine=d.querySelector('.machine');if(!screen||!machine)return false;const label=d.createElement('div');label.className='na-stage';screen.appendChild(label);let tier='base',clearTierTimer=0;function flashStage(){label.textContent=stages[stageIndex].name;label.classList.remove('show');void label.offsetWidth;label.classList.add('show')}function render(shift=false){const s=stages[stageIndex];machine.dataset.stageTone=s.tone;machine.dataset.stageIndex=String(stageIndex);if(shift){machine.classList.remove('stage-shift');void machine.offsetWidth;machine.classList.add('stage-shift');flashStage();setTimeout(()=>machine.classList.remove('stage-shift'),950)}}function setTier(next){tier=next;machine.dataset.presentationTier=next;machine.classList.remove('na-whisper','na-rise','na-omen');if(next!=='base')machine.classList.add('na-'+next);clearTimeout(clearTierTimer);clearTierTimer=setTimeout(()=>{machine.classList.remove('na-whisper','na-rise','na-omen')},1450)}render();const bet=d.getElementById('bet'),lever=d.querySelector('.lever');if(bet)bet.addEventListener('pointerdown',()=>{if(bet.disabled)return;gameNo++;stageGames++;machine.dataset.gameNo=String(gameNo);machine.dataset.stageGames=String(stageGames);if(stageGames>=stageLength){stageIndex=(stageIndex+1)%stages.length;stageGames=0;stageLength=8+((gameNo+stageIndex*3)%6);render(true)}},{capture:true});if(lever)lever.addEventListener('pointerdown',()=>{if(lever.disabled)return;const mod=gameNo%12;setTier(mod===0?'omen':mod===5||mod===9?'rise':mod===3||mod===7?'whisper':'base')},{capture:true});const stops=[...d.querySelectorAll('.stop')];stops.forEach((btn,i)=>btn.addEventListener('pointerdown',()=>{if(btn.disabled)return;const cls='na-stop'+(i+1);machine.classList.remove('na-stop1','na-stop2','na-stop3');machine.classList.add(cls);setTimeout(()=>machine.classList.remove(cls),i===2&&tier==='omen'?520:260)},{capture:true}));installed=true;return true}function probe(){if(!install())setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,80);setTimeout(install,500);setTimeout(install,1200)});probe()})();</script></body></html>
