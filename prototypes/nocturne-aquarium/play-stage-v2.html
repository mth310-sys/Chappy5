<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Stage V2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="shell" src="./play-sound.html" title="ノクターン・アクアリウム"></iframe><script>(()=>{const shell=document.getElementById('shell');let installed=false,gameNo=0,stageIndex=0,stageGames=0,stageLength=9;const stages=[{name:'沈都外縁',sub:'静かな水路と遠景の灯',tone:'outer'},{name:'月影広場',sub:'沈んだ広場に光が集う',tone:'plaza'},{name:'玻璃の塔',sub:'塔の反射に記憶が滲む',tone:'tower'},{name:'深層記録庫',sub:'都市の記録が眠る深部',tone:'archive'}];function getDoc(){try{const a=shell.contentDocument,b=a&&a.getElementById('shell'),c=b&&b.contentDocument,d=c&&c.getElementById('game');return d&&d.contentDocument}catch(_){return null}}function install(){const d=getDoc();if(!d)return false;if(d.documentElement.dataset.stageV2==='1'){installed=true;return true}d.documentElement.dataset.stageV2='1';const st=d.createElement('style');st.textContent='.gr-observe,.vm-worldports,.vm-optics{display:none!important}.na-stage{position:absolute;z-index:20;left:13px;bottom:11px;pointer-events:none;text-shadow:0 2px 8px #000}.na-stage b{display:block;font:700 13px/1.2 "Yu Mincho",serif;letter-spacing:.09em;color:#eaffff}.na-stage small{display:block;margin-top:3px;font:700 7px/1.2 ui-monospace,monospace;letter-spacing:.08em;color:#8ac6cf;opacity:.82}.machine[data-stage-tone="plaza"] .screen{background:linear-gradient(#0a4a60,#0a3042 48%,#07151d)!important}.machine[data-stage-tone="tower"] .screen{background:linear-gradient(#123d57,#092638 48%,#06131d)!important}.machine[data-stage-tone="archive"] .screen{background:linear-gradient(#102843,#071d31 48%,#030b15)!important}.machine.stage-shift .tankFrame{animation:naStageShift .9s ease-out}@keyframes naStageShift{0%{filter:brightness(.65)}38%{filter:brightness(1.28)}100%{filter:brightness(1)}}';d.head.appendChild(st);const screen=d.querySelector('.screen'),machine=d.querySelector('.machine');if(!screen||!machine)return false;const label=d.createElement('div');label.className='na-stage';label.innerHTML='<b></b><small></small>';screen.appendChild(label);function render(shift=false){const s=stages[stageIndex];label.querySelector('b').textContent=s.name;label.querySelector('small').textContent=s.sub;machine.dataset.stageTone=s.tone;machine.dataset.stageIndex=String(stageIndex);if(shift){machine.classList.remove('stage-shift');void machine.offsetWidth;machine.classList.add('stage-shift');setTimeout(()=>machine.classList.remove('stage-shift'),950)}}render();const bet=d.getElementById('bet');if(bet)bet.addEventListener('pointerdown',()=>{if(bet.disabled)return;gameNo++;stageGames++;machine.dataset.gameNo=String(gameNo);machine.dataset.stageGames=String(stageGames);if(stageGames>=stageLength){stageIndex=(stageIndex+1)%stages.length;stageGames=0;stageLength=8+((gameNo+stageIndex*3)%6);render(true)}},{capture:true});const stops=[...d.querySelectorAll('.stop')];stops.forEach((btn,i)=>btn.addEventListener('pointerdown',()=>{if(btn.disabled)return;machine.dataset.stopBeat=String(i+1);setTimeout(()=>{if(machine.dataset.stopBeat===String(i+1))delete machine.dataset.stopBeat},180)},{capture:true}));installed=true;return true}function probe(){if(!install())setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,80);setTimeout(install,500);setTimeout(install,1200)});probe()})();</script></body></html>
