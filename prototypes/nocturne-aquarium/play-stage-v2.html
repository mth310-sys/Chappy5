<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>NOCTURNE AQUARIUM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="shell" src="./play-sound.html" title="NOCTURNE AQUARIUM"></iframe><script>(()=>{const shell=document.getElementById('shell');const qaMode=new URLSearchParams(location.search).get('qa')==='product-loop';let gameNo=0,stageIndex=0,stageGames=0,stageLength=9,anticipation=0,anticipationTtl=0,bonusGames=0,atGames=0,bonusCharge=0,stopsThisGame=0,roundState='idle',mode='normal',lastEvidence={score:0,token:'none',symbols:[]},stoppedSymbols=['','',''],coreResult=null;const stages=[{tone:'outer'},{tone:'plaza'},{tone:'tower'},{tone:'archive'}];const QA_EVIDENCE=[{score:1,token:'trace',symbols:['月','泡','灯']},{score:2,token:'pair',symbols:['灯','灯','泡']},{score:3,token:'seven-resonance',symbols:['七','月','七']}];let qaIndex=0;function getDoc(){try{const a=shell.contentDocument,b=a&&a.getElementById('shell'),c=b&&b.contentDocument,d=c&&c.getElementById('game');return d&&d.contentDocument}catch(_){return null}}function install(){const d=getDoc();if(!d||d.documentElement.dataset.productRun==='5')return false;const machine=d.querySelector('.machine'),screen=d.querySelector('.screen'),bet=d.getElementById('bet'),lever=d.querySelector('.lever');if(!machine||!screen||!bet||!lever)return false;d.documentElement.dataset.productRun='5';const emit=(type,detail={})=>{const payload={gameNo,stageIndex,anticipation,anticipationTtl,bonusGames,atGames,mode,roundState,...detail};machine.dataset.lastGameEvent=type;d.dispatchEvent(new CustomEvent('nocturne:game-event',{detail:{type,...payload}}))};const st=d.createElement('style');st.textContent='.gr-observe,.vm-worldports,.vm-optics,.na-stage{display:none!important}.na-hit{position:absolute;z-index:30;left:50%;top:42%;transform:translateX(-50%);pointer-events:none;opacity:0;white-space:nowrap;color:#efffff;text-shadow:0 2px 10px #000,0 0 14px #70eaff;font:900 26px/1 serif;letter-spacing:.18em}.na-hit.show{animation:naName 1.15s ease-out forwards}@keyframes naName{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:.95;transform:translate(-50%,0)}70%{opacity:.75}100%{opacity:0;transform:translate(-50%,-4px)}}.machine[data-stage-tone="plaza"] .screen{background:linear-gradient(#0a4a60,#0a3042 48%,#07151d)!important}.machine[data-stage-tone="tower"] .screen{background:linear-gradient(#123d57,#092638 48%,#06131d)!important}.machine[data-stage-tone="archive"] .screen{background:linear-gradient(#102843,#071d31 48%,#030b15)!important}.machine.na-whisper .lights{opacity:.72!important}.machine.na-whisper .jelly{filter:drop-shadow(0 0 13px #a7efff)}.machine.na-rise .screen{box-shadow:inset 0 0 55px #00131f,0 0 30px #5be9ff55!important}.machine.na-rise .tube{box-shadow:inset 0 0 18px #c9ffff88,0 0 18px #36dff266!important}.machine.na-omen .screen{animation:naOmen 1.05s ease-out}.machine.na-omen .tube{box-shadow:inset 0 0 25px #e8ffffbb,0 0 25px #5ceaff99!important}@keyframes naOmen{0%{filter:brightness(.48)}17%{filter:brightness(1.28)}34%{filter:brightness(.68)}100%{filter:brightness(1)}}.machine.na-stop1 .tankFrame{box-shadow:0 8px 18px #000,inset 0 0 0 1px #b9ffff99,0 0 15px #46eaff66!important}.machine.na-stop2 .depthRing{filter:brightness(1.55);box-shadow:0 0 22px #79f1ff88!important}.machine.na-stop3 .screen:after{content:"";position:absolute;z-index:18;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,#eaffff55,transparent 34%);animation:naResolve .42s ease-out}@keyframes naResolve{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.22)}}.machine.na-develop .screen{animation:naDevelop .82s ease-in-out}.machine.na-develop .tube{filter:brightness(1.55)}@keyframes naDevelop{0%,100%{filter:brightness(1)}35%{filter:brightness(.35)}52%{filter:brightness(1.35)}}.machine.na-win .screen{box-shadow:inset 0 0 80px #e9ffff88,0 0 42px #7af3ffbb!important}.machine.na-win .lights,.machine.na-win .tube{filter:brightness(1.85)!important}.machine.na-bonus .screen{background:radial-gradient(circle at 50% 40%,#146b88,#06263c 48%,#020914)!important;animation:naBonus 2.4s ease-in-out infinite}.machine.na-bonus .tube{box-shadow:inset 0 0 24px #eaffffcc,0 0 28px #58eaffaa!important}.machine.na-at .screen{background:radial-gradient(circle at 50% 30%,#187d9a,#05253f 48%,#010816)!important}.machine.na-at .tube{box-shadow:inset 0 0 25px #e8ffffdd,0 0 30px #55dbffbb!important}.machine.na-chance .depthRing{filter:brightness(1.7);box-shadow:0 0 28px #b8f8ff99!important}@keyframes naBonus{50%{filter:brightness(1.18)}}';d.head.appendChild(st);const hit=d.createElement('div');hit.className='na-hit';screen.append(hit);function flash(text){hit.textContent=text;hit.classList.remove('show');void hit.offsetWidth;hit.classList.add('show')}function renderStage(){const s=stages[stageIndex];machine.dataset.stageTone=s.tone;machine.dataset.stageIndex=stageIndex;emit('stage-shift',{stageTone:s.tone})}function tier(t){machine.classList.remove('na-whisper','na-rise','na-omen');if(t)machine.classList.add('na-'+t);machine.dataset.presentationTier=t||'base'}function centerSymbol(reelIndex){const reel=d.querySelectorAll('.reel')[reelIndex],syms=reel?[...reel.querySelectorAll('.sym')]:[];return(syms[1]||syms[0])?.textContent?.trim()||''}function classify(symbols){const clean=symbols.filter(Boolean),counts=new Map();clean.forEach(s=>counts.set(s,(counts.get(s)||0)+1));const max=Math.max(0,...counts.values()),sevens=clean.filter(s=>s.includes('七')).length,keyMoon=clean.some(s=>s.includes('鍵'))&&clean.some(s=>s.includes('月'));let score=0,token='plain';if(max>=3){score=3;token='triple'}else if(sevens>=2){score=3;token='seven-resonance'}else if(keyMoon){score=2;token='key-moon'}else if(max>=2){score=2;token='pair'}else if(clean.some(s=>s.includes('七')||s.includes('鍵')||s.includes('月'))){score=1;token='trace'}return{score,token,symbols:clean}}function fromCore(detail){const base=classify(detail?.symbols||[]);return{...base,role:detail?.role||'MISS',payout:Number(detail?.payout||0),prototypeRule:true,source:'core'}}function setMode(next){mode=next;machine.dataset.gameMode=next;machine.classList.toggle('na-bonus',next==='bonus');machine.classList.toggle('na-at',next==='at');emit('mode-change',{next})}function expectationTier(){if(mode==='bonus'||mode==='at')return'rise';const heat=Math.max(anticipation,lastEvidence.score>=2?2:lastEvidence.score);return heat>=3?'omen':heat===2?'rise':heat===1?'whisper':'base'}function startRound(){stopsThisGame=0;stoppedSymbols=['','',''];coreResult=null;roundState='bet';gameNo++;if(mode==='normal'){stageGames++;if(stageGames>=stageLength){stageIndex=(stageIndex+1)%stages.length;stageGames=0;stageLength=8+((gameNo+stageIndex*3)%6);renderStage()}if(anticipationTtl>0)anticipationTtl--;else if(anticipation>0)anticipation--}machine.dataset.gameNo=gameNo;machine.dataset.roundState=roundState;machine.dataset.anticipation=anticipation;emit('bet',{previousEvidence:lastEvidence})}function updateCarry(evidence,hitEligible){if(mode!=='normal'||hitEligible)return;if(evidence.score>=2){anticipation=Math.max(anticipation,evidence.score);anticipationTtl=evidence.score===2?2:3}else if(evidence.score===1){anticipation=Math.max(anticipation,1);anticipationTtl=Math.max(anticipationTtl,1)}else if(anticipationTtl===0)anticipation=Math.max(0,anticipation-1);machine.dataset.anticipation=anticipation}function finishBonusRound(evidence){bonusCharge+=evidence.score;bonusGames=Math.max(0,bonusGames-1);machine.dataset.bonusGames=bonusGames;emit('bonus-result',{remaining:bonusGames,charge:bonusCharge,evidence,payout:evidence.payout||0,prototypeRule:true});if(bonusGames===0)setTimeout(()=>{emit('bonus-end',{charge:bonusCharge});if(bonusCharge>=5){atGames=15;machine.dataset.atGames=atGames;setMode('at');flash('OCEAN RECORD');emit('at-open',{awardGames:15,prototypeRule:true})}else{bonusCharge=0;anticipation=0;anticipationTtl=0;setMode('normal');emit('normal-return')}},520)}function finishAtRound(evidence){if(evidence.score>=3&&atGames<20){atGames++;emit('at-continue',{addedGames:1,evidence,prototypeRule:true})}atGames=Math.max(0,atGames-1);machine.dataset.atGames=atGames;emit('at-result',{remaining:atGames,evidence,payout:evidence.payout||0,prototypeRule:true});if(atGames===0)setTimeout(()=>{bonusCharge=0;anticipation=0;anticipationTtl=0;setMode('normal');emit('at-end');emit('normal-return')},480)}d.addEventListener('nocturne:core-result',e=>{coreResult=fromCore(e.detail);machine.dataset.coreRole=coreResult.role;machine.dataset.corePayout=String(coreResult.payout);emit('core-result',{evidence:coreResult,payout:coreResult.payout,role:coreResult.role,prototypeRule:true})});renderStage();bet.addEventListener('pointerdown',()=>{if(!bet.disabled)startRound()},{capture:true});lever.addEventListener('pointerdown',()=>{if(lever.disabled)return;roundState='spin';machine.dataset.roundState=roundState;const t=expectationTier();tier(t==='base'?null:t);emit('lever',{tier:t,evidence:lastEvidence,carry:anticipation})},{capture:true});[...d.querySelectorAll('.stop')].forEach((btn,reelIndex)=>btn.addEventListener('pointerdown',()=>{if(btn.disabled)return;const ordinal=++stopsThisGame;roundState='stop'+ordinal;machine.dataset.roundState=roundState;const cls='na-stop'+ordinal;machine.classList.remove('na-stop1','na-stop2','na-stop3');machine.classList.add(cls);emit('stop',{ordinal,reelIndex});setTimeout(()=>machine.classList.remove(cls),320);setTimeout(()=>{stoppedSymbols[reelIndex]=centerSymbol(reelIndex);const partial=classify(stoppedSymbols),symbol=stoppedSymbols[reelIndex];emit('reel-role',{ordinal,reelIndex,symbol,evidence:partial});if(ordinal===1&&partial.score>=1){machine.classList.add('na-chance');emit('chance-up',{level:1,evidence:partial});setTimeout(()=>machine.classList.remove('na-chance'),360)}if(ordinal===2){const develop=mode!=='normal'||anticipation>=2||partial.score>=2;if(develop){machine.classList.add('na-develop');emit('develop',{strength:Math.max(anticipation,partial.score),evidence:partial});setTimeout(()=>machine.classList.remove('na-develop'),850)}if(partial.score>=2){machine.classList.add('na-chance');emit('chance-up',{level:2,evidence:partial});setTimeout(()=>machine.classList.remove('na-chance'),430)}}if(ordinal===3){let evidence=coreResult&&coreResult.symbols.join('|')===stoppedSymbols.filter(Boolean).join('|')?coreResult:classify(stoppedSymbols);if(qaMode&&mode==='normal'&&qaIndex<QA_EVIDENCE.length)evidence={...QA_EVIDENCE[qaIndex++],payout:0,role:'QA_OVERRIDE',prototypeRule:true,source:'qa'};lastEvidence=evidence;machine.dataset.reelEvidence=evidence.token;machine.dataset.reelEvidenceScore=String(evidence.score);roundState='resolve';machine.dataset.roundState=roundState;emit('resolve',{evidence,payout:evidence.payout||0,role:evidence.role||'PARTIAL',qaOverride:qaMode,canonicalSource:evidence.source||'fallback'});if(mode==='bonus'){finishBonusRound(evidence);return}if(mode==='at'){finishAtRound(evidence);return}const hitEligible=evidence.score>=3||(evidence.score>=2&&anticipation>=3);updateCarry(evidence,hitEligible);if(hitEligible){setTimeout(()=>{machine.classList.add('na-win');flash('BONUS');bonusGames=8;bonusCharge=0;machine.dataset.bonusGames=bonusGames;anticipation=0;anticipationTtl=0;emit('bonus-hit',{awardGames:8,evidence,payout:evidence.payout||0,prototypeRule:true});setTimeout(()=>{machine.classList.remove('na-win');setMode('bonus');emit('bonus-open',{evidence})},980)},180)}else setTimeout(()=>{tier(null);emit('miss',{evidence,carry:anticipation,payout:evidence.payout||0,prototypeRule:true})},520)}},45)},{capture:true}));emit('runtime-ready',{resultModel:'canonical-core-reel-carry-prototype',qaMode});return true}function probe(){if(!install())setTimeout(probe,120)}shell.addEventListener('load',()=>setTimeout(probe,80));probe()})();</script><script src="./visual-product-run1.js"></script><script src="./visual-product-run2.js"></script><script src="./visual-product-run3.js"></script></body></html>
