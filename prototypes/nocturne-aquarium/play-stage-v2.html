<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>NOCTURNE AQUARIUM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="shell" src="./play-sound.html" title="NOCTURNE AQUARIUM"></iframe><script>(()=>{const shell=document.getElementById('shell');let gameNo=0,stageIndex=0,stageGames=0,stageLength=9,omen=0,bonusGames=0,stopsThisGame=0,roundState='idle',lastEvidence={score:0,token:'none',symbols:[]};const stages=[{name:'沈都外縁',tone:'outer'},{name:'月影広場',tone:'plaza'},{name:'玻璃の塔',tone:'tower'},{name:'深層記録庫',tone:'archive'}];function getDoc(){try{const a=shell.contentDocument,b=a&&a.getElementById('shell'),c=b&&b.contentDocument,d=c&&c.getElementById('game');return d&&d.contentDocument}catch(_){return null}}function install(){const d=getDoc();if(!d||d.documentElement.dataset.productRun==='3')return false;const machine=d.querySelector('.machine'),screen=d.querySelector('.screen'),bet=d.getElementById('bet'),lever=d.querySelector('.lever');if(!machine||!screen||!bet||!lever)return false;d.documentElement.dataset.productRun='3';const emit=(type,detail={})=>{const payload={gameNo,stageIndex,omen,bonusGames,roundState,...detail};machine.dataset.lastGameEvent=type;d.dispatchEvent(new CustomEvent('nocturne:game-event',{detail:{type,...payload}}))};const st=d.createElement('style');st.textContent='.gr-observe,.vm-worldports,.vm-optics{display:none!important}.na-stage,.na-hit{position:absolute;z-index:30;left:50%;top:18px;transform:translateX(-50%);pointer-events:none;opacity:0;white-space:nowrap;color:#efffff;text-shadow:0 2px 10px #000,0 0 14px #70eaff}.na-stage{font:700 13px/1.2 "Yu Mincho",serif;letter-spacing:.12em}.na-hit{top:42%;font:900 26px/1 serif;letter-spacing:.18em}.show{animation:naName 1.15s ease-out forwards}@keyframes naName{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:.95;transform:translate(-50%,0)}70%{opacity:.75}100%{opacity:0;transform:translate(-50%,-4px)}}.machine[data-stage-tone="plaza"] .screen{background:linear-gradient(#0a4a60,#0a3042 48%,#07151d)!important}.machine[data-stage-tone="tower"] .screen{background:linear-gradient(#123d57,#092638 48%,#06131d)!important}.machine[data-stage-tone="archive"] .screen{background:linear-gradient(#102843,#071d31 48%,#030b15)!important}.machine.na-whisper .lights{opacity:.72!important}.machine.na-whisper .jelly{filter:drop-shadow(0 0 13px #a7efff)}.machine.na-rise .screen{box-shadow:inset 0 0 55px #00131f,0 0 30px #5be9ff55!important}.machine.na-rise .tube{box-shadow:inset 0 0 18px #c9ffff88,0 0 18px #36dff266!important}.machine.na-omen .screen{animation:naOmen 1.05s ease-out}.machine.na-omen .tube{box-shadow:inset 0 0 25px #e8ffffbb,0 0 25px #5ceaff99!important}@keyframes naOmen{0%{filter:brightness(.48)}17%{filter:brightness(1.28)}34%{filter:brightness(.68)}100%{filter:brightness(1)}}.machine.na-stop1 .tankFrame{box-shadow:0 8px 18px #000,inset 0 0 0 1px #b9ffff99,0 0 15px #46eaff66!important}.machine.na-stop2 .depthRing{filter:brightness(1.55);box-shadow:0 0 22px #79f1ff88!important}.machine.na-stop3 .screen:after{content:"";position:absolute;z-index:18;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 55%,#eaffff55,transparent 34%);animation:naResolve .42s ease-out}@keyframes naResolve{from{opacity:1;transform:scale(.7)}to{opacity:0;transform:scale(1.22)}}.machine.na-develop .screen{animation:naDevelop .82s ease-in-out}.machine.na-develop .tube{filter:brightness(1.55)}@keyframes naDevelop{0%,100%{filter:brightness(1)}35%{filter:brightness(.35)}52%{filter:brightness(1.35)}}.machine.na-win .screen{box-shadow:inset 0 0 80px #e9ffff88,0 0 42px #7af3ffbb!important}.machine.na-win .lights,.machine.na-win .tube{filter:brightness(1.85)!important}.machine.na-bonus .screen{background:radial-gradient(circle at 50% 40%,#146b88,#06263c 48%,#020914)!important;animation:naBonus 2.4s ease-in-out infinite}.machine.na-bonus .tube{box-shadow:inset 0 0 24px #eaffffcc,0 0 28px #58eaffaa!important}@keyframes naBonus{50%{filter:brightness(1.18)}}';d.head.appendChild(st);const stageLabel=d.createElement('div'),hit=d.createElement('div');stageLabel.className='na-stage';hit.className='na-hit';screen.append(stageLabel,hit);function flash(el,text){el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}function renderStage(shift){const s=stages[stageIndex];machine.dataset.stageTone=s.tone;machine.dataset.stageIndex=stageIndex;if(shift){flash(stageLabel,s.name);emit('stage-shift',{stageTone:s.tone})}}function tier(t){machine.classList.remove('na-whisper','na-rise','na-omen');if(t)machine.classList.add('na-'+t);machine.dataset.presentationTier=t||'base'}function centerSymbols(){return [...d.querySelectorAll('.reel')].slice(0,3).map(reel=>{const syms=[...reel.querySelectorAll('.sym')];return (syms[1]||syms[0])?.textContent?.trim()||''})}function classify(symbols){const clean=symbols.filter(Boolean),counts=new Map();clean.forEach(s=>counts.set(s,(counts.get(s)||0)+1));const max=Math.max(0,...counts.values());const sevens=clean.filter(s=>s.includes('七')).length;const keyMoon=clean.some(s=>s.includes('鍵'))&&clean.some(s=>s.includes('月'));let score=0,token='plain';if(max>=3){score=3;token='triple'}else if(sevens>=2){score=3;token='seven-resonance'}else if(keyMoon){score=2;token='key-moon'}else if(max>=2){score=2;token='pair'}else if(clean.some(s=>s.includes('七')||s.includes('鍵')||s.includes('月'))){score=1;token='trace'}return{score,token,symbols:clean}}function nextGame(){stopsThisGame=0;roundState='bet';if(bonusGames>0){bonusGames--;machine.classList.add('na-bonus');tier(null);emit('bonus-game',{remaining:bonusGames});if(!bonusGames){machine.classList.remove('na-bonus');omen=0;emit('bonus-end')}}else{gameNo++;stageGames++;if(stageGames>=stageLength){stageIndex=(stageIndex+1)%stages.length;stageGames=0;stageLength=8+((gameNo+stageIndex*3)%6);renderStage(true)}emit('bet',{previousEvidence:lastEvidence})}machine.dataset.gameNo=gameNo;machine.dataset.bonusGames=bonusGames;machine.dataset.roundState=roundState}renderStage(false);bet.addEventListener('pointerdown',()=>{if(!bet.disabled)nextGame()},{capture:true});lever.addEventListener('pointerdown',()=>{if(lever.disabled)return;roundState='spin';machine.dataset.roundState=roundState;if(bonusGames>0){tier('rise');emit('lever',{tier:'bonus',evidence:lastEvidence});return}let t='base';if(lastEvidence.score>=3||omen>=2){omen=Math.min(3,omen+1);t='omen'}else if(lastEvidence.score===2){omen=Math.min(2,omen+1);t='rise'}else if(lastEvidence.score===1){t='whisper'}tier(t==='base'?null:t);machine.dataset.omen=omen;emit('lever',{tier:t,evidence:lastEvidence})},{capture:true});[...d.querySelectorAll('.stop')].forEach((btn,reelIndex)=>btn.addEventListener('pointerdown',()=>{if(btn.disabled)return;const ordinal=++stopsThisGame;roundState='stop'+ordinal;machine.dataset.roundState=roundState;const cls='na-stop'+ordinal;machine.classList.remove('na-stop1','na-stop2','na-stop3');machine.classList.add(cls);emit('stop',{ordinal,reelIndex});setTimeout(()=>machine.classList.remove(cls),320);setTimeout(()=>{const symbols=centerSymbols(),evidence=classify(symbols);emit('reel-evidence',{ordinal,reelIndex,symbol:symbols[reelIndex]||'',evidence});if(ordinal===2&&(omen>=2||evidence.score>=2)){machine.classList.add('na-develop');emit('develop',{evidence});setTimeout(()=>machine.classList.remove('na-develop'),850)}if(ordinal===3){lastEvidence=evidence;machine.dataset.reelEvidence=evidence.token;machine.dataset.reelEvidenceScore=String(evidence.score);roundState='resolve';machine.dataset.roundState=roundState;emit('resolve',{evidence});const hitEligible=bonusGames===0&&omen>=2&&evidence.score>=3;if(hitEligible){setTimeout(()=>{machine.classList.add('na-win');flash(hit,'BONUS');bonusGames=12;machine.dataset.bonusGames=bonusGames;emit('bonus-hit',{awardGames:12,evidence,prototypeRule:true});setTimeout(()=>{machine.classList.remove('na-win');machine.classList.add('na-bonus');emit('bonus-open',{evidence})},1050)},180)}else if(bonusGames===0){setTimeout(()=>{tier(null);omen=evidence.score>=2?Math.min(2,omen):Math.max(0,omen-1);machine.dataset.omen=omen;emit('miss',{evidence,prototypeRule:true})},520)}}},45)},{capture:true}));emit('runtime-ready',{resultModel:'reel-evidence-prototype'});return true}function probe(){if(!install())setTimeout(probe,120)}shell.addEventListener('load',()=>setTimeout(probe,80));probe()})();</script></body></html>
