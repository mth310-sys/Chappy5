<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // BONUS BGM DEMO</title><style>html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 22%,#0d4d5a,#03111a 48%,#010407 78%);color:#d9fbff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.panel{width:min(92vw,430px);padding:28px 20px;border:1px solid #77dfe966;border-radius:26px;background:#041015dd;box-shadow:0 20px 70px #000a;text-align:center}h1{font-size:23px;letter-spacing:.08em;margin:0 0 8px}p{opacity:.68;font-size:12px;line-height:1.7;margin:0 0 22px}.controls{display:flex;gap:12px;justify-content:center}button{min-width:120px;min-height:52px;border-radius:16px;border:1px solid #82e8ee77;background:#08232b;color:#d8fbff;font-weight:800;font-size:15px}.state{margin-top:18px;font-size:11px;letter-spacing:.16em;opacity:.65}</style></head><body><main><section class="panel"><h1>ノクターン・アクアリウム</h1><p>BONUS BGM 試聴専用<br>SE・リール音なし</p><div class="controls"><button id="play">▶ PLAY</button><button id="stop">■ STOP</button></div><div id="state" class="state">TAP PLAY</div></section></main><script>(()=>{const AC=window.AudioContext||window.webkitAudioContext;let ac=null,master=null,comp=null,timer=null,next=0,step=0,pad=[];const bpm=76,beat=60/bpm/2,seq=[261.63,329.63,392,493.88,440,392,329.63,293.66,261.63,329.63,440,523.25,493.88,392,329.63,293.66];function init(){if(ac)return true;if(!AC)return false;ac=new AC();master=ac.createGain();comp=ac.createDynamicsCompressor();master.gain.value=.72;comp.threshold.value=-20;comp.ratio.value=2.6;comp.attack.value=.03;comp.release.value=.3;master.connect(comp).connect(ac.destination);return true}function tone(t,f,d,g,type='sine',attack=.018){if(!ac||ac.state!=='running')return;const o=ac.createOscillator(),v=ac.createGain(),flt=ac.createBiquadFilter();o.type=type;o.frequency.setValueAtTime(f,t);flt.type='lowpass';flt.frequency.value=type==='sine'?2600:1400;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+attack);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(flt).connect(v).connect(master);o.onended=()=>{try{o.disconnect();v.disconnect();flt.disconnect()}catch(_){}};o.start(t);o.stop(t+d+.04)}function startPad(){if(pad.length||!ac||ac.state!=='running')return;[43,64.5,86].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain(),flt=ac.createBiquadFilter();o.type=i===0?'sine':'triangle';o.frequency.value=f;flt.type='lowpass';flt.frequency.value=180+i*70;g.gain.value=i===0?.024:.011;o.connect(flt).connect(g).connect(master);o.start();pad.push({o,g,flt})})}function chime(t,f){tone(t,f,beat*1.55,.055,'sine');tone(t+.06,f*2.01,beat*1.1,.021,'sine');tone(t+.14,f*.5,beat*1.8,.024,'triangle',.035)}function pulse(t,strong=false){tone(t,strong?65.4:73.4,beat*.9,strong?.07:.038,'sine');if(strong)tone(t+.08,130.8,beat*.55,.024,'triangle')}function scheduleHit(t,i){const f=seq[i%seq.length];chime(t,f);if(i%2===0)tone(t+beat*.35,f*1.5,beat*.7,.021,'sine');if(i%4===0)pulse(t,true);else if(i%2===0)pulse(t,false);if(i%8===6)tone(t+beat*.5,783.99,beat*1.2,.023,'sine')}function schedule(){if(!ac||ac.state!=='running')return;while(next<ac.currentTime+.18){scheduleHit(next,step);next+=beat;step++}}function begin(){if(timer)return;startPad();step=0;next=ac.currentTime+.04;schedule();timer=setInterval(schedule,35);document.getElementById('state').textContent='BONUS BGM PLAYING'}function start(){if(!init()){document.getElementById('state').textContent='AUDIO UNSUPPORTED';return}try{const p=ac.resume();if(ac.state==='running')begin();else if(p&&p.then)p.then(begin).catch(()=>document.getElementById('state').textContent='TAP PLAY AGAIN');else setTimeout(()=>{if(ac.state==='running')begin();},0)}catch(_){document.getElementById('state').textContent='TAP PLAY AGAIN'}}function stop(){if(timer){clearInterval(timer);timer=null}if(ac&&ac.state==='running')ac.suspend().catch(()=>{});document.getElementById('state').textContent='STOPPED'}document.getElementById('play').addEventListener('pointerdown',start,{passive:true});document.getElementById('stop').addEventListener('pointerdown',stop,{passive:true});})();</script></body></html>
