<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>NOCTURNE AQUARIUM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}.audioBadge{position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));right:8px;padding:5px 8px;border:1px solid #83e7ee55;border-radius:99px;background:#041015c9;color:#9debf1;font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.72}.audioBadge.on{opacity:.32}</style></head><body data-audio-tech="not-started"><div id="badge" class="audioBadge">SOUND: TAP</div><iframe id="shell" src="./play.html" title="NOCTURNE AQUARIUM"></iframe><script>(()=>{
let ac=null,master=null,fx=null,world=null,comp=null,bank={},loop=null,loopGain=null,loopName='',armed=false,duckTimer=0;
const badge=document.getElementById('badge'),shell=document.getElementById('shell'),AC=window.AudioContext||window.webkitAudioContext;
function mk(name,d,fn){const n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=Math.max(-1,Math.min(1,fn(i/ac.sampleRate,d,i,n)));bank[name]=b}
function build(){const rnd=()=>Math.random()*2-1;
mk('bet',.13,t=>.42*Math.sin(1080*t)*Math.exp(-25*t)+.08*rnd()*Math.exp(-20*t));mk('lever',.28,(t,d)=>.5*Math.sin(2*Math.PI*(72+55*t/d)*t)*Math.exp(-7*t)+.07*rnd()*Math.sin(Math.PI*t/d));
for(let s=1;s<=3;s++)mk('stop'+s,.27,(t,d)=>.46*Math.sin(2*Math.PI*(96+s*8)*t)*Math.exp(-40*t)+.32*Math.sin(2*Math.PI*([268,332,406][s-1])*(1+.38*t/d)*t)*Math.exp(-10*t)+.05*rnd()*Math.exp(-14*t));
mk('trace',.36,t=>.28*Math.sin(1948*t)*Math.exp(-7*t)+.15*Math.sin(3896*t)*Math.exp(-10*t));mk('rise',.48,(t,d)=>.36*Math.sin(2*Math.PI*(185+150*t/d)*t)*Math.sin(Math.PI*t/d)+.16*Math.sin(383*t)*Math.exp(-3*t));mk('omen',.58,(t,d)=>.4*Math.sin(2*Math.PI*(138+290*t/d)*t)*Math.sin(Math.PI*t/d)+.24*Math.sin(308*t)*Math.exp(-2.5*t));
mk('chance',.34,(t,d)=>.34*Math.sin(2*Math.PI*(392+190*t/d)*t)*Math.sin(Math.PI*t/d)+.18*Math.sin(4926*t)*Math.exp(-11*t));mk('clock',.3,(t,d)=>.26*Math.sin(2*Math.PI*(118+42*t/d)*t)*Math.exp(-9*t)+.15*Math.sin(2*Math.PI*472*t)*Math.exp(-18*t)+.05*rnd()*Math.exp(-22*t));mk('develop',.72,(t,d)=>.35*Math.sin(2*Math.PI*(92+250*t/d)*t)*Math.sin(Math.PI*t/d)+.17*Math.sin(2*Math.PI*(460+90*t/d)*t)*Math.sin(Math.PI*t/d));mk('resolve',.42,t=>.3*Math.sin(1533*t)*Math.exp(-6*t)+.2*Math.sin(3066*t)*Math.exp(-8*t));
mk('miss',.46,(t,d)=>.22*Math.sin(2*Math.PI*(180-80*t/d)*t)*Math.exp(-5*t)+.12*Math.sin(302*t)*Math.exp(-4*t));mk('win',1.05,t=>(.32*Math.sin(2*Math.PI*(244+110*t)*t)+.24*Math.sin(2*Math.PI*(366+150*t)*t)+.18*Math.sin(2*Math.PI*(488+180*t)*t))*Math.exp(-2.2*t)+.3*Math.sin(346*t)*Math.exp(-3*t));
mk('coin',.23,(t,d)=>.26*Math.sin(2*Math.PI*(620+260*t/d)*t)*Math.exp(-14*t)+.15*Math.sin(2*Math.PI*310*t)*Math.exp(-17*t));mk('count',.19,t=>.27*Math.sin(3204*t)*Math.exp(-15*t)+.11*Math.sin(1602*t)*Math.exp(-18*t));mk('continue',.56,(t,d)=>.3*Math.sin(2*Math.PI*(330+210*t/d)*t)*Math.sin(Math.PI*t/d)+.17*Math.sin(2*Math.PI*(660+120*t/d)*t)*Math.sin(Math.PI*t/d));mk('return',.62,(t,d)=>.18*Math.sin(2*Math.PI*(148-55*t/d)*t)*Math.exp(-3.2*t)+.1*Math.sin(270*t));
function music(name,bpm,seq){mk(name,(60/bpm)*8,(t,d)=>{const half=(60/bpm)/2,step=Math.floor(t/half)%16,f=seq[step],p=(t%half)/half,e=Math.exp(-p*4.3);return .2*Math.sin(2*Math.PI*f*t)*e+.085*Math.sin(4*Math.PI*f*t)*e+.17*Math.sin(2*Math.PI*43*t)+(p<.1?.13*Math.sin(2*Math.PI*(name==='at'?96:86)*t)*Math.exp(-p*22):0)})}music('bonus',76,[261.63,329.63,392,493.88,440,392,329.63,293.66,261.63,329.63,440,523.25,493.88,392,329.63,293.66]);music('at',90,[220,293.66,329.63,440,392,493.88,440,329.63,246.94,329.63,392,523.25,493.88,440,392,293.66])}
function expose(state){document.body.dataset.audioTech=state}
function badgeState(){const state=ac?ac.state:(AC?'not-started':'unsupported'),on=state==='running';expose(state);badge.textContent=on?'SOUND: ON':'SOUND: TAP';badge.classList.toggle('on',on)}
function boot(){if(!AC){expose('unsupported');return false}if(!ac){try{ac=new AC()}catch(_){expose('create-failed');return false}master=ac.createGain();fx=ac.createGain();world=ac.createGain();comp=ac.createDynamicsCompressor();master.gain.value=.84;fx.gain.value=1;world.gain.value=.88;comp.threshold.value=-17;comp.knee.value=16;comp.ratio.value=3.4;comp.attack.value=.008;comp.release.value=.2;fx.connect(master);world.connect(master);master.connect(comp).connect(ac.destination);build();const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.frequency.value=43;f.type='lowpass';f.frequency.value=92;g.gain.value=.011;o.connect(f).connect(g).connect(world);o.start()}if(ac.state!=='running')try{const p=ac.resume();if(p&&p.then)p.then(badgeState).catch(()=>expose('resume-failed'))}catch(_){expose('resume-failed')}badgeState();return true}
function play(name,g=1,delay=0,rate=1,bus='fx'){if(!ac||ac.state!=='running'||!bank[name])return;const s=ac.createBufferSource(),v=ac.createGain();s.buffer=bank[name];s.playbackRate.value=rate;v.gain.value=g;s.connect(v).connect(bus==='world'?world:fx);s.onended=()=>{try{s.disconnect();v.disconnect()}catch(_){}};s.start(ac.currentTime+delay)}
function duck(level=.2,ms=220){if(!ac)return;clearTimeout(duckTimer);const t=ac.currentTime;world.gain.cancelScheduledValues(t);world.gain.setTargetAtTime(level,t,.018);duckTimer=setTimeout(()=>{if(ac){const n=ac.currentTime;world.gain.cancelScheduledValues(n);world.gain.setTargetAtTime(.88,n,.09)}},ms)}
function stopLoop(f=.3){if(!loop)return;const s=loop,g=loopGain;loop=null;loopGain=null;loopName='';try{g.gain.setTargetAtTime(0,ac.currentTime,.07);s.stop(ac.currentTime+f)}catch(_){}setTimeout(()=>{try{s.disconnect();g.disconnect()}catch(_){}},(f+.2)*1000)}function startLoop(name,gain){if(!ac||ac.state!=='running'||loopName===name)return;stopLoop(.2);const s=ac.createBufferSource(),g=ac.createGain();s.buffer=bank[name];s.loop=true;g.gain.setValueAtTime(.001,ac.currentTime);g.gain.setTargetAtTime(gain,ac.currentTime,.12);s.connect(g).connect(world);s.start();loop=s;loopGain=g;loopName=name}
function payout(n,delay=.08){n=Number(n)||0;if(n<=0)return;play('coin',Math.min(.48,.2+n*.025),delay,1+Math.min(8,n)*.018);if(n>=6)play('count',.14,delay+.12,1.08)}
function event(e){if(!ac||ac.state!=='running')return;const x=e.detail||{},t=x.type;
if(t==='lever'){if(x.tier==='whisper')play('trace',.32,.04);else if(x.tier==='rise'){play('rise',.42,.035);play('clock',.12,.17,.88)}else if(x.tier==='omen'){duck(.18,190);play('omen',.58,.11);play('clock',.2,.24,1.08)}}
else if(t==='reel-role'&&x.evidence?.score>=1)play('trace',x.evidence.score>=2?.23:.12,.025,x.evidence.score>=3?1.12:.94);else if(t==='chance-up'){duck(.45,130);play('chance',x.level>=2?.62:.4,.04,x.level>=2?1.08:.96);play('clock',x.level>=2?.2:.1,.13,x.level>=2?1.12:.9)}else if(t==='develop'){duck(.11,250);play('develop',.7,.17);play('clock',.2,.38,.78)}else if(t==='resolve'){duck(.34,130);play('resolve',x.evidence?.score>=2?.56:.29,.045);play('clock',.16,.16,x.evidence?.score>=2?1.16:.84);payout(x.payout,.23)}else if(t==='miss')play('miss',.31,.04);else if(t==='bonus-hit'){duck(.025,290);play('win',.94,.25);play('clock',.34,.42,1.24)}else if(t==='bonus-open'||(t==='mode-change'&&x.next==='bonus'))startLoop('bonus',.55);else if(t==='bonus-result'){payout(x.payout,.03);play('count',.2,.13,1+Math.min(4,Number(x.charge)||0)*.025)}else if(t==='bonus-end'){stopLoop(.38);duck(.28,180)}else if(t==='at-open'||(t==='mode-change'&&x.next==='at')){duck(.05,220);play('win',.62,.2,1.08);play('clock',.3,.35,1.3);setTimeout(()=>startLoop('at',.58),260)}else if(t==='at-continue'){play('continue',.66,.035,1+Math.min(3,Number(x.addedGames)||0)*.03);play('clock',.18,.2,1.18)}else if(t==='at-result'){payout(x.payout,.02);play('count',.17,.12,.92)}else if(t==='at-end'){stopLoop(.32);duck(.26,160)}else if(t==='normal-return'){stopLoop(.25);play('return',.25,.04,.92,'world')}else if(t==='stage-shift')play('trace',.16,.03,.76,'world')}
function install(){let a,g,d;try{a=shell.contentDocument;g=a&&a.getElementById('game');d=g&&g.contentDocument}catch(_){return false}if(!d)return false;if(d.documentElement.dataset.soundProduct==='3'){armed=true;return true}d.documentElement.dataset.soundProduct='3';d.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;boot();if(b.id==='bet')play('bet',.78);else if(b.id==='lever')play('lever',.86);else if(b.classList.contains('stop')&&!b.disabled){const n=[...d.querySelectorAll('.stop')].filter(x=>x.disabled).length+1;play('stop'+Math.min(3,n),n===3?.94:.82)}},{capture:true});d.addEventListener('nocturne:game-event',event);armed=true;return true}function probe(){install();if(!armed)setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,0);setTimeout(install,250);setTimeout(install,700)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac&&ac.state==='running')ac.suspend().then(badgeState).catch(()=>{})});badgeState()})();</script></body></html>
