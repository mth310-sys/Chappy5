<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Layered Sound</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}.audioBadge{position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));right:8px;padding:5px 8px;border:1px solid #83e7ee77;border-radius:99px;background:#041015de;color:#9debf1;font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.9}.audioBadge.on{color:#dfffff;border-color:#88ffcf77;opacity:.55}</style></head><body><div id="badge" class="audioBadge">SOUND: TAP</div><iframe id="shell" src="./play.html" title="ノクターン・アクアリウム"></iframe><script>(()=>{let ac=null,master=null,comp=null,armed=false,bank={},bed=null;const badge=document.getElementById('badge'),shell=document.getElementById('shell'),AC=window.AudioContext||window.webkitAudioContext;function mk(name,d,fn){const n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/ac.sampleRate;a[i]=Math.max(-1,Math.min(1,fn(t,d,i,n)))}bank[name]=b}function build(){const rnd=()=>Math.random()*2-1;mk('bet',.18,(t,d)=>{const e=Math.exp(-t*20),body=Math.sin(2*Math.PI*178*t)+.25*Math.sin(2*Math.PI*356*t);const water=.12*rnd()*Math.exp(-t*16);return .48*body*e+water});mk('lever',.34,(t,d)=>{const f=78+48*(t/d),e=Math.exp(-t*6),swell=Math.sin(2*Math.PI*f*t)+.28*Math.sin(2*Math.PI*(f*2.02)*t);return .58*swell*e+.08*rnd()*Math.sin(Math.PI*t/d)});for(let s=1;s<=3;s++)mk('stop'+s,.38,(t,d)=>{const zone=[292,354,428][s-1],mech=.42*Math.sin(2*Math.PI*(102+s*7)*t)*Math.exp(-t*38),rise=Math.sin(2*Math.PI*(zone+(zone*.52)*(t/d))*t)*Math.exp(-t*7),glass=.26*Math.sin(2*Math.PI*(zone*2.1)*t)*Math.exp(-t*10),water=.1*rnd()*Math.exp(-t*9);return mech+.48*rise+glass+water});mk('memory',.72,(t,d)=>{const e=Math.exp(-t*3.7),a=.42*Math.sin(2*Math.PI*(244+82*t)*t),b=.27*Math.sin(2*Math.PI*(488+140*t)*t),sub=.32*Math.sin(2*Math.PI*61*t)*Math.exp(-t*4.5);return (a+b)*e+sub+.06*rnd()*e})}function boot(){if(!AC)return false;if(!ac){ac=new AC();master=ac.createGain();comp=ac.createDynamicsCompressor();master.gain.value=.84;comp.threshold.value=-18;comp.knee.value=18;comp.ratio.value=3.2;comp.attack.value=.012;comp.release.value=.22;master.connect(comp).connect(ac.destination);build();const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sine';o.frequency.value=43;f.type='lowpass';f.frequency.value=96;g.gain.value=.012;o.connect(f).connect(g).connect(master);o.start();bed={o,g,f}}if(ac.state!=='running'){try{const p=ac.resume();if(p&&p.then)p.then(setBadge)}catch(_){}}setBadge();return true}function play(name,g=1,delay=0,rate=1){if(!ac||ac.state!=='running'||!bank[name])return;const s=ac.createBufferSource(),v=ac.createGain();s.buffer=bank[name];s.playbackRate.value=rate;v.gain.value=g;s.connect(v).connect(master);s.onended=()=>{try{s.disconnect();v.disconnect()}catch(_){}};s.start(ac.currentTime+delay)}function setBadge(){const on=ac&&ac.state==='running';badge.textContent=on?'SOUND: ON':'SOUND: TAP';badge.classList.toggle('on',!!on)}function install(){let playDoc,game,doc;try{playDoc=shell.contentDocument;game=playDoc&&playDoc.getElementById('game');doc=game&&game.contentDocument}catch(_){return false}if(!doc||doc.documentElement.dataset.soundHotfix==='3')return !!doc;doc.documentElement.dataset.soundHotfix='3';doc.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;boot();if(b.id==='bet'){play('bet',.88);play('stop1',.12,.045,.76)}else if(b.id==='lever'){play('lever',.94)}else if(b.classList.contains('stop')&&!b.disabled){const n=[...doc.querySelectorAll('.stop')].filter(x=>x.disabled).length+1;play('stop'+Math.min(3,n),n===3?1:.92);if(n===3)play('memory',.66,.12)}},{capture:true});armed=true;return true}function probe(){install();if(!armed)setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,0);setTimeout(install,250);setTimeout(install,700)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac&&ac.state==='running')ac.suspend().then(setBadge).catch(()=>{})});setBadge()})();</script></body></html>
