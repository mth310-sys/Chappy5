<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>NOCTURNE AQUARIUM</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}.audioBadge{position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));right:8px;padding:5px 8px;border:1px solid #83e7ee55;border-radius:99px;background:#041015c9;color:#9debf1;font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.72}.audioBadge.on{opacity:.32}</style></head><body><div id="badge" class="audioBadge">SOUND: TAP</div><iframe id="shell" src="./play.html" title="NOCTURNE AQUARIUM"></iframe><script>(()=>{let ac=null,master=null,comp=null,armed=false,bank={},bed=null,bonusSource=null,bonusGain=null,duckTimer=0;const badge=document.getElementById('badge'),shell=document.getElementById('shell'),AC=window.AudioContext||window.webkitAudioContext;function mk(name,d,fn){const n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/ac.sampleRate;a[i]=Math.max(-1,Math.min(1,fn(t,d,i,n)))}bank[name]=b}function build(){const rnd=()=>Math.random()*2-1;mk('bet',.13,t=>.42*Math.sin(2*Math.PI*172*t)*Math.exp(-t*25)+.09*rnd()*Math.exp(-t*20));mk('lever',.28,(t,d)=>{const f=72+55*t/d;return .52*Math.sin(2*Math.PI*f*t)*Math.exp(-t*7)+.08*rnd()*Math.sin(Math.PI*t/d)});for(let s=1;s<=3;s++)mk('stop'+s,.27,(t,d)=>{const f=[268,332,406][s-1],body=.48*Math.sin(2*Math.PI*(96+s*8)*t)*Math.exp(-t*40),glass=.34*Math.sin(2*Math.PI*(f+f*.38*t/d)*t)*Math.exp(-t*10);return body+glass+.06*rnd()*Math.exp(-t*14)});mk('trace',.38,t=>.3*Math.sin(2*Math.PI*310*t)*Math.exp(-t*7)+.17*Math.sin(2*Math.PI*620*t)*Math.exp(-t*10));mk('rise',.48,(t,d)=>.38*Math.sin(2*Math.PI*(185+150*t/d)*t)*Math.sin(Math.PI*t/d)+.18*Math.sin(2*Math.PI*61*t)*Math.exp(-t*3));mk('omen',.58,(t,d)=>.42*Math.sin(2*Math.PI*(138+290*t/d)*t)*Math.sin(Math.PI*t/d)+.25*Math.sin(2*Math.PI*49*t)*Math.exp(-t*2.5));mk('develop',.72,(t,d)=>{const e=Math.sin(Math.PI*t/d);return .36*Math.sin(2*Math.PI*(92+250*t/d)*t)*e+.18*Math.sin(2*Math.PI*(460+90*t/d)*t)*e});mk('resolve',.42,t=>.3*Math.sin(2*Math.PI*244*t)*Math.exp(-t*6)+.2*Math.sin(2*Math.PI*488*t)*Math.exp(-t*8));mk('win',1.05,(t,d)=>{const e=Math.exp(-t*2.2),ch=.32*Math.sin(2*Math.PI*(244+110*t)*t)+.24*Math.sin(2*Math.PI*(366+150*t)*t)+.18*Math.sin(2*Math.PI*(488+180*t)*t);return ch*e+.32*Math.sin(2*Math.PI*55*t)*Math.exp(-t*3)});mk('bonus',5.052,(t,d)=>{const beat=60/76,step=Math.floor(t/(beat/2))%16,seq=[261.63,329.63,392,493.88,440,392,329.63,293.66,261.63,329.63,440,523.25,493.88,392,329.63,293.66],f=seq[step],phase=(t%(beat/2))/(beat/2),env=Math.exp(-phase*4.8),note=.22*Math.sin(2*Math.PI*f*t)*env+.1*Math.sin(2*Math.PI*f*2*t)*env,sub=.16*Math.sin(2*Math.PI*43*t),pulse=(phase<.09?.12*Math.sin(2*Math.PI*86*t)*Math.exp(-phase*24):0);return note+sub+pulse})}function setBadge(){const on=ac&&ac.state==='running';badge.textContent=on?'SOUND: ON':'SOUND: TAP';badge.classList.toggle('on',!!on)}function boot(){if(!AC)return false;if(!ac){ac=new AC();master=ac.createGain();comp=ac.createDynamicsCompressor();master.gain.value=.82;comp.threshold.value=-17;comp.knee.value=16;comp.ratio.value=3.4;comp.attack.value=.008;comp.release.value=.2;master.connect(comp).connect(ac.destination);build();const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type='sine';o.frequency.value=43;f.type='lowpass';f.frequency.value=92;g.gain.value=.01;o.connect(f).connect(g).connect(master);o.start();bed={o,g,f}}if(ac.state!=='running'){try{const p=ac.resume();if(p&&p.then)p.then(setBadge)}catch(_){}}setBadge();return true}function play(name,g=1,delay=0,rate=1){if(!ac||ac.state!=='running'||!bank[name])return;const s=ac.createBufferSource(),v=ac.createGain();s.buffer=bank[name];s.playbackRate.value=rate;v.gain.value=g;s.connect(v).connect(master);s.onended=()=>{try{s.disconnect();v.disconnect()}catch(_){}};s.start(ac.currentTime+delay)}function duck(level=.22,ms=260){if(!ac||!master)return;clearTimeout(duckTimer);const now=ac.currentTime;master.gain.cancelScheduledValues(now);master.gain.setTargetAtTime(level,now,.018);duckTimer=setTimeout(()=>{if(ac&&master){const t=ac.currentTime;master.gain.cancelScheduledValues(t);master.gain.setTargetAtTime(.82,t,.08)}},ms)}function startBonus(){if(!ac||ac.state!=='running'||bonusSource)return;bonusSource=ac.createBufferSource();bonusGain=ac.createGain();bonusSource.buffer=bank.bonus;bonusSource.loop=true;bonusGain.gain.value=.58;bonusSource.connect(bonusGain).connect(master);bonusSource.start()}function stopBonus(){if(!bonusSource)return;try{bonusGain.gain.setTargetAtTime(0,ac.currentTime,.12);bonusSource.stop(ac.currentTime+.5)}catch(_){}const s=bonusSource,g=bonusGain;bonusSource=null;bonusGain=null;setTimeout(()=>{try{s.disconnect();g.disconnect()}catch(_){}},600)}function onGameEvent(e){if(!ac||ac.state!=='running')return;const x=e.detail||{},type=x.type;if(type==='lever'){if(x.tier==='whisper')play('trace',.34,.04);else if(x.tier==='rise')play('rise',.42,.035);else if(x.tier==='omen'){duck(.28,150);play('omen',.58,.12)}else if(x.tier==='bonus')play('rise',.24,.02)}else if(type==='develop'){duck(.18,210);play('develop',.7,.18)}else if(type==='resolve'){play('resolve',x.evidence&&x.evidence.score>=2?.54:.28,.05)}else if(type==='bonus-hit'){duck(.08,240);play('win',.92,.24)}else if(type==='bonus-open'){startBonus()}else if(type==='bonus-end'){stopBonus()}else if(type==='stage-shift'){play('trace',.24,.03,.78)}}function install(){let playDoc,game,doc;try{playDoc=shell.contentDocument;game=playDoc&&playDoc.getElementById('game');doc=game&&game.contentDocument}catch(_){return false}if(!doc)return false;if(doc.documentElement.dataset.soundProduct==='1'){armed=true;return true}doc.documentElement.dataset.soundProduct='1';doc.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;boot();if(b.id==='bet')play('bet',.78);else if(b.id==='lever')play('lever',.86);else if(b.classList.contains('stop')&&!b.disabled){const n=[...doc.querySelectorAll('.stop')].filter(x=>x.disabled).length+1;play('stop'+Math.min(3,n),n===3?.94:.82)}},{capture:true});doc.addEventListener('nocturne:game-event',onGameEvent);armed=true;return true}function probe(){install();if(!armed)setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,0);setTimeout(install,250);setTimeout(install,700)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac&&ac.state==='running')ac.suspend().then(setBadge).catch(()=>{})});setBadge()})();</script></body></html>
