<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Integrated Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./index.html" title="ノクターン・アクアリウム"></iframe><script>
(()=>{let ac,master,ambient,mechBus,observeBus,memoryBus,resumePromise=null;const frame=document.getElementById('game');function audioState(v){document.body.dataset.audioTech=v}function makeBus(level){const g=ac.createGain();g.gain.value=level;g.connect(master);return g}function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C){audioState('unsupported');return false}ac=new C();master=ac.createGain();master.gain.value=.34;master.connect(ac.destination);ambient=makeBus(.035);mechBus=makeBus(.82);observeBus=makeBus(.7);memoryBus=makeBus(.76);const o=ac.createOscillator(),f=ac.createBiquadFilter();o.type='sine';o.frequency.value=43;f.type='lowpass';f.frequency.value=96;o.connect(f).connect(ambient);o.start()}if(ac.state==='running'){audioState('running');return true}if(ac.state==='suspended'||ac.state==='interrupted'){audioState('resuming');if(!resumePromise)resumePromise=ac.resume().then(()=>{const ok=ac.state==='running';audioState(ok?'running':ac.state);return ok}).catch(()=>{audioState('resume-failed');return false}).finally(()=>{resumePromise=null});return resumePromise}audioState(ac.state);return false}function withAudio(fn){const r=boot();if(r===true)fn();else if(r&&typeof r.then==='function')r.then(ok=>{if(ok)fn()})}function ping(f,d=.08,g=.018,delay=0,type='sine',out=mechBus||master){if(!ac||ac.state!=='running'||!out)return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(out);o.onended=()=>{try{o.disconnect();v.disconnect()}catch(_){}};o.start(t);o.stop(t+d+.01)}function channel(i){const f=[286,337,401][i];ping(f,.065,.015,0,'sine',observeBus);ping(f*2.01,.12,.007,.035,'sine',observeBus)}function surveyComplete(){ping(228,.09,.006,0,'sine',observeBus);ping(342,.12,.004,.055,'sine',observeBus)}function memory(text){if(/DEPTH/.test(text)){ping(164,.32,.018,0,'sine',memoryBus);ping(246,.38,.014,.08,'sine',memoryBus);ping(369,.44,.012,.16,'sine',memoryBus);ping(554,.5,.009,.25,'sine',memoryBus)}else if(/NEW MEMORY/.test(text)){ping(310,.2,.014,0,'sine',memoryBus);ping(465,.24,.011,.08,'sine',memoryBus);ping(620,.28,.008,.15,'sine',memoryBus)}else if(/赤い連結|鍵と月|気泡/.test(text)){ping(265,.13,.009,0,'sine',memoryBus);ping(398,.17,.006,.07,'sine',memoryBus)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;const style=d.createElement('style');style.textContent='.bet{min-height:46px!important}.controls,.bet,.lever,.stop{transform:none!important}.bet,.lever,.stop{transition:filter .08s,box-shadow .08s!important}.bet:active,.stop:active,.lever:active{transform:none!important;filter:brightness(1.15)!important;box-shadow:0 3px 8px #000,inset 0 3px 6px #0008!important}.gr-observe{position:relative;margin:5px 8px 0;padding:7px 10px 6px;border:1px solid #73c9d477;border-radius:12px;background:linear-gradient(180deg,#102d35,#041319 33%,#08232b 72%,#020a0e);font:700 9px/1.3 ui-monospace,monospace;letter-spacing:.06em;color:#6c9ba2;text-align:center;height:46px;overflow:hidden;box-shadow:inset 0 1px #e2ffff20,inset 0 -8px 14px #0008,0 4px 11px #0009}.gr-observe:before,.gr-observe:after{content:"";position:absolute;top:7px;width:5px;height:5px;border-radius:50%;background:#8defff66;box-shadow:0 0 7px #56eaff88}.gr-observe:before{left:7px}.gr-observe:after{right:7px}.gr-observe .live{color:#eaffff;text-shadow:0 0 8px #7cf5ff}.gr-observe .pick{color:#8ce9e5}.gr-observe .memory{color:#d8d2ff;text-shadow:0 0 8px #8177ff}.gr-observe .survey{color:#9fffd9;text-shadow:0 0 7px #58ffc266}.vm-sonar{position:absolute;z-index:12;width:58px;height:58px;border:1px solid #9bf7ff88;border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 9px #55efff44,inset 0 0 12px #65edff22}.vm-sonar:before,.vm-sonar:after{content:"";position:absolute;border:1px solid #a8f7ff55;border-radius:50%;inset:8px}.vm-sonar:after{inset:18px;background:#baffff22}.vm-sonar.pulse{animation:vmSonar .48s ease-out}.vm-sonar.pulse:before{animation:vmSonarInner .48s ease-out}@keyframes vmSonar{0%{opacity:0;transform:scale(.35)}24%{opacity:.95}100%{opacity:0;transform:scale(1.35)}}@keyframes vmSonarInner{from{opacity:1;transform:scale(.35)}to{opacity:0;transform:scale(1.7)}}.vm-optics{position:absolute;z-index:11;left:50%;bottom:8px;display:flex;gap:11px;transform:translateX(-50%);pointer-events:none;opacity:.72}.vm-optic{position:relative;width:22px;height:22px;border:1px solid #81e9ee55;border-radius:50%;background:radial-gradient(circle at 38% 33%,#dfffff25 0 12%,#0e465560 22%,#031116cc 58%,#001018 70%);box-shadow:inset 0 0 7px #58ddeb22,0 0 3px #000;transition:filter .25s,box-shadow .25s,transform .25s}.vm-optic:before{content:"";position:absolute;inset:4px;border:1px solid #8ceef055;border-radius:50%}.vm-optic:after{content:"";position:absolute;left:50%;top:50%;width:3px;height:3px;margin:-1.5px;border-radius:50%;background:#bffcff55;box-shadow:0 0 4px #7effff}.vm-optic.seen{filter:brightness(1.25);box-shadow:inset 0 0 9px #7cfff777,0 0 8px #54f5e177}.vm-optic.active{transform:scale(1.16);filter:brightness(1.55);box-shadow:inset 0 0 10px #e9ffffaa,0 0 14px #77ffffaa}.vm-glass-ribs{position:absolute;z-index:9;inset:2% 1.5%;border-radius:22px;pointer-events:none;overflow:hidden}.vm-glass-ribs:before,.vm-glass-ribs:after{content:"";position:absolute;top:-8%;bottom:-8%;width:16%;border-left:1px solid #dfffff28;border-right:1px solid #7befff16;background:linear-gradient(90deg,transparent,#efffff12 48%,transparent);filter:blur(.2px);transform:skewX(-5deg)}.vm-glass-ribs:before{left:4%}.vm-glass-ribs:after{right:4%;transform:skewX(5deg)}.vm-glass-ribs i{position:absolute;left:12%;right:12%;top:4%;height:18%;border-top:1px solid #e8ffff33;border-radius:50%;background:linear-gradient(180deg,#ffffff10,transparent 70%);transform:perspective(120px) rotateX(10deg)}.vm-link{position:absolute;z-index:10;left:50%;bottom:7%;width:2px;height:49%;transform-origin:50% 100%;opacity:0;pointer-events:none;background:linear-gradient(180deg,#baffff00,#9effff55 35%,#e5ffffb0 70%,#9effff33);box-shadow:0 0 5px #8cf8ff88;filter:blur(.15px);transition:opacity .08s}.vm-link.l{transform:translateX(-72px) rotate(-19deg)}.vm-link.c{transform:translateX(-1px)}.vm-link.r{transform:translateX(70px) rotate(19deg)}.vm-link.on{opacity:.75}.vm-link.echo{opacity:1;filter:brightness(1.45);box-shadow:0 0 8px #b9ffff,0 0 20px #74eaff88}.vm-refraction{position:absolute;z-index:8;inset:8% 7%;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 56%,#b4ffff24 0 8%,#8cecff13 9% 22%,transparent 23% 100%);transform:scale(.65)}.vm-refraction.fire{animation:vmRefract .62s ease-out}@keyframes vmRefract{0%{opacity:0;transform:scale(.55)}25%{opacity:.75}100%{opacity:0;transform:scale(1.22)}}.machine.vm-survey-complete .tankFrame{box-shadow:0 8px 18px #000,inset 0 0 0 1px #d9ffffaa,0 0 30px #63ffd477}.machine.vm-survey-complete .screen{filter:brightness(1.08) saturate(1.12)}.machine.vm-survey-complete .vm-optic{filter:brightness(1.55);box-shadow:inset 0 0 10px #efffffb0,0 0 14px #7cffddaa}.machine.vm-ch1 .tube.l,.machine.vm-ch2 .tube,.machine.vm-ch3 .tube.r{box-shadow:inset 0 0 18px #d7ffff88,0 0 19px #51efff88}.machine.vm-ch1 .tankFrame,.machine.vm-ch2 .tankFrame,.machine.vm-ch3 .tankFrame{box-shadow:0 8px 18px #000,inset 0 0 0 1px #e8ffff77,0 0 20px #3be4ff55}.machine.vm-memory .tankFrame{box-shadow:0 8px 18px #000,inset 0 0 0 1px #d7ccff99,0 0 26px #7d77ff55}.machine.vm-memory .depthRing{box-shadow:0 0 24px #73f2ff88;filter:brightness(1.25)}.machine.vm-memory .vm-glass-ribs{filter:brightness(1.2)}@media(max-width:390px){.gr-observe{margin-left:5px;margin-right:5px;padding-left:8px;padding-right:8px;font-size:8px;letter-spacing:.04em}.vm-sonar{width:50px;height:50px}.vm-optics{bottom:6px;gap:8px}.vm-optic{width:19px;height:19px}.vm-link.l{transform:translateX(-61px) rotate(-18deg)}.vm-link.r{transform:translateX(59px) rotate(18deg)}}';d.head.appendChild(style);const screen=d.querySelector('.screen');const sonar=d.createElement('div');sonar.className='vm-sonar';const optics=d.createElement('div');optics.className='vm-optics';optics.innerHTML='<i class="vm-optic" data-o="0"></i><i class="vm-optic" data-o="1"></i><i class="vm-optic" data-o="2"></i>';const glass=d.createElement('div');glass.className='vm-glass-ribs';glass.innerHTML='<i></i>';const links=d.createElement('div');links.innerHTML='<i class="vm-link l" data-l="0"></i><i class="vm-link c" data-l="1"></i><i class="vm-link r" data-l="2"></i>';const refraction=d.createElement('div');refraction.className='vm-refraction';if(screen){screen.appendChild(glass);screen.appendChild(links);screen.appendChild(refraction);screen.appendChild(sonar);screen.appendChild(optics)}const linkEls=[...links.querySelectorAll('.vm-link')],opticEls=[...optics.querySelectorAll('.vm-optic')];const anchor=d.querySelector('.reelDeck')||d.querySelector('.reels')||d.querySelector('.controls');const rail=d.createElement('div');rail.className='gr-observe';rail.innerHTML='<span class="live">観測待機</span> → 選択 → 採取 → 照合 → 記憶';if(anchor)anchor.insertAdjacentElement('afterend',rail);const machine=d.querySelector('.machine');const place=['広場','塔','記録庫'];let seq=0,selected='',last='',captured=[],gameNo=0,surveyMask=0,surveyCycles=0,cycleComplete=false;function center(i){const r=d.querySelectorAll('.reel')[i],s=r&&r.querySelectorAll('.sym');return s&&s[1]?s[1].textContent.trim():'?'}function surveyCount(){return [1,2,4].filter(bit=>surveyMask&bit).length}function nextPlace(){for(let i=0;i<3;i++)if(!(surveyMask&(1<<i)))return place[i];return '全層完了'}function pairEcho(){if(captured.length<3)return'';const dup=captured.find((v,i)=>captured.indexOf(v)!==i);return dup?`${dup} 共鳴`:'三種採取'}function paint(extra=''){let body=seq===0?'<span class="live">観測待機</span>':'観測';if(selected)body+=` → <span class="pick">${selected}</span>`;else body+=' → 選択';body+=captured.length?` → <span class="pick">${captured.join('・')}</span>`:' → 採取';body+=seq>=3?' → <span class="live">照合</span>':' → 照合';body+=' → 記憶';if(extra)body+=`<br><span class="memory">${extra}</span> <span class="survey">巡回 ${surveyCount()}/3${surveyCycles?` / 完了${surveyCycles}`:''}</span>`;rail.innerHTML=body}function paintOptics(active=-1){opticEls.forEach((el,i)=>{el.classList.toggle('seen',!!(surveyMask&(1<<i)));el.classList.toggle('active',i===active)})}function paintLink(active=-1,echo=false){linkEls.forEach((el,i)=>{el.classList.toggle('on',i===active);el.classList.toggle('echo',echo&&i===active)})}function refract(){refraction.classList.remove('fire');void refraction.offsetWidth;refraction.classList.add('fire')}function sonarPulse(i,strong=false){if(!screen)return;const pts=[[19,54],[50,49],[78,58]][i]||[50,50];sonar.style.left=`calc(${pts[0]}% - 29px)`;sonar.style.top=`calc(${pts[1]}% - 29px)`;sonar.style.filter=strong?'brightness(1.35) hue-rotate(18deg)':'none';sonar.classList.remove('pulse');void sonar.offsetWidth;sonar.classList.add('pulse')}function cabinetChannel(i){if(!machine)return;machine.classList.remove('vm-ch1','vm-ch2','vm-ch3');const c=`vm-ch${i+1}`;machine.classList.add(c);setTimeout(()=>machine.classList.remove(c),330)}d.addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='bet'){gameNo++;if(cycleComplete){surveyMask=0;cycleComplete=false;paintOptics()}seq=0;selected='';captured=[];paintLink();paint(`第${gameNo}潜航 / 未観測 ${nextPlace()}`);if(machine)machine.classList.remove('vm-memory','vm-survey-complete');withAudio(()=>{ping(176,.045,.009,0,'sine',mechBus);ping(264,.06,.006,.025,'sine',mechBus)})}else if(t.id==='lever'){seq=0;selected='';captured=[];paintLink();paint(`第${Math.max(1,gameNo)}潜航 / 第一停止で観測層を選ぶ`);paintOptics();if(machine)machine.classList.remove('vm-memory','vm-survey-complete');withAudio(()=>{ping(58,.18,.012,0,'sine',mechBus);ping(116,.22,.005,.06,'sine',mechBus)})}else if(t.classList.contains('stop')&&!t.disabled){const i=+t.dataset.i;if(seq===0){selected=place[i];surveyMask|=(1<<i);paintLink(i);if(surveyMask===7){surveyCycles++;cycleComplete=true;if(machine){machine.classList.add('vm-survey-complete');setTimeout(()=>machine.classList.remove('vm-survey-complete'),720)}withAudio(()=>surveyComplete())}paintOptics(i)}seq=Math.min(3,seq+1);cabinetChannel(i);sonarPulse(i,seq===3);withAudio(()=>{ping(118+i*13,.035,.009,0,'square',mechBus);if(seq===1)channel(i);else ping(215+i*32,.07,.009,.012,'triangle',observeBus)});setTimeout(()=>{captured.push(center(i));const echo=seq===3&&/共鳴/.test(pairEcho());if(echo){paintLink(place.indexOf(selected),true);refract()}paint(seq===1?`${selected}を観測 / ${cycleComplete?'三層巡回完了':`次未観測 ${nextPlace()}`}`:seq===3?`${selected} × ${pairEcho()}`:'観測情報を追加')},45)}},{capture:true});const log=d.getElementById('log');if(log)new MutationObserver(()=>{const text=log.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running')memory(text);if(/NEW MEMORY|DEPTH|赤い連結|鍵と月|気泡/.test(text)){if(machine)machine.classList.add('vm-memory');paintLink(place.indexOf(selected),true);sonarPulse(place.indexOf(selected),true);refract();paint(`${text} / ${pairEcho()}`);setTimeout(()=>{if(seq===3)rail.innerHTML=`<span class="pick">${selected}</span> / ${captured.join('・')} / ${pairEcho()}　<span class="survey">巡回 ${surveyCount()}/3</span> → <span class="live">NEXT BET</span>`},760)}}).observe(log,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){audioState('suspended-by-visibility');ac.suspend().catch(()=>{})}});})();
