<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Audio Build</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./index.html" title="ノクターン・アクアリウム"></iframe><script>
(()=>{let ac,master,ambient;const frame=document.getElementById('game');async function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();master=ac.createGain();master.gain.value=.34;master.connect(ac.destination);ambient=ac.createGain();ambient.gain.value=.035;ambient.connect(master);const o=ac.createOscillator(),f=ac.createBiquadFilter();o.type='sine';o.frequency.value=46;f.type='lowpass';f.frequency.value=105;o.connect(f).connect(ambient);o.start()}if(ac.state==='suspended'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function ping(f,d=.08,g=.018,delay=0,type='sine'){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.01)}function channel(i){const f=[286,337,401][i];ping(f,.065,.017);ping(f*2.01,.12,.009,.035)}function memory(text){if(/DEPTH/.test(text)){ping(164,.32,.018);ping(246,.38,.014,.08);ping(369,.44,.012,.16);ping(554,.5,.009,.25)}else if(/NEW MEMORY/.test(text)){ping(310,.2,.014);ping(465,.24,.011,.08);ping(620,.28,.008,.15)}else if(/赤い連結|鍵と月|気泡/.test(text)){ping(265,.13,.011);ping(398,.17,.007,.07)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;let seq=0,last='';d.addEventListener('pointerdown',async e=>{const t=e.target.closest('button');if(!t)return;const ready=await boot();if(!ready)return;if(t.id==='bet'){ping(176,.045,.009);ping(264,.06,.006,.025)}else if(t.id==='lever'){seq=0;ping(58,.18,.012);ping(116,.22,.005,.06)}else if(t.classList.contains('stop')&&!t.disabled){seq++;const i=+t.dataset.i;if(seq===1)channel(i);else ping(215+i*32,.07,.013,0,'triangle')}},{capture:true});const log=d.getElementById('log');if(log)new MutationObserver(()=>{const text=log.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running')memory(text)}).observe(log,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();});})();
</script></body></html>
