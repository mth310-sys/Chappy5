<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Integrated Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./index.html" title="ノクターン・アクアリウム"></iframe><script>
(()=>{let ac,master,ambient;const frame=document.getElementById('game');async function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();master=ac.createGain();master.gain.value=.34;master.connect(ac.destination);ambient=ac.createGain();ambient.gain.value=.035;ambient.connect(master);const o=ac.createOscillator(),f=ac.createBiquadFilter();o.type='sine';o.frequency.value=46;f.type='lowpass';f.frequency.value=105;o.connect(f).connect(ambient);o.start()}if(ac.state==='suspended'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function ping(f,d=.08,g=.018,delay=0,type='sine'){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.01)}function channel(i){const f=[286,337,401][i];ping(f,.065,.017);ping(f*2.01,.12,.009,.035)}function memory(text){if(/DEPTH/.test(text)){ping(164,.32,.018);ping(246,.38,.014,.08);ping(369,.44,.012,.16);ping(554,.5,.009,.25)}else if(/NEW MEMORY/.test(text)){ping(310,.2,.014);ping(465,.24,.011,.08);ping(620,.28,.008,.15)}else if(/赤い連結|鍵と月|気泡/.test(text)){ping(265,.13,.011);ping(398,.17,.007,.07)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;const qaStyle=d.createElement('style');qaStyle.textContent='.bet{min-height:46px!important}.controls,.bet,.lever,.stop{transform:none!important}.bet,.lever,.stop{transition:filter .08s,box-shadow .08s!important}.bet:active,.stop:active,.lever:active{transform:none!important;filter:brightness(1.15)!important;box-shadow:0 3px 8px #000,inset 0 3px 6px #0008!important}.gr-observe{margin:5px 8px 0;padding:5px 7px;border:1px solid #5bc7d044;border-radius:10px;background:linear-gradient(90deg,#031219dd,#072731cc,#031219dd);font:700 9px/1.3 ui-monospace,monospace;letter-spacing:.05em;color:#6ea7af;text-align:center;min-height:30px;box-shadow:inset 0 0 10px #4ceaff0b}.gr-observe .live{color:#dffcff}.gr-observe .pick{color:#8ce9e5}.gr-observe .memory{color:#d3c9ff}';d.head.appendChild(qaStyle);const anchor=d.querySelector('.reelDeck')||d.querySelector('.reels')||d.querySelector('.controls');const rail=d.createElement('div');rail.className='gr-observe';rail.innerHTML='<span class="live">観測待機</span> → 選択 → 採取 → 照合 → 記憶';if(anchor)anchor.insertAdjacentElement('afterend',rail);const place=['広場','塔','記録庫'];let seq=0,selected='',last='',captured=[];function center(i){const r=d.querySelectorAll('.reel')[i],s=r&&r.querySelectorAll('.sym');return s&&s[1]?s[1].textContent.trim():'?'}function paint(extra=''){let body=seq===0?'<span class="live">観測待機</span>':'観測';if(selected)body+=` → <span class="pick">${selected}</span>`;else body+=' → 選択';body+=captured.length?` → <span class="pick">${captured.join('・')}</span>`:' → 採取';body+=seq>=3?' → <span class="live">照合</span>':' → 照合';body+=' → 記憶';if(extra)body+=`<br><span class="memory">${extra}</span>`;rail.innerHTML=body}d.addEventListener('pointerdown',async e=>{const t=e.target.closest('button');if(!t)return;const ready=await boot();if(t.id==='bet'){seq=0;selected='';captured=[];paint();if(ready){ping(176,.045,.009);ping(264,.06,.006,.025)}}else if(t.id==='lever'){seq=0;selected='';captured=[];paint('三つの観測層から最初の一枚を選ぶ');if(ready){ping(58,.18,.012);ping(116,.22,.005,.06)}}else if(t.classList.contains('stop')&&!t.disabled){const i=+t.dataset.i;if(seq===0)selected=place[i];seq=Math.min(3,seq+1);if(ready){if(seq===1)channel(i);else ping(215+i*32,.07,.013,0,'triangle')}setTimeout(()=>{captured.push(center(i));paint(seq===1?`${selected}を観測中`:seq===3?`${selected} × 出目を照合`:'観測情報を追加')},45)}},{capture:true});const log=d.getElementById('log');if(log)new MutationObserver(()=>{const text=log.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running')memory(text);if(/NEW MEMORY|DEPTH|赤い連結|鍵と月|気泡/.test(text)){paint(text);setTimeout(()=>{if(seq===3)rail.innerHTML=`<span class="pick">${selected}</span> / ${captured.join('・')}　→ <span class="live">NEXT BET</span>`},760)}}).observe(log,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();});})();
</script></body></html>
