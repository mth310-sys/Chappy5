<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // Audio Build</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./index.html" title="刻ノ一閃"></iframe><script>
(()=>{let ac,master;const frame=document.getElementById('game');async function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();master=ac.createGain();master.gain.value=.42;master.connect(ac.destination)}if(ac.state==='suspended'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function hit(f,d=.05,type='sine',g=.025,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.01)}function noise(d=.035,g=.018,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),v=ac.createGain(),f=ac.createBiquadFilter();s.buffer=b;f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;v.gain.value=g;s.connect(f).connect(v).connect(master);s.start(t)}function stopVoice(n,i){const roots=[330,410,520];noise(.045,.017);hit(roots[n-1]+i*18,.045,'triangle',.028);if(n===2)hit(720,.035,'sine',.012,.025);if(n===3){hit(980,.045,'triangle',.02,.018);noise(.08,.02,.055)}}function resolveVoice(text){if(/会心/.test(text)){hit(196,.16,'triangle',.025);hit(392,.2,'sine',.018,.045);hit(784,.24,'sine',.014,.09)}else if(/^斬/.test(text)){hit(180,.12,'triangle',.02);hit(540,.13,'sine',.015,.04)}else if(/紙一重/.test(text)){hit(155,.13,'triangle',.014)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;const qaStyle=d.createElement('style');qaStyle.textContent='.bet{min-height:46px!important}';d.head.appendChild(qaStyle);let seq=0,last='';d.addEventListener('pointerdown',async e=>{const t=e.target.closest('button');if(!t)return;const ready=await boot();if(!ready)return;if(t.id==='bet'){hit(145,.035,'square',.012);hit(290,.04,'sine',.01,.025)}else if(t.id==='lever'){seq=0;hit(72,.09,'triangle',.018);noise(.055,.008,.03)}else if(t.classList.contains('stop')&&!t.disabled){seq++;stopVoice(seq,+t.dataset.i)}},{capture:true});const msg=d.getElementById('msg');if(msg)new MutationObserver(()=>{const text=msg.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running'&&/会心|^斬「|紙一重/.test(text))resolveVoice(text)}).observe(msg,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();});})();
</script></body></html>
