<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // Integrated Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./index.html" title="刻ノ一閃"></iframe><script>
(()=>{let ac,master;const frame=document.getElementById('game');async function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();master=ac.createGain();master.gain.value=.42;master.connect(ac.destination)}if(ac.state==='suspended'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function hit(f,d=.05,type='sine',g=.025,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.01)}function noise(d=.035,g=.018,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),v=ac.createGain(),f=ac.createBiquadFilter();s.buffer=b;f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;v.gain.value=g;s.connect(f).connect(v).connect(master);s.start(t)}function stopVoice(n,i){const roots=[330,410,520];noise(.045,.017);hit(roots[n-1]+i*18,.045,'triangle',.028);if(n===2)hit(720,.035,'sine',.012,.025);if(n===3){hit(980,.045,'triangle',.02,.018);noise(.08,.02,.055)}}function resolveVoice(text){if(/会心/.test(text)){hit(196,.16,'triangle',.025);hit(392,.2,'sine',.018,.045);hit(784,.24,'sine',.014,.09)}else if(/^斬/.test(text)){hit(180,.12,'triangle',.02);hit(540,.13,'sine',.015,.04)}else if(/紙一重/.test(text)){hit(155,.13,'triangle',.014)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;const qaStyle=d.createElement('style');qaStyle.textContent='.bet{min-height:46px!important}.deck,.bet,.lever,.stop{transform:none!important}.bet,.lever,.stop{transition:filter .08s,box-shadow .08s!important}.lever:active,.bet:active,.stop:active{transform:none!important;filter:brightness(1.18)!important;box-shadow:0 3px 8px #000,inset 0 3px 6px #0008!important}.gr-tempo{position:relative;margin:5px 8px 0;padding:7px 12px 6px;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);border:1px solid #9b7b59aa;background:linear-gradient(180deg,#2b2131,#09070c 28%,#17101d 70%,#050406);font:700 9px/1.25 ui-monospace,monospace;letter-spacing:.08em;color:#8f8198;text-align:center;height:46px;overflow:hidden;box-shadow:inset 0 1px #fff2,inset 0 -7px 12px #0008,0 4px 10px #0008}.gr-tempo:before{content:"";position:absolute;left:8%;right:8%;top:2px;height:1px;background:linear-gradient(90deg,transparent,#d7b45d,#fff3c1,#d7b45d,transparent);box-shadow:0 0 8px #f1c65f88}.gr-tempo b{color:#f1d982}.gr-tempo .live{color:#fff4c2;text-shadow:0 0 7px #ffd66f}.gr-tempo .read{color:#e7bd5f}.gr-tempo .result{color:#e4ceff;text-shadow:0 0 8px #a449ff}.gr-tempo .chain{color:#ffd875;text-shadow:0 0 7px #f2b54488}.machine.vm-s1 .spine.l{opacity:1;filter:drop-shadow(0 0 11px #f0d07a)}.machine.vm-s2 .spine.r{opacity:1;filter:drop-shadow(0 0 11px #d487ff)}.machine.vm-s3 .spine{opacity:1;filter:drop-shadow(0 0 14px #fff)}.machine.vm-s1 .screenFrame,.machine.vm-s2 .screenFrame,.machine.vm-s3 .screenFrame{box-shadow:0 8px 20px #000,inset 0 0 0 1px #d4b46c88,0 0 16px #9f43ff55}.machine.vm-resolve{filter:brightness(1.06)}.machine.vm-resolve .bladeBridge:before{box-shadow:0 0 8px #fff,0 0 28px #c66cff}.vm-notch{position:absolute;z-index:17;left:50%;bottom:-1px;width:74%;height:8px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,#9a7630 10%,#f2dc95 49%,#fff8c9 50%,#c69a42 52%,transparent 90%);clip-path:polygon(0 45%,45% 45%,48% 0,52% 0,55% 45%,100% 45%,100% 60%,55% 60%,52% 100%,48% 100%,45% 60%,0 60%);opacity:.5;transition:opacity .1s,filter .1s}.machine.vm-s3 .vm-notch,.machine.vm-resolve .vm-notch{opacity:1;filter:drop-shadow(0 0 6px #fff4b0)}.vm-residue{position:absolute;inset:0;z-index:16;overflow:hidden;pointer-events:none;mix-blend-mode:screen}.vm-residue i{position:absolute;left:13%;top:50%;width:78%;height:1px;opacity:0;transform-origin:center;background:linear-gradient(90deg,transparent,#6d3d8d55 16%,#e7c973cc 49%,#fff7cd 51%,#7f42ad55 84%,transparent);box-shadow:0 0 3px #fff5c9,0 0 9px #b55cff55;transition:opacity .22s ease,filter .22s ease}.vm-residue i:nth-child(1){transform:rotate(-11deg) translateY(-13px)}.vm-residue i:nth-child(2){transform:rotate(7deg) translateY(5px)}.vm-residue i:nth-child(3){transform:rotate(-3deg) translateY(19px)}.vm-residue.r1 i:nth-child(1),.vm-residue.r2 i:nth-child(-n+2),.vm-residue.r3 i{opacity:.24}.vm-residue.r2 i{filter:brightness(1.08)}.vm-residue.r3 i{opacity:.38;filter:brightness(1.25)}.machine.vm-s1 .vm-residue i:nth-child(1),.machine.vm-s2 .vm-residue i:nth-child(2),.machine.vm-s3 .vm-residue i:nth-child(3){opacity:.9;filter:brightness(1.8);transition:none}.machine.vm-resolve .vm-residue i{opacity:.62;filter:brightness(1.45)}@media(max-width:390px){.gr-tempo{margin-left:5px;margin-right:5px;padding-left:7px;padding-right:7px;font-size:8px;letter-spacing:.05em}.vm-residue i{left:10%;width:84%}}';d.head.appendChild(qaStyle);const bridge=d.querySelector('.bladeBridge');if(bridge){const notch=d.createElement('div');notch.className='vm-notch';bridge.appendChild(notch)}const screenFrame=d.querySelector('.screenFrame')||d.querySelector('.screen');const residue=d.createElement('div');residue.className='vm-residue';residue.innerHTML='<i></i><i></i><i></i>';if(screenFrame)screenFrame.appendChild(residue);const anchor=d.querySelector('.reelDeck')||d.querySelector('.deck');const tempo=d.createElement('div');tempo.className='gr-tempo';tempo.innerHTML='<span class="live">構え</span> → 壱 → 弐 → 参 → 決';if(anchor)anchor.insertAdjacentElement('afterend',tempo);const machine=d.getElementById('machine')||d.querySelector('.machine');let seq=0,last='',centers=['','',''],gameNo=0,chain=0,stopOrder=[],firstRead=false;function center(i){const r=d.querySelectorAll('.reel')[i],s=r&&r.querySelectorAll('.sym');return s&&s[1]?s[1].textContent.trim():'?'}function orderText(){return stopOrder.length?stopOrder.map(i=>['左','中','右'][i]).join('→'):''}function paint(label=''){const steps=['壱','弐','参'];let out=seq===0?'<span class="live">構え</span>':'構え';for(let n=0;n<3;n++){const c=centers[n]?` ${centers[n]}`:'';out+=` → <span class="${n<seq?'read':n===seq?'live':''}">${steps[n]}${c}</span>`}out+=' → 決';if(label)out+=`<br><span class="result">${label}</span>${chain?`　<span class="chain">連閃 ${chain}</span>`:''}`;tempo.innerHTML=out}function paintResidue(){if(!residue)return;residue.classList.remove('r1','r2','r3');if(chain>0)residue.classList.add(`r${Math.min(3,chain)}`)}function cabinetBeat(n){if(!machine)return;machine.classList.remove('vm-s1','vm-s2','vm-s3');const c=`vm-s${n}`;machine.classList.add(c);setTimeout(()=>machine.classList.remove(c),230+n*35)}d.addEventListener('pointerdown',async e=>{const t=e.target.closest('button');if(!t)return;const ready=await boot();if(t.id==='bet'){gameNo++;seq=0;centers=['','',''];stopOrder=[];firstRead=false;paint(`第${gameNo}局 / 初手判断を継続`);paintResidue();if(machine)machine.classList.remove('vm-resolve');if(ready){hit(145,.035,'square',.012);hit(290,.04,'sine',.01,.025)}}else if(t.id==='lever'){seq=0;centers=['','',''];stopOrder=[];firstRead=false;paint(`第${Math.max(1,gameNo)}局 / 敵の初手を読む`);paintResidue();if(machine)machine.classList.remove('vm-resolve');if(ready){hit(72,.09,'triangle',.018);noise(.055,.008,.03)}}else if(t.classList.contains('stop')&&!t.disabled){const order=seq,i=+t.dataset.i;stopOrder.push(i);seq=Math.min(3,seq+1);cabinetBeat(seq);if(ready)stopVoice(seq,i);setTimeout(()=>{centers[order]=center(i);const read=d.querySelectorAll('.reel')[i]?.classList.contains('read');if(seq===1){firstRead=!!read;chain=firstRead?chain+1:0;paintResidue()}paint(seq===1?(firstRead?`初手一致 / ${orderText()}`:`初手外し / ${orderText()}`):seq===3?`三太刀 ${orderText()}`:`次の太刀 / ${orderText()}`)},45)}},{capture:true});const msg=d.getElementById('msg');if(msg)new MutationObserver(()=>{const text=msg.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running'&&/会心|^斬「|紙一重/.test(text))resolveVoice(text);if(/会心|^斬「|紙一重/.test(text)){if(machine)machine.classList.add('vm-resolve');paint(`${text} / ${orderText()}`);setTimeout(()=>{if(seq===3)tempo.innerHTML=`第${Math.max(1,gameNo)}局　${orderText()}　${chain?`<span class="chain">連閃 ${chain}</span>　`:''}<span class="live">NEXT BET</span>`},620)}}).observe(msg,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();});})();
</script></body></html>
