(()=>{let ac,master,mechBus,bladeBus,resultBus,noiseBuffer,resumePromise=null;const frame=document.getElementById('game');function audioState(v){document.body.dataset.audioTech=v}function makeBus(level){const g=ac.createGain();g.gain.value=level;g.connect(master);return g}function buildNoiseBuffer(){const n=Math.max(1,Math.floor(ac.sampleRate*.09)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);return b}function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C){audioState('unsupported');return false}ac=new C();master=ac.createGain();master.gain.value=.42;master.connect(ac.destination);mechBus=makeBus(.9);bladeBus=makeBus(.78);resultBus=makeBus(.82);noiseBuffer=buildNoiseBuffer()}if(ac.state==='running'){audioState('running');return true}if(ac.state==='suspended'||ac.state==='interrupted'){audioState('resuming');if(!resumePromise)resumePromise=ac.resume().then(()=>{const ok=ac.state==='running';audioState(ok?'running':ac.state);return ok}).catch(()=>{audioState('resume-failed');return false}).finally(()=>{resumePromise=null});return resumePromise}audioState(ac.state);return false}function withAudio(fn){const r=boot();if(r===true)fn();else if(r&&typeof r.then==='function')r.then(ok=>{if(ok)fn()})}function hit(f,d=.05,type='sine',g=.025,delay=0,out=mechBus||master){if(!ac||ac.state!=='running'||!out)return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(out);o.onended=()=>{try{o.disconnect();v.disconnect()}catch(_){}};o.start(t);o.stop(t+d+.01)}function noise(d=.035,g=.018,delay=0,out=bladeBus||master){if(!ac||ac.state!=='running'||!out||!noiseBuffer)return;const t=ac.currentTime+delay,s=ac.createBufferSource(),v=ac.createGain(),f=ac.createBiquadFilter();s.buffer=noiseBuffer;f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;v.gain.value=g;s.connect(f).connect(v).connect(out);s.onended=()=>{try{s.disconnect();f.disconnect();v.disconnect()}catch(_){}};s.start(t);s.stop(t+Math.min(d,.085))}function stopVoice(n,i){const roots=[330,410,520],slashDelay=.012;hit(92+n*18,.028,'square',.014,0,mechBus);noise(.038,.014,slashDelay,bladeBus);hit(roots[n-1]+i*18,.045,'triangle',.023,slashDelay,bladeBus);if(n===2)hit(720,.035,'sine',.009,slashDelay+.026,bladeBus);if(n===3){hit(980,.045,'triangle',.015,slashDelay+.02,bladeBus);noise(.07,.015,slashDelay+.058,bladeBus)}}function resolveVoice(text){const d=.105;if(/会心/.test(text)){hit(196,.16,'triangle',.022,d,resultBus);hit(392,.2,'sine',.016,d+.045,resultBus);hit(784,.24,'sine',.012,d+.09,resultBus)}else if(/^斬/.test(text)){hit(180,.12,'triangle',.018,d,resultBus);hit(540,.13,'sine',.013,d+.04,resultBus)}else if(/紙一重/.test(text)){hit(155,.13,'triangle',.012,d,resultBus)}}frame.addEventListener('load',()=>{const d=frame.contentDocument,w=frame.contentWindow;if(w&&typeof w.tone==='function')w.tone=()=>{};if(w&&typeof w.setInterval==='function'){const nativeSetInterval=w.setInterval.bind(w);w.setInterval=(fn,ms,...args)=>ms===78?0:nativeSetInterval(fn,ms,...args)}const perfStrips=[['鐘','蒼','七','桜','刀','蒼','鐘','七'],['蒼','桜','鐘','刀','七','蒼','桜','鐘'],['鐘','七','蒼','刀','桜','七','蒼','鐘']],reelNodes=[...d.querySelectorAll('.reel')].map(r=>[...r.querySelectorAll('.sym')]);if(w&&typeof w.render==='function'&&reelNodes.every(nodes=>nodes.length===3)){w.render=(i,offset=Math.floor(Math.random()*perfStrips[i].length))=>{const row=perfStrips[i],nodes=reelNodes[i];for(let j=0;j<3;j++){const s=row[(offset+j)%row.length],node=nodes[j];node.textContent=s;node.className=`sym ${s==='七'?'red':s==='蒼'?'blue':s==='鐘'?'gold':''}`}return row[(offset+1)%row.length]}}
const style=d.createElement('style');style.textContent='@keyframes grReelSpin{0%{transform:translateY(-5%) scaleY(1.02)}50%{transform:translateY(5%) scaleY(.98)}100%{transform:translateY(-5%) scaleY(1.02)}}.reel.spin .strip{animation:grReelSpin .19s linear infinite;will-change:transform}.bet{min-height:46px!important}.deck,.bet,.lever,.stop{transform:none!important}.bet,.lever,.stop{transition:filter .08s,box-shadow .08s!important}.lever:active,.bet:active,.stop:active{transform:none!important;filter:brightness(1.18)!important;box-shadow:0 3px 8px #000,inset 0 3px 6px #0008!important}.gr-tempo{position:relative;margin:5px 8px 0;padding:7px 12px 6px;clip-path:polygon(3% 0,97% 0,100% 50%,97% 100%,3% 100%,0 50%);border:1px solid #9b7b59aa;background:linear-gradient(180deg,#2b2131,#09070c 28%,#17101d 70%,#050406);font:700 9px/1.25 ui-monospace,monospace;letter-spacing:.08em;color:#8f8198;text-align:center;height:46px;overflow:hidden;box-shadow:inset 0 1px #fff2,inset 0 -7px 12px #0008,0 4px 10px #0008}.gr-tempo:before{content:"";position:absolute;left:8%;right:8%;top:2px;height:1px;background:linear-gradient(90deg,transparent,#d7b45d,#fff3c1,#d7b45d,transparent);box-shadow:0 0 8px #f1c65f88}.gr-tempo .live{color:#fff4c2;text-shadow:0 0 7px #ffd66f}.gr-tempo .read{color:#e7bd5f}.gr-tempo .result{color:#e4ceff;text-shadow:0 0 8px #a449ff}.gr-tempo .chain{color:#ffd875;text-shadow:0 0 7px #f2b54488}.machine.vm-s1 .spine.l{opacity:1;filter:drop-shadow(0 0 11px #f0d07a)}.machine.vm-s2 .spine.r{opacity:1;filter:drop-shadow(0 0 11px #d487ff)}.machine.vm-s3 .spine{opacity:1;filter:drop-shadow(0 0 14px #fff)}.machine.vm-s1 .screenFrame,.machine.vm-s2 .screenFrame,.machine.vm-s3 .screenFrame{box-shadow:0 10px 24px #000,inset 0 0 0 1px #d4b46c88,0 0 16px #9f43ff55}.machine.vm-resolve{filter:brightness(1.06)}.machine.vm-resolve .bladeBridge:before{box-shadow:0 0 8px #fff,0 0 28px #c66cff}.vm-notch{position:absolute;z-index:17;left:50%;bottom:-1px;width:74%;height:8px;transform:tran de-depth i:last-child{right:2.5%;transform:rotateY(-42deg) rotateZ(2deg)}.machine.vm-s1 .vm-blade-depth i:first-child,.machine.vm-s2 .vm-blade-depth i:last-child,.machine.vm-s3 .vm-blade-depth i{opacity:.95;filter:brightness(1.6) drop-shadow(0 0 7px #d17bff);transform:rotateY(0) scaleX(1.25)}.machine.vm-strong .vm-blade-depth i{filter:brightness(2) drop-shadow(0 0 10px #fff1a8)}.vm-impact{z-index:18;opacity:0;mix-blend-mode:screen}.vm-impact:before{content:"";position:absolute;left:10%;top:50%;width:80%;height:2px;background:linear-gradient(90deg,transparent,#fff0b8,#fff,#c46dff,transparent);box-shadow:0 0 5px #fff,0 0 17px #bf67ff}.vm-impact.i0:before{transform:rotate(-18deg)}.vm-impact.i1:before{transform:rotate(2deg)}.vm-impact.i2:before{transform:rotate(18deg)}.vm-impact.fire{animation:vmImpact .24s ease-out}@keyframes vmImpact{0%{opacity:0;transform:scaleX(.25)}18%{opacity:1}100%{opacity:0;transform:scaleX(1.08)}}.machine.vm-clean .screenFrame{box-shadow:0 10px 24px #000,inset 0 0 0 1px #f2d78fcc,0 0 22px #d6a6ff66}.machine.vm-clean .reel.read{filter:brightness(1.18) saturate(1.1)}@media(max-width:390px){.gr-tempo{margin-left:5px;margin-right:5px;padding-left:7px;padding-right:7px;font-size:8px;letter-spacing:.05em}.vm-residue i{left:10%;width:84%}.vm-blade-depth i{width:7px}}';d.head.appendChild(style);const bridge=d.querySelector('.bladeBridge');if(bridge){const notch=d.createElement('div');notch.className='vm-notch';bridge.appendChild(notch)}const screenFrame=d.querySelector('.screenFrame')||d.querySelector('.screen');const residue=d.createElement('div');residue.className='vm-residue';residue.innerHTML='<i></i><i></i><i></i>';const blades=d.createElement('div');blades.className='vm-blade-depth';blades.innerHTML='<i></i><i></i>';const impact=d.createElement('div');impact.className='vm-impact';if(screenFrame){screenFrame.appendChild(blades);screenFrame.appendChild(residue);screenFrame.appendChild(impact)}const anchor=d.querySelector('.reelDeck')||d.querySelector('.deck');const tempo=d.createElement('div');tempo.className='gr-tempo';tempo.innerHTML='<span class="live">構え</span> → 壱 → 弐 → 参 → 決';if(anchor)anchor.insertAdjacentElement('afterend',tempo);const machine=d.getElementById('machine')||d.querySelector('.machine');let seq=0,last='',centers=['','',''],gameNo=0,chain=0,stopOrder=[],firstRead=false;function center(i){const r=d.querySelectorAll('.reel')[i],s=r&&r.querySelectorAll('.sym');return s&&s[1]?s[1].textContent.trim():'?'}function orderText(){return stopOrder.length?stopOrder.map(i=>['左','中','右'][i]).join('→'):''}function symbolCue(s,n){if(s==='刀')return'強斬';if(s==='七')return n===3?'決め七':'七印';if(s==='蒼')return n===2?'二太刀冴え':'蒼気';if(s==='桜')return n===1?'初太刀冴え':'桜気';if(s==='鐘')return'立直し';return s}function paint(label=''){const steps=['壱','弐','参'];let out=seq===0?'<span class="live">構え</span>':'構え';for(let n=0;n<3;n++){const c=centers[n]?` ${centers[n]}`:'';out+=` → <span class="${n<seq?'read':n===seq?'live':''}">${steps[n]}${c}</span>`}out+=' → 決';if(label)out+=`<br><span class="result">${label}</span>${chain?`　<span class="chain">連閃 ${chain}</span>`:''}`;tempo.innerHTML=out}function paintResidue(){residue.classList.remove('r1','r2','r3');if(chain>0)residue.classList.add(`r${Math.min(3,chain)}`)}function impactBeat(i,strong=false){impact.className=`vm-impact i${i}`;if(strong)impact.style.filter='brightness(1.55)';else impact.style.filter='';void impact.offsetWidth;impact.classList.add('fire')}function cabinetBeat(n){if(!machine)return;machine.classList.remove('vm-s1','vm-s2','vm-s3');const c=`vm-s${n}`;machine.classList.add(c);setTimeout(()=>machine.classList.remove(c),230+n*35)}function semanticBeat(meaning,i,read){if(!machine)return;machine.classList.remove('vm-strong','vm-clean');if(/強斬|決め七/.test(meaning))machine.classList.add('vm-strong');if(read||/太刀冴え/.test(meaning))machine.classList.add('vm-clean');impactBeat(i,/強斬|決め七/.test(meaning));setTimeout(()=>machine.classList.remove('vm-strong','vm-clean'),300)}d.addEventListener('pointerdown',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='bet'){gameNo++;seq=0;centers=['','',''];stopOrder=[];firstRead=false;paint(`第${gameNo}局 / 初手判断を継続`);paintResidue();if(machine)machine.classList.remove('vm-resolve','vm-strong','vm-clean');withAudio(()=>{hit(145,.035,'square',.012,0,mechBus);hit(290,.04,'sine',.01,.025,mechBus)})}else if(t.id==='lever'){seq=0;centers=['','',''];stopOrder=[];firstRead=false;paint(`第${Math.max(1,gameNo)}局 / 敵の初手を読む`);paintResidue();if(machine)machine.classList.remove('vm-resolve','vm-strong','vm-clean');withAudio(()=>{hit(72,.09,'triangle',.018,0,mechBus);noise(.055,.008,.03,mechBus)})}else if(t.classList.contains('stop')&&!t.disabled){const order=seq,i=+t.dataset.i,stopNumber=seq+1;stopOrder.push(i);seq=Math.min(3,seq+1);cabinetBeat(seq);withAudio(()=>stopVoice(seq,i));setTimeout(()=>{centers[order]=center(i);const read=d.querySelectorAll('.reel')[i]?.classList.contains('read'),meaning=symbolCue(centers[order],stopNumber);semanticBeat(meaning,i,read);if(stopNumber===1){firstRead=!!read;chain=firstRead?chain+1:0;paintResidue()}paint(stopNumber===1?(firstRead?`初手一致 / ${orderText()} / ${meaning}`:`初手外し / ${orderText()} / ${meaning}`):stopNumber===3?`三太刀 ${orderText()} / ${meaning}`:`二太刀 ${orderText()} / ${meaning}`)},45)}},{capture:true});const msg=d.getElementById('msg');if(msg)new MutationObserver(()=>{const text=msg.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running'&&/会心|^斬「|紙一重/.test(text))resolveVoice(text);if(/会心|^斬「|紙一重/.test(text)){if(machine)machine.classList.add('vm-resolve');paint(`${text} / ${orderText()}`);setTimeout(()=>{if(seq===3)tempo.innerHTML=`第${Math.max(1,gameNo)}局　${orderText()}　${chain?`<span class="chain">連閃 ${chain}</span>　`:''}<span class="live">NEXT BET</span>`},620)}}).observe(msg,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden){audioState('suspended-by-visibil
