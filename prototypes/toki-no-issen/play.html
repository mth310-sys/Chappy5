<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // Integrated Prototype</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="game" src="./index.html" title="刻ノ一閃"></iframe><script>
(()=>{let ac,master;const frame=document.getElementById('game');async function boot(){if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();master=ac.createGain();master.gain.value=.42;master.connect(ac.destination)}if(ac.state==='suspended'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function hit(f,d=.05,type='sine',g=.025,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.01)}function noise(d=.035,g=.018,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),v=ac.createGain(),f=ac.createBiquadFilter();s.buffer=b;f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;v.gain.value=g;s.connect(f).connect(v).connect(master);s.start(t)}function stopVoice(n,i){const roots=[330,410,520];noise(.045,.017);hit(roots[n-1]+i*18,.045,'triangle',.028);if(n===2)hit(720,.035,'sine',.012,.025);if(n===3){hit(980,.045,'triangle',.02,.018);noise(.08,.02,.055)}}function resolveVoice(text){if(/会心/.test(text)){hit(196,.16,'triangle',.025);hit(392,.2,'sine',.018,.045);hit(784,.24,'sine',.014,.09)}else if(/^斬/.test(text)){hit(180,.12,'triangle',.02);hit(540,.13,'sine',.015,.04)}else if(/紙一重/.test(text)){hit(155,.13,'triangle',.014)}}frame.addEventListener('load',()=>{const d=frame.contentDocument;const qaStyle=d.createElement('style');qaStyle.textContent='.bet{min-height:46px!important}.deck,.bet,.lever,.stop{transform:none!important}.bet,.lever,.stop{transition:filter .08s,box-shadow .08s!important}.lever:active,.bet:active,.stop:active{transform:none!important;filter:brightness(1.18)!important;box-shadow:0 3px 8px #000,inset 0 3px 6px #0008!important}.gr-tempo{margin:5px 8px 0;padding:5px 7px;border:1px solid #75548366;border-radius:7px;background:linear-gradient(90deg,#09070cdd,#1b1022cc,#09070cdd);font:700 9px/1.25 ui-monospace,monospace;letter-spacing:.06em;color:#917fa0;text-align:center;min-height:28px}.gr-tempo b{color:#f1d982}.gr-tempo .live{color:#fff}.gr-tempo .read{color:#f3c85b}.gr-tempo .result{color:#d7b6ff}';d.head.appendChild(qaStyle);const anchor=d.querySelector('.reelDeck')||d.querySelector('.deck');const tempo=d.createElement('div');tempo.className='gr-tempo';tempo.innerHTML='<span class="live">構え</span> → 壱 → 弐 → 参 → 決';if(anchor)anchor.insertAdjacentElement('afterend',tempo);let seq=0,last='',centers=['','',''];function center(i){const r=d.querySelectorAll('.reel')[i],s=r&&r.querySelectorAll('.sym');return s&&s[1]?s[1].textContent.trim():'?'}function paint(label=''){const steps=['壱','弐','参'];let out=seq===0?'<span class="live">構え</span>':'構え';for(let n=0;n<3;n++){const c=centers[n]?` ${centers[n]}`:'';out+=` → <span class="${n<seq?'read':n===seq?'live':''}">${steps[n]}${c}</span>`}out+=' → 決';if(label)out+=`<br><span class="result">${label}</span>`;tempo.innerHTML=out}d.addEventListener('pointerdown',async e=>{const t=e.target.closest('button');if(!t)return;const ready=await boot();if(t.id==='bet'){seq=0;centers=['','',''];paint();if(ready){hit(145,.035,'square',.012);hit(290,.04,'sine',.01,.025)}}else if(t.id==='lever'){seq=0;centers=['','',''];paint('敵の初手を読む');if(ready){hit(72,.09,'triangle',.018);noise(.055,.008,.03)}}else if(t.classList.contains('stop')&&!t.disabled){const order=seq;seq=Math.min(3,seq+1);if(ready)stopVoice(seq,+t.dataset.i);setTimeout(()=>{centers[order]=center(+t.dataset.i);const read=d.querySelectorAll('.reel')[+t.dataset.i]?.classList.contains('read');paint(seq===1?(read?'初手一致':'初手外し'):seq===3?'三太刀確定':'次の太刀へ')},45)}},{capture:true});const msg=d.getElementById('msg');if(msg)new MutationObserver(()=>{const text=msg.textContent;if(text===last)return;last=text;if(ac&&ac.state==='running'&&/会心|^斬「|紙一重/.test(text))resolveVoice(text);if(/会心|^斬「|紙一重/.test(text)){paint(text);setTimeout(()=>{if(seq===3)tempo.innerHTML='構え ← <span class="live">NEXT BET</span>　余韻を切って次ゲームへ'},620)}}).observe(msg,{childList:true,subtree:true,characterData:true});});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();});})();
</script></body></html>
