<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // Sound Hotfix</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205}iframe{display:block;width:100%;height:100%;border:0}.audioBadge{position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));right:8px;padding:5px 8px;border:1px solid #d9b85d77;border-radius:99px;background:#09070bd9;color:#d9c889;font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.9}.audioBadge.on{color:#dfffdc;border-color:#7cff9b77;opacity:.55}</style></head><body><div id="badge" class="audioBadge">SOUND: TAP</div><iframe id="shell" src="./play.html" title="刻ノ一閃"></iframe><script>(()=>{let ac=null,master=null,armed=false;const badge=document.getElementById('badge'),shell=document.getElementById('shell');const AC=window.AudioContext||window.webkitAudioContext;function boot(){if(!AC)return false;if(!ac){ac=new AC();master=ac.createGain();master.gain.value=.82;master.connect(ac.destination)}if(ac.state!=='running'){try{const p=ac.resume();if(p&&p.then)p.then(()=>setBadge())}catch(_){}}setBadge();return true}function setBadge(){const on=ac&&ac.state==='running';badge.textContent=on?'SOUND: ON':'SOUND: TAP';badge.classList.toggle('on',!!on)}function tone(f=220,d=.05,g=.05,type='sine',delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.onended=()=>{try{o.disconnect();v.disconnect()}catch(_){}};o.start(t);o.stop(t+d+.01)}function noise(d=.045,g=.055,delay=0,highpass=900){if(!ac||ac.state!=='running')return;const len=Math.max(1,Math.floor(ac.sampleRate*d)),buf=ac.createBuffer(1,len,ac.sampleRate),data=buf.getChannelData(0);for(let i=0;i<len;i++)data[i]=(Math.random()*2-1)*(1-i/len);const src=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain(),t=ac.currentTime+delay;f.type='highpass';f.frequency.value=highpass;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);src.buffer=buf;src.connect(f).connect(v).connect(master);src.onended=()=>{try{src.disconnect();f.disconnect();v.disconnect()}catch(_){}};src.start(t);src.stop(t+d)}function install(){let playDoc,game,doc;try{playDoc=shell.contentDocument;game=playDoc&&playDoc.getElementById('game');doc=game&&game.contentDocument}catch(_){return false}if(!doc||doc.documentElement.dataset.soundHotfix==='2')return !!doc;doc.documentElement.dataset.soundHotfix='2';doc.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;boot();if(b.id==='bet'){tone(128,.038,.065,'square');noise(.028,.035,.004,1300);tone(286,.05,.028,'sine',.018)}else if(b.id==='lever'){tone(74,.085,.08,'triangle');tone(148,.055,.035,'square',.012);noise(.035,.028,.014,700)}else if(b.classList.contains('stop')&&!b.disabled){const i=Number(b.dataset.i)||0;const n=[...doc.querySelectorAll('.stop')].filter(x=>x.disabled).length+1;const blade=[520,690,880][Math.min(2,n-1)]+i*26;tone(118+n*18,.034,.075,'square');noise(.052,.075,.006,1050+n*180);tone(blade,.062,.09,'sawtooth',.010);tone(blade*1.72,.045,.045,'triangle',.022);if(n>=3){tone(1040,.07,.055,'sine',.034);tone(164,.12,.045,'triangle',.085)}}},{capture:true});armed=true;return true}function probe(){install();if(!armed)setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,0);setTimeout(install,250);setTimeout(install,700)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac&&ac.state==='running')ac.suspend().then(setBadge).catch(()=>{})});setBadge()})();</script></body></html>
