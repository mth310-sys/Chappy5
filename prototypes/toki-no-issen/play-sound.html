<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // Layered Sound</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205}iframe{display:block;width:100%;height:100%;border:0}.audioBadge{position:fixed;z-index:9999;top:max(8px,env(safe-area-inset-top));right:8px;padding:5px 8px;border:1px solid #d9b85d77;border-radius:99px;background:#09070bd9;color:#d9c889;font:700 9px/1 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.9}.audioBadge.on{color:#dfffdc;border-color:#7cff9b77;opacity:.55}</style></head><body><div id="badge" class="audioBadge">SOUND: TAP</div><iframe id="shell" src="./play.html" title="刻ノ一閃"></iframe><script>(()=>{let ac=null,master=null,comp=null,armed=false,bank={};const badge=document.getElementById('badge'),shell=document.getElementById('shell'),AC=window.AudioContext||window.webkitAudioContext;function mk(name,d,fn){const n=Math.max(1,Math.floor(ac.sampleRate*d)),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++){const t=i/ac.sampleRate;a[i]=Math.max(-1,Math.min(1,fn(t,d,i,n)))}bank[name]=b}function build(){const rnd=()=>Math.random()*2-1;mk('bet',.105,(t,d)=>{const e=Math.exp(-t*34),click=Math.sin(2*Math.PI*138*t)+.45*Math.sin(2*Math.PI*276*t);return .8*click*e+.18*rnd()*Math.exp(-t*75)});mk('lever',.19,(t,d)=>{const e=Math.exp(-t*17),f=72+28*(t/d),body=Math.sin(2*Math.PI*f*t)+.35*Math.sin(2*Math.PI*145*t);return .82*body*e+.13*rnd()*Math.exp(-t*45)});for(let s=1;s<=3;s++)mk('stop'+s,.22+s*.035,(t,d)=>{const hit=Math.sin(2*Math.PI*(122+s*18)*t)*Math.exp(-t*52);const scrape=rnd()*Math.exp(-t*(18-s*2))*Math.sin(Math.PI*Math.min(1,t/.035));const blade=Math.sin(2*Math.PI*(620+s*155)*t+10*t*t)*Math.exp(-t*(12-s));const ring=Math.sin(2*Math.PI*(1040+s*110)*t)*Math.exp(-t*19);const tail=s===3?.28*Math.sin(2*Math.PI*164*t)*Math.exp(-t*8):0;return .7*hit+.38*scrape+.52*blade+.18*ring+tail});mk('resolve',.42,(t,d)=>{const sub=.75*Math.sin(2*Math.PI*92*t)*Math.exp(-t*7),metal=.32*Math.sin(2*Math.PI*780*t)*Math.exp(-t*12),air=.2*rnd()*Math.exp(-t*10);return sub+metal+air})}function boot(){if(!AC)return false;if(!ac){ac=new AC();master=ac.createGain();comp=ac.createDynamicsCompressor();master.gain.value=.95;comp.threshold.value=-16;comp.knee.value=15;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.12;master.connect(comp).connect(ac.destination);build()}if(ac.state!=='running'){try{const p=ac.resume();if(p&&p.then)p.then(setBadge)}catch(_){}}setBadge();return true}function play(name,g=1,delay=0,rate=1){if(!ac||ac.state!=='running'||!bank[name])return;const s=ac.createBufferSource(),v=ac.createGain();s.buffer=bank[name];s.playbackRate.value=rate;v.gain.value=g;s.connect(v).connect(master);s.onended=()=>{try{s.disconnect();v.disconnect()}catch(_){}};s.start(ac.currentTime+delay)}function setBadge(){const on=ac&&ac.state==='running';badge.textContent=on?'SOUND: ON':'SOUND: TAP';badge.classList.toggle('on',!!on)}function install(){let playDoc,game,doc;try{playDoc=shell.contentDocument;game=playDoc&&playDoc.getElementById('game');doc=game&&game.contentDocument}catch(_){return false}if(!doc||doc.documentElement.dataset.soundHotfix==='3')return !!doc;doc.documentElement.dataset.soundHotfix='3';doc.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');if(!b)return;boot();if(b.id==='bet'){play('bet',.92)}else if(b.id==='lever'){play('lever',1);play('bet',.2,.055,.82)}else if(b.classList.contains('stop')&&!b.disabled){const n=[...doc.querySelectorAll('.stop')].filter(x=>x.disabled).length+1;play('stop'+Math.min(3,n),n===3?1.08:.98);if(n===3)play('resolve',.76,.095)}},{capture:true});armed=true;return true}function probe(){install();if(!armed)setTimeout(probe,120)}shell.addEventListener('load',()=>{setTimeout(probe,0);setTimeout(install,250);setTimeout(install,700)});document.addEventListener('visibilitychange',()=>{if(document.hidden&&ac&&ac.state==='running')ac.suspend().then(setBadge).catch(()=>{})});setBadge()})();</script></body></html>
