<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>刻ノ一閃 // Prototype</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#05040a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow-x:hidden}body{display:grid;place-items:center;padding:10px;background:radial-gradient(circle at 50% 8%,#261144 0,#08070d 45%,#020203 100%)}.wrap{width:min(100%,430px)}.lab{font-size:10px;letter-spacing:.22em;color:#b7a6d4;text-align:center;margin:2px 0 7px}.machine{position:relative;border-radius:26px 26px 18px 18px;padding:10px 12px 17px;background:linear-gradient(100deg,#120d19,#403154 9%,#0d0b11 19%,#151019 81%,#4a315d 92%,#0b0910);border:1px solid #7f5ca3;box-shadow:0 25px 70px #000,0 0 24px #7b2cff55,inset 0 0 0 2px #000}.blade{position:absolute;left:5%;right:5%;top:44%;height:3px;opacity:.25;background:linear-gradient(90deg,transparent,#fff,#af65ff,#fff,transparent);filter:drop-shadow(0 0 8px #b554ff);transform:scaleX(.08);transition:.18s}.machine.hit .blade{opacity:1;transform:scaleX(1)}.crown{text-align:center;padding:5px 0 7px}.title{font-family:serif;font-weight:900;font-size:30px;letter-spacing:.12em;background:linear-gradient(#fff6ca,#dca630 52%,#73400f);-webkit-background-clip:text;color:transparent;text-shadow:0 0 16px #9b55ff55}.sub{font-size:9px;letter-spacing:.3em;color:#ba93e9}.screen{height:222px;position:relative;overflow:hidden;border-radius:14px;border:2px solid #4d365e;background:linear-gradient(#0e1224,#171022 52%,#08070c);box-shadow:inset 0 0 35px #000,0 0 18px #8c3dff33}.moon{position:absolute;width:92px;height:92px;border-radius:50%;right:30px;top:17px;background:radial-gradient(circle at 35% 35%,#fff,#c3b7ff 45%,#665f9d 70%,transparent 72%);filter:drop-shadow(0 0 17px #b89dff88)}.pagoda{position:absolute;left:0;right:0;bottom:0;height:95px;background:linear-gradient(140deg,transparent 0 10%,#09070e 11% 25%,transparent 26%),linear-gradient(220deg,transparent 0 16%,#0a0710 17% 35%,transparent 36%),linear-gradient(#17101e,#08070b);clip-path:polygon(0 44%,12% 35%,21% 43%,32% 29%,44% 39%,57% 23%,68% 39%,79% 31%,100% 45%,100% 100%,0 100%)}.samurai{position:absolute;left:18px;bottom:18px;width:150px;height:150px}.samurai:before{content:"";position:absolute;left:54px;top:7px;width:42px;height:42px;border-radius:50% 50% 45% 45%;background:#09080d;box-shadow:0 0 0 8px #15101c}.samurai:after{content:"";position:absolute;left:34px;top:44px;width:86px;height:104px;background:linear-gradient(135deg,#1b1730,#08080d);clip-path:polygon(31% 0,65% 0,100% 67%,72% 100%,0 100%,16% 44%);filter:drop-shadow(0 0 9px #6923b7)}.sword{position:absolute;left:90px;top:47px;width:145px;height:4px;background:linear-gradient(90deg,#fff,#7e2dff 35%,#f7e5ff);transform:rotate(-28deg);transform-origin:left;box-shadow:0 0 10px #a84cff,0 0 28px #6a22ff}.screen.flash:after{content:"";position:absolute;inset:-30%;background:linear-gradient(110deg,transparent 42%,#fff 49%,#9c56ff 51%,transparent 58%);animation:slash .32s ease-out}@keyframes slash{from{transform:translateX(-45%)}to{transform:translateX(45%)}}.hud{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;font-size:10px;color:#d7c7ff}.message{position:absolute;left:12px;right:12px;bottom:10px;text-align:right;font-family:serif;font-weight:700;font-size:14px;text-shadow:0 2px 6px #000}.reelDeck{margin-top:7px;padding:10px;border-radius:12px;background:linear-gradient(#0a080c,#19141e);border:1px solid #6d4a82;box-shadow:inset 0 0 22px #000}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:#070608;padding:5px;border-radius:9px}.reel{height:116px;border-radius:7px;overflow:hidden;background:linear-gradient(90deg,#bdb4a6,#f7f0dd 25%,#fff 50%,#e9dfc9 75%,#aba190);box-shadow:inset 0 0 12px #38342d}.strip{height:100%;display:grid;grid-template-rows:repeat(3,1fr);transition:filter .1s}.reel.spin .strip{filter:blur(3px)}.sym{display:grid;place-items:center;font-weight:900;font-family:serif;font-size:23px;color:#251a26;text-shadow:0 1px #fff;border-bottom:1px solid #8d8576}.sym.red{color:#ad1c20}.sym.blue{color:#233d92}.sym.gold{color:#8d5a00}.deck{display:grid;grid-template-columns:65px 1fr 1fr 1fr 65px;align-items:center;gap:7px;padding:10px 2px 0}.lever,.bet,.stop{border:0;color:#fff;font-weight:800;box-shadow:0 5px 11px #000,inset 0 2px 3px #ffffff33;touch-action:manipulation}.lever{height:48px;border-radius:22px;background:radial-gradient(circle at 40% 30%,#6c6a70,#17151b 45%,#020203 70%);font-size:9px}.bet{height:44px;border-radius:10px;background:linear-gradient(#3a2e47,#17121c);font-size:10px}.stop{height:55px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#ff5c58,#ad0c17 55%,#50040a 70%);font-size:11px}.stop:disabled,.lever:disabled{opacity:.35}.meters{display:flex;justify-content:space-between;padding:9px 6px 0;font:700 11px ui-monospace,monospace;color:#ccb5ec}.hint{text-align:center;font-size:10px;color:#947da9;margin-top:6px;min-height:15px}.foot{text-align:center;font-size:9px;color:#6f6478;padding:8px}.machine.pulse{animation:pulse .23s ease}@keyframes pulse{50%{filter:brightness(1.32)}}
</style></head><body><div class="wrap"><div class="lab">YUSOSHA // BROWSER PROTOTYPE 0</div><main class="machine" id="machine"><div class="blade"></div><div class="crown"><div class="title">刻ノ一閃</div><div class="sub">TOKI NO ISSEN</div></div><section class="screen" id="screen"><div class="moon"></div><div class="pagoda"></div><div class="samurai"><div class="sword"></div></div><div class="hud"><span id="phase">静</span><span>刻力 <b id="power">0</b>/9</span></div><div class="message" id="msg">レバーで構えろ。</div></section><section class="reelDeck"><div class="reels" id="reels"></div><div class="deck"><button class="bet" id="bet">MAX<br>BET</button><button class="stop" data-i="0" disabled>壱</button><button class="stop" data-i="1" disabled>弐</button><button class="stop" data-i="2" disabled>参</button><button class="lever" id="lever">LEVER</button></div><div class="meters"><span>CREDIT <b id="credit">50</b></span><span>BET <b id="betv">0</b></span><span>GAME <b id="game">0</b></span></div><div class="hint" id="hint">MAX BET → LEVER → STOP ×3</div></section></main><div class="foot">Prototype tuning only / no real-money gambling</div></div><script>
const symbols=[['鐘','蒼','七','桜','刀','蒼','鐘','七'],['蒼','桜','鐘','刀','七','蒼','桜','鐘'],['鐘','七','蒼','刀','桜','七','蒼','鐘']];let credit=50,bet=0,game=0,spinning=false,stopped=[true,true,true],power=0,spinTimer=[];const $=s=>document.querySelector(s),reels=$('#reels'),machine=$('#machine'),screen=$('#screen');
function cls(s){return s==='七'?'red':s==='蒼'?'blue':s==='鐘'?'gold':''}function render(i,offset=Math.floor(Math.random()*symbols[i].length)){const a=[];for(let j=0;j<3;j++){const s=symbols[i][(offset+j)%symbols[i].length];a.push(`<div class="sym ${cls(s)}">${s}</div>`)}document.querySelectorAll('.reel')[i].querySelector('.strip').innerHTML=a.join('')}
for(let i=0;i<3;i++){reels.insertAdjacentHTML('beforeend',`<div class="reel"><div class="strip"></div></div>`);render(i,i)}
function ui(){credit=$('#credit').textContent=credit;$('#betv').textContent=bet;$('#game').textContent=game;$('#power').textContent=power;$('#lever').disabled=spinning||bet<3;document.querySelectorAll('.stop').forEach((b,i)=>b.disabled=!spinning||stopped[i])}
function tone(freq,d=.045,type='sine',gain=.04){try{window.ac??=new AudioContext();const a=window.ac,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
$('#bet').onclick=()=>{if(spinning||bet===3||credit<3)return;const add=3-bet;credit-=add;bet=3;tone(170,.06,'square',.025);$('#msg').textContent='刻を合わせろ。';ui()};
$('#lever').onclick=()=>{if(bet<3||spinning)return;spinning=true;game++;stopped=[false,false,false];$('#phase').textContent='構';$('#msg').textContent='見切れ。三つの停止で決める。';document.querySelectorAll('.reel').forEach((r,i)=>{r.classList.add('spin');spinTimer[i]=setInterval(()=>render(i),80)});tone(90,.12,'sawtooth',.025);ui()};
function stop(i){if(!spinning||stopped[i])return;stopped[i]=true;clearInterval(spinTimer[i]);const r=document.querySelectorAll('.reel')[i];r.classList.remove('spin');render(i);tone(250+i*90,.07,'square',.045);machine.classList.add('pulse');setTimeout(()=>machine.classList.remove('pulse'),240);const n=stopped.filter(Boolean).length;$('#phase').textContent=['構','読','断','決'][n];$('#msg').textContent=['','一の太刀。間合いを読め。','二の太刀。次で決めろ。','一閃。'][n];if(n===3)resolve();ui()}
document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>stop(+b.dataset.i));
function resolve(){screen.classList.add('flash');machine.classList.add('hit');tone(680,.09,'sawtooth',.05);setTimeout(()=>tone(210,.22,'triangle',.05),55);setTimeout(()=>{screen.classList.remove('flash');machine.classList.remove('hit')},350);const win=Math.random()<.34;if(win){power=Math.min(9,power+1+Math.floor(Math.random()*2));credit+=5;$('#msg').textContent=power>=9?'刻力MAX――次の一閃が変わる。':'斬。刻力が高まった。'}else{$('#msg').textContent='紙一重。もう一度、構えろ。'}spinning=false;bet=0;ui()}
ui();
</script></body></html>
