<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chappy5 Visual Lab</title><link rel="stylesheet" href="./src/game/hall-v01.css"><style>

</style></head><body><header class="hud"><div><strong>Chappy5</strong><span>Visual Lab</span></div><div class="stats"><span>素材を実画面で確認</span></div></header><div class="lab"><nav class="folders"><button class="on" data-folder="shell">床・壁</button><button data-folder="machines">機械設備</button><button data-folder="furniture">家具・備品</button><button data-folder="signs">装飾・看板</button><button data-folder="people">人物</button></nav>
<section id="shell" class="folder on"><div class="tabs"><button class="on" data-id="pixel">高密度Pixel</button><button data-id="svg">SVG</button><button data-id="css">CSS</button><button data-id="sprite">Sprite風</button><button data-id="depth">2.5D</button><button data-id="hd">HD-2D風</button></div><div id="pixel" class="sample on"><div class="card"><h2>Canvas / 高密度ピクセル</h2><div class="stage"><canvas id="hall" width="820" height="1280"></canvas></div></div></div><div id="svg" class="sample"><div class="emptybox"><strong>SVG 床・壁</strong>比較表示は復旧対象</div></div><div id="css" class="sample"><div class="emptybox"><strong>CSS Art</strong>比較表示</div></div><div id="sprite" class="sample"><div class="emptybox"><strong>Sprite / タイルマップ風</strong>比較表示は復旧対象</div></div><div id="depth" class="sample"><div class="emptybox"><strong>トップビュー 2.5D</strong>比較表示は復旧対象</div></div><div id="hd" class="sample"><div class="emptybox"><strong>HD-2D風</strong>比較表示は復旧対象</div></div></section>

/><use href="#slot01" x="500"/><use href="#slot01" x="600"/><use href="#slot01" x="700"/><use href="#slot01" x="800"/></g><rect x="130" y="865" width="560" height="38" fill="#373c3d"/><g fill="#614a36"><circle cx="182" cy="948" r="25"/><circle cx="242" cy="948" r="25"/><circle cx="302" cy="948" r="25"/><circle cx="362" cy="948" r="25"/><circle cx="422" cy="948" r="25"/><circle cx="482" cy="948" r="25"/><circle cx="542" cy="948" r="25"/><circle cx="602" cy="948" r="25"/><circle cx="662" cy="948" r="25"/></g><text x="410" y="1085" text-anchor="middle" fill="#dbe6e9" font-size="24" font-family="sans-serif">縮小しても「明るい3リール窓＋3STOP」が残る</text></svg></div><div class="note">精密実機ではなくゲーム用。上部ランプ、明るい3リール、3STOP、下パネル、操作部の張り出しを強調して、ホール縮尺でもスロット台として読める形にしています。</div></div></div></section>
<section id="furniture" class="folder"><div class="emptybox"><strong>家具・備品</strong>椅子・カウンターなど</div></section><section id="signs" class="folder"><div class="emptybox"><strong>装飾・看板</strong>POP・照明・島札など</div></section><section id="people" class="folder"><div class="emptybox"><strong>人物</strong>客・スタッフは後から追加</div></section></div><script>document.querySelectorAll('.folders button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.folders button,.folder').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.folder).classList.add('on');window.dispatchEvent(new Event('resize'))});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const f=b.closest('.folder');f.querySelectorAll('.tabs button,.sample').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.querySelector('#'+b.dataset.id).classList.add('on');window.dispatchEvent(new Event('resize'))})</script><script src="./src/game/hall-v01.js"></script></body></html>
