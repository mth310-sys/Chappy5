<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chappy5 Visual Lab</title><link rel="stylesheet" href="./src/game/hall-v01.css"><style>
body{overflow:auto}.lab{max-width:980px;margin:auto;padding:8px 8px 70px}.folders,.tabs{display:flex;gap:6px;overflow-x:auto;padding:7px}.folders{position:sticky;top:0;z-index:30;background:#09131d;border-bottom:1px solid #24445d}.folders button,.tabs button{flex:0 0 auto;border:1px solid #315571;background:#102c43;color:#dcebf5;border-radius:6px;padding:9px 10px;font-size:10px}.folders button.on{background:#8a652d;border-color:#c0924c}.tabs button.on{background:#315571}.folder,.sample{display:none}.folder.on,.sample.on{display:block}.card{background:#101820;border:1px solid #294052;border-radius:8px;padding:8px}.card h2{font-size:14px;margin:2px 0 8px}.stage{height:64vh;min-height:500px;background:#071018;border:1px solid #24445d;border-radius:6px;overflow:hidden;position:relative}.stage canvas,.stage svg{width:100%;height:100%;display:block}.note,.empty{font-size:11px;color:#9fb1bd;padding:8px}.csshall{position:relative;width:min(76%,420px);height:92%;margin:4% auto;background:repeating-linear-gradient(0deg,#9b8063 0 23px,#8c7158 24px 25px);border:18px ridge #68655f;box-shadow:inset 0 0 35px #554838}.csshall:after{content:"";position:absolute;width:28%;height:20px;left:36%;bottom:-19px;background:#56737a;border:5px solid #343c3e;border-bottom:0}.emptybox{margin:12px;border:1px dashed #49677a;border-radius:8px;padding:25px 15px;text-align:center;background:#0c1821}.emptybox strong{display:block;color:#e5eef4;margin-bottom:8px}
</style></head><body><header class="hud"><div><strong>Chappy5</strong><span>Visual Lab</span></div><div class="stats"><span>素材を実画面で確認</span></div></header><div class="lab">
<nav class="folders"><button class="on" data-folder="shell">床・壁</button><button data-folder="machines">機械設備</button><button data-folder="furniture">家具・備品</button><button data-folder="signs">装飾・看板</button><button data-folder="people">人物</button></nav>
<section id="shell" class="folder on"><div class="tabs"><button class="on" data-id="pixel">高密度Pixel</button><button data-id="svg">SVG</button><button data-id="css">CSS</button><button data-id="sprite">Sprite風</button><button data-id="depth">2.5D</button><button data-id="hd">HD-2D風</button></div>
<div id="pixel" class="sample on"><div class="card"><h2>Canvas / 高密度ピクセル</h2><div class="stage"><canvas id="hall" width="820" height="1280"></canvas></div><div class="note">ドット素材を積み上げる方式。</div></div></div>
<div id="svg" class="sample"><div class="card"><h2>SVG</h2><div class="stage"><svg viewBox="0 0 820 1280"><defs><pattern id="t" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#a88b70"/><path d="M0 0H40V40" fill="none" stroke="#75604d" stroke-width="2"/></pattern></defs><rect width="820" height="1280" fill="#111516"/><rect x="45" y="35" width="730" height="1210" fill="#666762"/><rect x="76" y="66" width="668" height="1144" fill="url(#t)"/><path d="M76 66H744V1210H476M344 1210H76Z" fill="none" stroke="#393d3c" stroke-width="13"/><rect x="344" y="1202" width="132" height="43" fill="#58747a"/></svg></div></div></div>
<div id="css" class="sample"><div class="card"><h2>CSS Art</h2><div class="stage"><div class="csshall"></div></div></div></div>
<div id="sprite" class="sample"><div class="card"><h2>Sprite / タイルマップ風</h2><div class="stage"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><pattern id="sp" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="64" height="64" fill="#9a7a5d"/><rect width="31" height="31" x="2" y="2" fill="#ad8b68"/><rect width="29" height="29" x="34" y="34" fill="#a08061"/></pattern></defs><rect width="820" height="1280" fill="#101719"/><rect x="52" y="42" width="716" height="1196" fill="#464b49"/><rect x="78" y="68" width="664" height="1138" fill="url(#sp)"/><path d="M78 68H742V1206H478M342 1206H78Z" stroke="#777872" stroke-width="18" fill="none"/><rect x="342" y="1204" width="136" height="34" fill="#506f76"/></svg></div></div></div>
<div id="depth" class="sample"><div class="card"><h2>トップビュー 2.5D</h2><div class="stage"><svg viewBox="0 0 820 1280"><defs><linearGradient id="df" x2="0" y2="1"><stop stop-color="#b09370"/><stop offset="1" stop-color="#7b624e"/></linearGradient></defs><rect width="820" height="1280" fill="#0c1215"/><rect x="82" y="64" width="656" height="1132" fill="url(#df)"/><path d="M62 48H758V1214H488V1190H738V68H82V1190H332V1214H62Z" fill="#696b67"/><path d="M62 48l20 20h656l20-20M82 68v1122l-20 24M738 68v1122l20 24" stroke="#aaa69c" stroke-width="8" fill="none"/><rect x="332" y="1190" width="156" height="40" fill="#4c6970"/></svg></div></div></div>
<div id="hd" class="sample"><div class="card"><h2>HD-2D風</h2><div class="stage"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><radialGradient id="light"><stop stop-color="#ffd89b" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><pattern id="hdt" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#8d6d54"/><rect x="2" y="2" width="28" height="28" fill="#a27e5e"/></pattern></defs><rect width="820" height="1280" fill="#070b0d"/><rect x="50" y="40" width="720" height="1200" fill="#454846"/><rect x="76" y="66" width="668" height="1144" fill="url(#hdt)"/><path d="M76 66H744V1210H478M342 1210H76Z" stroke="#77756f" stroke-width="20" fill="none"/><ellipse cx="410" cy="330" rx="320" ry="260" fill="url(#light)"/><ellipse cx="410" cy="900" rx="300" ry="250" fill="url(#light)"/><rect x="342" y="1200" width="136" height="40" fill="#56777d"/></svg></div></div></div></section>
<section id="machines" class="folder"><div class="emptybox"><strong>機械設備フォルダ</strong>パチスロ台・島設備・サンド・両替機・計数機などを、ここで方式別／種類別に実物表示して比較していく。</div></section>
<section id="furniture" class="folder"><div class="emptybox"><strong>家具・備品フォルダ</strong>椅子・カウンター・ゴミ箱・休憩設備などを追加予定。</div></section>
<section id="signs" class="folder"><div class="emptybox"><strong>装飾・看板フォルダ</strong>店内看板・POP・照明・島札などを追加予定。</div></section>
<section id="people" class="folder"><div class="emptybox"><strong>人物フォルダ</strong>客・スタッフは後から追加できるよう独立管理。</div></section>
</div><script>
document.querySelectorAll('.folders button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.folders button,.folder').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.folder).classList.add('on');window.dispatchEvent(new Event('resize'))});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const f=b.closest('.folder');f.querySelectorAll('.tabs button,.sample').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.id).classList.add('on');window.dispatchEvent(new Event('resize'))});
</script><script src="./src/game/hall-v01.js"></script></body></html>
