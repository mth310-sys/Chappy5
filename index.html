<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071018">
  <title>ECHO DRIFT — Chappy5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" aria-live="polite">
    <header class="topbar">
      <div><span class="eyebrow">遊創舎 / CHAPPY5</span><h1>ECHO DRIFT</h1></div>
      <button id="resetSave" class="ghost" type="button">記録初期化</button>
    </header>

    <section class="hud">
      <div><span>ENERGY</span><strong id="energy">10</strong></div>
      <div><span>DEPTH</span><strong id="depth">0</strong></div>
      <div><span>HAUL</span><strong id="haul">0</strong></div>
      <div><span>RESONANCE</span><strong id="resonance">—</strong></div>
    </section>

    <section class="radar" aria-label="signal radar">
      <div class="pulse"></div>
      <div class="radar-core"><span id="threatLabel">CALM</span><strong id="threat">0%</strong></div>
    </section>

    <section class="mission">
      <p id="statusText">信号海へ潜る準備ができた。</p>
      <div id="routes" class="routes"></div>
    </section>

    <section class="actions">
      <button id="extract" class="extract" type="button" disabled>回収して帰還</button>
      <button id="startRun" class="primary" type="button">潜航開始</button>
    </section>

    <section class="archive">
      <div><span>累計回収</span><strong id="banked">0</strong></div>
      <div><span>帰還回数</span><strong id="runs">0</strong></div>
      <div><span>発見記録</span><strong id="discoveries">0 / 6</strong></div>
    </section>

    <details class="logbox">
      <summary>航海ログ</summary>
      <ol id="log"></ol>
    </details>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
