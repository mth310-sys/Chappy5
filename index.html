<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chappy5 Visual Compare</title><link rel="stylesheet" href="./src/game/hall-v01.css"><style>

</style></head><body><header class="hud"><div><strong>Chappy5</strong><span>描画方式 比較</span></div><div class="stats"><span>床・壁・入口のみ</span></div></header><div class="compare"><div class="tabs"><button class="on" data-id="pixel">高密度Pixel</button><button data-id="svg">SVG</button><button data-id="css">CSS</button><button data-id="sprite">Sprite風</button><button data-id="depth">2.5D</button><button data-id="iso">アイソメ</button><button data-id="hd">HD-2D風</button></div>
<section id="pixel" class="sample on"><div class="card"><h2>Canvas / 高密度ピクセル</h2><div class="stage"><canvas id="hall" width="820" height="1280"></canvas></div><div class="note">ドット素材を積み上げる王道ゲーム方式。</div></div></section>
<section id="svg" class="sample"><div class="card"><h2>SVG / ベクター</h2><div class="stage"><svg viewBox="0 0 820 1280"><defs><pattern id="t" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#a88b70"/><path d="M0 0H40V40" fill="none" stroke="#75604d" stroke-width="2"/></pattern></defs><rect width="820" height="1280" fill="#111516"/><rect x="45" y="35" width="730" height="1210" fill="#666762"/><rect x="76" y="66" width="668" height="1144" fill="url(#t)"/><path d="M76 66H744V1210H476M344 1210H76Z" fill="none" stroke="#393d3c" stroke-width="13"/><rect x="344" y="1202" width="132" height="43" fill="#58747a"/></svg></div><div class="note">滑らかな線、曲線、陰影に強い。</div></div></section>
<section id="css" class="sample"><div class="card"><h2>CSS Art</h2><div class="stage"><div class="csshall"></div></div><div class="note">UIと一体化しやすい方式。</div></div></section>
<section id="sprite" class="sample"><div class="card"><h2>Sprite / タイルマップ風</h2><div class="stage"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><pattern id="sp" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="64" height="64" fill="#9a7a5d"/><rect width="31" height="31" x="2" y="2" fill="#ad8b68"/><rect width="29" height="29" x="34" y="34" fill="#a08061"/><path d="M8 15h12v3H8zm38 31h9v3h-9z" fill="#705746"/></pattern></defs><rect width="820" height="1280" fill="#101719"/><rect x="52" y="42" width="716" height="1196" fill="#464b49"/><rect x="78" y="68" width="664" height="1138" fill="url(#sp)"/><path d="M78 68H742V1206H478M342 1206H78Z" stroke="#777872" stroke-width="18" fill="none"/><rect x="342" y="1204" width="136" height="34" fill="#506f76"/></svg></div><div class="note">Phaser等で素材を配置する完成ゲームに近い考え方。</div></div></section>
<section id="depth" class="sample"><div class="card"><h2>トップビュー 2.5D</h2><div class="stage"><svg viewBox="0 0 820 1280"><defs><linearGradient id="df" x2="0" y2="1"><stop stop-color="#b09370"/><stop offset="1" stop-color="#7b624e"/></linearGradient></defs><rect width="820" height="1280" fill="#0c1215"/><rect x="68" y="72" width="684" height="1140" fill="#24292a" opacity=".7"/><rect x="82" y="64" width="656" height="1132" fill="url(#df)"/><path d="M62 48H758V1214H488V1190H738V68H82V1190H332V1214H62Z" fill="#696b67"/><path d="M62 48l20 20h656l20-20M82 68v1122l-20 24M738 68v1122l20 24" stroke="#aaa69c" stroke-width="8" fill="none"/><rect x="332" y="1190" width="156" height="40" fill="#4c6970"/><ellipse cx="410" cy="1080" rx="250" ry="70" fill="#e0bd87" opacity=".10"/></svg></div><div class="note">真上視点を保ちつつ壁の厚み・影・照明で立体感を出す。</div></div></section>
<section id="iso" class="sample"><div class="card"><h2>アイソメトリック</h2><div class="stage"><svg viewBox="0 0 820 1280"><rect width="820" height="1280" fill="#101619"/><path d="M410 130L730 350 410 1120 90 900Z" fill="#9b7c60"/><path d="M410 130L730 350 710 390 410 185 110 920 90 900Z" fill="#73736e"/><path d="M90 900L410 1120V1165L70 930Z" fill="#464a49"/><path d="M730 350L410 1120V1165L750 365Z" fill="#343a3a"/><g stroke="#765d49" opacity=".65"><path d="M150 820L470 1040M210 680L530 900M270 540L590 760M330 400L650 620"/><path d="M170 940L490 170M290 1020L610 250M410 1100L730 330"/></g><path d="M370 1093L410 1120 450 1025" stroke="#5e7d83" stroke-width="24"/></svg></div><div class="note">斜め見下ろし。家具や筐体の形を見せやすい。</div></div></section>
<section id="hd" class="sample"><div class="card"><h2>HD-2D風</h2><div class="stage hd"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><radialGradient id="light"><stop stop-color="#ffd89b" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><pattern id="hdt" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#8d6d54"/><rect x="2" y="2" width="28" height="28" fill="#a27e5e"/></pattern></defs><rect width="820" height="1280" fill="#070b0d"/><rect x="50" y="40" width="720" height="1200" fill="#454846"/><rect x="76" y="66" width="668" height="1144" fill="url(#hdt)"/><path d="M76 66H744V1210H478M342 1210H76Z" stroke="#77756f" stroke-width="20" fill="none"/><ellipse cx="410" cy="330" rx="320" ry="260" fill="url(#light)"/><ellipse cx="410" cy="900" rx="300" ry="250" fill="url(#light)"/><rect x="342" y="1200" width="136" height="40" fill="#56777d"/></svg></div><div class="note">ピクセル素材＋高解像度の光・影・エフェクトを重ねる方向。</div></div></section>
</div><script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.sample').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.id).classList.add('on');window.dispatchEvent(new Event('resize'))})</script><script src="./src/game/hall-v01.js"></script></body></html>
