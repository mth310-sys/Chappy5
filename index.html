<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chappy5 Visual Compare</title>
<link rel="stylesheet" href="./src/game/hall-v01.css">
<style>
body{overflow:auto}.compare{max-width:980px;margin:auto;padding:10px 10px 70px}.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:8px;background:#09131d}.tabs button{flex:1;padding:9px 4px;border:1px solid #315571;background:#102c43;color:#dcebf5;border-radius:6px;font-size:11px}.tabs button.on{background:#315571}.sample{display:none}.sample.on{display:block}.card{background:#101820;border:1px solid #294052;border-radius:8px;padding:8px;margin-bottom:10px}.card h2{font-size:14px;margin:2px 0 8px}.stage{height:68vh;min-height:520px;background:#071018;border:1px solid #24445d;border-radius:6px;overflow:hidden}.stage canvas{border:0;border-radius:0}.svgstage svg{width:100%;height:100%;display:block}.csshall{position:relative;width:min(76%,420px);height:92%;margin:4% auto;background:repeating-linear-gradient(0deg,#9b8063 0 23px,#8c7158 24px 25px),repeating-linear-gradient(90deg,transparent 0 23px,#705945 24px 25px);border:18px ridge #68655f;box-shadow:inset 0 0 35px #554838}.csshall:after{content:"";position:absolute;width:28%;height:20px;left:36%;bottom:-19px;background:#56737a;border:5px solid #343c3e;border-bottom:0}.note{font-size:11px;color:#9fb1bd;margin:7px 2px 0}
</style>
</head><body>
<header class="hud"><div><strong>Chappy5</strong><span>描画方式 比較</span></div><div class="stats"><span>床・壁・入口のみ</span></div></header>
<div class="compare">
<div class="tabs"><button class="on" data-id="pixel">高密度Pixel</button><button data-id="svg">SVG</button><button data-id="css">CSS</button></div>
<section id="pixel" class="sample on"><div class="card"><h2>Canvas / 高密度ピクセル</h2><div class="stage"><canvas id="hall" width="820" height="1280"></canvas></div><div class="note">ゲーム向き。ドット単位で素材化・アニメ化しやすい。</div></div></section>
<section id="svg" class="sample"><div class="card"><h2>SVG / ベクターイラスト</h2><div class="stage svgstage"><svg viewBox="0 0 820 1280" preserveAspectRatio="xMidYMid meet"><defs><pattern id="tile" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#a88b70"/><path d="M0 0H48M0 0V48" stroke="#79624f" stroke-width="2"/><path d="M7 10h13M29 31h8" stroke="#b99d80" stroke-width="3" opacity=".55"/></pattern><linearGradient id="wall" x2="0" y2="1"><stop stop-color="#9a9790"/><stop offset=".35" stop-color="#6d6c68"/><stop offset="1" stop-color="#3e4140"/></linearGradient></defs><rect width="820" height="1280" fill="#111516"/><rect x="45" y="35" width="730" height="1210" rx="4" fill="url(#wall)"/><rect x="76" y="66" width="668" height="1144" fill="url(#tile)"/><path d="M76 66H744V1210H476V1245H344V1210H76Z" fill="none" stroke="#3c403e" stroke-width="13"/><rect x="344" y="1202" width="132" height="43" fill="#58747a" stroke="#343d40" stroke-width="8"/><path d="M410 1205V1242M355 1212h44M421 1212h44" stroke="#91a9aa" stroke-width="3"/></svg></div><div class="note">曲線・陰影・グラデーションが得意。拡大しても滑らか。</div></div></section>
<section id="css" class="sample"><div class="card"><h2>CSS Art</h2><div class="stage"><div class="csshall"></div></div><div class="note">HTML部品との相性が良い。装飾やUIには強いが、複雑なゲーム絵は管理しにくい。</div></div></section>
</div>
<script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.sample').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.id).classList.add('on');window.dispatchEvent(new Event('resize'))})</script>
<script src="./src/game/hall-v01.js"></script>
</body></html>
