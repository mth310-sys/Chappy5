<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Chappy5 Visual Lab</title><link rel="stylesheet" href="./src/game/hall-v01.css"><style>

</style></head><body><header class="hud"><div><strong>Chappy5</strong><span>Visual Lab</span></div><div class="stats"><span>素材を実画面で確認</span></div></header><div class="lab"><nav class="folders"><button class="on" data-folder="shell">床・壁</button><button data-folder="machines">機械設備</button><button data-folder="furniture">家具・備品</button><button data-folder="signs">装飾・看板</button><button data-folder="people">人物</button></nav>

<div id="svg" class="sample"><div class="card"><h2>SVG</h2><div class="stage"><svg viewBox="0 0 820 1280"><defs><pattern id="t" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#a88b70"/><path d="M0 0H40V40" fill="none" stroke="#75604d" stroke-width="2"/></pattern></defs><rect width="820" height="1280" fill="#111516"/><rect x="45" y="35" width="730" height="1210" fill="#666762"/><rect x="76" y="66" width="668" height="1144" fill="url(#t)"/><path d="M76 66H744V1210H476M344 1210H76Z" fill="none" stroke="#393d3c" stroke-width="13"/><rect x="344" y="1202" width="132" height="43" fill="#58747a"/></svg></div></div></div>
<div id="css" class="sample"><div class="card"><h2>CSS Art</h2><div class="stage"><div class="csshall"></div></div></div></div>

<div id="hd" class="sample"><div class="card"><h2>HD-2D風</h2><div class="stage hd"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><radialGradient id="light"><stop stop-color="#ffd89b" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><pattern id="hdt" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#8d6d54"/><rect x="2" y="2" width="28" height="28" fill="#a27e5e"/></pattern></defs><rect width="820" height="1280" fill="#070b0d"/><rect x="50" y="40" width="720" height="1200" fill="#454846"/><rect x="76" y="66" width="668" height="1144" fill="url(#hdt)"/><path d="M76 66H744V1210H478M342 1210H76Z" stroke="#77756f" stroke-width="20" fill="none"/><ellipse cx="410" cy="330" rx="320" ry="260" fill="url(#light)"/><ellipse cx="410" cy="900" rx="300" ry="250" fill="url(#light)"/><rect x="342" y="1200" width="136" height="40" fill="#56777d"/></svg></div></div></div></section>
<section id="machines" class="folder"><div class="tabs"><button class="on" data-id="atype">Aタイプ 01</button></div><div id="atype" class="sample on"><div class="card"><h2>Aタイプ 01 / ホール用トップビュー素材</h2><div class="stage machine-stage"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><g id="slot01"><rect width="92" height="126" rx="5" fill="#1b2023" stroke="#7c8587" stroke-width="4"/><rect x="7" y="8" width="78" height="27" fill="#303a3e"/><rect x="14" y="13" width="64" height="14" fill="#d7b846"/><circle cx="46" cy="20" r="6" fill="#fff19a"/><rect x="9" y="40" width="74" height="39" fill="#0c1113" stroke="#9ba1a0" stroke-width="3"/><rect x="15" y="45" width="62" height="27" fill="#e9e1ca"/><path d="M35 45V72M56 45V72" stroke="#79766d" stroke-width="3"/><rect x="18" y="50" width="12" height="5" fill="#d84237"/><rect x="40" y="59" width="12" height="5" fill="#d84237"/><rect x="61" y="50" width="12" height="5" fill="#d84237"/><rect x="8" y="83" width="76" height="25" fill="#343b3e"/><circle cx="28" cy="95" r="6" fill="#d84a42"/><circle cx="46" cy="95" r="6" fill="#d84a42"/><circle cx="64" cy="95" r="6" fill="#d84a42"/><rect x="14" y="112" width="64" height="8" fill="#9a713c"/><path d="M5 126H87L78 142H14Z" fill="#111719"/><path d="M14 126H78L72 134H20Z" fill="#4a5152"/></g></defs><rect width="820" height="1280" fill="#11191d"/><text x="50" y="65" class="scale-label">単体</text><g transform="translate(335 95) scale(1.65)"><use href="#slot01"/></g><text x="50" y="395" class="scale-label">3台並び</text><g transform="translate(245 430)"><use href="#slot01"/><use href="#slot01" x="98"/><use href="#slot01" x="196"/></g><text x="50" y="650" class="scale-label">ホール縮尺 / 9台</text><rect x="105" y="690" width="610" height="330" fill="#96785d" stroke="#6c5746" stroke-width="5"/><g transform="translate(155 735) scale(.58)"><use href="#slot01"/><use href="#slot01" x="100"/><use href="#slot01" x="200"/><use href="#slot01" x="300"/><use href="#slot01" x="400"/><use href="#slot01" x="500"/><use href="#slot01" x="600"/><use href="#slot01" x="700"/><use href="#slot01" x="800"/></g><rect x="130" y="865" width="560" height="38" fill="#373c3d"/><g fill="#614a36"><circle cx="182" cy="948" r="25"/><circle cx="242" cy="948" r="25"/><circle cx="302" cy="948" r="25"/><circle cx="362" cy="948" r="25"/><circle cx="422" cy="948" r="25"/><circle cx="482" cy="948" r="25"/><circle cx="542" cy="948" r="25"/><circle cx="602" cy="948" r="25"/><circle cx="662" cy="948" r="25"/></g><text x="410" y="1085" text-anchor="middle" fill="#dbe6e9" font-size="24" font-family="sans-serif">縮小しても「明るい3リール窓＋3STOP」が残る</text></svg></div><div class="note">精密実機ではなくゲーム用。上部ランプ、明るい3リール、3STOP、下パネル、操作部の張り出しを強調。</div></div></div></section>
<section id="furniture" class="folder"><div class="emptybox"><strong>家具・備品</strong>椅子・カウンターなど</div></section><section id="signs" class="folder"><div class="emptybox"><strong>装飾・看板</strong>POP・照明・島札など</div></section><section id="people" class="folder"><div class="emptybox"><strong>人物</strong>客・スタッフは後から追加</div></section></div><script>document.querySelectorAll('.folders button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.folders button,.folder').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.folder).classList.add('on');window.dispatchEvent(new Event('resize'))});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const f=b.closest('.folder');f.querySelectorAll('.tabs button,.sample').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.querySelector('#'+b.dataset.id).classList.add('on');window.dispatchEvent(new Event('resize'))})</script><script src="./src/game/hall-v01.js"></script></body></html>
