</style></head><body><header class="hud"><div><strong>Chappy5</strong><span>Visual Lab</span></div><div class="stats"><span>素材を実画面で確認</span></div></header><div class="lab"><nav class="folders"><button class="on" data-folder="shell">床・壁</button><button data-folder="machines">機械設備</button><button data-folder="furniture">家具・備品</button><button data-folder="signs">装飾・看板</button><button data-folder="people">人物</button></nav>
<section id="shell" class="folder on"><div class="tabs"><button class="on" data-id="pixel">高密度Pixel</button><button data-id="svg">SVG</button><button data-id="css">CSS</button><button data-id="sprite">Sprite風</button><button data-id="depth">2.5D</button><button data-id="hd">HD-2D風</button></div><div id="pixel" class="sample on"><div class="card"><h2>Canvas / 高密度ピクセル</h2><div class="stage"><canvas id="hall" width="820" height="1280"></canvas></div></div></div><div id="svg" class="sample"><div class="emptybox"><strong>SVG 床・壁</strong>比較版</div></div><div id="css" class="sample"><div class="card"><h2>CSS Art</h2><div class="stage"><div class="csshall"></div></div></div></div><div id="sprite" class="sample"><div class="emptybox"><strong>Sprite / タイルマップ風</strong>比較版</div></div><div id="depth" class="sample"><div class="emptybox"><strong>トップビュー 2.5D</strong>比較版</div></div><div id="hd" class="sample"><div class="emptybox"><strong>HD-2D風</strong>比較版</div></div></section>

ght="92" fill="#1d2428" stroke="#777e80" stroke-width="4"/><circle cx="86" cy="382" r="13" fill="#e9b83f" stroke="#111" stroke-width="3"/><circle cx="126" cy="397" r="17" fill="#d33c36" stroke="#111" stroke-width="3"/><circle cx="170" cy="397" r="17" fill="#d33c36" stroke="#111" stroke-width="3"/><circle cx="214" cy="397" r="17" fill="#d33c36" stroke="#111" stroke-width="3"/><rect x="72" y="449" width="156" height="94" fill="#121719" stroke="#6e7475" stroke-width="4"/><rect x="88" y="466" width="124" height="42" fill="#272e31"/><text x="150" y="493" fill="#aab6b8" text-anchor="middle" font-size="13" font-family="sans-serif">A TYPE</text><rect x="104" y="528" width="92" height="8" fill="#333b3e"/><rect x="60" y="575" width="180" height="20" fill="#111619"/><rect x="52" y="595" width="196" height="10" fill="#070a0c"/></svg></div><div class="note">5号機時代を意識した、液晶なし・3リール・告知ランプ・BET/STOP・下パネルだけの基本形。まず形状確認用。</div></div></div></section>
<section id="furniture" class="folder"><div class="emptybox"><strong>家具・備品</strong>椅子・カウンターなど</div></section><section id="signs" class="folder"><div class="emptybox"><strong>装飾・看板</strong>POP・照明・島札など</div></section><section id="people" class="folder"><div class="emptybox"><strong>人物</strong>客・スタッフは後から追加</div></section></div><script>document.querySelectorAll('.folders button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.folders button,.folder').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.folder).classList.add('on');window.dispatchEvent(new Event('resize'))});document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{const f=b.closest('.folder');f.querySelectorAll('.tabs button,.sample').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.querySelector('#'+b.dataset.id).classList.add('on');window.dispatchEvent(new Event('resize'))})</script><script src="./src/game/hall-v01.js"></script></body></html>
