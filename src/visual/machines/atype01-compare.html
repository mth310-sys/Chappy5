<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aタイプ01 三案比較</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#e9f0f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.head{position:sticky;top:0;background:#0b1116ee;z-index:3;padding:6px 0 10px}h1{font-size:18px;margin:0 0 5px}.sub{font-size:11px;color:#9eb0bc}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{border:1px solid #36546a;background:#132331;color:#dce8ef;border-radius:6px;padding:8px 10px;white-space:nowrap}.tabs button.on{background:#875f27;border-color:#c49248}.panel{display:none}.panel.on{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.card{background:#121c24;border:1px solid #294153;border-radius:8px;padding:7px;min-width:0}.card h2{font-size:12px;margin:0 0 6px}.stage{background:#171b1d;border-radius:5px;min-height:360px;display:flex;align-items:center;justify-content:center;overflow:hidden}.machine{width:200px;max-width:92%;aspect-ratio:2/3}.machine svg{width:100%;height:100%;display:block}.scaleRow{display:flex;align-items:flex-end;justify-content:center;gap:10px;min-height:240px;overflow:auto;padding:8px}.s80{width:80px;flex:none}.s40{width:40px;flex:none}.s80 svg,.s40 svg{width:100%;display:block}.hall{display:grid;grid-template-columns:repeat(3,40px);gap:5px;justify-content:center;background:linear-gradient(#8f745a,#775f4b);padding:24px 10px;min-height:250px}.hall>div{width:40px}.hall svg{width:100%;display:block}.note{font-size:10px;color:#9eb0bc;padding:6px 1px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stage{min-height:300px}}</style></head><body><div class="head"><h1>Aタイプ01 / 三案・完全同条件比較</h1><div class="sub">チャッピー案・候補A・候補Bを 200px / 80px / 40px / 9台配置で比較</div><div class="tabs"><button class="on" data-p="all">3案横比較</button><button data-p="scale">80px・40px</button><button data-p="hall">9台配置</button></div></div><section id="all" class="panel on"><div class="grid" id="largeGrid"></div></section><section id="scale" class="panel"><div class="grid" id="scaleGrid"></div></section><section id="hall" class="panel"><div class="grid" id="hallGrid"></div></section><script>
function chappy(){return `<svg viewBox="0 0 92 142" shape-rendering="crispEdges"><rect width="92" height="126" fill="#1b2023" stroke="#778083" stroke-width="4"/><rect x="7" y="8" width="78" height="27" fill="#303a3e"/><rect x="14" y="13" width="64" height="14" fill="#d7b846"/><circle cx="46" cy="20" r="6" fill="#fff19a"/><rect x="9" y="40" width="74" height="39" fill="#0c1113"/><rect x="15" y="45" width="62" height="27" fill="#e9e1ca"/><path d="M35 45V72M56 45V72" stroke="#79766d" stroke-width="3"/><rect x="8" y="83" width="76" height="25" fill="#343b3e"/><circle cx="28" cy="95" r="6" fill="#d84a42"/><circle cx="46" cy="95" r="6" fill="#d84a42"/><circle cx="64" cy="95" r="6" fill="#d84a42"/><rect x="14" y="112" width="64" height="8" fill="#9a713c"/><path d="M5 126H87L78 142H14Z" fill="#111719"/></svg>`}
function a(){return `<svg viewBox="0 0 200 320"><defs><linearGradient id="ab" x2="1"><stop stop-color="#1a1a1d"/><stop offset=".5" stop-color="#5a5a62"/><stop offset="1" stop-color="#1a1a1d"/></linearGradient></defs><rect x="10" y="10" width="180" height="294" rx="8" fill="url(#ab)" stroke="#8a8a93" stroke-width="4"/><rect x="22" y="20" width="156" height="82" fill="#18202b"/><circle cx="53" cy="61" r="17" fill="#ff1744"/><circle cx="147" cy="61" r="17" fill="#ffea00"/><rect x="30" y="111" width="140" height="70" fill="#eee" stroke="#000" stroke-width="6"/><path d="M77 114V178M123 114V178" stroke="#777" stroke-width="4"/><path d="M12 190H188V238H12Z" fill="#70767a"/><circle cx="65" cy="211" r="13" fill="#e53935"/><circle cx="100" cy="211" r="13" fill="#43a047"/><circle cx="135" cy="211" r="13" fill="#1e88e5"/><rect x="28" y="250" width="144" height="45" fill="#b71c1c"/><path d="M65 254L100 291L135 254Z" fill="#fff" opacity=".8"/></svg>`}
function b(id='b'){return `<svg viewBox="0 0 200 300"><defs><linearGradient id="${id}" x2="1"><stop stop-color="#1f2124"/><stop offset=".45" stop-color="#3a3d43"/><stop offset="1" stop-color="#1f2124"/></linearGradient></defs><rect x="14" y="6" width="172" height="270" rx="10" fill="url(#${id})" stroke="#090a0b" stroke-width="3"/><polygon points="24,16 176,16 168,46 32,46" fill="#25282d"/><g fill="#ff4d4d"><circle cx="52" cy="31" r="8"/><circle cx="100" cy="29" r="9"/><circle cx="148" cy="31" r="8"/></g><rect x="30" y="58" width="140" height="88" fill="#080a0c"/><rect x="36" y="64" width="40" height="76" fill="#ffe14d"/><rect x="80" y="64" width="40" height="76" fill="#4dd2ff"/><rect x="124" y="64" width="40" height="76" fill="#ff8a4d"/><polygon points="18,150 182,150 192,196 8,196" fill="#292d31"/><g fill="#ffe14d" stroke="#000" stroke-width="2"><circle cx="60" cy="172" r="13"/><circle cx="100" cy="174" r="14"/><circle cx="140" cy="172" r="13"/></g><rect x="26" y="208" width="148" height="46" fill="#4dd2ff"/><rect x="14" y="260" width="172" height="16" fill="#1f2124"/></svg>`}
const models=[['チャッピー案',()=>chappy()],['候補A / Canvas 2.5D意匠',()=>a()],['候補B / SVG',i=>b('bg'+i)]];function card(name,body,note=''){return `<div class="card"><h2>${name}</h2>${body}<div class="note">${note}</div></div>`}document.getElementById('largeGrid').innerHTML=models.map((m,i)=>card(m[0],`<div class="stage"><div class="machine">${m[1](i)}</div></div>`,'200px基準')).join('');document.getElementById('scaleGrid').innerHTML=models.map((m,i)=>card(m[0],`<div class="scaleRow"><div class="s80">${m[1](i+'a')}</div><div class="s40">${m[1](i+'b')}</div></div>`,'左80px / 右40px')).join('');document.getElementById('hallGrid').innerHTML=models.map((m,i)=>card(m[0],`<div class="hall">${Array.from({length:9},(_,j)=>`<div>${m[1](i+'h'+j)}</div>`).join('')}</div>`,'40px幅 × 9台 / 同一床背景')).join('');document.querySelectorAll('.tabs button').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(y=>y.classList.remove('on'));x.classList.add('on');document.getElementById(x.dataset.p).classList.add('on')});
</script></body></html>
