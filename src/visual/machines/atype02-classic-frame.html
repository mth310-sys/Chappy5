<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chappy5 Aタイプ 筐体02</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}h1{font-size:17px;margin:0 0 4px}.sub{font-size:11px;color:#9eafb9;margin-bottom:12px}.card{background:#121a21;border:1px solid #2a4150;border-radius:9px;padding:10px;margin-bottom:10px}.row{display:flex;gap:14px;align-items:flex-end;justify-content:center;flex-wrap:wrap}.item{text-align:center;font-size:10px;color:#9eafb9}.large{width:280px}.mid{width:80px}.small{width:40px}.hall{display:grid;grid-template-columns:repeat(9,40px);gap:4px;justify-content:center;background:linear-gradient(#9a8066,#745c48);padding:22px 8px;overflow:auto}.hall svg{width:40px;display:block}@media(max-width:520px){.large{width:240px}.hall{justify-content:start}}</style></head><body><h1>Aタイプ / 筐体フレーム02</h1><div class="sub">実機写真から「大型トップクラウン・黒フェイス・縦発光支柱・突出操作棚・大型下パネル・下皿」の構造だけを抽象化</div><div class="card"><div class="row" id="scale"></div></div><div class="card"><div class="hall" id="hall"></div></div><script>
function machine(id='x'){return `<svg viewBox="0 0 200 330" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="silver${id}" x2="1"><stop stop-color="#e5e7e5"/><stop offset=".18" stop-color="#8d9496"/><stop offset=".48" stop-color="#f1f1ed"/><stop offset=".82" stop-color="#777f82"/><stop offset="1" stop-color="#d7d9d7"/></linearGradient><linearGradient id="red${id}" y2="1"><stop stop-color="#f1282f"/><stop offset="1" stop-color="#9d1118"/></linearGradient><linearGradient id="art${id}" x2="1" y2="1"><stop stop-color="#0a1d35"/><stop offset=".42" stop-color="#075c91"/><stop offset=".65" stop-color="#10141a"/><stop offset="1" stop-color="#a4231d"/></linearGradient></defs>

<!-- large central black face --> <path d="M39 50H161L158 170H42Z" fill="#030506" stroke="#22282b" stroke-width="2"/>
<!-- upper art area inside face --> <rect x="48" y="58" width="104" height="34" rx="2" fill="#4e1012"/><path d="M57 78L76 64L98 81L119 62L143 78" fill="none" stroke="#f15b35" stroke-width="4"/>

<!-- lower grille + deep black medal tray --> <path d="M28 299H172L178 311H22Z" fill="#92999a"/><g fill="#282d2f"><circle cx="55" cy="305" r="2"/><circle cx="63" cy="305" r="2"/><circle cx="71" cy="305" r="2"/><circle cx="129" cy="305" r="2"/><circle cx="137" cy="305" r="2"/><circle cx="145" cy="305" r="2"/></g><path d="M17 311H183L194 319L187 329H13L6 319Z" fill="#090b0c" stroke="#34393b" stroke-width="2"/><path d="M39 313H161L151 324H49Z" fill="#181c1e"/></svg>`}
const scale=document.getElementById('scale');[['large','280px'],['mid','80px'],['small','40px']].forEach((x,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="${x[0]}">${machine('s'+i)}</div><div>${x[1]}</div>`;scale.appendChild(d)});const hall=document.getElementById('hall');for(let i=0;i<9;i++){const d=document.createElement('div');d.innerHTML=machine('h'+i);hall.appendChild(d)}
</script></body></html>
