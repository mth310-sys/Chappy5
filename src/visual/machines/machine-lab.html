<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chappy5 Visual Asset Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.head{position:sticky;top:0;z-index:10;background:#0b1116ee;padding:4px 0 10px}h1{font-size:18px;margin:0 0 5px}.sub,.note{font-size:11px;color:#9eb0bb}.nav,.tabs,.tests{display:flex;gap:6px;overflow:auto;margin:8px 0}.nav button,.tabs button,.tests button{border:1px solid #35536a;background:#132331;color:#dce8ef;border-radius:6px;padding:8px 11px;white-space:nowrap}.nav button.on{background:#315571}.tabs button.on,.tests button.on{background:#875f27;border-color:#c49248}.category,.panel{display:none}.category.on,.panel.on{display:block}.card{background:#121a21;border:1px solid #537044;border-radius:9px;padding:8px;margin-bottom:10px}.card h2{font-size:14px;margin:2px 0 7px}.frame{width:100%;height:72vh;min-height:580px;border:0;border-radius:6px;background:#0d1318}.status{display:inline-block;font-size:10px;border:1px solid #536d45;color:#bdd3ad;padding:4px 7px;border-radius:12px;margin-left:6px}.shell-stage,.game-test{min-height:590px;border-radius:6px;background:#17130f;overflow:auto;padding:14px}.hall{position:relative;min-width:330px;max-width:720px;min-height:560px;margin:auto;border:18px solid #5f605c;border-bottom-width:24px;background:repeating-linear-gradient(0deg,#92775c 0 23px,#826a52 24px 25px);box-shadow:inset 0 0 35px #493d31}.hall:after{content:"入口";position:absolute;bottom:-24px;left:37%;width:26%;height:24px;text-align:center;font-size:9px;line-height:22px;background:#56737a;color:#dce9ed;border-left:5px solid #353d3e;border-right:5px solid #353d3e}.wall-detail{height:26px;background:linear-gradient(#85847e,#5d5e5a);border-bottom:5px solid #393b39;margin:-14px -14px 16px}.island{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:#282d2f;padding:5px;margin:28px auto;max-width:650px}.slot{aspect-ratio:2/3;background:linear-gradient(#66737a 0 12%,#151b1e 12% 31%,#eee8d8 31% 49%,#252c2f 49% 64%,#765b38 64% 86%,#101416 86%);border:1px solid #92999b;position:relative}.slot:before{content:"";position:absolute;left:19%;right:19%;top:51%;height:8%;background:radial-gradient(circle,#e8e8e0 0 35%,transparent 38%) 0 0/33% 100%}.placeholder{padding:60px 15px;text-align:center;border:1px dashed #3d596b;border-radius:8px;color:#8095a2}@media(max-width:780px){.frame{height:68vh;min-height:540px}.shell-stage,.game-test{min-height:540px}.hall{min-height:510px}.island{margin:20px auto}}</style></head><body><div class="head"><h1>Chappy5 / Visual Asset Lab</h1><div class="sub">ゲームで使う素材を、実装に近い条件で見ながら採用判定する統合試験場。</div><div class="nav"><button class="on" data-cat="shell">床・壁</button><button data-cat="machines">機械設備</button><button data-cat="furniture">家具・備品</button><button data-cat="signs">装飾・看板</button><button data-cat="people">人物</button><button data-cat="preview">実装プレビュー</button></div></div><section id="shell" class="category on"><div class="card"><h2>床・壁候補01 <span class="status">候補</span></h2><div class="note">現在のホールシェル方向：古い地方ホール、茶系床、経年壁、下中央入口。</div><div class="shell-stage"><div class="hall"><div class="wall-detail"></div></div></div></div></section><section id="machines" class="category"><div class="tabs"><button class="on" data-id="m01">筐体01</button><button data-id="m02">筐体02</button><button data-id="m03">筐体03</button></div><div class="tests"><button class="on" data-test="detail">単体・縮尺</button><button data-test="island">18台島</button><button data-test="hall130">130台想定</button><button data-test="hall216">216台負荷想定</button></div><main id="detail"><section id="m01" class="panel on"><div class="card"><h2>筐体01 <span class="status">候補</span></h2><iframe class="frame" src="./atype01-v2-realframe.html"></iframe></div></section><section id="m02" class="panel"><div class="card"><h2>筐体02 <span class="status">候補</span></h2><iframe class="frame" src="./atype02-classic-frame.html"></iframe></div></section><section id="m03" class="panel"><div class="card"><h2>筐体03 <span class="status">候補</span></h2><iframe class="frame" src="./atype03-dualwing-frame.html"></iframe></div></section></main><div id="gameTest" class="game-test" style="display:none"><div class="note" id="testNote"></div><div class="hall" id="testHall"><div class="wall-detail"></div><div id="islands"></div></div></div></section><section id="furniture" class="category"><div class="placeholder">家具・備品候補をここで試験</div></section><section id="signs" class="category"><div class="placeholder">装飾・看板候補をここで試験</div></section><section id="people" class="category"><div class="placeholder">人物候補をここで試験</div></section><section id="preview" class="category"><div class="card"><h2>実装プレビュー</h2><div class="note">採用候補の床・壁＋選択中の筐体を同じホール条件で合成確認。</div><div class="shell-stage"><div class="hall"><div class="wall-detail"></div><div id="previewIslands"></div></div></div></div></section><script>let machine='m01';const cats=[...document.querySelectorAll('.category')],nav=[...document.querySelectorAll('.nav button')],tabs=[...document.querySelectorAll('.tabs button')],tests=[...document.querySelectorAll('.tests button')],panels=[...document.querySelectorAll('.panel')];nav.forEach(b=>b.onclick=()=>{nav.forEach(x=>x.classList.toggle('on',x===b));cats.forEach(x=>x.classList.toggle('on',x.id===b.dataset.cat));if(b.dataset.cat==='preview')document.getElementById('previewIslands').innerHTML=Array.from({length:6},island).join('')});tabs.forEach(b=>b.onclick=()=>{machine=b.dataset.id;tabs.forEach(x=>x.classList.toggle('on',x===b));panels.forEach(x=>x.classList.toggle('on',x.id===machine))});function island(){return '<div class="island">'+Array.from({length:9},()=>'<div class="slot"></div>').join('')+'</div>'}function render(mode){const detail=document.getElementById('detail'),gt=document.getElementById('gameTest'),holder=document.getElementById('islands'),note=document.getElementById('testNote');if(mode==='detail'){detail.style.display='block';gt.style.display='none';return}detail.style.display='none';gt.style.display='block';let rows=2,label='18台島：9台×両面';if(mode==='hall130'){rows=15;label='130台想定'}if(mode==='hall216'){rows=24;label='216台負荷想定'}note.textContent=label+' / 選択中 '+machine.replace('m','筐体')+' / 床・壁候補01と合成';holder.innerHTML=Array.from({length:rows},island).join('')}tests.forEach(b=>b.onclick=()=>{tests.forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.test)})</script></body></html>
