<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chappy5 Visual Asset Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.head{position:sticky;top:0;z-index:10;background:#0b1116ee;padding:4px 0 10px}h1{font-size:18px;margin:0 0 5px}.sub,.note{font-size:11px;color:#9eb0bb}.nav,.tabs,.tests{display:flex;gap:6px;overflow:auto;margin:8px 0}.nav button,.tabs button,.tests button{border:1px solid #35536a;background:#132331;color:#dce8ef;border-radius:6px;padding:8px 11px;white-space:nowrap}.nav button.on{background:#315571}.tabs button.on,.tests button.on{background:#875f27;border-color:#c49248}.category,.panel,.shellsample{display:none}.category.on,.panel.on,.shellsample.on{display:block}.card{background:#121a21;border:1px solid #537044;border-radius:9px;padding:8px;margin-bottom:10px}.card h2{font-size:14px;margin:2px 0 7px}.frame{width:100%;height:72vh;min-height:580px;border:0;border-radius:6px;background:#0d1318}.status{display:inline-block;font-size:10px;border:1px solid #536d45;color:#bdd3ad;padding:4px 7px;border-radius:12px;margin-left:6px}.shell-stage,.game-test{height:64vh;min-height:540px;border-radius:6px;background:#071018;overflow:hidden;padding:8px}.shell-stage svg,.shell-stage canvas{width:100%;height:100%;display:block}.csshall{position:relative;width:min(76%,420px);height:92%;margin:4% auto;background:repeating-linear-gradient(0deg,#9b8063 0 23px,#8c7158 24px 25px);border:18px ridge #68655f;box-shadow:inset 0 0 35px #554838}.csshall:after{content:"";position:absolute;width:28%;height:20px;left:36%;bottom:-19px;background:#56737a;border:5px solid #343c3e;border-bottom:0}.game-test{height:auto;overflow:auto;background:#17130f;padding:14px}.hall{position:relative;min-width:330px;max-width:720px;min-height:560px;margin:auto;border:18px solid #5f605c;border-bottom-width:24px;background:repeating-linear-gradient(0deg,#92775c 0 23px,#826a52 24px 25px);box-shadow:inset 0 0 35px #493d31}.hall:after{content:"入口";position:absolute;bottom:-24px;left:37%;width:26%;height:24px;text-align:center;font-size:9px;line-height:22px;background:#56737a;color:#dce9ed;border-left:5px solid #353d3e;border-right:5px solid #353d3e}.wall-detail{height:26px;background:linear-gradient(#85847e,#5d5e5a);border-bottom:5px solid #393b39}.island{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:#282d2f;padding:5px;margin:28px auto;max-width:650px}.slot{aspect-ratio:2/3;background:linear-gradient(#66737a 0 12%,#151b1e 12% 31%,#eee8d8 31% 49%,#252c2f 49% 64%,#765b38 64% 86%,#101416 86%);border:1px solid #92999b}.placeholder{padding:60px 15px;text-align:center;border:1px dashed #3d596b;border-radius:8px;color:#8095a2}@media(max-width:780px){.frame{height:68vh;min-height:540px}.shell-stage{min-height:500px}.hall{min-height:510px}}</style></head><body><div class="head"><h1>Chappy5 / Visual Asset Lab</h1><div class="sub">ゲーム素材を実装に近い条件で比較・採用判定する統合試験場。</div><div class="nav"><button class="on" data-cat="shell">床・壁</button><button data-cat="machines">機械設備</button><button data-cat="furniture">家具・備品</button><button data-cat="signs">装飾・看板</button><button data-cat="people">人物</button><button data-cat="preview">実装プレビュー</button></div></div><section id="shell" class="category on"><div class="tabs shelltabs"><button class="on" data-shell="pixel">高密度Pixel</button><button data-shell="svg">SVG</button><button data-shell="css">CSS</button><button data-shell="sprite">Sprite風</button><button data-shell="depth">2.5D</button><button data-shell="hd">HD-2D風</button></div><div id="pixel" class="shellsample on"><div class="card"><h2>高密度Pixel <span class="status">候補</span></h2><div class="shell-stage"><iframe class="frame" src="./shell-pixel.html" style="height:100%;min-height:0"></iframe></div><div class="note">現行 hall-v01 の高密度Canvasをそのまま確認。</div></div></div><div id="svg" class="shellsample"><div class="card"><h2>SVG <span class="status">候補</span></h2><div class="shell-stage"><svg viewBox="0 0 820 1280"><defs><pattern id="t" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#a88b70"/><path d="M0 0H40V40" fill="none" stroke="#75604d" stroke-width="2"/></pattern></defs><rect width="820" height="1280" fill="#111516"/><rect x="45" y="35" width="730" height="1210" fill="#666762"/><rect x="76" y="66" width="668" height="1144" fill="url(#t)"/><path d="M76 66H744V1210H476M344 1210H76Z" fill="none" stroke="#393d3c" stroke-width="13"/><rect x="344" y="1202" width="132" height="43" fill="#58747a"/></svg></div></div></div><div id="css" class="shellsample"><div class="card"><h2>CSS Art <span class="status">候補</span></h2><div class="shell-stage"><div class="csshall"></div></div></div></div><div id="sprite" class="shellsample"><div class="card"><h2>Sprite / タイルマップ風 <span class="status">候補</span></h2><div class="shell-stage"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><pattern id="sp" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="64" height="64" fill="#9a7a5d"/><rect width="31" height="31" x="2" y="2" fill="#ad8b68"/><rect width="29" height="29" x="34" y="34" fill="#a08061"/></pattern></defs><rect width="820" height="1280" fill="#101719"/><rect x="52" y="42" width="716" height="1196" fill="#464b49"/><rect x="78" y="68" width="664" height="1138" fill="url(#sp)"/><path d="M78 68H742V1206H478M342 1206H78Z" stroke="#777872" stroke-width="18" fill="none"/><rect x="342" y="1204" width="136" height="34" fill="#506f76"/></svg></div></div></div><div id="depth" class="shellsample"><div class="card"><h2>トップビュー 2.5D <span class="status">候補</span></h2><div class="shell-stage"><svg viewBox="0 0 820 1280"><defs><linearGradient id="df" x2="0" y2="1"><stop stop-color="#b09370"/><stop offset="1" stop-color="#7b624e"/></linearGradient></defs><rect width="820" height="1280" fill="#0c1215"/><rect x="68" y="72" width="684" height="1140" fill="#24292a" opacity=".7"/><rect x="82" y="64" width="656" height="1132" fill="url(#df)"/><path d="M62 48H758V1214H488V1190H738V68H82V1190H332V1214H62Z" fill="#696b67"/><path d="M62 48l20 20h656l20-20M82 68v1122l-20 24M738 68v1122l20 24" stroke="#aaa69c" stroke-width="8" fill="none"/><rect x="332" y="1190" width="156" height="40" fill="#4c6970"/></svg></div></div></div><div id="hd" class="shellsample"><div class="card"><h2>HD-2D風 <span class="status">候補</span></h2><div class="shell-stage"><svg viewBox="0 0 820 1280" shape-rendering="crispEdges"><defs><radialGradient id="light"><stop stop-color="#ffd89b" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><pattern id="hdt" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#8d6d54"/><rect x="2" y="2" width="28" height="28" fill="#a27e5e"/></pattern></defs><rect width="820" height="1280" fill="#070b0d"/><rect x="50" y="40" width="720" height="1200" fill="#454846"/><rect x="76" y="66" width="668" height="1144" fill="url(#hdt)"/><path d="M76 66H744V1210H478M342 1210H76Z" stroke="#77756f" stroke-width="20" fill="none"/><ellipse cx="410" cy="330" rx="320" ry="260" fill="url(#light)"/><ellipse cx="410" cy="900" rx="300" ry="250" fill="url(#light)"/><rect x="342" y="1200" width="136" height="40" fill="#56777d"/></svg></div></div></div></section><section id="machines" class="category"><div class="tabs"><button class="on" data-id="m01">筐体01</button><button data-id="m02">筐体02</button><button data-id="m03">筐体03</button></div><div class="tests"><button class="on" data-test="detail">単体・縮尺</button><button data-test="island">18台島</button><button data-test="hall130">130台想定</button><button data-test="hall216">216台負荷想定</button></div><main id="detail"><section id="m01" class="panel on"><div class="card"><h2>筐体01 <span class="status">候補</span></h2><iframe class="frame" src="./atype01-v2-realframe.html"></iframe></div></section><section id="m02" class="panel"><div class="card"><h2>筐体02 <span class="status">候補</span></h2><iframe class="frame" src="./atype02-classic-frame.html"></iframe></div></section><section id="m03" class="panel"><div class="card"><h2>筐体03 <span class="status">候補</span></h2><iframe class="frame" src="./atype03-dualwing-frame.html"></iframe></div></section></main><div id="gameTest" class="game-test" style="display:none"><div class="note" id="testNote"></div><div class="hall"><div class="wall-detail"></div><div id="islands"></div></div></div></section><section id="furniture" class="category"><div class="placeholder">家具・備品候補をここで試験</div></section><section id="signs" class="category"><div class="placeholder">装飾・看板候補をここで試験</div></section><section id="people" class="category"><div class="placeholder">人物候補をここで試験</div></section><section id="preview" class="category"><div class="card"><h2>実装プレビュー</h2><div class="note">選択した素材を同じホール条件で合成確認。</div><div class="game-test"><div class="hall"><div class="wall-detail"></div><div id="previewIslands"></div></div></div></div></section><script>let machine='m01';const cats=[...document.querySelectorAll('.category')],nav=[...document.querySelectorAll('.nav button')],tabs=[...document.querySelectorAll('#machines>.tabs button')],tests=[...document.querySelectorAll('.tests button')],panels=[...document.querySelectorAll('.panel')];nav.forEach(b=>b.onclick=()=>{nav.forEach(x=>x.classList.toggle('on',x===b));cats.forEach(x=>x.classList.toggle('on',x.id===b.dataset.cat));if(b.dataset.cat==='preview')document.getElementById('previewIslands').innerHTML=Array.from({length:6},island).join('')});document.querySelectorAll('.shelltabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.shelltabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.shellsample').forEach(x=>x.classList.toggle('on',x.id===b.dataset.shell))});tabs.forEach(b=>b.onclick=()=>{machine=b.dataset.id;tabs.forEach(x=>x.classList.toggle('on',x===b));panels.forEach(x=>x.classList.toggle('on',x.id===machine))});function island(){return '<div class="island">'+Array.from({length:9},()=>'<div class="slot"></div>').join('')+'</div>'}function render(mode){const detail=document.getElementById('detail'),gt=document.getElementById('gameTest'),holder=document.getElementById('islands'),note=document.getElementById('testNote');if(mode==='detail'){detail.style.display='block';gt.style.display='none';return}detail.style.display='none';gt.style.display='block';let rows=2,label='18台島：9台×両面';if(mode==='hall130'){rows=15;label='130台想定'}if(mode==='hall216'){rows=24;label='216台負荷想定'}note.textContent=label+' / 選択中 '+machine.replace('m','筐体');holder.innerHTML=Array.from({length:rows},island).join('')}tests.forEach(b=>b.onclick=()=>{tests.forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.test)})</script></body></html>
