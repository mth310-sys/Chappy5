<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chappy5 Machine Visual Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.head{position:sticky;top:0;z-index:5;background:#0b1116ee;padding:4px 0 10px}h1{font-size:18px;margin:0 0 5px}.sub{font-size:11px;color:#9eb0bb}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{border:1px solid #35536a;background:#132331;color:#dce8ef;border-radius:6px;padding:8px 12px;white-space:nowrap}.tabs button.on{background:#875f27;border-color:#c49248}.panel{display:none}.panel.on{display:block}.card{background:#121a21;border:1px solid #537044;border-radius:9px;padding:8px}.card h2{font-size:14px;margin:2px 0 7px}.note{font-size:10px;color:#9eb0bb;margin-bottom:7px}.frame{width:100%;height:80vh;min-height:650px;border:0;border-radius:6px;background:#0d1318}@media(max-width:780px){.frame{height:78vh;min-height:600px}}</style></head><body><div class="head"><h1>Chappy5 / Machine Visual Lab</h1><div class="sub">実機画像 → 構造言語化 → コード化。筐体ごとに1ページずつ確認する。</div><div class="tabs"><button class="on" data-id="m01">筐体01</button><button data-id="m02">筐体02</button></div></div><section id="m01" class="panel on"><div class="card"><h2>筐体01 / 立体装飾フレーム系</h2><div class="note">大型上部表示＋左右立体発光ユニット＋3リール＋突出操作棚＋大型下パネル＋突出下皿</div><iframe class="frame" src="./atype01-v2-realframe.html"></iframe></div></section><section id="m02" class="panel"><div class="card"><h2>筐体02 / 大型クラウン・大面構成系</h2><div class="note">大型トップクラウン＋黒フェイス＋縦発光支柱＋白3リール＋絞り情報帯＋銀操作棚＋大型下パネル＋深い下皿</div><iframe class="frame" src="./atype02-classic-frame.html"></iframe></div></section><script>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.id).classList.add('on')})</script></body></html>
