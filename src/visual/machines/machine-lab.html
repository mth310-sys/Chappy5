<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chappy5 Machine Asset Test</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px}.head{position:sticky;top:0;z-index:5;background:#0b1116ee;padding:4px 0 10px}h1{font-size:18px;margin:0 0 5px}.sub,.note{font-size:11px;color:#9eb0bb}.tabs,.tests{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button,.tests button{border:1px solid #35536a;background:#132331;color:#dce8ef;border-radius:6px;padding:8px 12px;white-space:nowrap}.tabs button.on,.tests button.on{background:#875f27;border-color:#c49248}.panel{display:none}.panel.on{display:block}.card{background:#121a21;border:1px solid #537044;border-radius:9px;padding:8px}.card h2{font-size:14px;margin:2px 0 7px}.frame{width:100%;height:76vh;min-height:620px;border:0;border-radius:6px;background:#0d1318}.game-test{display:none;min-height:620px;border-radius:6px;background:#17130f;overflow:auto;padding:14px}.game-test.on{display:block}.hall{min-width:340px;min-height:570px;border:16px solid #595954;background:repeating-linear-gradient(0deg,#8f745a 0 24px,#826950 25px 26px);padding:24px 10px}.island{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;background:#282d2f;padding:5px;margin:28px auto;max-width:700px}.slot{aspect-ratio:2/3;background:linear-gradient(#647077 0 12%,#151b1e 12% 31%,#eee8d8 31% 49%,#252c2f 49% 64%,#765b38 64% 86%,#101416 86%);border:1px solid #92999b;position:relative}.slot:before{content:"";position:absolute;left:19%;right:19%;top:51%;height:8%;background:radial-gradient(circle,#e8e8e0 0 35%,transparent 38%) 0 0/33% 100%}.status{display:inline-block;font-size:10px;border:1px solid #536d45;color:#bdd3ad;padding:4px 7px;border-radius:12px;margin-left:6px}@media(max-width:780px){.frame{height:72vh;min-height:570px}.game-test{min-height:570px}.hall{padding:18px 5px}.island{margin:22px auto}}</style></head><body><div class="head"><h1>Chappy5 / Visual Asset Test</h1><div class="sub">ゲーム素材を実使用条件で確認し、採用・保留・不採用を判断する試験場。</div><div class="tabs"><button class="on" data-id="m01">筐体01</button><button data-id="m02">筐体02</button><button data-id="m03">筐体03</button></div><div class="tests"><button class="on" data-test="detail">単体・縮尺</button><button data-test="island">18台島</button><button data-test="hall130">130台想定</button><button data-test="hall216">216台負荷想定</button></div></div><main id="detail"><section id="m01" class="panel on"><div class="card"><h2>筐体01 <span class="status">候補</span></h2><div class="note">同一素材の280px / 80px / 40px / 9台表示を確認</div><iframe class="frame" src="./atype01-v2-realframe.html"></iframe></div></section><section id="m02" class="panel"><div class="card"><h2>筐体02 <span class="status">候補</span></h2><div class="note">同一素材の280px / 80px / 40px / 9台表示を確認</div><iframe class="frame" src="./atype02-classic-frame.html"></iframe></div></section><section id="m03" class="panel"><div class="card"><h2>筐体03 <span class="status">候補</span></h2><div class="note">同一素材の280px / 80px / 40px / 9台表示を確認</div><iframe class="frame" src="./atype03-dualwing-frame.html"></iframe></div></section></main><div id="gameTest" class="game-test"><div class="note" id="testNote"></div><div class="hall" id="hall"></div></div><script>let machine='m01';const tabs=[...document.querySelectorAll('.tabs button')],tests=[...document.querySelectorAll('.tests button')],panels=[...document.querySelectorAll('.panel')];tabs.forEach(b=>b.onclick=()=>{machine=b.dataset.id;tabs.forEach(x=>x.classList.toggle('on',x===b));panels.forEach(x=>x.classList.toggle('on',x.id===machine))});function island(){return '<div class="island">'+Array.from({length:9},()=>'<div class="slot"></div>').join('')+'</div>'}function render(mode){const detail=document.getElementById('detail'),gt=document.getElementById('gameTest'),hall=document.getElementById('hall'),note=document.getElementById('testNote');if(mode==='detail'){detail.style.display='block';gt.classList.remove('on');return}detail.style.display='none';gt.classList.add('on');let rows=2,label='18台島：9台×両面を想定したゲーム縮尺確認';if(mode==='hall130'){rows=15;label='130台想定：営業開始時の高密度配置を簡易再現'}if(mode==='hall216'){rows=24;label='216台負荷想定：最大設置時の描画密度を簡易再現'}note.textContent=label+' / 選択中 '+machine.replace('m','筐体');hall.innerHTML=Array.from({length:rows},island).join('')}tests.forEach(b=>b.onclick=()=>{tests.forEach(x=>x.classList.toggle('on',x===b));render(b.dataset.test)})</script></body></html>
