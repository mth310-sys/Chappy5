<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chappy5 Visual Lab - パチスロ機 Aタイプ 01 (2.5D Canvas)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #121214; color: #e0e0e0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    h1 { font-size: 1.2rem; margin-bottom: 8px; color: #fff; }
    p { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; text-align: center; }
    .preview-container { background: #1e1e24; border: 1px solid #333; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .preview-group { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .preview-box { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .preview-label { font-size: 0.75rem; color: #888; }
    canvas { display: block; image-rendering: pixelated; }
  </style>
</head>
<body>
  <h1>Chappy5 Visual Lab - Aタイプ 01</h1>
  <p>トップビュー2.5D方式 / iPhone Safari最適化 / 縮小耐性設計</p>
  <div class="preview-container">
    <div class="preview-group">
      <div class="preview-box"><canvas id="slot-large" width="200" height="320"></canvas><span class="preview-label">等倍表示 (200×320)</span></div>
      <div class="preview-box"><canvas id="slot-medium" width="80" height="128"></canvas><span class="preview-label">ホール中 (80×128)</span></div>
      <div class="preview-box"><canvas id="slot-small" width="40" height="64"></canvas><span class="preview-label">ホール極小 (40×64)</span></div>
    </div>
  </div>
  <script>
    function drawSlotMachine(canvas, options = {}) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = `${w}px`;
      canvas.style.height = `${h}px`;
      ctx.scale(dpr, dpr);
      ctx.clearRect(0, 0, w, h);

      const isLit = options.isLit ?? true;
      const subColor = options.subColor || '#d32f2f';
      const padX = w * 0.05;
      const padY = h * 0.03;
      const slotW = w - padX * 2;
      const slotH = h - padY * 2;

      ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
      ctx.beginPath();
      ctx.ellipse(w / 2, h - padY, slotW * 0.55, padY * 1.5, 0, 0, Math.PI * 2);
      ctx.fill();

      const bodyGrad = ctx.createLinearGradient(padX, 0, padX + slotW, 0);
      bodyGrad.addColorStop(0, '#1a1a1d'); bodyGrad.addColorStop(0.15, '#3a3a40'); bodyGrad.addColorStop(0.5, '#5a5a62'); bodyGrad.addColorStop(0.85, '#3a3a40'); bodyGrad.addColorStop(1, '#1a1a1d');
      ctx.fillStyle = bodyGrad;
      const radius = Math.max(2, w * 0.04);
      ctx.beginPath();
      ctx.roundRect(padX, padY, slotW, slotH, [radius, radius, 2, 2]);
      ctx.fill();
      ctx.strokeStyle = '#8a8a93';
      ctx.lineWidth = Math.max(1, w * 0.02);
      ctx.stroke();

      const topPanelH = slotH * 0.28;
      const topPanelY = padY + slotH * 0.03;
      const topPanelW = slotW * 0.88;
      const topPanelX = padX + (slotW - topPanelW) / 2;
      ctx.fillStyle = '#0d0d11';
      ctx.fillRect(topPanelX, topPanelY, topPanelW, topPanelH);
      const panelArtGrad = ctx.createLinearGradient(0, topPanelY, 0, topPanelY + topPanelH);
      panelArtGrad.addColorStop(0, '#111827'); panelArtGrad.addColorStop(1, '#1f2937');
      ctx.fillStyle = panelArtGrad;
      ctx.fillRect(topPanelX + 2, topPanelY + 2, topPanelW - 4, topPanelH - 4);

      const lampR = Math.max(3, topPanelH * 0.22);
      ctx.beginPath(); ctx.arc(topPanelX + topPanelW * 0.2, topPanelY + topPanelH * 0.5, lampR, 0, Math.PI * 2);
      if (isLit) { ctx.fillStyle = '#ff1744'; ctx.shadowColor = '#ff1744'; ctx.shadowBlur = Math.max(4, w * 0.08); } else { ctx.fillStyle = '#4a1525'; }
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.beginPath(); ctx.arc(topPanelX + topPanelW * 0.8, topPanelY + topPanelH * 0.5, lampR, 0, Math.PI * 2);
      if (isLit) { ctx.fillStyle = '#ffea00'; ctx.shadowColor = '#ffea00'; ctx.shadowBlur = Math.max(4, w * 0.08); } else { ctx.fillStyle = '#554e10'; }
      ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(topPanelX + topPanelW * 0.38, topPanelY + topPanelH * 0.4, topPanelW * 0.24, topPanelH * 0.2);

      const reelY = topPanelY + topPanelH + slotH * 0.03;
      const reelH = slotH * 0.22;
      const reelW = topPanelW;
      const reelX = topPanelX;
      ctx.fillStyle = '#000000';
      ctx.fillRect(reelX, reelY, reelW, reelH);
      const singleReelW = (reelW - 8) / 3;
      for (let i = 0; i < 3; i++) {
        const rx = reelX + 2 + i * (singleReelW + 2);
        const ry = reelY + 2;
        const rh = reelH - 4;
        const rGrad = ctx.createLinearGradient(0, ry, 0, ry + rh);
        rGrad.addColorStop(0, '#b0b0b0'); rGrad.addColorStop(0.2, '#ffffff'); rGrad.addColorStop(0.8, '#ffffff'); rGrad.addColorStop(1, '#a0a0a0');
        ctx.fillStyle = rGrad; ctx.fillRect(rx, ry, singleReelW, rh);
        const symH = rh * 0.22;
        ctx.fillStyle = i === 1 ? '#d32f2f' : '#1976d2'; ctx.fillRect(rx + 2, ry + rh * 0.39, singleReelW - 4, symH);
        ctx.fillStyle = '#fbc02d'; ctx.fillRect(rx + 3, ry + rh * 0.1, singleReelW - 6, symH * 0.7);
        ctx.fillStyle = '#388e3c'; ctx.fillRect(rx + 3, ry + rh * 0.72, singleReelW - 6, symH * 0.7);
      }

      const shelfY = reelY + reelH + slotH * 0.02;
      const shelfH = slotH * 0.14;
      const shelfW = slotW * 0.96;
      const shelfX = padX + (slotW - shelfW) / 2;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(shelfX, shelfY + shelfH * 0.8, shelfW, shelfH * 0.4);
      const shelfGrad = ctx.createLinearGradient(0, shelfY, 0, shelfY + shelfH);
      shelfGrad.addColorStop(0, '#9e9e9e'); shelfGrad.addColorStop(0.3, '#e0e0e0'); shelfGrad.addColorStop(0.7, '#757575'); shelfGrad.addColorStop(1, '#424242');
      ctx.fillStyle = shelfGrad; ctx.fillRect(shelfX, shelfY, shelfW, shelfH * 0.8);

      const btnW = shelfW * 0.18;
      const btnH = shelfH * 0.45;
      const btnY = shelfY + shelfH * 0.18;
      const btnGap = shelfW * 0.05;
      const btnStartX = shelfX + (shelfW - (btnW * 3 + btnGap * 2)) / 2;
      const btnColors = ['#e53935', '#43a047', '#1e88e5'];
      for (let i = 0; i < 3; i++) {
        const bx = btnStartX + i * (btnW + btnGap);
        ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.roundRect(bx - 1, btnY - 1, btnW + 2, btnH + 2, 2); ctx.fill();
        ctx.fillStyle = btnColors[i]; ctx.beginPath(); ctx.roundRect(bx, btnY, btnW, btnH, 1.5); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillRect(bx + 1, btnY + 1, btnW - 2, btnH * 0.3);
      }
      ctx.fillStyle = '#f57c00'; ctx.beginPath(); ctx.arc(btnStartX - btnW * 0.5, btnY + btnH * 0.5, Math.max(2, btnH * 0.35), 0, Math.PI * 2); ctx.fill();

      const bPanelY = shelfY + shelfH + slotH * 0.02;
      const bPanelH = (padY + slotH) - bPanelY - slotH * 0.04;
      const bPanelW = topPanelW;
      const bPanelX = topPanelX;
      ctx.fillStyle = '#0a0a0c'; ctx.fillRect(bPanelX, bPanelY, bPanelW, bPanelH);
      const bArtGrad = ctx.createLinearGradient(bPanelX, bPanelY, bPanelX + bPanelW, bPanelY + bPanelH);
      bArtGrad.addColorStop(0, subColor); bArtGrad.addColorStop(0.5, '#ffb300'); bArtGrad.addColorStop(1, '#8e24aa');
      ctx.fillStyle = bArtGrad; ctx.fillRect(bPanelX + 2, bPanelY + 2, bPanelW - 4, bPanelH - 4);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.beginPath(); ctx.moveTo(bPanelX + bPanelW * 0.3, bPanelY + 4); ctx.lineTo(bPanelX + bPanelW * 0.5, bPanelY + bPanelH - 4); ctx.lineTo(bPanelX + bPanelW * 0.7, bPanelY + 4); ctx.fill();
      ctx.fillStyle = '#151515'; ctx.fillRect(bPanelX + bPanelW * 0.15, bPanelY + bPanelH - 3, bPanelW * 0.7, 3);
    }

    window.addEventListener('DOMContentLoaded', () => {
      drawSlotMachine(document.getElementById('slot-large'), { isLit: true, subColor: '#b71c1c' });
      drawSlotMachine(document.getElementById('slot-medium'), { isLit: true, subColor: '#b71c1c' });
      drawSlotMachine(document.getElementById('slot-small'), { isLit: true, subColor: '#b71c1c' });
    });
  </script>
</body>
</html>
