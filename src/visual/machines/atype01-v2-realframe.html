<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chappy5 Aタイプ01 v2 実機構造</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}h1{font-size:17px;margin:0 0 4px}.sub{font-size:11px;color:#9eb0bb;margin-bottom:12px}.card{background:#121a21;border:1px solid #2b4150;border-radius:9px;padding:10px;margin-bottom:10px}.row{display:flex;gap:12px;align-items:flex-end;justify-content:center;flex-wrap:wrap}.item{text-align:center;font-size:10px;color:#9eb0bb}.m{display:block}.large{width:280px}.mid{width:80px}.small{width:40px}.hall{display:grid;grid-template-columns:repeat(9,40px);gap:4px;justify-content:center;background:linear-gradient(#9a8066,#745c48);padding:22px 8px;overflow:auto}.hall .m{width:40px}@media(max-width:520px){.large{width:240px}.hall{justify-content:start}}</style></head><body><h1>Aタイプ01 v2 / 実機構造コード化</h1><div class="sub">画像の固有意匠ではなく、実機の立体構造・情報密度・前後段差を抽象化</div><div class="card"><div class="row" id="scales"></div></div><div class="card"><div class="hall" id="hall"></div></div><script>
function machine(id='m'){return `<svg class="m" viewBox="0 0 200 330" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="metal${id}" x2="1"><stop stop-color="#d5d8d8"/><stop offset=".12" stop-color="#52595e"/><stop offset=".5" stop-color="#eceeee"/><stop offset=".84" stop-color="#4a5055"/><stop offset="1" stop-color="#d9dada"/></linearGradient><linearGradient id="dark${id}" y2="1"><stop stop-color="#30363a"/><stop offset="1" stop-color="#0c0f11"/></linearGradient><linearGradient id="art${id}" x2="1" y2="1"><stop stop-color="#102b45"/><stop offset=".5" stop-color="#8e2c24"/><stop offset="1" stop-color="#d5a13c"/></linearGradient></defs>
<!-- central chassis --> <path d="M24 14Q24 6 34 6H166Q176 6 176 14L184 286Q184 300 170 304H30Q16 300 16 286Z" fill="#101417" stroke="#555d61" stroke-width="3"/>
<!-- top crown / LED bar --> <path d="M22 10L36 2H164L178 10L170 34H30Z" fill="url(#metal${id})" stroke="#0a0b0c" stroke-width="2"/><rect x="40" y="8" width="120" height="17" rx="3" fill="#152333"/><g fill="#5dbdff"><rect x="45" y="11" width="17" height="11"/><rect x="65" y="11" width="17" height="11"/></g><g fill="#ff5353"><rect x="118" y="11" width="17" height="11"/><rect x="138" y="11" width="17" height="11"/></g>
<!-- upper display --> <path d="M40 32H160L154 86H46Z" fill="#050708" stroke="#b7bdbe" stroke-width="3"/><rect x="50" y="39" width="100" height="38" rx="2" fill="#74232a"/><path d="M60 65L82 47L100 64L120 45L141 66" fill="none" stroke="#ffcf69" stroke-width="4"/>
<!-- sculpted side units --> <path d="M23 34L45 31L42 150L20 165L10 145L13 64Z" fill="url(#metal${id})" stroke="#090b0c" stroke-width="2"/><path d="M177 34L155 31L158 150L180 165L190 145L187 64Z" fill="url(#metal${id})" stroke="#090b0c" stroke-width="2"/><path d="M19 51L36 45L34 142L18 151Z" fill="#2689d8"/><path d="M181 51L164 45L166 142L182 151Z" fill="#e13f3f"/><path d="M25 73L36 64L34 102L24 111Z" fill="#07131b"/><path d="M175 73L164 64L166 102L176 111Z" fill="#1b0909"/>
<!-- reel triple frame --> <rect x="38" y="91" width="124" height="88" rx="4" fill="#050708" stroke="#c8cbca" stroke-width="3"/><rect x="44" y="98" width="112" height="70" fill="#f3efe4"/><path d="M81 98V168M119 98V168" stroke="#3e4243" stroke-width="3"/><g fill="#d52e2e"><path d="M52 117H73L59 139H75V148H48L62 126H52Z"/><path d="M90 117H111L97 139H113V148H86L100 126H90Z"/><path d="M128 117H149L135 139H151V148H124L138 126H128Z"/></g><g fill="#58a64a"><circle cx="60" cy="106" r="5"/><circle cx="98" cy="106" r="5"/><circle cx="136" cy="106" r="5"/></g>
<!-- info waist --> <path d="M37 181H163L169 201H31Z" fill="#181d20" stroke="#747b7d" stroke-width="2"/><g fill="#e0a838"><rect x="48" y="187" width="17" height="7"/><rect x="72" y="187" width="17" height="7"/><rect x="111" y="187" width="17" height="7"/><rect x="135" y="187" width="17" height="7"/></g>
<!-- projecting control shelf: top + face + shadow --> <path d="M29 201H171L190 219H10Z" fill="url(#metal${id})" stroke="#090a0b" stroke-width="2"/><path d="M10 219H190L182 248H18Z" fill="url(#dark${id})" stroke="#050607" stroke-width="2"/><ellipse cx="39" cy="213" rx="10" ry="6" fill="#151719" stroke="#bbb"/><circle cx="164" cy="212" r="9" fill="#d9d9d5" stroke="#202326" stroke-width="3"/><g fill="#ed3c35" stroke="#08090a" stroke-width="3"><circle cx="72" cy="231" r="11"/><circle cx="100" cy="231" r="11"/><circle cx="128" cy="231" r="11"/></g>
<!-- large framed lower art panel --> <path d="M30 251H170L166 296H34Z" fill="url(#metal${id})"/><rect x="39" y="257" width="122" height="33" rx="2" fill="url(#art${id})" stroke="#070809" stroke-width="2"/><path d="M48 282L76 264L97 284L120 262L152 282" fill="none" stroke="#f3d28b" stroke-width="4"/>
<!-- protruding medal tray / feet --> <path d="M24 299H176L187 311L178 326H22L13 311Z" fill="#080a0b" stroke="#3e4447" stroke-width="2"/><path d="M37 304H163L155 317H45Z" fill="#171b1e"/><rect x="26" y="323" width="35" height="5" fill="#050607"/><rect x="139" y="323" width="35" height="5" fill="#050607"/></svg>`}
const s=document.getElementById('scales');[['large','280px'],['mid','80px'],['small','40px']].forEach((x,i)=>{const d=document.createElement('div');d.className='item';d.innerHTML=`<div class="${x[0]}">${machine('s'+i)}</div><div>${x[1]}</div>`;s.appendChild(d)});const h=document.getElementById('hall');for(let i=0;i<9;i++){const d=document.createElement('div');d.innerHTML=machine('h'+i);h.appendChild(d)}
</script></body></html>
