<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ホールレイアウト / 斜め俯瞰02</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#080c0f;color:#edf3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h2{margin:0 0 5px;font-size:18px}.note{margin:0 0 12px;color:#9eafb8;font-size:12px;line-height:1.6}.viewport{height:640px;overflow:auto;border:1px solid #3c4a51;border-radius:10px;background:linear-gradient(#11171b,#090d10);-webkit-overflow-scrolling:touch;perspective:1500px;perspective-origin:50% 14%}.scene{position:relative;width:1700px;height:1250px;transform-style:preserve-3d}.floor{position:absolute;left:0;top:0;width:1700px;height:1250px;background:repeating-linear-gradient(0deg,#242a2b 0 1px,transparent 1px 70px),repeating-linear-gradient(90deg,#242a2b 0 1px,transparent 1px 70px),linear-gradient(#191d1e,#0f1315);transform:rotateX(58deg);transform-origin:50% 0}.island{position:absolute;width:1050px;height:250px;transform-style:preserve-3d;filter:drop-shadow(0 22px 16px #000c)}.i1{left:180px;top:240px}.i2{left:340px;top:760px}.front{position:absolute;left:0;top:65px;width:1050px;height:185px;background:linear-gradient(#24292b,#080b0c 60%,#020303);border:2px solid #050707;display:flex;overflow:hidden;transform:translateZ(42px)}.top{position:absolute;left:0;top:0;width:1050px;height:65px;background:linear-gradient(#555d5f,#222829 48%,#0c1011);border:2px solid #060808;transform-origin:bottom center;transform:rotateX(64deg) translateZ(42px)}.rear{position:absolute;left:0;top:-23px;width:1050px;height:28px;background:linear-gradient(#202628,#090c0d);border:2px solid #050707;transform:translateZ(-42px);opacity:.82}.rear:after{content:"反対面9台";position:absolute;right:16px;top:5px;color:#78868b;font-size:10px}.bay{position:relative;width:116.666px;height:185px;flex:0 0 116.666px;border-right:1px solid #333a3c}.header{position:absolute;left:4px;right:4px;top:3px;height:19px;background:linear-gradient(#747a7c,#171b1c);border:1px solid #050707}.data{position:absolute;left:37px;top:5px;width:45px;height:22px;background:#071012;border:2px solid #566266;z-index:5}.mount{position:absolute;left:19px;top:28px;width:78px;height:105px;background:repeating-linear-gradient(135deg,#07090a 0 7px,#0b0e0f 7px 14px);border:2px solid #363d3f}.rail{position:absolute;left:98px;top:27px;width:4px;height:108px;background:linear-gradient(90deg,#111,#747c7e,#111)}.sand{position:absolute;left:102px;top:32px;width:13px;height:95px;background:linear-gradient(90deg,#080a0b,#4a5558,#111719);border:1px solid #687579}.sand:before{content:"";position:absolute;left:2px;right:2px;top:7px;height:15px;background:#0b282c;border:1px solid #596a6e}.counter{position:absolute;left:3px;right:3px;top:133px;height:20px;background:linear-gradient(#303638,#070909);border:1px solid #010202}.fascia{position:absolute;left:3px;right:3px;top:152px;height:31px;background:linear-gradient(#151819,#030404);border:1px solid #010202}.label{position:absolute;left:12px;bottom:8px;padding:4px 7px;background:#081014cc;border:1px solid #536167;border-radius:4px;color:#cbd5d9;font-size:10px;z-index:20;transform:translateZ(44px)}.entrance{position:absolute;left:75px;top:1050px;width:300px;height:90px;border:3px solid #566469;background:#12191c;display:grid;place-items:center;color:#9fb0b8;transform:translateZ(8px)}.counterdesk{position:absolute;right:90px;top:110px;width:260px;height:100px;background:linear-gradient(#56504a,#262421);border:3px solid #171513;display:grid;place-items:center;color:#d2c7b7;transform:translateZ(20px)}.legend{margin-top:12px;padding:10px 12px;background:#101820;border:1px solid #41545e;border-radius:7px;color:#b8c6cd;font-size:12px;line-height:1.6}</style></head><body><h2>ホールレイアウト / 斜め俯瞰02</h2><div class="note">島そのものを斜めに曲げるのではなく、カメラを上から少し見下ろす方式に修正。正面は水平のまま残し、上面と床だけで奥行きを見せる。</div><div class="viewport" data-playtest-scroll><div class="scene"><div class="floo
