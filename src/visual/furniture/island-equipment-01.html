<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>島設備01</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1116;color:#eaf1f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:16px}.note{font-size:12px;color:#9eb0bb;margin:6px 0 14px}.stage{overflow:auto;background:#17130f;border:1px solid #44545d;border-radius:8px;padding:24px}.island{display:grid;grid-template-columns:repeat(9,64px);grid-template-rows:repeat(3,64px);width:max-content;border:1px solid #76828a;box-shadow:0 10px 24px #0008}.cell{position:relative;border:1px solid #3c4a50;overflow:hidden}.machine{background:linear-gradient(90deg,#20272a,#65737a 18%,#111719 20% 80%,#65737a 82%,#20272a)}.machine:before{content:"";position:absolute;left:17%;right:17%;top:16%;height:34%;background:#eee7d7;border:3px solid #222}.machine:after{content:"";position:absolute;left:18%;right:18%;bottom:10%;height:24%;background:#624a35;border:3px solid #171b1d}.rack{background:linear-gradient(#66513e,#493a2f 46%,#322b26 47% 100%)}.rack:before{content:"";position:absolute;left:7px;right:7px;top:8px;height:16px;background:#85705a;border:1px solid #ad9476}.sand{position:absolute;right:3px;top:5px;width:8px;height:25px;background:#1b2022;border:1px solid #a1a9aa}.box{position:absolute;left:5px;bottom:5px;width:22px;height:12px;border:2px solid #d7caa7;background:#766743}.rear-hidden{background:linear-gradient(#2f3030,#242626);border-color:#303638}.rear-hidden:after{content:"裏面・非表示";position:absolute;inset:0;display:grid;place-items:center;font-size:8px;color:#69757b;opacity:.65}.end{outline:4px solid #343a3c}.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;font-size:11px}.tag{border:1px solid #526c7b;border-radius:12px;padding:4px 8px}</style></head><body><h2>島設備01 / 5号機時代・両面島</h2><div class="note">基本占有は9×3マス・18台。ただし描画は視点側の9台と島設備だけを見せ、反対側9台は占有・台データのみ保持して画面には描画しません。</div><div class="stage"><div id="island" class="island"></div></div><div class="legend"><span class="tag">18台</span><span class="tag">9×3マス占有</span><span class="tag">裏面9台は非描画</span><span class="tag">台間サンド</span><span class="tag">ドル箱置場</span><span class="tag">島端設備</span><span class="tag">候補</span></div><script>const el=document.getElementById('island');for(let r=0;r<3;r++){for(let c=0;c<9;c++){const d=document.createElement('div');d.className='cell '+(r===0?'machine':r===1?'rack':'rear-hidden')+((c===0||c===8)?' end':'');if(r===1){d.innerHTML='<span class="sand"></span><span class="box"></span>'}el.appendChild(d)}}</script></body></html>
