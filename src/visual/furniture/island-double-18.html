2>両面島01 / 18台・確定9台基準</h2><div class="note">確定した片面9台を変更せず背中合わせに配置。両面18台を1つの島家具として扱うためのレイアウト用基準モデル。</div><div class="stage" data-playtest-scroll><div class="plan"><div class="face rear" id="rear"></div><div class="spine"></div><div class="face front" id="front"></div></div><div class="floor">FRONT側通路 / 9台</div></div><div class="info">FRONT 9台 + BACK 9台 = 18台。各面は344pxピッチ。サンドは各筐体の右取付レールへ直接隣接した確定配置を維持。</div><script>const inner='<div class="unit"><div class="shadow"></div><div class="backboard"></div><div class="header"></div><div class="data"></div><div class="mount"></div><div class="rail-left"></div><div class="rail-right"></div><div class="sand"><span class="screen"></span><span class="slot"></span><span class="button"></span><span class="indicator"></span><span class="medal"></span></div><div class="divider"></div><div class="box-side"><div class="box-stack"><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div></div><div class="counter"></div><div class="fascia"></div><div class="foot"></div></div>';for(const id of ['front','rear']){const face=document.getElementById(id);for(let i=0;i<9;i++){const bay=document.createElement('div');bay.className='bay';bay.style.left=i*344+'px';bay.innerHTML=inner;face.appendChild(bay)}}</script></body></html>
