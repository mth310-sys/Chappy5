<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>両面島01・18台モデル</title><style>*{box-sizing:border-box}body{margin:0;padding:16px;background:#090e12;color:#edf3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}h2{margin:0 0 5px;font-size:18px}.note{margin:0 0 14px;color:#9eafb8;font-size:12px;line-height:1.65}.stage{overflow:auto;padding:38px 28px 48px;background:radial-gradient(ellipse at 50% 18%,#36322d,#181919 48%,#090a0b);border:1px solid #3c4a51;border-radius:10px}.island{position:relative;width:1134px;height:398px;margin:auto;filter:drop-shadow(0 17px 16px #000c)}.header{position:absolute;inset:0 0 auto;height:34px;background:linear-gradient(#747a7c,#3a4042 18%,#171b1c 58%,#050707);border:2px solid #030404;box-shadow:inset 0 2px #9da4a6}.body{position:absolute;left:0;right:0;top:33px;height:282px;background:linear-gradient(#222627,#0a0d0e);border:2px solid #020303}.counter{position:absolute;left:0;right:0;top:311px;height:41px;background:linear-gradient(#2a2f31,#111415 30%,#030404);border:2px solid #010202;box-shadow:inset 0 2px #555d5f}.fascia{position:absolute;left:0;right:0;top:350px;height:48px;background:linear-gradient(#121516,#040505);border:2px solid #010202}.bay{position:absolute;top:0;width:126px;height:398px;border-right:1px solid #1f2425}.mount{position:absolute;left:18px;top:51px;width:91px;height:245px;background:repeating-linear-gradient(135deg,#07090a 0 8px,#0b0e0f 8px 16px);border:2px solid #363d3f;box-shadow:inset 0 0 15px #000}.mount:after{content:"筐体";position:absolute;inset:0;display:grid;place-items:center;color:#4f5c61;font-size:9px}.data{position:absolute;left:31px;top:7px;width:67px;height:38px;background:#080c0d;border:2px solid #566266;border-radius:3px;z-index:8}.data:before{content:"12 03";position:absolute;inset:5px;background:#020606;display:grid;place-items:center;color:#e35d50;font:7px monospace}.sand{position:absolute;left:110px;top:55px;width:15px;height:225px;background:linear-gradient(90deg,#070a0b,#3b4548,#101516);border:1px solid #687579;z-index:7}.sand:before{content:"";position:absolute;left:2px;right:2px;top:9px;height:27px;background:#0b282c;border:1px solid #596a6e}.sand:after{content:"●";position:absolute;left:2px;right:2px;bottom:14px;height:38px;display:grid;place-items:center;border:1px solid #4f5b5e;color:#bca96d;font-size:9px}.boxes{position:absolute;left:1px;bottom:47px;width:16px;display:flex;flex-direction:column-reverse;gap:1px;z-index:7}.box{height:19px;background:linear-gradient(#d0c096,#9c875c,#776441);border:1px solid #55482f}.end{position:absolute;top:0;width:16px;height:398px;background:linear-gradient(90deg,#07090a,#4a5153,#0a0d0e);border:2px solid #020303;z-index:12}.end.left{left:-16px}.end.right{right:-16px;transform:scaleX(-1)}.floor{width:1134px;margin:19px auto 0;border-top:1px dashed #59676e;padding-top:8px;text-align:center;color:#74838a;font-size:10px}.logic{margin-top:15px;padding:12px;border:1px solid #41545e;border-radius:8px;background:#101820}.logic h3{font-size:13px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}.cell{padding:7px 3px;text-align:center;border:1px solid #52636b;border-radius:3px;background:#151e23;font-size:10px}.rear{opacity:.72}.spine{margin:5px 0;padding:6px;text-align:center;border:1px solid #655f51;background:#24221e;color:#bdb5a3;font-size:10px}.caption{margin-top:8px;color:#9fb0b8;font-size:11px;line-height:1.6}</style></head><body><h2>両面島01 / 18台モデル</h2><div class="note">見た目は片面9台だけ。反対面9台は同じ島設備の奥側に論理データとして保持します。通常の正面視点で裏側筐体を透過・帯表示することはありません。</div><div class="stage"><div class="island" id="island"><div class="header"></div><div class="body"></div><div class="counter"></div><div class="fascia"></div><div class="end left"></div><div class="end right"></div></div><div class="floor">現在見ている側の通路 / FRONT 9台</div></div><div class="logic"><h3>論理構成確認（ゲーム画面には表示しない）</h3><div class="grid rear" id="rear"></div><div class="spine">共通の島設備・棚 / 両側の筐体を保持</div><div class="grid" id="front"></div><div class="caption">REAR 9台 + FRONT 9台 = 18台。島オブジェクトとして移動・回転すると18台すべてが追従する想定。描画はカメラ側の面だけを自然に表示します。</div></div><script>const island=document.getElementById('island');for(let i=0;i<9;i++){const bay=document.createElement('div');bay.className='bay';bay.style.left=i*126+'px';bay.innerHTML='<div class="data"></div><div class="mount"></div><div class="sand"></div><div class="boxes"><i class="box"></i><i class="box"></i><i class="box"></i></div>';island.appendChild(bay)}for(const id of ['rear','front']){const el=document.getElementById(id);for(let i=1;i<=9;i++){const c=document.createElement('div');c.className='cell';c.textContent=(id==='rear'?'R':'F')+String(i).padStart(2,'0');el.appendChild(c)}}</script></body></html>
