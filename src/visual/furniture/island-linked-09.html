="note">1台ユニットの密度感を9台連結へ再調整。1台ピッチと筐体開口を広げ、細すぎる縦長感を解消しながら、上部レール・黒い手元棚・下部前板は島全体で一本につなげています。</div><div class="stage"><div class="island" id="island"><div class="shadow"></div><div class="header"></div><div class="body"></div><div class="counter"></div><div class="wear"></div><div class="fascia"></div><div class="end left"></div><div class="end right"></div></div><div class="floor">客席・通路側 / 片面9台</div></div><div class="info"><b>幅再調整：</b> 1台ピッチを126px→150px、筐体開口を87px→108pxへ拡大。データ表示・台間設備・ドル箱側も合わせて再配置し、9台連結が細い縦枠の連続に見えない比率へ戻しました。</div><script>const island=document.getElementById('island');for(let i=0;i<9;i++){const bay=document.createElement('div');bay.className='bay';bay.style.left=(i*150)+'px';bay.innerHTML='<div class="data"></div><div class="mount"></div><div class="rail-left"></div><div class="rail-right"></div><div class="sand"><span class="screen"></span><span class="slot"></span><span class="button"></span><span class="indicator"></span><span class="medal"></span></div><div class="box-side"><div class="boxes"><i class="box"></i><i class="box"></i><i class="box"></i></div></div>';island.appendChild(bay)}</script></body></html>
