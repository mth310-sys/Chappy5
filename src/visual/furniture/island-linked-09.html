f3f5}</style></head><body><h2>島設備01 / 片面9台・連結品質確認</h2><div class="note">最新の1台ユニットに合わせて、サンドを筐体スロットの直横まで詰めた9台連結版。黒い手元棚・下部前板・上部レールは一本の設備として連続させています。</div><div class="stage"><div class="island" id="island"><div class="header"></div><div class="body"></div><div class="counter"></div><div class="fascia"></div><div class="end left"></div><div class="end right"></div></div><div class="floor">客席・通路側 / 片面9台</div></div><div class="info"><b>連結仕様：</b> 各筐体の右直横に細いサンド、その先は最小限の境界。左側ドル箱スペースは次の台との台間に収めています。反対面9台は同一島の奥側データとして保持する前提で、この視点には描画しません。</div><script>const island=document.getElementById('island');for(let i=0;i<9;i++){const bay=document.createElement('div');bay.className='bay';bay.style.left=(i*126)+'px';bay.innerHTML='<div class="data"></div><div class="mount"></div><div class="sand"></div><div class="divider"></div><div class="boxes"><i class="box"></i><i class="box"></i><i class="box"></i></div><div class="seam"></div>';island.appendChild(bay)}</script></body></html>
