ル箱は筐体左横の専用スペースへ縦方向に積み上げる形へ変更。</div><div class="stage"><div class="unit"><div class="backboard"></div><div class="header-rail"></div><div class="data"></div><div class="machine"><span class="crown"></span><span class="upper"></span><span class="reels"><i></i><i></i><i></i></span><span class="deck"></span><span class="lever"></span><span class="stop"><i></i><i></i><i></i></span><span class="lower"></span></div><div class="sand"><span class="screen"></span><span class="slot"></span><span class="medal"></span></div><div class="divider"></div><div class="counter"></div><div class="box-rack"><div class="box-stack"><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div></div><div class="base"></div><div class="floor">客席・通路側</div></div></div><div class="labels"><div class="label"><b>左側</b>ドル箱専用スペース。箱を横へ広げず、縦方向に積み上げる。</div><div class="label"><b>上部</b>データ表示器を島側設備として配置。</div><div class="label"><b>右側</b>台間サンド＋隣台との境界材。</div><div class="label"><b>下部・背面</b>島内部へ配線・メダル補給系を収める想定。</div></div><div class="status"><span class="tag">1台分</span><span class="tag">5号機時代</span><span class="tag">左側ドル箱積み</span><span class="tag">台間サンド</span><span class="tag">データ表示器</span><span class="tag">候補01</span></div></body></html>
