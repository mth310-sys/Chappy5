<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大学生風 Ultra Bit Lab</title><style>body{margin:0;background:#15202a;color:#eef4f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{padding:16px;background:#223445;position:sticky;top:0;z-index:3}h1{font-size:19px;margin:0 0 4px}.sub{font-size:11px;color:#bdd0dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:12px}.card{background:#f6efe4;color:#29231e;border-radius:10px;padding:10px}.card h2{font-size:14px;margin:0 0 4px}.stage{height:235px;display:flex;align-items:center;justify-content:center;background:#efdbb4;border-radius:7px}.stage canvas{width:192px;height:192px}.meta{font-size:11px;line-height:1.45;margin-top:7px}.badge{display:inline-block;background:#2d526f;color:#fff;padding:2px 6px;border-radius:8px;margin-right:4px}</style></head><body><header><h1>大学生風キャラ Ultra Bit Lab</h1><div class="sub">同一デザインを 192 / 384 / 512 / 768 論理ピクセルで別々にラスタライズ。最終表示は192px固定。</div></header><main class="grid" id="grid"></main><script>
const C={ol:'#211815',hd:'#38251d',h:'#68442e',hm:'#875638',hh:'#b77a4b',sk:'#f0b98e',ss:'#d47f61',sl:'#ffd2a8',bd:'#173d70',b:'#2869ad',bm:'#3f7fc0',bh:'#6aa6dc',wh:'#f7f3ec',pd:'#1e2936',p:'#34485c',pm:'#52697d',sh:'#17191d',so:'#e9edf0',eye:'#241915',mouth:'#9a5047'};
function base(size){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');x.imageSmoothingEnabled=true;const k=size/768;const rr=(a,b,w,h,r,col)=>{x.fillStyle=col;x.beginPath();x.roundRect(a*k,b*k,w*k,h*k,r*k);x.fill()},el=(a,b,rx,ry,col)=>{x.fillStyle=col;x.beginPath();x.ellipse(a*k,b*k,rx*k,ry*k,0,0,Math.PI*2);x.fill()},path=(pts,col)=>{x.fillStyle=col;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0]*k,p[1]*k):x.moveTo(p[0]*k,p[1]*k));x.closePath();x.fill()},stroke=(a,b,c,d,w,col)=>{x.strokeStyle=col;x.lineWidth=w*k;x.lineCap='round';x.beginPath();x.moveTo(a*k,b*k);x.lineTo(c*k,d*k);x.stroke()};

el(384,713,140,24,'#00000028');

path([[402,548],[475,548],[491,649],[520,700],[451,708],[420,643]],C.ol);path([[414,560],[465,560],[476,640],[498,685],[455,690],[431,632]],C.p);path([[455,676],[527,676],[559,706],[547,724],[456,724],[435,703]],C.sh);rr(465,689,72,18,8,C.so);
// front leg
path([[292,548],[380,548],[365,646],[340,701],[257,708],[286,642]],C.ol);path([[306,560],[365,560],[351,636],[326,684],[278,690],[299,632]],C.pm);path([[252,676],[332,676],[365,706],[347,724],[248,724],[230,703]],C.sh);rr(259,689,76,18,8,C.so);
// torso silhouette
path([[264,336],[489,336],[535,392],[519,552],[466,589],[302,589],[244,549],[228,390]],C.ol);path([[278,348],[476,348],[512,400],[500,536],[455,570],[313,570],[261,535],[247,400]],C.b);path([[290,353],[363,353],[344,536],[306,559],[273,527],[264,401]],C.bh);path([[373,350],[433,350],[422,522],[394,548],[366,518]],C.wh);stroke(379,359,379,527,8,C.bd);

path([[244,157],[279,107],[318,104],[297,184],[263,210]],C.hd);path([[302,129],[348,82],[378,100],[347,184]],C.hm);path([[365,112],[408,79],[444,104],[409,173]],C.h);path([[430,123],[474,97],[500,132],[462,185]],C.hd);

rr(291,223,32,52,11,C.eye);rr(439,223,32,52,11,C.eye);rr(297,228,10,15,5,C.wh);rr(445,228,10,15,5,C.wh);rr(301,250,16,17,6,'#3c2a22');rr(449,250,16,17,6,'#3c2a22');
// nose / blush / mouth
path([[384,260],[374,282],[391,282]],C.ss);el(278,286,31,11,'#e3987f66');el(489,286,31,11,'#e3987f66');stroke(356,310,409,310,9,C.mouth);stroke(364,313,385,322,6,C.mouth);

path([[284,388],[314,359],[330,370],[315,455],[287,467]],C.bh);path([[493,394],[516,409],[529,451],[515,470],[499,430]],C.bm);
return c}
function raster(res){const src=base(res),out=document.createElement('canvas');out.width=out.height=192;const x=out.getContext('2d');x.imageSmoothingEnabled=true;x.drawImage(src,0,0,192,192);return out}
const items=[[192,'1×','基準'],[384,'2×','輪郭・髪束・表情の分解能を増加'],[512,'2.67×','顔・髪・服の小さな形状差を保持'],[768,'4×','最も細かいマスター。48px換算で1表示px=16×16内部セル相当']];const g=document.getElementById('grid');for(const [r,memo,desc] of items){const s=document.createElement('section');s.className='card';const h=document.createElement('h2');h.textContent=`${r}×${r} native`;const st=document.createElement('div');st.className='stage';st.appendChild(raster(r));const p=document.createElement('div');p.className='meta';p.innerHTML=`<span class="badge">${memo}</span><span class="badge">最終192px</span><br>${desc}`;s.append(h,st,p);g.appendChild(s)}
</script></body></html>
