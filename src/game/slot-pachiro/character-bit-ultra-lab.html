function render(mode){const src=master(),out=document.createElement('canvas');out.width=out.height=mode==='native'?768:192;const x=out.getContext('2d');if(mode==='native'){x.drawImage(src,0,0);return out}if(mode==='pixel'){const low=document.createElement('canvas');low.width=low.height=48;const l=low.getContext('2d');l.imageSmoothingEnabled=true;l.drawImage(src,0,0,48,48);x.imageSmoothingEnabled=false;x.drawImage(low,0,0,48,48,0,0,192,192);return out}x.imageSmoothingEnabled=true;x.drawImage(src,0,0,192,192);return out}
