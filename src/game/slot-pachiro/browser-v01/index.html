<body><main id="app"><div id="game"></div><div class="hud"><div><strong>パチ朗</strong> 店舗基盤 v0.1</div><div>□グリッド / 疑似斜め見下ろし / 4島120台</div></div><div class="mobile-pad" aria-label="移動操作"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><button id="action-button" class="action-button" aria-label="決定">決定</button><section id="reel-panel" class="reel-panel" hidden style="display:none!important" aria-label="遊技パネル"><div id="reel-machine-name" class="reel-machine-name">---</div><button id="launch-pekachu" class="launch-machine-button" type="button">⚡ ペカチュウで遊技</button><div class="reels"><div id="reel-0" class="reel">7</div><div id="reel-1" class="reel">BAR</div><div id="reel-2" class="reel">🍒</div></div></section><section id="machine-launcher" class="machine-launcher" hidden><div class="machine-launcher-bar"><div id="machine-launcher-title" class="machine-launcher-title">ZELVOLT</div><button id="close-machine-launcher" class="close-machine-launcher" type="button">ホールへ戻る</button></div><div id="mega10-host" aria-label="MEGA10 データカウンター"></div><iframe id="machine-frame" class="machine-frame" title="ZELVOLT" loading="eager" style="opacity:0;visibility:hidden"></iframe></section></main><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script type="module" src="./main.js?v=20260910-machine-event1"></script>
<script>(()=>{const ID='I01-L01',launcher=document.getElementById('machine-launcher'),frame=document.getElementById('machine-frame'),closeBtn=document.getElementById('close-machine-launcher'),title=document.getElementById('machine-launcher-title'),machineUrl='../machines/pekachu/index.html';let session=null,hallCredit=50,frameReady=false,styledReady=false;window.__pachiroHallCredit=hallCredit;const getScene=()=>window.__pachiroScene||window.Phaser?.GAMES?.[0]?.scene?.scenes?.find?.(s=>s?.scene?.key==='main')||null;const sync=c=>{c=Number(c);if(!Number.isFinite(c))return;hallCredit=Math.max(0,c);window.__pachiroHallCredit=hallCredit;const s=getScene();if(s)s.playerMedals=hallCredit};const concealFrame=()=>{frame.style.opacity='0';frame.style.visibility='hidden'};const revealFrame=()=>{if(!session||!styledReady)return;requestAnimationFrame(()=>requestAnimationFrame(()=>{frame.style.visibility='visible';frame.style.opacity='1'}))};const sendInit=()=>{if(!session||session.initialized||!frameReady)return;session.initialized=true;frame.contentWindow?.postMessage({source:'pachiro',type:'init',machineId:session.machineId,credit:session.startCredit},location.origin)};const prepareFrame=()=>{frameReady=false;styledReady=false;concealFrame();frame.src=`${machineUrl}?from=pachiro&machine=${encodeURIComponent(ID)}&bridge=13&build=zelvolt-native-reel2&t=${Date.now()}`};window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.source!=='pekachu')return;if(e.data.type==='ready'){frameReady=true;sendInit();return}if(!session)return;const c=Number(e.data.credit);if(Number.isFinite(c)){session.credit=c;sync(c)}session.games=Number(e.data.totalGames)||0;session.bonuses=Number(e.data.bonusCount)||0;if(e.data.result)session.lastResult=e.data.result});frame.addEventListener('load',()=>{try{if(!frame.contentWindow||frame.contentWindow.location.href==='about:blank')return;const d=frame.contentDocument;if(!d)return;const finish=()=>{styledReady=true;revealFrame()};const old=d.getElementById('zelvolt-cabinet-style');if(old){finish();return}const l=d.createElement('link');l.id='zelvolt-cabinet-style';l.rel='stylesheet';l.href='https://mth310-sys.github.io/Chappy5/src/game/slot-pachiro/machines/pekachu/zelvolt_cabinet.css?v=20260911-7';l.addEventListener('load',finish,{once:true});l.addEventListener('error',()=>{console.warn('ZELVOLT cabinet CSS failed');styledReady=false},{once:true});d.head.appendChild(l)}catch(e){console.warn('ZELVOLT preload',e);styledReady=false}});const apply=()=>{if(!session||session.applied)return;const final=Number.isFinite(session.credit)?session.credit:session.startCredit;sync(final);const s=getScene(),m=s?.seatedMachine;if(s&&m&&m.machineId===session.machineId){const delta=final-session.startCredit;m.credit=final;m.totalGames+=session.games;m.bonusCount+=session.bonuses;m.differenceCoins+=delta}s&&(s.lastPlayResult=`ZELVOLT ${session.games}G`);session.applied=true};const open=id=>{if(id!==ID||session)return;const s=getScene();if(s&&Number.isFinite(Number(s.playerMedals))&&hallCredit===50)hallCredit=Math.max(0,Number(s.playerMedals));const startCredit=hallCredit;session={machineId:id,startCredit,credit:startCredit,games:0,bonuses:0,applied:false,initialized:false};title.textContent=`${id} / ZELVOLT`;launcher.hidden=false;document.body.classList.add('machine-open');sendInit();revealFrame()};const close=()=>{apply();concealFrame();launcher.hidden=true;document.body.classList.remove('machine-open');session=null;prepareFrame()};window.addEventListener('pachiro:machine-seated',e=>{if(e.detail?.machineId===ID&&e.detail?.modelId==='pekachu')open(e.detail.machineId)});setInterval(()=>{const s=getScene(),c=Number(window.__pachiroHallCredit);if(s&&Number.isFinite(c)&&s.playerMedals!==c)s.playerMedals=c},100);closeBtn?.addEventListener('pointerdown',e=>{e.preventDefault();close()});prepareFrame()})();</script><script src="./zelvolt-structure.js?v=3"></script><script src="./zelvolt-notice.js?v=1"></script><script src="./mega10-counter.js?v=3"></script></body></html>
