<!doctype html>
<html lang="ja">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" /><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /><meta http-equiv="Pragma" content="no-cache" /><meta http-equiv="Expires" content="0" /><title>パチ朗 - 店舗基盤 v0.1</title><link rel="stylesheet" href="./style.css?v=20260909-pekachu2" /></head>
<body><main id="app"><div id="game"></div><div class="hud"><div><strong>パチ朗</strong> 店舗基盤 v0.1</div><div>□グリッド / 疑似斜め見下ろし / 4島120台</div></div><div class="mobile-pad" aria-label="移動操作"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div><button id="action-button" class="action-button" aria-label="決定">決定</button><section id="reel-panel" class="reel-panel" hidden aria-label="遊技パネル"><div id="reel-machine-name" class="reel-machine-name">---</div><button id="launch-pekachu" class="launch-machine-button" type="button">⚡ ペカチュウで遊技</button><div class="reels" aria-label="リール"><div id="reel-0" class="reel">7</div><div id="reel-1" class="reel">BAR</div><div id="reel-2" class="reel">🍒</div></div><div class="reel-controls"><button id="play-button" class="play-button" aria-label="スタート">START</button><button class="stop-button" data-reel="0">STOP</button><button class="stop-button" data-reel="1">STOP</button><button class="stop-button" data-reel="2">STOP</button></div></section><section id="machine-launcher" class="machine-launcher" hidden aria-label="ペカチュウ遊技画面"><div class="machine-launcher-bar"><div id="machine-launcher-title" class="machine-launcher-title">ペカチュウ</div><button id="close-machine-launcher" class="close-machine-launcher" type="button">ホールへ戻る</button></div><iframe id="machine-frame" class="machine-frame" title="ペカチュウ Ver.0.6.2" loading="lazy"></iframe></section></main><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script type="module" src="./main.js?v=20260909-pekachu2"></script>
<script>(()=>{const launcher=document.getElementById('machine-launcher'),frame=document.getElementById('machine-frame'),openBtn=document.getElementById('launch-pekachu'),closeBtn=document.getElementById('close-machine-launcher'),title=document.getElementById('machine-launcher-title'),machineName=document.getElementById('reel-machine-name'),machineUrl='../machines/pekachu/index.html';let session=null;const getScene=()=>window.Phaser?.GAMES?.[0]?.scene?.getScene('main')||null;const getMachineId=()=>((machineName?.textContent||'').trim().split(' / ')[0]||'UNKNOWN');
const applyState=data=>{if(!session||data.machineId!==session.machineId)return;session.credit=Number(data.credit);session.games=Number(data.totalGames)||0;session.bonuses=Number(data.bonusCount)||0;if(data.result)session.lastResult=data.result};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.source!=='pekachu'||!session)return;applyState(e.data);if(e.data.type==='ready'){const scene=getScene();frame.contentWindow.postMessage({source:'pachiro',type:'init',machineId:session.machineId,credit:Math.max(0,Number(scene?.playerMedals)||0)},location.origin)}});
const applySession=()=>{if(!session||session.applied)return;const scene=getScene(),machine=scene?.seatedMachine;if(!scene||!machine||machine.machineId!==session.machineId)return;const finalCredit=Number.isFinite(session.credit)?session.credit:session.startCredit;const delta=finalCredit-session.startCredit;scene.playerMedals=finalCredit;machine.totalGames+=session.games;machine.bonusCount+=session.bonuses;machine.differenceCoins+=delta;const sign=delta>=0?'+':'';scene.lastPlayResult=`ペカチュウ ${session.games}G / 差枚${sign}${delta}${session.lastResult?` / ${session.lastResult}`:''}`;session.applied=true};
const openMachine=()=>{const scene=getScene(),machineId=getMachineId(),startCredit=Math.max(0,Number(scene?.playerMedals)||0);session={machineId,startCredit,credit:startCredit,games:0,bonuses:0,lastResult:'',applied:false};title.textContent=`${machineId} / ペカチュウ Ver.0.6.2`;frame.src=`${machineUrl}?from=pachiro&machine=${encodeURIComponent(machineId)}&bridge=2&t=${Date.now()}`;launcher.hidden=false;document.body.classList.add('machine-open')};const closeMachine=()=>{applySession();launcher.hidden=true;frame.src='about:blank';document.body.classList.remove('machine-open');session=null};openBtn?.addEventListener('pointerdown',e=>{e.preventDefault();openMachine()});closeBtn?.addEventListener('pointerdown',e=>{e.preventDefault();closeMachine()});document.addEventListener('contextmenu',e=>{if(e.target.closest('.machine-launcher,.launch-machine-button'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('.machine-launcher,.launch-machine-button'))e.preventDefault()})})();</script></body></html>
