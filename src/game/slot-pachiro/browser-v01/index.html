<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>パチ朗 - 店舗基盤 v0.1</title>
  <link rel="stylesheet" href="./style.css?v=20260909-pekachu1" />
</head>
<body>
  <main id="app">
    <div id="game"></div>
    <div class="hud">
      <div><strong>パチ朗</strong> 店舗基盤 v0.1</div>
      <div>□グリッド / 疑似斜め見下ろし / 4島120台</div>
    </div>
    <div class="mobile-pad" aria-label="移動操作">
      <button data-dir="up">▲</button>
      <div>
        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>
    </div>
    <button id="action-button" class="action-button" aria-label="決定">決定</button>
    <section id="reel-panel" class="reel-panel" hidden aria-label="遊技パネル">
      <div id="reel-machine-name" class="reel-machine-name">---</div>
      <button id="launch-pekachu" class="launch-machine-button" type="button">⚡ ペカチュウで遊技</button>
      <div class="reels" aria-label="リール">
        <div id="reel-0" class="reel">7</div>
        <div id="reel-1" class="reel">BAR</div>
        <div id="reel-2" class="reel">🍒</div>
      </div>
      <div class="reel-controls">
        <button id="play-button" class="play-button" aria-label="スタート">START</button>
        <button class="stop-button" data-reel="0" aria-label="左リール停止">STOP</button>
        <button class="stop-button" data-reel="1" aria-label="中リール停止">STOP</button>
        <button class="stop-button" data-reel="2" aria-label="右リール停止">STOP</button>
      </div>
    </section>

    <section id="machine-launcher" class="machine-launcher" hidden aria-label="ペカチュウ遊技画面">
      <div class="machine-launcher-bar">
        <div id="machine-launcher-title" class="machine-launcher-title">ペカチュウ</div>
        <button id="close-machine-launcher" class="close-machine-launcher" type="button">ホールへ戻る</button>
      </div>
      <iframe id="machine-frame" class="machine-frame" title="ペカチュウ Ver.0.6.2" loading="lazy"></iframe>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./main.js?v=20260909-reel1"></script>
  <script>
    (()=>{
      const launcher=document.getElementById('machine-launcher');
      const frame=document.getElementById('machine-frame');
      const openBtn=document.getElementById('launch-pekachu');
      const closeBtn=document.getElementById('close-machine-launcher');
      const title=document.getElementById('machine-launcher-title');
      const machineName=document.getElementById('reel-machine-name');
      const machineUrl='../machines/pekachu/index.html';
      let session=null;

      const getScene=()=>window.Phaser?.GAMES?.[0]?.scene?.getScene('main')||null;
      const getMachineId=()=>{
        const text=(machineName?.textContent||'').trim();
        return text.split(' / ')[0]||'UNKNOWN';
      };
      const readCredit=()=>{
        const n=Number(frame.contentDocument?.getElementById('credit')?.textContent);
        return Number.isFinite(n)?n:null;
      };
      const readMessage=()=>frame.contentDocument?.getElementById('msg')?.textContent?.trim()||'';
      const classifyBonus=text=>/SUPER BIG|BIG BONUS|雷BONUS/.test(text);

      const finalizeSpin=()=>{
        if(!session?.spinActive)return;
        const doc=frame.contentDocument;
        if(!doc)return;
        const stops=[...doc.querySelectorAll('.stop')];
        if(stops.length!==3||stops.some(b=>!b.disabled))return;
        session.spinActive=false;
        session.games+=1;
        const result=readMessage();
        if(classifyBonus(result))session.bonuses+=1;
        session.lastResult=result||'遊技終了';
      };

      const bindPekachu=()=>{
        if(!session)return;
        const doc=frame.contentDocument;
        const win=frame.contentWindow;
        const scene=getScene();
        if(!doc||!win||!scene)return;

        const hallCredit=Math.max(0,Number(scene.playerMedals)||0);
        session.hallCreditBefore=hallCredit;
        session.syncedCredit=false;
        try{
          win.eval(`credit=${hallCredit};bet=0;pay=0;update();`);
          session.syncedCredit=readCredit()===hallCredit;
        }catch(_){session.syncedCredit=false}
        session.baseCredit=readCredit()??50;

        const startBtn=doc.getElementById('startBtn');
        const stopBtns=[...doc.querySelectorAll('.stop')];
        startBtn?.addEventListener('click',()=>setTimeout(()=>{
          if(stopBtns.some(b=>!b.disabled))session.spinActive=true;
        },0));
        stopBtns.forEach(btn=>btn.addEventListener('click',()=>setTimeout(()=>{
          if(stopBtns.every(b=>b.disabled))setTimeout(finalizeSpin,1050);
        },0)));
      };

      const applySession=()=>{
        if(!session||session.applied)return;
        finalizeSpin();
        const scene=getScene();
        const machine=scene?.seatedMachine;
        if(!scene||!machine||machine.machineId!==session.machineId)return;

        const finalCredit=readCredit();
        const base=session.baseCredit??50;
        const delta=finalCredit==null?0:finalCredit-base;
        if(finalCredit!=null){
          scene.playerMedals=session.syncedCredit?finalCredit:Math.max(0,(session.hallCreditBefore??scene.playerMedals)+delta);
        }
        machine.totalGames+=session.games;
        machine.bonusCount+=session.bonuses;
        machine.differenceCoins+=delta;
        const sign=delta>=0?'+':'';
        scene.lastPlayResult=`ペカチュウ ${session.games}G / 差枚${sign}${delta}${session.lastResult?` / ${session.lastResult}`:''}`;
        session.applied=true;
      };

      const openMachine=()=>{
        const machineId=getMachineId();
        session={machineId,games:0,bonuses:0,spinActive:false,lastResult:'',applied:false,baseCredit:null,hallCreditBefore:null,syncedCredit:false};
        title.textContent=`${machineId} / ペカチュウ Ver.0.6.2`;
        frame.src=`${machineUrl}?from=pachiro&machine=${encodeURIComponent(machineId)}&t=${Date.now()}`;
        launcher.hidden=false;
        document.body.classList.add('machine-open');
      };

      const closeMachine=()=>{
        applySession();
        launcher.hidden=true;
        frame.src='about:blank';
        document.body.classList.remove('machine-open');
        session=null;
      };

      frame.addEventListener('load',()=>{
        if(!session||frame.src==='about:blank')return;
        bindPekachu();
      });
      openBtn?.addEventListener('pointerdown',e=>{e.preventDefault();openMachine()});
      closeBtn?.addEventListener('pointerdown',e=>{e.preventDefault();closeMachine()});
      document.addEventListener('contextmenu',e=>{if(e.target.closest('.machine-launcher,.launch-machine-button'))e.preventDefault()});
      document.addEventListener('selectstart',e=>{if(e.target.closest('.machine-launcher,.launch-machine-button'))e.preventDefault()});
    })();
  </script>
</body>
</html>
