<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / START HALL</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>FOUNDATION / STEP 10</small><h1>START HALL</h1></div><output>6 FIXTURES</output></header><section class="preview"><svg id="hall" class="iso" viewBox="48 52 264 256" aria-label="9×9 startup hall with six slot fixtures and central aisles"></svg></section><section class="note"><b>GAMECENTER DENSITY PASS 01</b><span>9×9 / 6 fixtures / 2-row central aisle / entrance route / startup camera 100%</span></section></main><script type="module">import{GRID}from'./core/grid.js';import{SLOT_FIXTURE}from'./core/slot-fixture.js';const svg=document.querySelector('#hall'),NS='http://www.w3.org/2000/svg';const WALL_H=100/64,u=v=>v/SLOT_FIXTURE.cell;const raw=(x,y,z=0)=>({x:GRID.originX+(x-y)*GRID.halfW,y:GRID.originY+(x+y)*GRID.halfH-z*GRID.tileH});const corners=[raw(0,0,WALL_H),raw(9,0,WALL_H),raw(0,9,WALL_H),raw(9,9),raw(0,0),raw(9,0),raw(0,9)];const minX=Math.min(...corners.map(v=>v.x)),maxX=Math.max(...corners.map(v=>v.x)),minY=Math.min(...corners.map(v=>v.y)),maxY=Math.max(...corners.map(v=>v.y));const pad=14,scale=Math.min((360-pad*2)/(maxX-minX),(360-pad*2)/(maxY-minY));const p=(x,y,z=0)=>{const q=raw(x,y,z);return{x:pad+(q.x-minX)*scale,y:pad+(q.y-minY)*scale}};const poly=(pts,cls)=>{const e=document.createElementNS(NS,'polygon');e.setAttribute('points',pts.map(v=>`${v.x},${v.y}`).join(' '));e.setAttribute('class',cls);svg.appendChild(e);return e};const line=(a,b,cls)=>{const e=document.createElementNS(NS,'line');e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y);e.setAttribute('class',cls);svg.appendChild(e)};const prism=(x0,y0,x1,y1,z0,z1,base)=>{poly([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],`${base} top`);poly([p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)],`${base} front`);poly([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],`${base} side`)};const fixtureCells=new Set(['2,2','3,2','4,2','4,5','5,5','6,5']);const aisleCells=new Set();for(let x=1;x<=7;x++){aisleCells.add(`${x},3`);aisleCells.add(`${x},4`)}for(let y=4;y<=8;y++)aisleCells.add(`4,${y}`);for(let y=0;y<9;y++)for(let x=0;x<9;x++){let cls=`gridCell c${(x+y)&1}`;if(aisleCells.has(`${x},${y}`))cls+=' aisleCell';if(fixtureCells.has(`${x},${y}`))cls+=' fixtureCell';if(x===4&&y===8)cls+=' entranceCell';poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],cls)}for(let x=0;x<9;x++)poly([p(x,0),p(x+1,0),p(x+1,0,WALL_H),p(x,0,WALL_H)],'roomWall wallA');for(let y=0;y<9;y++)poly([p(0,y),p(0,y+1),p(0,y+1,WALL_H),p(0,y,WALL_H)],'roomWall wallB');const shelfDepth=u(SLOT_FIXTURE.shelf.depth),frame=u(SLOT_FIXTURE.shelf.frameThickness),baseH=u(SLOT_FIXTURE.shelf.baseHeight),machineDepth=u(SLOT_FIXTURE.machineSand.depth),machineH=u(SLOT_FIXTURE.machineSand.height),graphDepth=u(SLOT_FIXTURE.slumpGraph.depth),graphH=u(SLOT_FIXTURE.slumpGraph.height),machineW=u(SLOT_FIXTURE.machineSand.machineWidth),machineTop=baseH+machineH,fixtureTop=machineTop+graphH;function drawFixture(x,y){prism(x,y,x+1,y+shelfDepth,0,baseH,'shelfBody');prism(x,y,x+1,y+frame,baseH,machineTop,'shelfBack');prism(x,y,x+frame,y+shelfDepth,baseH,machineTop,'shelfLeft');prism(x+1-frame,y,x+1,y+shelfDepth,baseH,machineTop,'shelfRight');prism(x,y,x+1,y+shelfDepth,machineTop-frame,machineTop,'shelfTop');prism(x,y,x+machineW,y+machineDepth,baseH,machineTop,'machineBody');prism(x+machineW,y,x+1,y+machineDepth,baseH,machineTop,'sideUnitBody');const payY=y+machineDepth+.006,payZ0=baseH+u(8),payZ1=baseH+u(16);poly([p(x+.24,payY,payZ0),p(x+.70,payY,payZ0),p(x+.70,payY,payZ1),p(x+.24,payY,payZ1)],'payout');const reelZ0=baseH+u(23),reelZ1=baseH+u(39);poly([p(x+.12,payY,reelZ0),p(x+.74,payY,reelZ0),p(x+.74,payY,reelZ1),p(x+.12,payY,reelZ1)],'reelWindow');for(const dx of [.25,.43,.61])line(p(x+dx,payY+.001,reelZ0),p(x+dx,payY+.001,reelZ1),'reelDivider');poly([p(x+.18,payY,baseH+u(18)),p(x+.68,payY,baseH+u(18)),p(x+.68,payY,baseH+u(22)),p(x+.18,payY,baseH+u(22))],'controlDeck');prism(x+.08,y,x+.84,y+graphDepth,machineTop,fixtureTop,'graphBody');const gy=y+graphDepth+.006,g0=machineTop+u(2),g1=fixtureTop-u(2);poly([p(x+.14,gy,g0),p(x+.78,gy,g0),p(x+.78,gy,g1),p(x+.14,gy,g1)],'graphScreen');line(p(x+.18,gy+.001,g0+u(2)),p(x+.32,gy+.001,g0+u(4)),'graphLine');line(p(x+.32,gy+.001,g0+u(4)),p(x+.48,gy+.001,g0+u(3)),'graphLine');line(p(x+.48,gy+.001,g0+u(3)),p(x+.66,gy+.001,g0+u(6)),'graphLine');const sy=y+machineDepth+u(30),cx=x+.5,r=u(SLOT_FIXTURE.stool.diameter)/2,seatH=u(SLOT_FIXTURE.stool.height),ellipse=document.createElementNS(NS,'ellipse'),sc=p(cx,sy,seatH);ellipse.setAttribute('cx',sc.x);ellipse.setAttribute('cy',sc.y);ellipse.setAttribute('rx',r*GRID.tileW*scale);ellipse.setAttribute('ry',r*GRID.tileH*scale);ellipse.setAttribute('class','stoolSeat');svg.appendChild(ellipse);line(p(cx-r*.55,sy,seatH*.85),p(cx-r*.55,sy,0),'stoolLeg');line(p(cx+r*.55,sy,seatH*.85),p(cx+r*.55,sy,0),'stoolLeg')}[[2,2],[3,2],[4,2],[4,5],[5,5],[6,5]].forEach(([x,y])=>drawFixture(x,y));poly([p(0,0),p(9,0),p(9,9),p(0,9)],'gridOutline');</script><style>.aisleCell{fill:#f1e5c7}.fixtureCell{fill:#d9ef9d}.entranceCell{fill:#a9ddf0;stroke:#2b738d;stroke-width:2}</style></body></html>
