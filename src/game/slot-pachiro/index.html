<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗</title><style>*{box-sizing:border-box}body{margin:0;background:#171b1c;color:#172025;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;user-select:none}.game{width:100%;max-width:430px;min-height:100vh;margin:auto;background:#d8e4c5;overflow:hidden}.top{height:58px;padding:6px 9px;background:#f3e8bd;border-bottom:3px solid #6b5940;display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:5px}.panel{background:#fff8d8;border:2px solid #806d4d;border-radius:7px;padding:3px 6px;font-size:10px;box-shadow:inset 0 -3px #ead79f}.panel b{display:block;font-size:14px}.hall{position:relative;height:550px;overflow:hidden;background:linear-gradient(#bed2aa,#d9d1aa)}.floor{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 43px,#84966f45 44px,#84966f45 45px),repeating-linear-gradient(90deg,transparent 0 43px,#84966f45 44px,#84966f45 45px)}.wall{position:absolute;left:0;right:0;top:0;height:48px;background:#d5c89c;border-bottom:4px solid #77684d}.counter{position:absolute;right:18px;top:18px;width:104px;height:48px;background:#b88654;border:3px solid #65482e;border-radius:4px;text-align:center;padding-top:13px;font-size:10px;font-weight:700}.island{position:absolute;left:27px;width:348px;height:112px;background:#464b49;border:3px solid #282b2a;border-radius:5px;box-shadow:0 8px 0 #0002}.a{top:115px}.b{top:302px}.machines{display:grid;grid-template-columns:repeat(9,1fr);height:79px;padding:5px 3px 0}.machine{position:relative;margin:0 1px;background:#171b1c;border:2px solid #626967;border-radius:2px}.machine:before{content:"";position:absolute;left:4px;right:4px;top:7px;height:27px;background:#26363a;border:2px solid #889492}.machine:after{content:"";position:absolute;left:5px;right:5px;bottom:7px;height:20px;background:#702c27;border-top:3px solid #d3a34d}.sand{position:absolute;right:-3px;top:8px;width:4px;height:61px;background:#c5c9bd;z-index:2}.base{height:27px;margin:0 4px;background:#292e2d;border-top:4px solid #7c8581}.tag{position:absolute;left:5px;bottom:3px;color:#f7e6a5;font-size:9px;font-weight:700}.person{position:absolute;width:22px;height:28px;border-radius:9px 9px 5px 5px;background:#467aa0;border:2px solid #253b48;z-index:4}.person:before{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#e8c49d;left:2px;top:-11px;border:2px solid #6c4b37}.p1{left:94px;top:247px}.p2{left:256px;top:250px;background:#b85b55}.p3{left:173px;top:435px;background:#659552}.entrance{position:absolute;left:128px;bottom:10px;width:145px;height:42px;background:#d8e7e6;border:3px solid #627978;border-radius:4px;text-align:center;padding-top:11px;font-size:10px;font-weight:800}.bubble{position:absolute;left:65px;top:78px;background:white;border:2px solid #6c725f;border-radius:12px;padding:5px 9px;font-size:10px;box-shadow:0 2px #0002}.bottom{height:112px;background:#eee0ad;border-top:3px solid #705e40;padding:7px}.status{display:flex;gap:5px;margin-bottom:6px}.status div{flex:1;background:#fff8d9;border:2px solid #8b7652;border-radius:6px;text-align:center;padding:4px;font-size:10px}.menu{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.btn{height:55px;border:2px solid #66563e;border-radius:8px;background:linear-gradient(#fff3bf,#d9bd72);font-weight:800;font-size:11px;box-shadow:0 3px #7e6844;display:grid;place-items:center;text-align:center}.btn:active{transform:translateY(2px);box-shadow:0 1px #7e6844}</style></head><body><main class="game"><header class="top"><div class="panel">所持金<b>¥3,000,000</b></div><div class="panel">1年目 4月<b>1日 10:00</b></div><div class="panel">ホール人気<b>★ 12</b></div></header><section class="hall"><div class="floor"></div><div class="wall"></div><div class="counter">景品カウンター</div><div class="bubble">新装開店！</div><div class="island a"><div class="machines" id="m1"></div><div class="base"></div><span class="tag">A島</span></div><div class="person p1"></div><div class="person p2"></div><div class="island b"><div class="machines" id="m2"></div><div class="base"></div><span class="tag">B島</span></div><div class="person p3"></div><div class="entrance">入口</div></section><footer class="bottom"><div class="status"><div>本日の売上<br><b>¥0</b></div><div>来店客<br><b>3人</b></div><div>稼働率<br><b>17%</b></div></div><nav class="menu"><button class="btn">建設</button><button class="btn">台入替</button><button class="btn">経営</button><button class="btn">情報</button><button class="btn">メニュー</button></nav></footer></main><script>const machine='<div class="machine"><i class="sand"></i></div>';m1.innerHTML=machine.repeat(9);m2.innerHTML=machine.repeat(9);</script></body></html>
