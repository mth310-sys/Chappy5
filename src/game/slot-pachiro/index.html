<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>スロットパチ朗 / 箱庭基盤22</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./island-canonical.css">
  <link rel="stylesheet" href="./interior.css">
  <link rel="stylesheet" href="./responsive-fit.css">
  <link rel="stylesheet" href="./foundation-debug.css">
</head>
<body>
  <main class="game">
    <header class="hud">
      <div class="h"><small>1年目 4月 1週</small><b>10:20　晴れ</b></div>
      <div class="h"><small>ホール人気 / 来店</small><b>★13　48人</b></div>
      <div class="h money"><small>所持金</small><b>3,226,400G</b></div>
    </header>
    <div class="sub">
      <span>稼働 55%</span>
      <span>本日 +226,400G</span>
      <span id="foundation-status">FOUNDATION CHECK</span>
    </div>
    <div class="viewport" id="vp" data-playtest-scroll>
      <div class="sceneFrame" id="scene-frame">
        <div class="scene" id="scene">
          <div class="lot"></div>
          <div class="floor"></div>
          <div class="road"></div>
        </div>
      </div>
    </div>
    <footer class="bottom">
      <button class="sidebtn">情報</button>
      <div class="menu">
        <button>建設</button><button>台入替</button><button>経営</button>
        <button>広告</button><button>研究</button><button>客層</button>
      </div>
      <button class="sidebtn">メニュー</button>
    </footer>
  </main>
  <script type="module" src="./core/main.js"></script>
</body>
</html>
