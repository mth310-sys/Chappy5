ader><div class="viewport" id="vp" data-playtest-scroll><div class="scene"><div class="floor"></div><div class="backwall"></div><div class="counterdesk">景品カウンター</div><div class="island i1"><div class="topline"></div><div class="front" id="front1"></div><div class="label">島 A / 18台</div></div><div class="aisle">MAIN AISLE</div><div class="island i2"><div class="topline"></div><div class="front" id="front2"></div><div class="label">島 B / 18台</div></div><div class="entrance">ENTRANCE / 入口</div></div></div><nav class="bottom"><button class="btn">建設</button><button class="btn">台入替</button><button class="btn">経営</button><button class="btn">情報</button><button class="btn">メニュー</button></nav></main><script>const bay='<div class="bay"><div class="header"></div><div class="data"></div><div class="mount"></div><div class="rail"></div><div class="sand"></div><div class="counter"></div><div class="fascia"></div></div>';for(const id of ['front1','front2'])document.getElementById(id).innerHTML=bay.repeat(9);addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(1260-v.clientWidth)/2;v.scrollTop=20})</script></body></html>
