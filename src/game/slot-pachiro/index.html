<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 本編</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0e10;color:#edf3f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.game{min-height:100vh}.hud{height:62px;padding:6px 8px;background:#101719;border-bottom:2px solid #3c4a51;display:flex;gap:6px;position:sticky;top:0;z-index:20}.hudbox{min-width:105px;flex:1;background:#172124;border:1px solid #536167;border-radius:6px;padding:4px 7px;font-size:10px;color:#aebdc3}.hudbox b{display:block;color:#edf3f5;font-size:14px;margin-top:2px}.viewport{height:calc(100vh - 136px);overflow:auto;background:#111719;-webkit-overflow-scrolling:touch}.scene{position:relative;width:1260px;height:940px;background:linear-gradient(#283234 0 68px,#202829 68px 100%);image-rendering:pixelated}.floor{position:absolute;left:60px;right:60px;top:70px;bottom:40px;background:repeating-linear-gradient(0deg,#262f30 0 59px,#344042 60px),repeating-linear-gradient(90deg,transparent 0 59px,#344042 60px);border:3px solid #101516}.backwall{position:absolute;left:180px;top:74px;width:900px;height:54px;background:#3a4648;border:3px solid #111719;box-shadow:0 6px 0 #151b1c}.counterdesk{position:absolute;right:205px;top:83px;width:190px;height:38px;background:#6b5f50;border:3px solid #1d1915;display:grid;place-items:center;color:#f1e6d7;font-size:11px;box-shadow:0 5px 0 #211d18}.island{position:absolute;left:50%;width:1000px;margin-left:-500px;height:205px}.i1{top:185px}.i2{top:545px}.topline{position:absolute;left:18px;top:0;width:964px;height:18px;background:#596568;border:3px solid #121718;border-bottom:0}.front{position:absolute;left:0;top:15px;width:1000px;height:180px;background:#121718;border:3px solid #070a0b;display:flex;overflow:hidden;box-shadow:0 9px 0 #0a0d0e}.bay{position:relative;width:111.111px;height:177px;flex:0 0 111.111px;border-right:2px solid ader><div class="viewport" id="vp" data-playtest-scroll><div class="scene"><div class="floor"></div><div class="backwall"></div><div class="counterdesk">景品カウンター</div><div class="island i1"><div class="topline"></div><div class="front" id="front1"></div><div class="label">島 A / 18台</div></div><div class="aisle">MAIN AISLE</div><div class="island i2"><div class="topline"></div><div class="front" id="front2"></div><div class="label">島 B / 18台</div></div><div class="entrance">ENTRANCE / 入口</div></div></div><nav class="bottom"><button class="btn">建設</button><button class="btn">台入替</button><button class="btn">経営</button><button class="btn">情報</button><button class="btn">メニュー</button></nav></main><script>const bay='<div class="bay"><div class="header"></div><div class="data"></div><div class="mount"></div><div class="rail"></div><div class="sand"></div><div class="counter"></div><div class="fascia"></div></div>';for(const id of ['front1','front2'])document.getElementById(id).innerHTML=bay.repeat(9);addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(1260-v.clientWidth)/2;v.scrollTop=20})</script></body></html>
