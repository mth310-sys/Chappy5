<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / オマージュ試作</title><style>*{box-sizing:border-box}html,body{margin:0;background:#21162f;font-family:"Courier New",monospace;color:#2c1f25}.game{min-height:100vh;background:#9a7b69}.hud{height:88px;position:sticky;top:0;z-index:20;background:#5a3a2d;border-bottom:4px solid #321f18;display:grid;grid-template-columns:1fr 1.2fr}.date{display:flex;align-items:center;justify-content:center;background:#8e563c;border-right:4px solid #493026;color:#fff3cf;font-weight:900;font-size:20px;text-shadow:2px 2px #4e2e20}.date span{margin:0 6px}.money{display:grid;grid-template-rows:44px 40px}.cash{display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:#ded8e8;border:3px solid #61546d;border-top:0;font-size:20px;font-weight:900;color:#5a4515;text-shadow:1px 1px #fff}.stats{display:grid;grid-template-columns:1fr 1fr;background:#ebe6f2;border-left:3px solid #61546d}.stat{display:flex;align-items:center;justify-content:center;gap:6px;border-right:2px solid #756b82;font-weight:900;color:#173f82}.icon{width:22px;height:22px;border:3px solid #44374f;background:#4ecb65;box-shadow:inset 0 -4px #2c8b3b}.icon.blue{background:#3cc5e7;box-shadow:inset 0 -4px #177d9f}.viewport{height:calc(100vh - 166px);overflow:auto;background:#31213f;-webkit-overflow-scrolling:touch}.scene{position:relative;width:920px;height:1280px;background:#a68170;image-rendering:pixelated}.floor{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 47px,#8b6d61 48px),repeating-linear-gradient(90deg,transparent 0 47px,#8b6d61 48px)}.wall{position:absolute;background:#34223e;border:4px solid #201426;box-shadow:inset 0 0 0 3px #71566f}.w1{left:0;top:0;width:920px;height:42px}.w2{left:0;top:360px;width:250px;height:44px}.w3{right:0;top:690px;width:230px;height:44px}.counterdesk{position:absolute;left:625px;top:58px;width:190px;height:52px;background:#d3a765;border:4px solid #6b4825;box-shadow:0 5px #4b3119,inset 0 0 0 3px #ffe0a3;display:grid;place-items:center;font-weight:900;font-size:13px}.island{position:absolute;width:390px;height:108px}.i1{left:85px;top:160px}.i2{left:455px;top:320px}.i3{left:110px;top:560px}.i4{left:450px;top:780px}.front{position:absolute;inset:0;background:#4f515a;border:4px solid #252631;display:flex;box-shadow:0 7px #302d36,inset 0 0 0 3px #7d8493}.bay{position:relative;width:43px;height:100px;flex:0 0 43px;border-right:2px solid #24242b;background:#606574}.header{position:absolute;left:3px;right:3px;top:4px;height:10px;background:#f5b442;border:2px solid #6d4615}.data{position:absolute;left:11px;top:15px;width:20px;height:13px;background:#1c4e62;border:2px solid #bedbe1}.mount{position:absolute;left:6px;top:29px;width:27px;height:48px;background:#20222c;border:2px solid #9298a8}.mount:after{content:"";position:absolute;left:4px;right:4px;top:8px;height:18px;background:#8c1f2e;border:2px solid #e4b943}.sand{position:absolute;right:1px;top:30px;width:7px;height:45px;background:#a8b3b8;border:2px solid #56636a}.counter{position:absolute;left:2px;right:2px;bottom:13px;height:8px;background:#c69b5d;border-top:2px solid #5e462d}.fascia{position:absolute;left:2px;right:2px;bottom:2px;height:11px;background:#3d2b37}.label{position:absolute;left:6px;top:-24px;background:#fff2b1;border:3px solid #744d27;padding:2px 7px;font-weight:900;font-size:11px;box-shadow:2px 2px #4a2c1d}.person{position:absolute;width:24px;height:28px;background:#4e94d4;border:3px solid #203d5a;box-shadow:0 4px #6e574c}.person:before{content:"";position:absolute;left:4px;top:-13px;width:11px;height:11px;background:#f0c39d;border:3px solid #6a4431}.person:after{content:"";position:absolute;left:-4px;top:10px;width:26px;height:5px;background:#f3d03e;border:2px solid #6b5515}.p1{left:300px;top:285px}.p2{left:540px;top:455px;background:#ca5b66;border-color:#682e35}.p3{left:215px;top:470px;background:#63a55e;border-color:#315b2e}.p4{left:655px;top:655px;background:#c58d42;border-color:#6b4a20}.p5{left:355px;top:900px;background:#8c6ac6;border-color:#49396a}.p6{left:165px;top:760px;background:#4ab5a6;border-color:#23665e}.bubble{position:absolute;background:#fff;border:3px solid #6e5f8a;border-radius:9px;padding:4px 7px;font-weight:900;font-size:12px;color:#4c46c8;box-shadow:2px 2px #6e5f8a}.b1{left:280px;top:245px}.b2{left:515px;top:415px}.entrance{position:absolute;left:340px;bottom:55px;width:240px;height:46px;background:#e5d6f2;border:4px solid #5f4d73;display:grid;place-items:center;font-weight:900;box-shadow:0 5px #4c3d5c}.bottom{height:78px;position:sticky;bottom:0;z-index:20;background:#c3afe1;border-top:4px solid #5f4e77;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:stretch}.sidebtn,.menugrid button{font-family:inherit;font-weight:900}.sidebtn{border:0;border-right:4px solid #5f4e77;background:#61549a;color:white;font-size:18px;text-shadow:2px 2px #342b59;box-shadow:inset 0 0 0 4px #8f81c2}.sidebtn:last-child{border-right:0;border-left:4px solid #5f4e77}.menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:#aa96ce}.menugrid button{background:#f5e4a8;border:3px solid #6e5329;color:#513a1e;font-size:11px;box-shadow:inset 0 -4px #d3b968}</style></head><body><main class="game"><header class="hud"><div class="date"><span>1年目</span><span>4月</span><span>1週</span></div><div class="money"><div class="cash">3,000,000G</div><div class="stats"><div class="stat"><i class="icon"></i>人気 12</div><div class="stat"><i class="icon blue"></i>研究 3</div></div></div></header><div class="viewport" id="vp" data-playtest-scroll><div class="scene"><div class="floor"></div><div class="wall w1"></div><div class="wall w2"></div><div class="wall w3"></div><div class="counterdesk">景品カウンター</div><div class="island i1"><div class="label">A島</div><div class="front" id="front1"></div></div><div class="island i2"><div class="label">B島</div><div class="front" id="front2"></div></div><div class="island i3"><div class="label">C島</div><div class="front" id="front3"></div></div><div class="island i4"><div class="label">D島</div><div class="front" id="front4"></div></div><div class="person p1"></div><div class="person p2"></div><div class="person p3"></div><div class="person p4"></div><div class="person p5"></div><div class="person p6"></div><div class="bubble b1">いい台だ！</div><div class="bubble b2">連チャン中！</div><div class="entrance">入口</div></div></div><footer class="bottom"><button class="sidebtn">セーブ</button><div class="menugrid"><button>建設</button><button>台入替</button><button>経営</button><button>広告</button><button>研究</button><button>情報</button></div><button class="sidebtn">メニュー</button></footer></main><script>const bay='<div class="bay"><div class="header"></div><div class="data"></div><div class="mount"></div><div class="sand"></div><div class="counter"></div><div class="fascia"></div></div>';for(const id of ['front1','front2','front3','front4'])document.getElementById(id).innerHTML=bay.repeat(9);addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(920-v.clientWidth)/2;v.scrollTop=20})</script></body></html>
