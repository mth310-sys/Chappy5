px;width:9px;height:314px;background:linear-gradient(90deg,#080a0b,#747c7e 48%,#24292a 70%,#080a0b);border:1px solid #050707;z-index:7}.asset .rail-left{left:128px}.asset .rail-right{left:377px}.asset .sand9{position:absolute;left:386px;top:70px;width:40px;height:276px;background:linear-gradient(90deg,#060809,#343d40 37%,#242b2d 57%,#0b0f10);border:2px solid #687579;border-radius:4px;z-index:9}.asset .sand9:before{content:"1000";position:absolute;left:6px;right:6px;top:13px;height:42px;background:#0a1c1f;border:1px solid #748489;display:grid;place-items:center;color:#7fc1ba;font:8px monospace}.asset .divider{position:absolute;left:430px;top:55px;width:7px;height:316px;background:linear-gradient(90deg,#080a0b,#666e70 48%,#171b1c);border:1px solid #050707;z-index:10}.asset .box-side{position:absolute;left:93px;top:72px;width:42px;height:286px;z-index:10}.asset .box-stack{position:absolute;left:0;bottom:2px;width:42px;display:flex;flex-direction:column-reverse;gap:2px}.asset .box{width:42px;height:30px;background:linear-gradient(#d0c197,#aa9569 17%,#847148 58%,#675738);border:2px solid #4e432e;border-radius:3px}.asset .counter9{position:absolute;left:101px;top:358px;width:336px;height:53px;background:linear-gradient(#292e30,#090b0c 62%,#030404);border:3px solid #010202;z-index:12}.asset .fascia9{position:absolute;left:101px;top:408px;width:336px;height:74px;background:linear-gradient(105deg,#050607,#131617 48%,#080a0b 72%,#030404);border:3px solid #010202;z-index:11}.asset .foot{position:absolute;left:112px;top:480px;width:314px;height:7px;background:linear-gradient(#202425,#050606);border:1px solid #020303;z-index:10}.chair{z-index:26;width:13px;height:10px;background:#7a5536;border:2px solid #513821;box-shadow:2px 2px #4a3526}.staff,.person{z-index:34;width:13px;height:17px;border:2px solid #28517a;background:#4d95d2;box-shadow:2px 2px #6e5549}.staff:before,.person:before{content:"";position:absolute;left:1px;top:-7px;width:8px;height:7px;background:#efc69e;border:2px solid #704b36}.staff:after,.person:after{content:"";position:absolute;left:-3px;top:6px;width:15px;height:4px;background:#f2cf3d;border:1px solid #72591a}.hair{position:absolute;left:1px;top:-7px;width:8px;height:3px;background:#4b3529;z-index:2}.staff{background:#f0e8d6;border-color:#4b6f88}.staff:after{background:#3f8db3}.counterdesk{z-index:24;width:84px;height:42px}.ctop{position:absolute;left:0;right:0;top:0;height:14px;background:linear-gradient(#f9dc9a,#e7bd6b);border:2px solid #8b6531;transform:skewX(-26.565deg)}.cface{position:absolute;left:0;right:7px;top:12px;height:27px;background:linear-gradient(#e5b36a,#c98c45);border:2px solid #765027;display:grid;place-items:center;font-size:7px;font-weight:900;box-shadow:4px 4px #5d3e21}.plant{z-index:20;width:16px;height:22px;background:#55ac58;border:2px solid #2c7137;box-shadow:2px 2px #705443}.plant:after{content:"";position:absolute;left:3px;bottom:-6px;width:8px;height:8px;background:#c07845;border:2px solid #754126}.entrance{z-index:15;width:104px;height:24px;background:linear-gradient(#eaf7f8,#c2e4e7);border:2px solid #5b8b96;transform:skewX(-26.565deg);box-shadow:4px 4px #476e76}.entrance span{display:block;transform:skewX(26.565deg);text-align:center;padding-top:5px;font-size:8px;font-weight:900}.road{position:absolute;left:-45px;top:608px;width:740px;height:90px;background:#c8ccca;transform:skewY(-7deg);border-top:4px solid #8d9692}.bottom{height:68px;position:sticky;bottom:0;z-index:100;background:#f3edcf;border-top:3px solid #8c7955;display:grid;grid-template-columns:.8fr 2.8fr .8fr}.sidebtn,.menu button{font-family:inherit;font-weight:900}.sidebtn{border:0;background:#4b9fc7;color:#fff;font-size:11px;box-shadow:inset 0 0 0 3px #92d5ec}.menu{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;padding:4px;background:#dce8dd}.menu button{position:relative;background:linear-gradient(#fff7be,#f1dd78);border:2px solid #8a6f31;color:#5b431c;font-size:7px;padding-top:25px;box-shadow:inset 0 -3px #d5bd57}.menu button:before{content:"";position:absolute;left:50%;top:5px;width:16px;height:16px;margin-left:-8px;background:#6fb4cf;border:2px solid #477b91}</style></head><body><main class="game"><header class="hud"><div class="h"><small>1年目 4月 1週</small><b>10:20　晴れ</b></div><div class="h"><small>ホール人気 / 来店</small><b>★13　48人</b></div><div class="h money"><small>所持金</small><b>3,226,400G</b></div></header><div class="sub"><span>稼働 55%</span><span>本日 +226,400G</span><span>満足 74</span></div><div class="viewport" id="vp" data-playtest-scroll><div class="scene" id="scene"><div class="lot"></div><div class="floor"></div><div class="road"></div></div></div><footer class="bottom"><button class="sidebtn">情報</button><div class="menu"><button>建設</button><button>台入替</button><button>経営</button><button>広告</button><button>研究</button><button>客層</button></div><button class="sidebtn">メニュー</button></footer></main><script>const GRID={ox:325,oy:176,hw:13,hh:6.5};const SPEC={island:{w:9,d:1},aisle:3,chairOffset:{x:0,y:1},personOffset:{x:0,y:2}};const layout={islands:[{x:-16,y:0},{x:-4,y:0},{x:8,y:0},{x:20,y:0}],counter:{x:10,y:-12,rise:86},staff:{x:11,y:-10,rise:24},plants:[{x:-11,y:-8,rise:20},{x:17,y:8,rise:20}],entrance:{x:-2,y:26,rise:0}};const scene=document.getElementById('scene');function iso(x,y,r=0){return{x:GRID.ox+(x-y)*GRID.hw,y:GRID.oy+(x+y)*GRID.hh-r}}function place(el,x,y,r=0){const p=iso(x,y,r);el.style.left=p.x+'px';el.style.top=p.y+'px';scene.appendChild(el);return el}function node(cls,x,y,r=0,html=''){const e=document.createElement('div');e.className='gridNode '+cls;e.innerHTML=html;return place(e,x,y,r)}function footprint(x,y,w,d){const p=iso(x,y);const e=document.createElement('div');e.className='footprint';e.style.width=(w*26)+'px';e.style.height=(d*13)+'px';e.style.left=p.x+'px';e.style.top=p.y+'px';scene.appendChild(e)}const inner='<div class="unit9"><div class="shadow"></div><div class="backboard"></div><div class="header9"></div><div class="data9"></div><div class="mount9"></div><div class="rail-left"></div><div class="rail-right"></div><div class="sand9"></div><div class="divider"></div><div class="box-side"><div class="box-stack"><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div></div></div><div class="counter9"></div><div class="fascia9"></div><div class="foot"></div></div>';function island(x,y,i){footprint(x,y,SPEC.island.w,SPEC.island.d);const a=node('asset',x,y,0,'<div class="island9"></div>');const el=a.firstChild;for(let n=0;n<9;n++){const b=document.createElement('div');b.className='bay9';b.style.left=(n*344)+'px';b.innerHTML=inner;el.appendChild(b)}const cx=x+4,cy=y+SPEC.chairOffset.y;node('chair',cx,cy,8);const colors=['#d86670','#67a862','#9272c8','#d69a49'];const p=node('person',cx,cy+1,22,'<i class="hair"></i>');p.style.background=colors[i]}layout.islands.forEach((v,i)=>island(v.x,v.y,i));node('counterdesk',layout.counter.x,layout.counter.y,layout.counter.rise,'<div class="ctop"></div><div class="cface">景品交換</div>');node('staff',layout.staff.x,layout.staff.y,layout.staff.rise,'<i class="hair"></i>');layout.plants.forEach(v=>node('plant',v.x,v.y,v.rise));node('entrance',layout.entrance.x,layout.entrance.y,0,'<span>入口</span>');const occupied=new Set();for(const s of layout.islands){for(let x=0;x<SPEC.island.w;x++){const k=(s.x+x)+','+s.y;if(occupied.has(k))console.error('grid collision',k);occupied.add(k)}}for(let i=1;i<layout.islands.length;i++){const gap=layout.islands[i].x-(layout.islands[i-1].x+SPEC.island.w);if(gap<SPEC.aisle)console.error('aisle too narrow',gap)}addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(650-v.clientWidth)/2;v.scrollTop=4})</script></body></html>
