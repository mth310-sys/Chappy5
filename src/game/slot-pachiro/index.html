<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 本編</title><style>*{box-sizing:border-box}body{margin:0;background:#d9ded8;color:#263136;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.game{min-height:100vh}.hud{height:62px;padding:6px 8px;background:#f2eee3;border-bottom:2px solid #9ca7a3;display:flex;gap:6px;position:sticky;top:0;z-index:20}.hudbox{min-width:105px;flex:1;background:#fffdf5;border:1px solid #a8b0aa;border-radius:6px;padding:4px 7px;font-size:10px;color:#667278}.hudbox b{display:block;color:#263136;font-size:14px;margin-top:2px}.viewport{height:calc(100vh - 136px);overflow:auto;background:#dce2dc;-webkit-overflow-scrolling:touch}.scene{position:relative;width:900px;height:1180px;background:#e5e4dc;image-rendering:pixelated}.floor{position:absolute;left:28px;right:28px;top:44px;bottom:28px;background:repeating-linear-gradient(0deg,#c9c5b9 0 39px,#b7b3a8 40px),repeating-linear-gradient(90deg,transparent 0 39px,#b7b3a8 40px);border:2px solid #918e85}.backwall{position:absolute;left:70px;top:47px;width:760px;height:38px;background:#f0e8d7;border:2px solid #a89f8d;box-shadow:0 4px 0 #c3bcae}.counterdesk{position:absolute;right:92px;top:54px;width:130px;height:27px;background:#b8946c;border:2px solid #755c42;display:grid;place-items:center;color:#fffaf0;font-size:8px;box-shadow:0 3px 0 #8e7356}.island{position:absolute;left:50%;width:648px;margin-left:-324px;height:132px}.i1{top:165px}.i2{top:430px}.i3{top:695px}.topline{position:absolute;left:12px;top:0;width:624px;height:12px;background:#737f80;border:2px solid #30383a;border-bottom:0}.front{position:absolute;left:0;top:10px;width:648px;height:116px;background:#22292b;border:2px solid #101415;display:flex;overflow:hidden;box-shadow:0 6px 0 #909a95}.bay{position:relative;width:72px;height:114px;flex:0 0 72px;border-right:1px solid #566164;background:#2e3638}.header{position:absolute;left:3px;right:3px;top:3px;height:11px;background:#778184;border:1px solid #262d2f}.data{position:absolute;left:22px;top:3px;width:29px;height:15px;background:#123438;border:1px solid #8b989a;z-index:5}.mount{position:absolute;left:11px;top:20px;width:49px;height:65px;background:repeating-linear-gradient(135deg,#161b1c 0 5px,#23292a 5px 10px);border:1px solid #667174}.rail{position:absolute;left:61px;top:20px;width:3px;height:66px;background:#a0aaac}.sand{position:absolute;left:64px;top:22px;width:7px;height:59px;background:#657376;border:1px solid #aab5b7}.sand:before{content:"";position:absolute;left:1px;right:1px;top:5px;height:9px;background:#1b484d}.counter{position:absolute;left:1px;right:1px;top:86px;height:12px;background:#465053;border-top:1px solid #899497}.fascia{position:absolute;left:1px;right:1px;top:98px;height:14px;background:#1d2325}.label{position:absolute;left:7px;bottom:0;padding:2px 5px;background:#263033;border:1px solid #89979b;color:#f1f5f4;font-size:8px}.aisle{position:absolute;left:125px;width:650px;height:70px;border-top:1px dashed #8f9289;border-bottom:1px dashed #8f9289}.a1{top:330px}.a2{top:595px}.entrance{position:absolute;left:350px;bottom:48px;width:200px;height:38px;background:#edf3ef;border:2px solid #899b96;display:grid;place-items:center;color:#53635f;font-size:9px}.person{position:absolute;width:18px;height:22px;border:2px solid #4d5e61;border-radius:7px 7px 4px 4px;background:#5f91ad;z-index:8;box-shadow:0 3px 0 #0002}.person:before{content:"";position:absolute;left:3px;top:-9px;width:9px;height:9px;border-radius:50%;background:#e3bd96;border:1px solid #795b45}.p1{left:315px;top:317px}.p2{left:545px;top:383px;background:#c86d65}.p3{left:405px;top:582px;background:#76a76e}.p4{left:260px;top:650px;background:#d2a75e}.p5{left:610px;top:844px;background:#8875ad}.bottom{height:74px;padding:7px;background:#f2eee3;border-top:2px solid #9ca7a3;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;position:sticky;bottom:0;z-index:20}.btn{border:1px solid #879691;border-radius:6px;background:#e5ebe6;color:#34413e;font-weight:700;font-size:11px}.btn:active{background:#ccd6cf}</style></head><body><main class="game"><header class="hud"><div class="hudbox">所持金<b>¥3,000,000</b></div><div class="hudbox">1年目 4月1日<b>10:00</b></div><div class="hudbox">ホール人気<b>★ 12</b></div></header><div class="viewport" id="vp" data-playtest-scroll><div class="scene"><div class="floor"></div><div class="backwall"></div><div class="counterdesk">景品カウンター</div><div class="island i1"><div class="topline"></div><div class="front" id="front1"></div><div class="label">島 A</div></div><div class="aisle a1"></div><div class="person p1"></div><div class="person p2"></div><div class="island i2"><div class="topline"></div><div class="front" id="front2"></div><div class="label">島 B</div></div><div class="aisle a2"></div><div class="person p3"></div><div class="person p4"></div><div class="island i3"><div class="topline"></div><div class="front" id="front3"></div><div class="label">島 C</div></div><div class="person p5"></div><div class="entrance">ENTRANCE / 入口</div></div></div><nav class="bottom"><button class="btn">建設</button><button class="btn">台入替</button><button class="btn">経営</button><button class="btn">情報</button><button class="btn">メニュー</button></nav></main><script>const bay='<div class="bay"><div class="header"></div><div class="data"></div><div class="mount"></div><div class="rail"></div><div class="sand"></div><div class="counter"></div><div class="fascia"></div></div>';for(const id of ['front1','front2','front3'])document.getElementById(id).innerHTML=bay.repeat(9);addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(900-v.clientWidth)/2;v.scrollTop=10})</script></body></html>
