<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 斜め視点オマージュ試作</title><style>*{box-sizing:border-box}html,body{margin:0;background:#2b1734;font-family:"Courier New",monospace;color:#33212b}.game{min-height:100vh;background:#9d7b67}.hud{height:90px;position:sticky;top:0;z-index:30;background:#714633;border-bottom:4px solid #42271e;display:grid;grid-template-columns:1.02fr 1.38fr;box-shadow:0 3px #0005}.date{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(#a86c49,#7d4c36);border-right:4px solid #4e3025;color:#fff1bd;font-size:18px;font-weight:900;text-shadow:2px 2px #563021}.money{display:grid;grid-template-rows:44px 42px}.cash{display:flex;align-items:center;justify-content:flex-end;padding:0 12px;background:#e7e0ee;border:3px solid #685a76;border-top:0;color:#6b5010;font-size:20px;font-weight:900;text-shadow:1px 1px white}.stats{display:grid;grid-template-columns:1fr 1fr;background:#f1ebf6;border-left:3px solid #685a76}.stat{display:flex;align-items:center;justify-content:center;gap:7px;border-right:2px solid #82758f;color:#254584;font-weight:900}.ico{width:22px;height:22px;border:3px solid #4b3f57;background:#57ce64;box-shadow:inset 0 -5px #2e963b}.ico.blue{background:#54c9e2;box-shadow:inset 0 -5px #2286a4}.viewport{height:calc(100vh - 170px);overflow:auto;background:#452d48;-webkit-overflow-scrolling:touch}.scene{position:relative;width:980px;height:1300px;overflow:hidden;background:#c59770;image-rendering:pixelated}.ground{position:absolute;left:-110px;top:40px;width:1200px;height:1220px;transform:skewY(-7deg);transform-origin:50% 0;background-color:#c9a37f;background-image:linear-gradient(30deg,#aa876b 12%,transparent 12.5%,transparent 87%,#aa876b 87.5%),linear-gradient(150deg,#aa876b 12%,transparent 12.5%,transparent 87%,#aa876b 87.5%),linear-gradient(30deg,#aa876b 12%,transparent 12.5%,transparent 87%,#aa876b 87.5%),linear-gradient(150deg,#aa876b 12%,transparent 12.5%,transparent 87%,#aa876b 87.5%);background-size:74px 44px;background-position:0 0,0 0,37px 22px,37px 22px}.wall{position:absolute;background:#3c2445;border:4px solid #25152c;box-shadow:inset 0 0 0 3px #71536e}.wall.back{left:45px;top:62px;width:860px;height:46px;transform:skewY(-4deg)}.counterdesk{position:absolute;left:670px;top:128px;width:185px;height:58px;background:#d9ad6e;border:4px solid #754c28;box-shadow:8px 8px #52341d,inset 0 0 0 3px #ffe4a8;transform:skewY(-7deg);display:grid;place-items:center;font-weight:900;font-size:12px;color:#51361f}.decor{position:absolute;width:50px;height:50px;border:4px solid #60421e;background:#70a650;box-shadow:6px 6px #60421e}.d1{left:80px;top:126px}.d2{right:72px;top:260px}.island{position:absolute;width:430px;height:122px;transform:skewY(-7deg)}.i1{left:95px;top:235px}.i2{left:430px;top:420px}.i3{left:120px;top:660px}.i4{left:445px;top:845px}.cap{position:absolute;left:10px;right:10px;top:-16px;height:20px;background:#8f95a0;border:4px solid #333540;transform:skewX(-28deg);transform-origin:left bottom;box-shadow:0 3px #565a65}.front{position:absolute;inset:0;background:#555a65;border:4px solid #282a32;display:flex;box-shadow:9px 9px #3d3542,inset 0 0 0 3px #9298a5}.bay{position:relative;width:47px;height:114px;flex:0 0 47px;border-right:2px solid #2d2e36;background:#676d7c}.header{position:absolute;left:3px;right:3px;top:4px;height:11px;background:#f3bd48;border:2px solid #765017}.data{position:absolute;left:12px;top:16px;width:22px;height:14px;background:#175269;border:2px solid #c4e5e9}.mount{position:absolute;left:6px;top:31px;width:29px;height:52px;background:#252731;border:2px solid #9fa6b4}.mount:after{content:"";position:absolute;left:4px;right:4px;top:9px;height:20px;background:#a32131;border:2px solid #f0c44a}.sand{position:absolute;right:2px;top:31px;width:8px;height:49px;background:#b7c0c4;border:2px solid #5e6b70}.counter{position:absolute;left:2px;right:2px;bottom:14px;height:9px;background:#d0a263;border-top:2px solid #62492f}.fascia{position:absolute;left:2px;right:2px;bottom:2px;height:12px;background:#432f40}.label{position:absolute;left:8px;top:-45px;transform:skewY(7deg);background:#fff0a8;border:3px solid #7d542c;padding:3px 8px;font-size:11px;font-weight:900;box-shadow:3px 3px #4b2c1f}.person{position:absolute;width:26px;height:31px;background:#4f98dc;border:3px solid #234360;box-shadow:5px 5px #76594c;z-index:15}.person:before{content:"";position:absolute;left:4px;top:-14px;width:12px;height:12px;background:#efc49c;border:3px solid #6c4936}.person:after{content:"";position:absolute;left:-5px;top:10px;width:30px;height:7px;background:#f4d344;border:2px solid #6d591a}.p1{left:315px;top:390px}.p2{left:590px;top:375px;background:#ce646d;border-color:#6e343b}.p3{left:260px;top:550px;background:#65a55e;border-color:#345c30}.p4{left:705px;top:635px;background:#d39a49;border-color:#765124}.p5{left:360px;top:820px;background:#8d70c5;border-color:#4c3b6c}.p6{left:620px;top:1010px;background:#4cb8a7;border-color:#26665f}.bubble{position:absolute;z-index:18;background:#fff;border:3px solid #6a5c88;border-radius:8px;padding:5px 8px;color:#4c46c7;font-size:12px;font-weight:900;box-shadow:3px 3px #6a5c88}.b1{left:285px;top:340px}.b2{left:570px;top:325px}.b3{left:690px;top:590px;color:#c54848}.entrance{position:absolute;left:365px;bottom:72px;width:245px;height:52px;background:#e7d7f2;border:4px solid #665178;display:grid;place-items:center;font-weight:900;box-shadow:7px 7px #4d3d5b;transform:skewY(-7deg)}.road{position:absolute;left:-70px;bottom:-60px;width:1110px;height:230px;background:#7d6f6c;transform:skewY(-7deg);border-top:5px solid #514543}.road:after{content:"";position:absolute;left:110px;right:110px;top:90px;height:5px;background:repeating-linear-gradient(90deg,#eee29a 0 44px,transparent 44px 88px)}.bottom{height:80px;position:sticky;bottom:0;z-index:30;background:#c7b1df;border-top:4px solid #665178;display:grid;grid-template-columns:1fr 2.2fr 1fr;box-shadow:0 -3px #0003}.sidebtn,.menugrid button{font-family:inherit;font-weight:900}.sidebtn{border:0;background:#6759a0;color:white;font-size:17px;text-shadow:2px 2px #342b59;box-shadow:inset 0 0 0 4px #9888c8}.menugrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:#ad99ce}.menugrid button{background:#f6e5aa;border:3px solid #70542b;color:#543b1d;font-size:11px;box-shadow:inset 0 -5px #d5ba6c}</style></head><body><main class="game"><header class="hud"><div class="date"><span>1年目</span><span>4月</span><span>1週</span></div><div class="money"><div class="cash">3,000,000G</div><div class="stats"><div class="stat"><i class="ico"></i>人気 12</div><div class="stat"><i class="ico blue"></i>研究 3</div></div></div></header><div class="viewport" id="vp" data-playtest-scroll><div class="scene"><div class="ground"></div><div class="wall back"></div><div class="counterdesk">景品カウンター</div><div class="decor d1"></div><div class="decor d2"></div><div class="road"></div><div class="island i1"><div class="cap"></div><div class="label">A島</div><div class="front" id="front1"></div></div><div class="island i2"><div class="cap"></div><div class="label">B島</div><div class="front" id="front2"></div></div><div class="island i3"><div class="cap"></div><div class="label">C島</div><div class="front" id="front3"></div></div><div class="island i4"><div class="cap"></div><div class="label">D島</div><div class="front" id="front4"></div></div><div class="person p1"></div><div class="person p2"></div><div class="person p3"></div><div class="person p4"></div><div class="person p5"></div><div class="person p6"></div><div class="bubble b1">いい台だ！</div><div class="bubble b2">連チャン中！</div><div class="bubble b3">大当たり！</div><div class="entrance">入口</div></div></div><footer class="bottom"><button class="sidebtn">セーブ</button><div class="menugrid"><button>建設</button><button>台入替</button><button>経営</button><button>広告</button><button>研究</button><button>情報</button></div><button class="sidebtn">メニュー</button></footer></main><script>const bay='<div class="bay"><div class="header"></div><div class="data"></div><div class="mount"></div><div class="sand"></div><div class="counter"></div><div class="fascia"></div></div>';for(const id of ['front1','front2','front3','front4'])document.getElementById(id).innerHTML=bay.repeat(9);addEventListener('load',()=>{const v=document.getElementById('vp');v.scrollLeft=(980-v.clientWidth)/2;v.scrollTop=10})</script></body></html>
