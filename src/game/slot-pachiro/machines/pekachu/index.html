<title>ペカチュウ Ver.0.6.2</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle,#2a2200,#020202);color:white;font-family:sans-serif;text-align:center}.wrap{max-width:390px;margin:auto;padding:4px}.machine{position:relative;overflow:hidden;background:linear-gradient(135deg,#f7f7f7 0%,#3c3c3c 5%,#050505 15%,#151200 50%,#050505 85%,#3c3c3c 95%,#fff 100%);border:6px solid #d8b900;border-radius:26px;padding:9px;box-shadow:0 0 34px #ffe600,0 0 60px #fff,0 0 75px #f90,inset 0 0 30px #000}.top-panel,.center-panel,.info-panel,.play-panel,.role,.reset{position:relative;z-index:1}.top-panel{background:#080700;border:2px solid #ddd;border-radius:16px;padding:8px;margin-bottom:7px}.logo{font-size:10px;color:#9cff9c;font-weight:bold}.top-panel h1{font-size:34px;margin:2px;color:#fff200}.version{font-size:11px;color:#fff7b0}.center-panel{background:#080808;border:2px solid #ddd;border-radius:16px;padding:9px 6px 6px;margin-bottom:7px}.reel-area{display:flex;align-items:center;justify-content:center;gap:7px}.lamp{width:52px;height:52px;flex:0 0 52px;border-radius:10px;background:#120900;border:3px solid #ffe600;color:#ffe56b;display:flex;align-items:center;justify-content:center;font-weight:bold}.lamp.on{background:#ffd000;color:#402000;box-shadow:0 0 34px #fff}.lamp.super{background:#9b5cff;color:#250040;box-shadow:0 0 45px #fff}.reels{display:flex;gap:6px}.reel{width:80px;height:112px;background:#eee;color:#111;border-radius:12px;border:4px solid #777;display:flex;align-items:center;justify-content:center}.symbol{width:72px;height:72px;object-fit:contain}.msg{color:#fff200;font-weight:bold;min-height:28px;margin:7px 0 1px;font-size:20px}.info-panel{display:flex;justify-content:space-around;background:#020202;border:2px solid #ddd;border-radius:13px;padding:7px;margin-bottom:7px}.info-box{width:32%}.info-label{font-size:10px;color:#fff7b0}.info-value{font-size:30px;font-weight:bold;color:#ff2c2c;font-family:monospace}.play-panel{background:#151515;border:2px solid #e0c84a;border-radius:17px;padding:8px;margin-bottom:8px}.control-panel,.stop-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:2px solid #ffe600;border-radius:14px;padding:7px;margin-bottom:8px}.control-panel{grid-template-columns:1.15fr 1fr 1fr}button{width:100%;font-size:15px;font-weight:bold;padding:8px 2px;border:none;color:white;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.btn-lever,.btn-bet{height:56px;border-radius:12px;background:#c9a900;color:#111}.stop{width:68px;height:68px;margin:auto;border-radius:50%;background:#d90000}.reset{background:#665300;font-size:12px;padding:7px 20px;width:auto;border-radius:10px}.role{font-size:10px;color:#f3eab0}.payEffect{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:bold;color:#fff200;display:none;z-index:10}.payEffect.show{display:block}button:disabled{opacity:.35}
</style></head><body><div class="wrap"><div class="machine"><div class="top-panel"><div class="logo">🌱 遊創舎</div><h1>⚡ペカチュウ⚡</h1><div class="version">PEKACHU SLOT Ver.0.6.2 全役・雷復活版</div></div><div class="center-panel"><div class="reel-area"><div id="lamp" class="lamp">PEKA</div><div class="reels"><div id="r1" class="reel"></div><div id="r2" class="reel"></div><div id="r3" class="reel"></div></div></div><div id="msg" class="msg">BETしてください</div></div><div class="info-panel"><div class="info-box"><div class="info-label">CREDIT</div><div id="credit" class="info-value">50</div></div><div class="info-box"><div class="info-label">BET</div><div id="bet" class="info-value">0</div></div><div class="info-box"><div class="info-label">PAYOUT</div><div id="pay" class="info-value">0</div></div></div><div class="play-panel"><div class="control-panel"><button id="startBtn" type="button" class="btn-lever" disabled>START<br>レバー</button><button id="betBtn" type="button" class="btn-bet">BET</button><button id="maxBetBtn" type="button" class="btn-bet">MAX<br>BET</button></div><div class="stop-panel"><button id="s1" type="button" class="stop" disabled>STOP</button><button id="s2" type="button" class="stop" disabled>STOP</button><button id="s3" type="button" class="stop" disabled>STOP</button></div></div><button id="resetBtn" type="button" class="reset">リセット</button><div class="role">赤7：BIG 50枚 / 白7：SUPER BIG 100枚 / BAR：雷BONUS 20枚<br>STAR：15枚 / ベル：10枚 / ブドウ：8枚 / チェリー：2枚</div></div></div><div id="payEffect" class="payEffect"></div><script>
const symbols=['7R','7W','BAR','CHERRY','GRAPE','BELL','STAR'],symbolFiles={7R:'7_red.png',7W:'7_white_purple.png',BAR:'bar.png',CHERRY:'cherry.png',GRAPE:'grape.png',BELL:'bell.png',STAR:'star.png'};const params=new URLSearchParams(location.search),pachiroMode=params.get('from')==='pachiro',machineId=params.get('machine')||'UNKNOWN';let credit=50,bet=0,pay=0,reels=['CHERRY','GRAPE','BELL'],spinning=[false,false,false],timers=[null,null,null],stopped=0,resultType='MISS',targetSymbol=null,totalGames=0,bonusCount=0,payEffectTimer=null,parentInitialized=false;
const creditEl=document.getElementById('credit'),betEl=document.getElementById('bet'),payEl=document.getElementById('pay'),startBtn=document.getElementById('startBtn'),betBtn=document.getElementById('betBtn'),maxBetBtn=document.getElementById('maxBetBtn'),stopBtns=[document.getElementById('s1'),document.getElementById('s2'),document.getElementById('s3')],resetBtn=document.getElementById('resetBtn');
function bridge(type,extra={}){if(pachiroMode&&window.parent!==window)window.parent.postMessage({source:'pekachu',type,machineId,credit,bet,pay,totalGames,bonusCount,...extra},location.origin)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.source!=='pachiro')return;if(e.data.type==='init'&&!parentInitialized){parentInitialized=true;const incoming=Number(e.data.credit);if(Number.isFinite(incoming))credit=Math.max(0,incoming);bet=0;pay=0;update();bridge('initialized')}});
function drawReel(i){document.getElementById('r'+(i+1)).innerHTML=`<img src="${symbolFiles[reels[i]]}" class="symbol">`}function drawAllReels(){for(let i=0;i<3;i++)drawReel(i)}function update(){creditEl.textContent=String(credit);betEl.textContent=String(bet);payEl.textContent=String(pay);startBtn.disabled=bet!==3||spinning.includes(true);for(let i=0;i<3;i++)stopBtns[i].disabled=!spinning[i];bridge('state')}function msg(t){document.getElementById('msg').textContent=t}function rand(){return symbols[Math.floor(Math.random()*symbols.length)]}function chooseResult(){const r=Math.random();if(r<.01)return{type:'SUPER',symbol:'7W'};if(r<.025)return{type:'REVIVAL',symbol:'7W'};if(r<.08)return{type:'BIG',symbol:'7R'};if(r<.125)return{type:'BAR',symbol:'BAR'};if(r<.185)return{type:'STAR',symbol:'STAR'};if(r<.275)return{type:'BELL',symbol:'BELL'};if(r<.385)return{type:'GRAPE',symbol:'GRAPE'};if(r<.565)return{type:'CHERRY',symbol:'CHERRY'};return{type:'MISS',symbol:null}}function hidePayEffect(){const e=document.getElementById('payEffect');e.classList.remove('show');if(payEffectTimer){clearTimeout(payEffectTimer);payEffectTimer=null}}function showPayEffect(n){if(n<=0)return;hidePayEffect();const e=document.getElementById('payEffect');e.textContent='+'+n;e.classList.add('show');payEffectTimer=setTimeout(hidePayEffect,900)}function betOne(){if(credit<=0||bet>=3||spinning.includes(true))return;hidePayEffect();credit-=1;bet+=1;pay=0;msg(bet===3?'STARTできます':'BET中');update();bridge('bet-change')}function maxBet(){if(spinning.includes(true))return;hidePayEffect();while(bet<3&&credit>0){credit-=1;bet+=1}pay=0;msg(bet===3?'STARTできます':'クレジット不足');update();bridge('bet-change')}function start(){if(bet!==3)return;hidePayEffect();stopped=0;pay=0;const c=chooseResult();resultType=c.type;targetSymbol=c.symbol;msg('リール回転中');for(let i=0;i<3;i++){spinning[i]=true;timers[i]=setInterval(()=>{reels[i]=rand();drawReel(i)},70)}bridge('spin-start');update()}function stop(i){if(!spinning[i])return;clearInterval(timers[i]);spinning[i]=false;if(['SUPER','BIG','BAR','STAR','BELL','GRAPE'].includes(resultType))reels[i]=targetSymbol;else if(resultType==='CHERRY')reels[i]=i===0?'CHERRY':rand();else if(resultType==='REVIVAL')reels[i]=i<2?'7W':'STAR';else reels[i]=rand();drawReel(i);stopped++;if(stopped===3)judge();update()}function payout(n,text){pay=n;credit+=n;msg(text);showPayEffect(n)}function completeSpin(result){bet=0;totalGames++;if(['SUPER','REVIVAL','BIG','BAR'].includes(resultType))bonusCount++;update();bridge('spin-complete',{result,payout:pay,resultType})}function judge(){if(resultType==='REVIVAL'){msg('雷復活モード！！');setTimeout(()=>{reels=['7W','7W','7W'];drawAllReels();payout(100,'白7 SUPER BIG！！');completeSpin('白7 SUPER BIG！！')},900);return}let result='ハズレ';if(reels.every(v=>v==='7W')){payout(100,'白7 SUPER BIG！！');result='白7 SUPER BIG！！'}else if(reels.every(v=>v==='7R')){payout(50,'BIG BONUS！！');result='BIG BONUS！！'}else if(reels.every(v=>v==='BAR')){payout(20,'BAR 雷BONUS 20枚');result='BAR 雷BONUS 20枚'}else if(reels.every(v=>v==='STAR')){payout(15,'STAR 15枚');result='STAR 15枚'}else if(reels.every(v=>v==='BELL')){payout(10,'ベル 10枚');result='ベル 10枚'}else if(reels.every(v=>v==='GRAPE')){payout(8,'ブドウ 8枚');result='ブドウ 8枚'}else if(reels.includes('CHERRY')){payout(2,'チェリー 2枚');result='チェリー 2枚'}else{pay=0;hidePayEffect();msg('ハズレ')}completeSpin(result)}function resetGame(){for(let i=0;i<3;i++)clearInterval(timers[i]);hidePayEffect();bet=0;pay=0;reels=['CHERRY','GRAPE','BELL'];spinning=[false,false,false];stopped=0;totalGames=0;bonusCount=0;drawAllReels();msg('BETしてください');update();bridge('reset')}
betBtn.addEventListener('click',betOne);maxBetBtn.addEventListener('click',maxBet);startBtn.addEventListener('click',start);stopBtns.forEach((btn,i)=>btn.addEventListener('click',()=>stop(i)));resetBtn.addEventListener('click',resetGame);document.addEventListener('contextmenu',e=>{if(e.target.closest('button'))e.preventDefault()});document.addEventListener('selectstart',e=>{if(e.target.closest('button'))e.preventDefault()});drawAllReels();update();bridge('ready');
</script></body></html>
