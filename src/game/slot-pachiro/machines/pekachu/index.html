<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="https://raw.githubusercontent.com/mth310-sys/yusosha-slot/main/pekachu_v062/">
<title>ペカチュウ Ver.0.6.2</title>
<style>
*{box-sizing:border-box;}
body{margin:0;background:radial-gradient(circle,#2a2200,#020202);color:white;font-family:sans-serif;text-align:center;}
.wrap{max-width:390px;margin:auto;padding:4px;}.machine{position:relative;overflow:hidden;background:linear-gradient(135deg,#f7f7f7 0%,#3c3c3c 5%,#050505 15%,#151200 50%,#050505 85%,#3c3c3c 95%,#ffffff 100%);border:6px solid #d8b900;border-radius:26px;padding:9px;box-shadow:0 0 34px #ffe600,0 0 60px #ffffff,0 0 75px #ff9900,inset 0 0 30px #000,inset 0 0 0 3px #25200a}.machine:before{content:"";position:absolute;inset:8px;border:2px solid #f7f7f7;border-radius:20px;box-shadow:0 0 20px #ffffff,0 0 28px #fff200,inset 0 0 16px #8a6a00;pointer-events:none}.machine:after{content:"⚡";position:absolute;inset:14px 16px auto 16px;height:34px;color:#fff200;font-size:30px;text-shadow:0 0 16px #fff200,0 0 32px #ffffff,0 0 42px #ff9900;opacity:.9;pointer-events:none}.led-side{position:absolute;top:42px;bottom:44px;width:13px;border-radius:8px;background:radial-gradient(circle,#ffffff 0 15%,#fff200 22%,#ffb300 42%,#ffffff 55%,#5b3a00 75%);background-size:13px 16px;box-shadow:0 0 20px #ffffff,0 0 30px #fff200,0 0 42px #ff9900;animation:ledPulse 1s infinite alternate}.led-left{left:8px}.led-right{right:8px}.top-led{position:relative;z-index:1;height:25px;margin:0 42px 7px;border-radius:0 0 18px 18px;background:linear-gradient(90deg,#1c1600,#fff200,#ffffff,#ffb300,#ffffff,#fff200,#1c1600);box-shadow:0 0 20px #ffffff,0 0 30px #fff200,inset 0 0 12px #fff7b0;clip-path:polygon(12% 0,88% 0,100% 100%,0 100%);animation:topRun 1.8s infinite linear}.top-panel,.center-panel,.info-panel,.play-panel,.role,.reset{position:relative;z-index:1}.top-panel{background:#030303;border:0;border-radius:16px;padding:0;margin-bottom:7px;box-shadow:0 0 14px #fff,0 0 20px #ffd000;overflow:hidden}.zelvolt-logo{display:block;width:100%;height:auto;max-height:102px;object-fit:cover;border-radius:14px}.center-panel{background:#080808;border:2px solid #d9d9d9;border-radius:16px;padding:9px 6px 6px;margin-bottom:7px;box-shadow:0 0 14px #fff,0 0 18px #ffcc00}.reel-area{display:flex;align-items:center;justify-content:center;gap:7px}.lamp{width:52px;height:52px;flex:0 0 52px;border-radius:10px;background:#120900;border:3px solid #ffe600;color:#ffe56b;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:13px}.lamp.on{background:#ffd000;color:#402000;box-shadow:0 0 34px #fff,0 0 55px gold}.lamp.super{background:#9b5cff;color:#250040;box-shadow:0 0 45px #fff,0 0 65px #b26cff}.reels{display:flex;gap:6px}.reel{width:80px;height:112px;background:#eee;color:#111;border-radius:12px;border:4px solid #777;display:flex;align-items:center;justify-content:center;position:relative}.symbol{width:72px;height:72px;object-fit:contain;pointer-events:none;user-select:none}.reel.spark,.reel.superSpark{box-shadow:0 0 18px #fff200}.msg{color:#fff200;font-weight:bold;min-height:28px;margin:7px 0 1px;font-size:20px}.msg.big,.msg.superMsg{font-size:22px}.info-panel{display:flex;justify-content:space-around;background:#020202;border:2px solid #d9d9d9;border-radius:13px;padding:7px;margin-bottom:7px}.info-box{width:32%;border-right:1px solid #252525}.info-box:last-child{border-right:none}.info-label{font-size:10px;color:#fff7b0}.info-value{font-size:30px;font-weight:bold;color:#ff2c2c;font-family:"Courier New",monospace}.play-panel{background:#151515;border:2px solid #e0c84a;border-radius:17px;padding:8px;margin-bottom:8px}.operation-unit{display:grid;grid-template-rows:auto auto;gap:8px}.control-panel,.stop-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border:2px solid #ffe600;border-radius:14px;padding:7px}.control-panel{grid-template-columns:1.15fr 1fr 1fr}button{width:100%;font-size:15px;font-weight:bold;padding:8px 2px;border:none;color:white;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.btn-lever,.btn-bet{height:56px;border-radius:12px;background:#c9a900;color:#111}.stop{width:68px;height:68px;margin:auto;border-radius:50%;background:#d90000}.reset{background:#665300;font-size:12px;padding:7px 20px;width:auto;margin-bottom:5px;border-radius:10px}button:disabled{opacity:.35}.role{font-size:10px;color:#f3eab0;line-height:1.35}.payEffect{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:bold;color:#fff200;display:none;z-index:10}.payEffect.show{display:block}@keyframes ledPulse{from{opacity:.55}to{opacity:1}}@keyframes topRun{50%{filter:brightness(1.9)}}
</style>
</head>
<body>
<div class="wrap"><div class="machine"><div class="led-side led-left"></div><div class="led-side led-right"></div><div class="top-led"></div><div class="top-panel"><img class="zelvolt-logo" src="/Chappy5/src/game/slot-pachiro/machines/pekachu/zelvolt_logo.jpg?v=2" alt="ZELVOLT"></div><div class="center-panel"><div class="reel-area"><div id="lamp" class="lamp">PEKA</div><div class="reels"><div id="r1" class="reel"></div><div id="r2" class="reel"></div><div id="r3" class="reel"></div></div></div><div id="msg" class="msg">BETしてください</div></div><div class="info-panel"><div class="info-box"><div class="info-label">CREDIT</div><div id="credit" class="info-value">50</div></div><div class="info-box"><div class="info-label">BET</div><div id="bet" class="info-value">0</div></div><div class="info-box"><div class="info-label">PAYOUT</div><div id="pay" class="info-value">0</div></div></div><div class="play-panel"><div class="operation-unit"><div class="control-panel"><button id="startBtn" type="button" class="btn-lever" onclick="start()" disabled>START<br>レバー</button><button type="button" class="btn-bet" onclick="betOne()">BET</button><button type="button" class="btn-bet" onclick="maxBet()">MAX<br>BET</button></div><div class="stop-panel"><button id="s1" type="button" class="stop" onclick="stop(0)" disabled>STOP</button><button id="s2" type="button" class="stop" onclick="stop(1)" disabled>STOP</button><button id="s3" type="button" class="stop" onclick="stop(2)" disabled>STOP</button></div></div></div><button type="button" class="reset" onclick="resetGame()">リセット</button><div class="role">赤7 / 白紫7：BIG / BAR：REG<br>STAR：15枚 / ベル：10枚 / ブドウ：8枚 / チェリー：2枚 / リプレイ：再遊技</div></div></div><div id="payEffect" class="payEffect"></div>
<script>
const symbols=["7R","7W","BAR","CHERRY","GRAPE","BELL","STAR"];
const symbolFiles={"7R":"7_red.png","7W":"7_white_purple.png","BAR":"bar.png","CHERRY":"cherry.png","GRAPE":"grape.png","BELL":"bell.png","STAR":"star.png"};
const GAME_STATE=Object.freeze({NORMAL_READY:'NORMAL_READY',NORMAL_BET:'NORMAL_BET',NORMAL_SPIN:'NORMAL_SPIN',NORMAL_RESULT:'NORMAL_RESULT',BONUS_HIT:'BONUS_HIT',BONUS_START:'BONUS_START',BIG_PLAY:'BIG_PLAY',REG_PLAY:'REG_PLAY',BONUS_END:'BONUS_END'});
const SETTING_ODDS=Object.freeze({1:{big:330,reg:470},2:{big:310,reg:430},3:{big:290,reg:390},4:{big:270,reg:350},5:{big:250,reg:310},6:{big:210,reg:270}});
const NORMAL_ODDS=Object.freeze({replay:7.3,bell:60,grape:50,cherry:80,star:150});
const params=new URLSearchParams(location.search);const pachiroMode=params.get('from')==='pachiro';const machineId=params.get('machine')||'UNKNOWN';
let credit=50,bet=0,pay=0,reels=["CHERRY","GRAPE","BELL"],spinning=[false,false,false],timers=[null,null,null],stopped=0,resultType="MISS",targetSymbol=null,totalGames=0,bonusCount=0,payEffectTimer=null,parentInitialized=false,currentState=GAME_STATE.NORMAL_READY,currentBonusType=null,setting=1,replayPending=false;
function setGameState(next,extra={}){if(!Object.values(GAME_STATE).includes(next))return false;const prev=currentState;currentState=next;if(Object.prototype.hasOwnProperty.call(extra,'bonusType'))currentBonusType=extra.bonusType;bridge('state-change',{previousState:prev,currentState,currentBonusType});return true}
function bridge(type,extra={}){if(!pachiroMode||window.parent===window)return;window.parent.postMessage({source:'pekachu',type,machineId,setting,credit,bet,pay,totalGames,bonusCount,currentState,currentBonusType,...extra},location.origin)}
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.source!=='pachiro')return;if(e.data.type==='init'&&!parentInitialized){parentInitialized=true;const incoming=Number(e.data.credit);if(Number.isFinite(incoming))credit=Math.max(0,incoming);const incomingSetting=Number(e.data.setting);if(Number.isInteger(incomingSetting)&&SETTING_ODDS[incomingSetting])setting=incomingSetting;bet=0;pay=0;replayPending=false;currentBonusType=null;setGameState(GAME_STATE.NORMAL_READY);update();bridge('initialized')}});
function drawReel(i){document.getElementById('r'+(i+1)).innerHTML=`<img src="${symbolFiles[reels[i]]}" class="symbol" alt="${reels[i]}">`}
function drawAllReels(){for(let i=0;i<3;i++)drawReel(i)}
function update(){document.getElementById('credit').textContent=credit;document.getElementById('bet').textContent=bet;document.getElementById('pay').textContent=pay;document.getElementById('startBtn').disabled=currentState!==GAME_STATE.NORMAL_BET||bet!==3||spinning.includes(true);for(let i=0;i<3;i++)document.getElementById('s'+(i+1)).disabled=currentState!==GAME_STATE.NORMAL_SPIN||!spinning[i];bridge('state')}
function msg(t,type='normal'){const m=document.getElementById('msg');m.textContent=t;m.classList.remove('big','superMsg');if(type==='big')m.classList.add('big');if(type==='super')m.classList.add('superMsg')}
function rand(){return symbols[Math.floor(Math.random()*symbols.length)]}function clearReelEffects(){for(let i=0;i<3;i++)document.getElementById('r'+(i+1)).classList.remove('spark','superSpark')}function clearSpecialBody(){document.body.classList.remove('flash','superFlash','revival')}function setLamp(mode){const l=document.getElementById('lamp');l.classList.remove('on','super');if(mode==='big')l.classList.add('on');if(mode==='super')l.classList.add('super')}
function chooseResult(){const odds=SETTING_ODDS[setting]||SETTING_ODDS[1];const entries=[{type:'BIG',p:1/odds.big},{type:'REG',p:1/odds.reg},{type:'REPLAY',p:1/NORMAL_ODDS.replay},{type:'BELL',p:1/NORMAL_ODDS.bell},{type:'GRAPE',p:1/NORMAL_ODDS.grape},{type:'CHERRY',p:1/NORMAL_ODDS.cherry},{type:'STAR',p:1/NORMAL_ODDS.star}];const r=Math.random();let edge=0;for(const entry of entries){edge+=entry.p;if(r<edge){if(entry.type==='BIG')return{type:'BIG',symbol:Math.random()<.8?'7R':'7W'};if(entry.type==='REG')return{type:'REG',symbol:'BAR'};if(entry.type==='REPLAY')return{type:'REPLAY',symbol:null};return{type:entry.type,symbol:entry.type}}}return{type:'MISS',symbol:null}}
function hidePayEffect(){const e=document.getElementById('payEffect');e.classList.remove('show');if(payEffectTimer){clearTimeout(payEffectTimer);payEffectTimer=null}}
function showPayEffect(amount){if(amount<=0)return;hidePayEffect();const e=document.getElementById('payEffect');e.textContent='+'+amount;void e.offsetWidth;e.classList.add('show');payEffectTimer=setTimeout(hidePayEffect,900)}
function prepareReplayBet(){bet=3;replayPending=false;setGameState(GAME_STATE.NORMAL_BET);msg('REPLAY - STARTできます');update()}
function betOne(){if(![GAME_STATE.NORMAL_READY,GAME_STATE.NORMAL_BET].includes(currentState)||credit<=0||bet>=3||spinning.includes(true))return;hidePayEffect();credit--;bet++;pay=0;setLamp('off');clearSpecialBody();clearReelEffects();setGameState(GAME_STATE.NORMAL_BET);msg(bet===3?'STARTできます':'BET中');update()}
function maxBet(){if(![GAME_STATE.NORMAL_READY,GAME_STATE.NORMAL_BET].includes(currentState)||spinning.includes(true))return;hidePayEffect();while(bet<3&&credit>0){credit--;bet++}pay=0;setLamp('off');clearSpecialBody();clearReelEffects();if(bet>0)setGameState(GAME_STATE.NORMAL_BET);msg(bet===3?'STARTできます':'クレジット不足');update()}
function start(){if(currentState!==GAME_STATE.NORMAL_BET||bet!==3)return;hidePayEffect();stopped=0;pay=0;clearSpecialBody();clearReelEffects();const chosen=chooseResult();resultType=chosen.type;targetSymbol=chosen.symbol;setGameState(GAME_STATE.NORMAL_SPIN);msg(resultType==='BIG'?'ボーナス気配':resultType==='REG'?'REG気配':resultType==='STAR'?'STARチャンス':resultType==='REPLAY'?'リプレイ':'リール回転中');for(let i=0;i<3;i++){spinning[i]=true;timers[i]=setInterval(()=>{reels[i]=rand();drawReel(i)},70)}bridge('spin-start',{resultType});update()}
function stop(i){if(currentState!==GAME_STATE.NORMAL_SPIN||!spinning[i])return;clearInterval(timers[i]);spinning[i]=false;if(['BIG','REG','STAR','BELL','GRAPE'].includes(resultType))reels[i]=targetSymbol;else if(resultType==='CHERRY')reels[i]=i===0?'CHERRY':rand();else{reels[i]=rand();if(reels[0]===reels[1]&&reels[1]===reels[2])reels[i]='CHERRY'}drawReel(i);stopped++;if(stopped===3){setGameState(GAME_STATE.NORMAL_RESULT);judge()}update()}
function payout(amount,text,type='normal'){pay=amount;credit+=pay;msg(text,type);showPayEffect(pay)}
function completeSpin(result){bet=0;totalGames++;const isBonus=['BIG','REG'].includes(resultType);if(isBonus){bonusCount++;currentBonusType=resultType;setGameState(GAME_STATE.BONUS_HIT,{bonusType:currentBonusType})}else if(resultType==='REPLAY'){currentBonusType=null;replayPending=true;setGameState(GAME_STATE.NORMAL_READY,{bonusType:null})}else{currentBonusType=null;setGameState(GAME_STATE.NORMAL_READY,{bonusType:null})}update();bridge('spin-complete',{result,payout:pay,resultType,setting});if(replayPending)setTimeout(prepareReplayBet,0)}
function judge(){let result='ハズレ';if(resultType==='BIG'&&reels.every(v=>v===targetSymbol)){setLamp(targetSymbol==='7W'?'super':'big');pay=0;msg(targetSymbol==='7W'?'白紫7 BIG BONUS！！':'赤7 BIG BONUS！！',targetSymbol==='7W'?'super':'big');result=targetSymbol==='7W'?'白紫7 BIG BONUS！！':'赤7 BIG BONUS！！'}else if(resultType==='REG'&&reels.every(v=>v==='BAR')){setLamp('big');pay=0;msg('BAR REG BONUS！！','big');result='BAR REG BONUS！！'}else if(resultType==='STAR'&&reels.every(v=>v==='STAR')){payout(15,'STAR 15枚','big');result='STAR 15枚'}else if(resultType==='BELL'&&reels.every(v=>v==='BELL')){payout(10,'ベル 10枚');result='ベル 10枚'}else if(resultType==='GRAPE'&&reels.every(v=>v==='GRAPE')){payout(8,'ブドウ 8枚');result='ブドウ 8枚'}else if(resultType==='CHERRY'&&reels.includes('CHERRY')){payout(2,'チェリー 2枚');result='チェリー 2枚'}else if(resultType==='REPLAY'){pay=0;hidePayEffect();msg('REPLAY');result='REPLAY'}else{pay=0;hidePayEffect();msg('ハズレ')}completeSpin(result)}
function resetGame(){for(let i=0;i<3;i++)clearInterval(timers[i]);hidePayEffect();credit=50;bet=0;pay=0;reels=['CHERRY','GRAPE','BELL'];spinning=[false,false,false];stopped=0;resultType='MISS';targetSymbol=null;totalGames=0;bonusCount=0;replayPending=false;currentBonusType=null;drawAllReels();setLamp('off');clearSpecialBody();clearReelEffects();setGameState(GAME_STATE.NORMAL_READY,{bonusType:null});msg('BETしてください');update();bridge('reset')}
drawAllReels();update();bridge('ready');
</script>
<script src="/Chappy5/src/game/slot-pachiro/machines/pekachu/zelvolt_bonus.js?v=1"></script>
</body></html>
