<style>*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:sans-serif;text-align:center}.wrap{max-width:390px;margin:auto;padding:4px}.machine{position:relative}.top-panel,.center-panel,.info-panel,.play-panel,.role,.reset{position:relative;z-index:1}.top-panel{background:#030303;border-radius:16px;overflow:hidden}.zelvolt-logo{display:block;width:100%;height:auto;max-height:102px;object-fit:cover}.reel-area{display:flex;align-items:center;justify-content:center;gap:7px}.reels{display:flex;gap:6px}.reel{width:80px;height:120px;background:#eee;border-radius:12px;border:4px solid #777;position:relative;overflow:hidden}.lamp,.msg,.reset,.role{display:none}.info-panel{display:flex;justify-content:space-around}.info-box{width:32%}.info-label{font-size:10px}.info-value{font-size:24px;font-weight:800}.operation-unit{display:grid;gap:8px}.control-panel,.stop-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.control-panel{grid-template-columns:1.15fr 1fr 1fr}.stop-panel{grid-template-columns:72px 72px 72px!important;justify-content:center!important;column-gap:3px!important;padding-left:5px!important;padding-right:5px!important}.stop-panel .stop{justify-self:center!important}button{touch-action:manipulation;-webkit-user-select:none;user-select:none}.stop{border-radius:50%}.payEffect{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:38px;font-weight:bold;color:#fff200;display:none;z-index:10}.payEffect.show{display:block}</style>

<div class="wrap"><div class="machine"><div class="led-side led-left"></div><div class="led-side led-right"></div><div class="top-led"></div><div class="top-panel"><img class="zelvolt-logo" src="/Chappy5/src/game/slot-pachiro/machines/pekachu/zelvolt_logo.jpg?v=1" alt="ZELVOLT"></div><div class="center-panel"><div class="reel-area"><div id="lamp" class="lamp"></div><div class="reels"><div id="r1" class="reel"></div><div id="r2" class="reel"></div><div id="r3" class="reel"></div></div></div><div id="msg" class="msg">BETしてください</div></div><div class="info-panel"><div class="info-box"><div class="info-label">CREDIT</div><div id="credit" class="info-value">50</div></div><div class="info-box"><div class="info-label">BET</div><div id="bet" class="info-value">0</div></div><div class="info-box"><div class="info-label">PAYOUT</div><div id="pay" class="info-value">0</div></div></div><div class="play-panel"><div class="operation-unit"><div class="control-panel"><button id="startBtn" type="button" class="btn-lever" onclick="start()" disabled>START<br>レバー</button><button type="button" class="btn-bet" onclick="betOne()">BET</button><button type="button" class="btn-bet" onclick="maxBet()">MAX<br>BET</button></div><div class="stop-panel"><button id="s1" type="button" class="stop" onclick="stop(0)" disabled>STOP</button><button id="s2" type="button" class="stop" onclick="stop(1)" disabled>STOP</button><button id="s3" type="button" class="stop" onclick="stop(2)" disabled>STOP</button></div></div></div><button type="button" class="reset" onclick="resetGame()">リセット</button><div class="role"></div></div></div><div id="payEffect" class="payEffect"></div>
<script src="/Chappy5/src/game/slot-pachiro/machines/zelvolt/zelvolt_symbols.js?v=3"></script>
<script>
const symbols=['7R','7W','BAR','CHERRY','GRAPE','BELL','REPLAY'];const symbolFiles=window.ZELVOLT_SYMBOLS;const GAME_STATE=Object.freeze({NORMAL_READY:'NORMAL_READY',NORMAL_BET:'NORMAL_BET',NORMAL_SPIN:'NORMAL_SPIN',NORMAL_RESULT:'NORMAL_RESULT',BONUS_HIT:'BONUS_HIT',BONUS_START:'BONUS_START',BIG_PLAY:'BIG_PLAY',REG_PLAY:'REG_PLAY',BONUS_END:'BONUS_END'});const SETTING_ODDS=Object.freeze({1:{big:330,reg:470},2:{big:310,reg:430},3:{big:290,reg:390},4:{big:270,reg:350},5:{big:250,reg:310},6:{big:210,reg:270}});const NORMAL_ODDS=Object.freeze({replay:7.3,bell:60,grape:50,cherry:80});const params=new URLSearchParams(location.search);const pachiroMode=params.get('from')==='pachiro';const machineId=params.get('machine')||'UNKNOWN';let credit=50,bet=0,pay=0,reels=['CHERRY','GRAPE','BELL'],spinning=[false,false,false],timers=[null,null,null],stopped=0,resultType='MISS',targetSymbol=null,totalGames=0,bonusCount=0,payEffectTimer=null,parentInitialized=false,currentState=GAME_STATE.NORMAL_READY,currentBonusType=null,setting=1,replayPending=false;
function setGameState(next,extra={}){if(!Object.values(GAME_STATE).includes(next))return false;const prev=currentState;currentState=next;if(Object.prototype.hasOwnProperty.call(extra,'bonusType'))currentBonusType=extra.bonusType;bridge('state-change',{previousState:prev,currentState,currentBonusType});return true}function bridge(type,extra={}){if(!pachiroMode||window.parent===window)return;window.parent.postMessage({source:'pekachu',type,machineId,setting,credit,bet,pay,totalGames,bonusCount,currentState,currentBonusType,...extra},location.origin)}window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent||e.data?.source!=='pachiro')return;if(e.data.type==='init'&&!parentInitialized){parentInitialized=true;const incoming=Number(e.data.credit);if(Number.isFinite(incoming))credit=Math.max(0,incoming);const incomingSetting=Number(e.data.setting);if(Number.isInteger(incomingSetting)&&SETTING_ODDS[incomingSetting])setting=incomingSetting;bet=0;pay=0;replayPending=false;currentBonusType=null;setGameState(GAME_STATE.NORMAL_READY);update();bridge('initialized')}});
function drawReel(i){document.getElementById('r'+(i+1)).innerHTML=`<img src="${symbolFiles[reels[i]]}" class="symbol" alt="${reels[i]}">`}function drawAllReels(){for(let i=0;i<3;i++)drawReel(i)}function update(){document.getElementById('credit').textContent=credit;document.getElementById('bet').textContent=bet;document.getElementById('pay').textContent=pay;document.getElementById('startBtn').disabled=currentState!==GAME_STATE.NORMAL_BET||bet!==3||spinning.includes(true);for(let i=0;i<3;i++)document.getElementById('s'+(i+1)).disabled=currentState!==GAME_STATE.NORMAL_SPIN||!spinning[i];bridge('state')}function msg(t,type='normal'){const m=document.getElementById('msg');m.textContent=t;m.className='msg'+(type==='big'?' big':type==='super'?' superMsg':'')}function rand(){return symbols[Math.floor(Math.random()*symbols.length)]}function clearReelEffects(){}function clearSpecialBody(){}function setLamp(){}
function chooseResult(){const odds=SETTING_ODDS[setting]||SETTING_ODDS[1];const entries=[{type:'BIG',p:1/odds.big},{type:'REG',p:1/odds.reg},{type:'REPLAY',p:1/NORMAL_ODDS.replay},{type:'BELL',p:1/NORMAL_ODDS.bell},{type:'GRAPE',p:1/NORMAL_ODDS.grape},{type:'CHERRY',p:1/NORMAL_ODDS.cherry}];const r=Math.random();let edge=0;for(const entry of entries){edge+=entry.p;if(r<edge){if(entry.type==='BIG')return{type:'BIG',symbol:Math.random()<.8?'7R':'7W'};if(entry.type==='REG')return{type:'REG',symbol:'BAR'};if(entry.type==='REPLAY')return{type:'REPLAY',symbol:'REPLAY'};return{type:entry.type,symbol:entry.type}}}return{type:'MISS',symbol:null}}function hidePayEffect(){const e=document.getElementById('payEffect');e.classList.remove('show');if(payEffectTimer){clearTimeout(payEffectTimer);payEffectTimer=null}}function showPayEffect(amount){if(amount<=0)return;hidePayEffect();const e=document.getElementById('payEffect');e.textContent='+'+amount;e.classList.add('show');payEffectTimer=setTimeout(hidePayEffect,900)}function prepareReplayBet(){bet=3;replayPending=false;setGameState(GAME_STATE.NORMAL_BET);update()}function betOne(){if(![GAME_STATE.NORMAL_READY,GAME_STATE.NORMAL_BET].includes(currentState)||credit<=0||bet>=3||spinning.includes(true))return;hidePayEffect();credit--;bet++;pay=0;setGameState(GAME_STATE.NORMAL_BET);update()}function maxBet(){if(![GAME_STATE.NORMAL_READY,GAME_STATE.NORMAL_BET].includes(currentState)||spinning.includes(true))return;hidePayEffect();while(bet<3&&credit>0){credit--;bet++}pay=0;if(bet>0)setGameState(GAME_STATE.NORMAL_BET);update()}function start(){if(currentState!==GAME_STATE.NORMAL_BET||bet!==3)return;hidePayEffect();stopped=0;pay=0;const chosen=chooseResult();resultType=chosen.type;targetSymbol=chosen.symbol;setGameState(GAME_STATE.NORMAL_SPIN);for(let i=0;i<3;i++){spinning[i]=true;timers[i]=setInterval(()=>{reels[i]=rand();drawReel(i)},70)}bridge('spin-start',{resultType});update()}function stop(i){if(currentState!==GAME_STATE.NORMAL_SPIN||!spinning[i])return;clearInterval(timers[i]);spinning[i]=false;if(['BIG','REG','REPLAY','BELL','GRAPE'].includes(resultType))reels[i]=targetSymbol;else if(resultType==='CHERRY')reels[i]=i===0?'CHERRY':rand();else{reels[i]=rand();if(reels[0]===reels[1]&&reels[1]===reels[2])reels[i]='CHERRY'}drawReel(i);stopped++;if(stopped===3){setGameState(GAME_STATE.NORMAL_RESULT);judge()}update()}function payout(amount,text,type='normal'){pay=amount;credit+=pay;showPayEffect(pay)}function completeSpin(result){bet=0;totalGames++;const isBonus=['BIG','REG'].includes(resultType);if(isBonus){bonusCount++;currentBonusType=resultType;setGameState(GAME_STATE.BONUS_HIT,{bonusType:currentBonusType})}else if(resultType==='REPLAY'){currentBonusType=null;replayPending=true;setGameState(GAME_STATE.NORMAL_READY,{bonusType:null})}else{currentBonusType=null;setGameState(GAME_STATE.NORMAL_READY,{bonusType:null})}update();bridge('spin-complete',{result,payout:pay,resultType,setting});if(replayPending)setTimeout(prepareReplayBet,0)}function judge(){let result='MISS';if(resultType==='BIG'&&reels.every(v=>v===targetSymbol)){result='BIG'}else if(resultType==='REG'&&reels.every(v=>v==='BAR')){result='REG'}else if(resultType==='BELL'&&reels.every(v=>v==='BELL')){payout(10);result='BELL'}else if(resultType==='GRAPE'&&reels.every(v=>v==='GRAPE')){payout(8);result='GRAPE'}else if(resultType==='CHERRY'&&reels.includes('CHERRY')){payout(2);result='CHERRY'}else if(resultType==='REPLAY'){pay=0;result='REPLAY'}else{pay=0}completeSpin(result)}function resetGame(){for(let i=0;i<3;i++)clearInterval(timers[i]);credit=50;bet=0;pay=0;reels=['CHERRY','GRAPE','BELL'];spinning=[false,false,false];stopped=0;resultType='MISS';targetSymbol=null;totalGames=0;bonusCount=0;replayPending=false;currentBonusType=null;drawAllReels();setGameState(GAME_STATE.NORMAL_READY,{bonusType:null});update();bridge('reset')}drawAllReels();update();bridge('ready');
</script><script src="/Chappy5/src/game/slot-pachiro/machines/pekachu/zelvolt_bonus_core.js?v=20260911-native1"></script><script src="/Chappy5/src/game/slot-pachiro/machines/pekachu/zelvolt_reel_core.js?v=20260912-native9"></script></body></html>
