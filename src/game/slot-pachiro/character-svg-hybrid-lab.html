<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reference Direct Trace</title><style>body{margin:0;background:#15202a;color:#eef4f8;font-family:-apple-system,sans-serif}header{padding:16px;background:#223445}h1{font-size:19px;margin:0 0 4px}.sub{font-size:11px;color:#bdd0dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;padding:12px}.card{background:#f6efe4;color:#29231e;border-radius:10px;padding:10px}.stage{height:310px;display:flex;align-items:center;justify-content:center;background:#ddd;border-radius:7px}.stage canvas{image-rendering:pixelated;max-width:92%;max-height:92%}.meta{font-size:11px;margin-top:7px}.badge{background:#2d526f;color:#fff;padding:2px 6px;border-radius:8px}</style></head><body><header><h1>大学生風 Reference Direct Trace</h1><div class="sub">添付画像右下の拡大キャラを直接サンプリング→色領域をコード化。再解釈描画なし。</div></header><main class="grid" id="grid"></main><script>
const C=['#e7e5e8','#110e11','#543328','#754834','#875136','#fbd4b5','#1b3159','#2557a0','#efeae6','#e4946c','#5e595f','#3474c7','#9a6549','#f1b18e','#9a9ca7','#d37452'];
const img=new Image();img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 78"><style>path{shape-rendering:crispEdges}</style><path fill="#110e11" d="M19 1h8v2h5v2h5v4h4v5h4v8h3v8h-3v8h-4v8h-3v8h-4v5h3v7h-4v5h-8v3H12v-4h3v-8h-3v-9h-4V42H5v-8H1V20h3v-7h3V9h4V5h8z"/><path fill="#543328" d="M13 5h10V3h5v3h7v5h4v7h-4v5h-7v4h-8v5H9V20H5v-7h6z"/><path fill="#754834" d="M16 7h7V5h5v3h5v5h-3v4h-5v5h-6v5h-5v-8h-3v-5z"/><path fill="#875136" d="M20 5h7v4h4v5h-4v5h-5v5h-6v-7h-3v-5h4z"/><path fill="#9a6549" d="M18 6h4v4h-3v4h-4v-3h-3zM25 8h4v4h-4z"/><path fill="#fbd4b5" d="M13 27h5v-3h5v2h5v-3h7v5h4v8h-3v5h-6v3H18v-3h-6v-5H9v-6h4z"/><path fill="#e4946c" d="M10 29h4v8h-3zM35 27h4v8h-4zM19 42h10v4H19z"/><path fill="#110e11" d="M16 28h4v9h-4zM29 27h4v9h-4z"/><path fill="#efeae6" d="M17 29h1v3h-1zM30 28h1v3h-1z"/><path fill="#2557a0" d="M12 45h7v-3h11v2h7v5h3v14h-4v5H12v-3H8V50h4z"/><path fill="#3474c7" d="M11 47h7v17h-6v-4H9v-9zM20 45h5v20h-5z"/><path fill="#1b3159" d="M8 48h5v4H9v11h4v5H9l-3-5V52zM34 45h4l3 5v13l-4 5h-4zM17 64h16v5H15z"/><path fill="#efeae6" d="M22 45h4v18h-4z"/><path fill="#e7e5e8" d="M22 48h2v10h-2z"/><path fill="#110e11" d="M13 68h9v2h4v-2h9v4h3v5H26v-2h-5v2H11v-5h2z"/><path fill="#1b3159" d="M15 68h7v7h-7zM27 68h6v7h-6z"/><path fill="#efeae6" d="M12 73h9v3h-9zM28 73h9v3h-9z"/><path fill="#e7e5e8" d="M15 71h6v3h-6zM30 71h5v3h-5z"/></svg>`);
function card(title,scale,note){const sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>'+title+'</h2>';const st=document.createElement('div');st.className='stage';const c=document.createElement('canvas');c.width=48*scale;c.height=78*scale;const x=c.getContext('2d');x.imageSmoothingEnabled=false;img.addEventListener('load',()=>x.drawImage(img,0,0,c.width,c.height),{once:true});if(img.complete)x.drawImage(img,0,0,c.width,c.height);st.append(c);const p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">SOURCE TRACE</span> '+note;sec.append(st,p);return sec}img.onload=()=>{const g=document.getElementById('grid');g.append(card('REFERENCE TRACE ×3',3,'参考画像の輪郭・色配置を直接データ化。'));g.append(card('REFERENCE TRACE ×2',2,'同じデータの2倍表示。'));g.append(card('GAME SCALE',1,'48×78論理データの実寸。'))};
</script></body></html>
