<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大学生風 Reference Trace SVG Lab</title><style>body{margin:0;background:#15202a;color:#eef4f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{padding:16px;background:#223445}h1{font-size:19px;margin:0 0 4px}.sub{font-size:11px;color:#bdd0dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;padding:12px}.card{background:#f6efe4;color:#29231e;border-radius:10px;padding:10px}.card h2{font-size:14px;margin:0 0 5px}.stage{height:300px;display:flex;align-items:center;justify-content:center;background:#efdbb4;border-radius:7px;overflow:hidden}.stage svg,.stage canvas{width:240px;height:240px}.pixel{image-rendering:pixelated}.meta{font-size:11px;line-height:1.5;margin-top:7px}.badge{display:inline-block;background:#2d526f;color:#fff;padding:2px 6px;border-radius:8px;margin-right:4px}</style></head><body><header><h1>大学生風 Reference Trace SVG Lab</h1><div class="sub"> supplied referenceの待機・右下向き1体を基準に再造形。大きい髪、狭い顔、小さい身体、青パーカー、短脚、大型白スニーカー。</div></header><main class="grid" id="grid"></main><script>

function e(tag,a={}){const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));return n}
function add(g,tag,a){const n=e(tag,a);g.appendChild(n);return n}
function rig(){const s=e('svg',{viewBox:'0 0 192 192'});const r=add(s,'g',{id:'student'});
add(r,'ellipse',{cx:97,cy:176,rx:27,ry:4.5,fill:'#000',opacity:.11});

let g=add(r,'g',{id:'backLeg'});add(g,'path',{d:'M104 137 L116 138 L121 160 L128 168 L124 174 L108 174 L105 157 Z',fill:C.ol});add(g,'path',{d:'M108 141 L114 142 L117 158 L122 166 L115 169 L109 156 Z',fill:C.pants});add(g,'path',{d:'M116 165 L128 165 L138 171 L137 177 L111 177 L108 173 Z',fill:C.shoe});add(g,'path',{d:'M118 169 L129 169 L134 172 L132 174 L115 174 Z',fill:C.sole});
// front leg
g=add(r,'g',{id:'frontLeg'});add(g,'path',{d:'M77 137 L92 138 L90 157 L84 168 L66 174 L62 169 L70 157 L71 141 Z',fill:C.ol});add(g,'path',{d:'M79 141 L88 141 L86 155 L80 164 L70 168 L68 165 L73 155 L74 143 Z',fill:C.pantsL});add(g,'path',{d:'M63 165 L82 165 L94 171 L90 178 L60 178 L53 173 Z',fill:C.shoe});add(g,'path',{d:'M64 169 L81 169 L88 172 L86 175 L60 175 Z',fill:C.sole});
// torso compact and narrow
add(r,'path',{d:'M69 91 Q77 83 88 82 L105 82 Q118 83 126 91 Q133 99 133 112 L131 137 Q126 145 116 148 L77 148 Q66 145 61 136 L59 111 Q60 99 69 91Z',fill:C.ol});
add(r,'path',{d:'M72 94 Q79 87 89 87 L104 87 Q114 88 122 94 Q127 101 127 111 L125 133 Q121 140 114 142 L79 142 Q71 140 67 134 L65 112 Q66 101 72 94Z',fill:C.blue});
// left/front plane
add(r,'path',{d:'M72 96 Q79 88 87 88 L87 138 Q78 140 72 134 L69 112Z',fill:C.blueM});add(r,'path',{d:'M75 99 Q79 92 83 92 L82 119 L75 122Z',fill:C.blueL});

// pocket
add(r,'path',{d:'M76 128 Q85 124 95 128 Q106 124 117 128 L112 136 L81 136Z',fill:C.blueD});
// sleeves: short, rounded
add(r,'path',{d:'M67 92 Q57 96 54 106 L53 128 Q55 137 62 141 L69 135 L70 105Z',fill:C.ol});add(r,'path',{d:'M64 97 Q59 100 58 107 L58 126 Q59 132 62 135 L65 131 L65 106Z',fill:C.blueM});add(r,'circle',{cx:61,cy:140,r:4.4,fill:C.ol});add(r,'circle',{cx:61,cy:140,r:2.6,fill:C.skin});
add(r,'path',{d:'M124 92 Q132 96 136 105 L137 129 Q135 137 129 141 L123 135 L122 104Z',fill:C.ol});add(r,'path',{d:'M127 97 Q131 100 132 107 L133 127 Q132 132 129 135 L126 131 L126 105Z',fill:C.blue});add(r,'circle',{cx:130,cy:140,r:4.2,fill:C.ol});add(r,'circle',{cx:130,cy:140,r:2.5,fill:C.skin});
// tiny neck only
add(r,'path',{d:'M89 83 L104 83 L103 90 Q97 94 91 90Z',fill:C.ol});add(r,'path',{d:'M92 84 L101 84 L100 89 Q97 91 93 89Z',fill:C.skinD});
// ears small and partly hidden
add(r,'path',{d:'M58 54 Q52 56 51 64 Q51 72 57 75 Q62 73 63 67 L62 59 Q61 55 58 54Z',fill:C.ol});add(r,'path',{d:'M58 58 Q55 59 55 64 Q55 69 58 71 Q60 69 60 65 L60 60Z',fill:C.skin});
add(r,'path',{d:'M133 55 Q139 57 140 64 Q140 72 134 75 Q129 73 128 67 L129 59 Q130 56 133 55Z',fill:C.ol});add(r,'path',{d:'M133 59 Q136 60 136 64 Q136 69 133 71 Q131 69 131 65 L131 60Z',fill:C.skin});
// face: narrow, tall enough, shifted right for quarter-view
add(r,'path',{d:'M61 35 Q73 21 96 20 Q118 21 131 36 L132 62 Q130 76 118 84 Q108 91 94 91 Q77 91 67 82 Q60 75 59 63Z',fill:C.ol});add(r,'path',{d:'M65 39 Q76 27 96 26 Q115 27 127 40 L128 61 Q126 72 116 79 Q107 85 94 85 Q80 85 72 78 Q66 72 65 62Z',fill:C.skin});add(r,'path',{d:'M69 42 Q78 31 96 31 Q112 32 123 43 L124 60 Q122 69 114 74 Q106 80 95 80 Q83 80 76 74 Q70 69 69 60Z',fill:C.skinL});
// hair silhouette from reference: tall, fluffy, asymmetrical, not wide-flat
add(r,'path',{d:'M57 57 L51 53 L53 46 L56 42 L54 35 L61 35 L63 29 L70 30 L74 24 L81 26 L87 20 L93 23 L99 18 L104 23 L111 21 L114 27 L122 25 L123 32 L130 32 L129 39 L136 42 L132 48 L138 52 L133 58 L134 63 L127 64 Q126 53 119 45 Q110 36 98 34 Q85 34 75 41 Q65 48 63 62Z',fill:C.hairD});
add(r,'path',{d:'M60 52 Q62 39 72 31 Q82 24 96 25 Q110 25 120 34 Q127 40 128 50 L121 48 Q117 41 111 37 L108 44 L101 36 L96 44 L89 35 L82 44 L75 37 L68 49Z',fill:C.hair});
// front bangs, shaped closer to reference
[['M61 50 Q64 39 70 35 L69 53 L64 59Z',C.hair],['M68 47 Q72 34 79 32 L78 51 L72 59Z',C.hairM],['M77 45 Q81 31 88 30 L86 51 L80 59Z',C.hair],['M85 43 Q90 29 97 30 L94 52 L88 59Z',C.hairM],['M95 44 Q101 31 108 33 L104 53 L97 59Z',C.hair],['M105 46 Q111 34 117 38 L113 54 L107 60Z',C.hairM],['M115 49 Q121 41 126 45 L122 55 L117 60Z',C.hair]].forEach(([d,f])=>add(r,'path',{d,fill:f}));
// hair color clusters
[['M68 35 L74 29 L79 31 L74 39Z',C.hairL],['M80 28 L86 24 L91 27 L87 34Z',C.hairHi],['M95 27 L101 24 L107 28 L102 35Z',C.hairL],['M109 31 L115 29 L120 34 L114 39Z',C.hairHi],['M61 43 L66 37 L69 39 L65 46Z',C.hairL],['M75 41 L80 35 L84 37 L81 44Z',C.hairM],['M100 39 L105 34 L109 37 L106 43Z',C.hairM]].forEach(([d,f])=>add(r,'path',{d,fill:f}));
// features, eyes lower and clearly visible
add(r,'path',{d:'M72 57 Q76 55 80 56',fill:'none',stroke:C.hairD,'stroke-width':1.7,'stroke-linecap':'round'});add(r,'path',{d:'M107 56 Q111 55 115 57',fill:'none',stroke:C.hairD,'stroke-width':1.6,'stroke-linecap':'round'});
add(r,'rect',{x:73,y:60,width:6.5,height:11.5,rx:1.8,fill:C.eye});add(r,'rect',{x:108.5,y:60,width:5.5,height:10.5,rx:1.7,fill:C.eye});add(r,'rect',{x:75,y:61,width:1.8,height:2.5,rx:.8,fill:C.shirt});add(r,'rect',{x:110,y:61,width:1.6,height:2.3,rx:.7,fill:C.shirt});
add(r,'path',{d:'M95 68 L93 72 L97 72Z',fill:C.skinD});add(r,'path',{d:'M89 77 Q95 80 101 77',fill:'none',stroke:C.mouth,'stroke-width':1.8,'stroke-linecap':'round'});
return s}
function raster(size){const svg=rig();const xml=new XMLSerializer().serializeToString(svg);const img=new Image();const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=true;return new Promise(res=>{img.onload=()=>{ctx.drawImage(img,0,0,size,size);res(c)};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)})}
async function build(){const g=document.getElementById('grid');let sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>1. SVG REFERENCE RIG</h2>';let st=document.createElement('div');st.className='stage';st.append(rig());let p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">REFERENCE-BASED</span>待機・右下向き1体に集中。';sec.append(st,p);g.append(sec);
const c192=await raster(192);sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>2. 192px RASTER</h2>';st=document.createElement('div');st.className='stage';st.append(c192);p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">192px</span>拡大確認。';sec.append(st,p);g.append(sec);
const c48=await raster(48),up=document.createElement('canvas');up.width=up.height=192;const ux=up.getContext('2d');ux.imageSmoothingEnabled=false;ux.drawImage(c48,0,0,48,48,0,0,192,192);up.className='pixel';sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>3. 48px GAME TARGET</h2>';st=document.createElement('div');st.className='stage';st.append(up);p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">48px</span>実ゲーム向け変換を4倍表示。';sec.append(st,p);g.append(sec)}build();</script></body></html>
