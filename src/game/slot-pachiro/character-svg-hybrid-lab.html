<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大学生風 SVG→Pixel Hybrid Lab</title><style>body{margin:0;background:#15202a;color:#eef4f8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}header{padding:16px;background:#223445}h1{font-size:19px;margin:0 0 4px}.sub{font-size:11px;color:#bdd0dc}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;padding:12px}.card{background:#f6efe4;color:#29231e;border-radius:10px;padding:10px}.card h2{font-size:14px;margin:0 0 5px}.stage{height:285px;display:flex;align-items:center;justify-content:center;background:#efdbb4;border-radius:7px;overflow:hidden}.stage svg,.stage canvas{width:230px;height:230px}.pixel{image-rendering:pixelated}.meta{font-size:11px;line-height:1.5;margin-top:7px}.badge{display:inline-block;background:#2d526f;color:#fff;padding:2px 6px;border-radius:8px;margin-right:4px}</style></head><body><header><h1>大学生風 SVG→Pixel Hybrid Lab</h1><div class="sub">参考画像を独立パーツのSVGリグで造形し、192px / 48pxへ変換。PNG完成絵は使用しない。</div></header><main class="grid" id="grid"></main><script>
const NS='http://www.w3.org/2000/svg';
const C={ol:'#211915',hd:'#35231d',h1:'#543424',h2:'#74482f',h3:'#95603d',h4:'#bd7c4c',h5:'#df9b61',sk0:'#d57e62',sk1:'#ef9e7b',sk2:'#ffc39b',sk3:'#ffe0bd',b0:'#12345d',b1:'#174d85',b2:'#2368ad',b3:'#4388c9',b4:'#73addb',w0:'#d3dbe0',w1:'#f6f5ef',p0:'#17212c',p1:'#2b3d4f',p2:'#465d72',shoe:'#171a1e',sole:'#f4f3ef',eye:'#251a17',mouth:'#9a514a'};
function svgEl(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function add(g,tag,attrs){const e=svgEl(tag,attrs);g.appendChild(e);return e}
function rig(){const s=svgEl('svg',{viewBox:'0 0 192 192','aria-label':'university student character rig'});const root=add(s,'g',{id:'student'});
// shadow
add(root,'ellipse',{cx:98,cy:176,rx:34,ry:5,fill:'#000',opacity:.12});
// back leg + shoe
let g=add(root,'g',{id:'legBack'});add(g,'path',{d:'M103 139 Q111 140 117 143 L122 164 Q127 168 132 171 L129 179 L105 178 L107 158 Z',fill:C.ol});add(g,'path',{d:'M106 142 Q112 142 115 145 L118 161 Q121 166 125 169 L111 171 L109 157 Z',fill:C.p1});add(g,'path',{d:'M115 166 L132 167 Q139 171 141 175 L138 180 L112 180 L108 176 Z',fill:C.shoe});add(g,'path',{d:'M118 170 L133 170 Q136 172 137 174 L135 176 L117 176 Z',fill:C.sole});
// front leg + shoe
 g=add(root,'g',{id:'legFront'});add(g,'path',{d:'M76 138 Q85 138 94 141 L91 160 Q88 168 83 174 L61 177 L63 168 Q69 161 72 153 Z',fill:C.ol});add(g,'path',{d:'M79 142 L90 143 L87 158 Q84 165 80 169 L68 171 Q71 164 73 157 Z',fill:C.p2});add(g,'path',{d:'M62 166 L82 166 Q90 170 94 174 L89 180 L59 180 L53 175 Z',fill:C.shoe});add(g,'path',{d:'M64 170 L82 170 Q87 172 89 174 L85 176 L61 176 Z',fill:C.sole});
// torso
 g=add(root,'g',{id:'torso'});add(g,'path',{d:'M66 86 Q77 75 94 76 Q111 74 126 84 Q137 93 139 108 L136 137 Q130 145 119 150 L74 150 Q62 146 57 137 L55 107 Q57 95 66 86Z',fill:C.ol});add(g,'path',{d:'M69 89 Q80 80 95 81 Q110 80 122 87 Q130 95 132 108 L130 133 Q125 141 116 144 L77 144 Q68 141 63 134 L61 109 Q62 98 69 89Z',fill:C.b1});
// hoodie front planes
add(g,'path',{d:'M69 93 Q77 84 88 83 L86 138 Q77 141 70 136 L66 109Z',fill:C.b3});add(g,'path',{d:'M122 89 Q130 97 131 109 L128 132 Q125 137 121 139 L116 86Z',fill:C.b2});add(g,'path',{d:'M73 98 Q78 89 84 88 L82 120 L74 123Z',fill:C.b4});
// shirt
add(g,'path',{d:'M89 82 L105 82 L106 132 L97 140 L89 132Z',fill:C.w0});add(g,'path',{d:'M94 82 L101 82 L101 132 L97 136 L94 132Z',fill:C.w1});
// hood volume
add(g,'path',{d:'M71 88 Q76 76 88 75 Q95 80 99 86 Q105 79 115 75 Q123 79 126 88 Q119 93 112 94 L81 94 Q75 92 71 88Z',fill:C.ol});add(g,'path',{d:'M76 87 Q80 79 88 80 Q95 85 98 91 Q103 84 113 80 Q120 82 122 87 Q115 90 109 90 L82 90 Q79 89 76 87Z',fill:C.b0});
// pocket
add(g,'path',{d:'M73 128 Q84 123 96 128 Q107 123 120 128 L114 138 L80 138Z',fill:C.b0});
// sleeves and hands
 g=add(root,'g',{id:'armBack'});add(g,'path',{d:'M124 87 Q137 91 141 102 L142 132 Q138 141 130 145 L123 136 L125 103Z',fill:C.ol});add(g,'path',{d:'M128 92 Q135 96 137 104 L138 129 Q136 135 132 138 L128 133 L129 104Z',fill:C.b2});add(g,'ellipse',{cx:133,cy:143,rx:5,ry:4,fill:C.ol});add(g,'ellipse',{cx:133,cy:143,rx:3,ry:2.7,fill:C.sk2});
 g=add(root,'g',{id:'armFront'});add(g,'path',{d:'M64 88 Q54 93 51 104 L50 131 Q53 140 61 144 L68 134 L67 103Z',fill:C.ol});add(g,'path',{d:'M61 94 Q56 98 55 106 L55 128 Q56 134 59 137 L63 132 L63 104Z',fill:C.b2});add(g,'ellipse',{cx:59,cy:142,rx:5,ry:4,fill:C.ol});add(g,'ellipse',{cx:59,cy:142,rx:3,ry:2.7,fill:C.sk2});
// ears tucked under hair
 g=add(root,'g',{id:'ears'});add(g,'path',{d:'M47 58 Q40 61 40 70 Q40 80 47 83 Q53 81 55 74 L54 63 Q52 59 47 58Z',fill:C.ol});add(g,'path',{d:'M47 62 Q44 64 44 70 Q44 76 48 78 Q51 75 51 70 L50 64Z',fill:C.sk1});add(g,'path',{d:'M145 58 Q152 61 152 70 Q152 80 145 83 Q139 81 137 74 L138 63 Q140 59 145 58Z',fill:C.ol});add(g,'path',{d:'M145 62 Q148 64 148 70 Q148 76 144 78 Q141 75 141 70 L142 64Z',fill:C.sk1});
// face
 g=add(root,'g',{id:'face'});add(g,'path',{d:'M55 36 Q69 19 96 18 Q123 20 137 38 L137 68 Q133 83 119 91 Q108 98 91 97 Q72 96 61 86 Q53 78 51 64Z',fill:C.ol});add(g,'path',{d:'M59 39 Q72 25 96 24 Q119 25 132 40 L132 66 Q129 78 117 85 Q107 91 92 91 Q76 90 66 82 Q59 75 57 64Z',fill:C.sk1});add(g,'path',{d:'M64 41 Q75 30 96 29 Q116 30 127 43 L127 64 Q125 74 115 80 Q106 86 92 85 Q79 84 70 78 Q64 72 63 63Z',fill:C.sk3});
// hair back silhouette with irregular spikes
 g=add(root,'g',{id:'hairBack'});add(g,'path',{d:'M52 61 L46 55 L48 45 L53 41 L51 34 L59 34 L61 27 L70 29 L75 21 L82 24 L90 17 L96 22 L104 18 L108 25 L116 23 L118 30 L127 29 L126 36 L135 39 L131 45 L139 49 L134 55 L136 63 L128 65 Q126 52 116 43 Q106 35 94 34 Q79 34 68 43 Q59 50 56 64Z',fill:C.hd});
// mid hair masses
add(g,'path',{d:'M55 52 Q57 37 69 30 Q82 22 96 24 Q113 25 124 35 Q131 42 132 52 L124 49 Q120 40 112 36 L108 44 L101 35 L95 44 L87 34 L80 44 L72 36 L65 48Z',fill:C.h2});
// explicit front bangs as independent paths
const bangs=[['M58 51 Q61 40 69 35 L68 53 L62 60Z',C.h1],['M66 48 Q70 35 78 32 L77 51 L70 59Z',C.h3],['M75 45 Q80 31 87 30 L85 51 L79 59Z',C.h1],['M84 44 Q89 29 97 30 L94 51 L87 59Z',C.h3],['M94 44 Q101 30 108 33 L104 52 L97 58Z',C.h1],['M104 46 Q111 33 118 38 L113 53 L107 59Z',C.h2],['M114 49 Q120 39 126 44 L121 55 L116 60Z',C.h1]];bangs.forEach(([d,f],i)=>add(g,'path',{id:'bang'+i,d,fill:f}));
// hair highlight clusters
[['M67 34 L73 28 L78 30 L73 37Z',C.h4],['M80 27 L86 23 L91 26 L87 33Z',C.h5],['M96 26 L102 23 L108 27 L103 34Z',C.h4],['M111 31 L117 29 L121 34 L115 39Z',C.h5],['M59 42 L65 35 L68 38 L64 45Z',C.h4]].forEach(([d,f])=>add(g,'path',{d,fill:f}));
// face features
 g=add(root,'g',{id:'features'});add(g,'path',{d:'M70 58 Q75 55 80 56',fill:'none',stroke:C.hd,'stroke-width':2,'stroke-linecap':'round'});add(g,'path',{d:'M108 56 Q113 55 117 58',fill:'none',stroke:C.hd,'stroke-width':2,'stroke-linecap':'round'});add(g,'rect',{x:73,y:61,width:7,height:12,rx:2.5,fill:C.eye});add(g,'rect',{x:109,y:61,width:6,height:11,rx:2.5,fill:C.eye});add(g,'rect',{x:75,y:62,width:2,height:3,rx:1,fill:C.w1});add(g,'rect',{x:111,y:62,width:2,height:3,rx:1,fill:C.w1});add(g,'path',{d:'M96 70 L94 74 L98 74Z',fill:C.sk0});add(g,'path',{d:'M89 80 Q96 84 103 80',fill:'none',stroke:C.mouth,'stroke-width':2,'stroke-linecap':'round'});add(g,'ellipse',{cx:67,cy:76,rx:6,ry:2.5,fill:C.sk0,opacity:.24});add(g,'ellipse',{cx:121,cy:76,rx:5,ry:2,fill:C.sk0,opacity:.2});
return s}
function toCanvas(size,pixelate=false){const svg=rig();const xml=new XMLSerializer().serializeToString(svg);const img=new Image();const c=document.createElement('canvas');c.width=c.height=size;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=!pixelate;const promise=new Promise(res=>{img.onload=()=>{ctx.clearRect(0,0,size,size);ctx.drawImage(img,0,0,size,size);res(c)};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)});return {c,promise}}
async function build(){const g=document.getElementById('grid');const svg=rig();let sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>1. SVG RIG MASTER</h2>';let st=document.createElement('div');st.className='stage';st.append(svg);let p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">VECTOR RIG</span>髪束・顔・服・腕・脚を独立パーツで保持。';sec.append(st,p);g.append(sec);
const r192=toCanvas(192,false);await r192.promise;sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>2. 192px RASTER</h2>';st=document.createElement('div');st.className='stage';st.append(r192.c);p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">SVG→192</span>ゲーム用高精細プレビュー。';sec.append(st,p);g.append(sec);
const low=toCanvas(48,true);await low.promise;const up=document.createElement('canvas');up.width=up.height=192;let ux=up.getContext('2d');ux.imageSmoothingEnabled=false;ux.drawImage(low.c,0,0,48,48,0,0,192,192);up.className='pixel';sec=document.createElement('section');sec.className='card';sec.innerHTML='<h2>3. 48px PIXEL CONVERSION</h2>';st=document.createElement('div');st.className='stage';st.append(up);p=document.createElement('div');p.className='meta';p.innerHTML='<span class="badge">SVG→48</span>48pxへ直接ラスタライズし、4倍表示。';sec.append(st,p);g.append(sec)}build();
</script></body></html>
