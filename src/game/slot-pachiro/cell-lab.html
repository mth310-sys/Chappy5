<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 9×9箱庭</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>FOUNDATION / STEP 3</small><h1>9 × 9</h1></div><output>1 CELL / 64×64</output></header><section class="preview"><svg id="room9" class="iso" viewBox="0 0 360 360" aria-label="9×9 grid with one slot machine sand and stool set"></svg></section><section class="note"><b>ONE-CELL EQUIPMENT TEST</b><span>cell 64×64 / outer wall H100 / slot 60 + sand 4 / depth 34 / slot height 70 / stool 25</span></section></main><script type="module">import{GRID}from'./core/grid.js';const svg=document.querySelector('#room9'),NS='http://www.w3.org/2000/svg';const WALL_H=100/64,SLOT_H=70/64;const raw=(x,y,z=0)=>({x:GRID.originX+(x-y)*GRID.halfW,y:GRID.originY+(x+y)*GRID.halfH-z*GRID.tileH});const corners=[raw(0,0,WALL_H),raw(9,0,WALL_H),raw(0,9,WALL_H),raw(9,9),raw(0,0),raw(9,0),raw(0,9)];const minX=Math.min(...corners.map(v=>v.x)),maxX=Math.max(...corners.map(v=>v.x)),minY=Math.min(...corners.map(v=>v.y)),maxY=Math.max(...corners.map(v=>v.y));const pad=14,scale=Math.min((360-pad*2)/(maxX-minX),(360-pad*2)/(maxY-minY));const p=(x,y,z=0)=>{const q=raw(x,y,z);return{x:pad+(q.x-minX)*scale,y:pad+(q.y-minY)*scale}};const poly=(pts,cls)=>{const e=document.createElementNS(NS,'polygon');e.setAttribute('points',pts.map(v=>`${v.x},${v.y}`).join(' '));e.setAttribute('class',cls);svg.appendChild(e);return e};const line=(a,b,cls)=>{const e=document.createElementNS(NS,'line');e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y);e.setAttribute('class',cls);svg.appendChild(e)};for(let y=0;y<9;y++)for(let x=0;x<9;x++)poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],`gridCell c${(x+y)&1}`);for(let x=0;x<9;x++)poly([p(x,0),p(x+1,0),p(x+1,0,WALL_H),p(x,0,WALL_H)],'roomWall wallA');for(let y=0;y<9;y++)poly([p(0,y),p(0,y+1),p(0,y+1,WALL_H),p(0,y,WALL_H)],'roomWall wallB');const x=4,y=4;poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],'occupiedCell');const cabD=34/64,cabH=SLOT_H,slotW=60/64,sandW=4/64;const box=(x0,y0,x1,y1,h,base)=>{poly([p(x0,y0,h),p(x1,y0,h),p(x1,y1,h),p(x0,y1,h)],`${base} top`);poly([p(x0,y1),p(x1,y1),p(x1,y1,h),p(x0,y1,h)],`${base} front`);poly([p(x1,y0),p(x1,y1),p(x1,y1,h),p(x1,y0,h)],`${base} side`)};box(x,y,x+slotW,y+cabD,cabH,'slotBody');box(x+slotW,y,x+1,y+cabD,cabH*.9,'sandBody');const sy=y+cabD+(30/64),cx=x+.5,r=25/128,seatH=18/64;const ellipse=document.createElementNS(NS,'ellipse'),sc=p(cx,sy,seatH);ellipse.setAttribute('cx',sc.x);ellipse.setAttribute('cy',sc.y);ellipse.setAttribute('rx',r*GRID.tileW*scale);ellipse.setAttribute('ry',r*GRID.tileH*scale);ellipse.setAttribute('class','stoolSeat');svg.appendChild(ellipse);line(p(cx-r*.55,sy,seatH*.85),p(cx-r*.55,sy,0),'stoolLeg');line(p(cx+r*.55,sy,seatH*.85),p(cx+r*.55,sy,0),'stoolLeg');poly([p(0,0),p(9,0),p(9,9),p(0,9)],'gridOutline');</script></body></html>
