<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 9×9箱庭</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>FOUNDATION / STEP 5</small><h1>9 × 9</h1></div><output>MODULAR FIXTURE</output></header><section class="preview"><svg id="room9" class="iso" viewBox="0 0 360 360" aria-label="9×9 grid with modular slot fixture"></svg></section><section class="note"><b>SLOT FIXTURE PARTS</b><span>shelf base H20 + enclosure / machine+side-unit H50 / slump graph H10 / stool 25</span></section></main><script type="module">import{GRID}from'./core/grid.js';import{SLOT_FIXTURE,createSlotFixture}from'./core/slot-fixture.js';const svg=document.querySelector('#room9'),NS='http://www.w3.org/2000/svg',fixture=createSlotFixture();const WALL_H=100/64;const u=v=>v/SLOT_FIXTURE.cell;const raw=(x,y,z=0)=>({x:GRID.originX+(x-y)*GRID.halfW,y:GRID.originY+(x+y)*GRID.halfH-z*GRID.tileH});const corners=[raw(0,0,WALL_H),raw(9,0,WALL_H),raw(0,9,WALL_H),raw(9,9),raw(0,0),raw(9,0),raw(0,9)];const minX=Math.min(...corners.map(v=>v.x)),maxX=Math.max(...corners.map(v=>v.x)),minY=Math.min(...corners.map(v=>v.y)),maxY=Math.max(...corners.map(v=>v.y));const pad=14,scale=Math.min((360-pad*2)/(maxX-minX),(360-pad*2)/(maxY-minY));const p=(x,y,z=0)=>{const q=raw(x,y,z);return{x:pad+(q.x-minX)*scale,y:pad+(q.y-minY)*scale}};const poly=(pts,cls)=>{const e=document.createElementNS(NS,'polygon');e.setAttribute('points',pts.map(v=>`${v.x},${v.y}`).join(' '));e.setAttribute('class',cls);svg.appendChild(e);return e};const line=(a,b,cls)=>{const e=document.createElementNS(NS,'line');e.setAttribute('x1',a.x);e.setAttribute('y1',a.y);e.setAttribute('x2',b.x);e.setAttribute('y2',b.y);e.setAttribute('class',cls);svg.appendChild(e)};const prism=(x0,y0,x1,y1,z0,z1,base)=>{poly([p(x0,y0,z1),p(x1,y0,z1),p(x1,y1,z1),p(x0,y1,z1)],`${base} top`);poly([p(x0,y1,z0),p(x1,y1,z0),p(x1,y1,z1),p(x0,y1,z1)],`${base} front`);poly([p(x1,y0,z0),p(x1,y1,z0),p(x1,y1,z1),p(x1,y0,z1)],`${base} side`)};for(let y=0;y<9;y++)for(let x=0;x<9;x++)poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],`gridCell c${(x+y)&1}`);for(let x=0;x<9;x++)poly([p(x,0),p(x+1,0),p(x+1,0,WALL_H),p(x,0,WALL_H)],'roomWall wallA');for(let y=0;y<9;y++)poly([p(0,y),p(0,y+1),p(0,y+1,WALL_H),p(0,y,WALL_H)],'roomWall wallB');const x=4,y=4;poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],'occupiedCell');const depth=u(SLOT_FIXTURE.shelf.depth),baseH=u(SLOT_FIXTURE.shelf.baseHeight),machineH=u(SLOT_FIXTURE.machineSand.height),graphH=u(SLOT_FIXTURE.slumpGraph.height),machineW=u(SLOT_FIXTURE.machineSand.machineWidth),fixtureTop=baseH+machineH+graphH;if(fixture.shelf){prism(x,y,x+1,y+depth,0,baseH,'shelfBody');prism(x,y,x+1,y+u(3),baseH,fixtureTop,'shelfBack');prism(x,y,x+u(4),y+depth,baseH,fixtureTop,'shelfLeft');prism(x+u(60),y,x+1,y+depth,baseH,fixtureTop,'shelfRight');prism(x,y,x+1,y+depth,fixtureTop-u(4),fixtureTop,'shelfTop');poly([p(x+.08,y+depth+.004,u(5)),p(x+.92,y+depth+.004,u(5)),p(x+.92,y+depth+.004,u(15)),p(x+.08,y+depth+.004,u(15))],'shelfInset')}if(fixture.machineSand){prism(x,y,x+machineW,y+depth,baseH,baseH+machineH,'machineBody');prism(x+machineW,y,x+1,y+depth,baseH,baseH+machineH,'sideUnitBody');const payY=y+depth+.006,payZ0=baseH+u(8),payZ1=baseH+u(16);poly([p(x+.24,payY,payZ0),p(x+.70,payY,payZ0),p(x+.70,payY,payZ1),p(x+.24,payY,payZ1)],'payout');const reelZ0=baseH+u(23),reelZ1=baseH+u(39);poly([p(x+.12,payY,reelZ0),p(x+.74,payY,reelZ0),p(x+.74,payY,reelZ1),p(x+.12,payY,reelZ1)],'reelWindow');for(const dx of [.25,.43,.61])line(p(x+dx,payY+.001,reelZ0),p(x+dx,payY+.001,reelZ1),'reelDivider');poly([p(x+.18,payY,baseH+u(18)),p(x+.68,payY,baseH+u(18)),p(x+.68,payY,baseH+u(22)),p(x+.18,payY,baseH+u(22))],'controlDeck')}if(fixture.slumpGraph){prism(x+.08,y,x+.84,y+u(SLOT_FIXTURE.slumpGraph.depth),baseH+machineH,fixtureTop,'graphBody');const gy=y+u(SLOT_FIXTURE.slumpGraph.depth)+.006,g0=baseH+machineH+u(2),g1=fixtureTop-u(2);poly([p(x+.14,gy,g0),p(x+.78,gy,g0),p(x+.78,gy,g1),p(x+.14,gy,g1)],'graphScreen');line(p(x+.18,gy+.001,g0+u(2)),p(x+.32,gy+.001,g0+u(4)),'graphLine');line(p(x+.32,gy+.001,g0+u(4)),p(x+.48,gy+.001,g0+u(3)),'graphLine');line(p(x+.48,gy+.001,g0+u(3)),p(x+.66,gy+.001,g0+u(6)),'graphLine')}if(fixture.stool){const sy=y+depth+u(30),cx=x+.5,r=u(SLOT_FIXTURE.stool.diameter)/2,seatH=u(SLOT_FIXTURE.stool.height);const ellipse=document.createElementNS(NS,'ellipse'),sc=p(cx,sy,seatH);ellipse.setAttribute('cx',sc.x);ellipse.setAttribute('cy',sc.y);ellipse.setAttribute('rx',r*GRID.tileW*scale);ellipse.setAttribute('ry',r*GRID.tileH*scale);ellipse.setAttribute('class','stoolSeat');svg.appendChild(ellipse);line(p(cx-r*.55,sy,seatH*.85),p(cx-r*.55,sy,0),'stoolLeg');line(p(cx+r*.55,sy,seatH*.85),p(cx+r*.55,sy,0),'stoolLeg')}poly([p(0,0),p(9,0),p(9,9),p(0,9)],'gridOutline');</script></body></html>
