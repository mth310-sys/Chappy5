<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 9×9基準</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>箱庭基盤 / STEP 2</small><h1>1×1 基準を 9×9 複製</h1></div><output>81 CELLS</output></header><section class="preview"><article class="geometryCard"><svg id="grid9" class="iso" viewBox="0 0 420 300" aria-label="1対1基準を複製した9×9グリッド"></svg><div class="rules"><b>基準維持</b><span>1セル：1 × 1</span><span>全体：9 × 9</span><span>セル数：81</span><span>座標：整数</span><span>スナップ：既存grid.js</span></div></article></section><section class="note"><b>複製ルール</b><span>1×1セルを縮小・変形せず、同じ投影式で整数座標(0〜8, 0〜8)へ81個並べる。セル同士は辺を完全共有する。</span></section></main><script type="module">import{toScreen}from'./core/grid.js';const svg=document.querySelector('#grid9');const NS='http://www.w3.org/2000/svg';const local=(x,y)=>{const p=toScreen(x,y);return{x:p.x-260,y:p.y+20}};for(let y=0;y<9;y++){for(let x=0;x<9;x++){const a=local(x,y),b=local(x+1,y),c=local(x+1,y+1),d=local(x,y+1);const poly=document.createElementNS(NS,'polygon');poly.setAttribute('points',`${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y} ${d.x},${d.y}`);poly.setAttribute('class','gridCell');poly.dataset.x=x;poly.dataset.y=y;svg.appendChild(poly)}}const outline=document.createElementNS(NS,'polygon');const p0=local(0,0),p1=local(9,0),p2=local(9,9),p3=local(0,9);outline.setAttribute('points',`${p0.x},${p0.y} ${p1.x},${p1.y} ${p2.x},${p2.y} ${p3.x},${p3.y}`);outline.setAttribute('class','gridOutline');svg.appendChild(outline);</script></body></html>
