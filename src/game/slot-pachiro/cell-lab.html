<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 9×9箱庭</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>FOUNDATION / STEP 2</small><h1>9 × 9</h1></div><output>9×9 / H1</output></header><section class="preview"><svg id="room9" class="iso" viewBox="0 0 360 360" aria-label="9×9 grid with unit-height outer walls"></svg></section><section class="note"><b>9×9 FOUNDATION</b><span>1×1 unit × 81 / outer wall H1 / integer-grid snap retained</span></section></main><script type="module">import{toScreen}from'./core/grid.js';const svg=document.querySelector('#room9'),NS='http://www.w3.org/2000/svg';const raw=(x,y,z=0)=>{const q=toScreen(x,y,z*13);return{x:q.x,y:q.y}};const corners=[raw(0,0,1),raw(9,0,1),raw(0,9,1),raw(9,9),raw(0,0),raw(9,0),raw(0,9)];const minX=Math.min(...corners.map(v=>v.x)),maxX=Math.max(...corners.map(v=>v.x)),minY=Math.min(...corners.map(v=>v.y)),maxY=Math.max(...corners.map(v=>v.y));const pad=14,scale=Math.min((360-pad*2)/(maxX-minX),(360-pad*2)/(maxY-minY));const p=(x,y,z=0)=>{const q=raw(x,y,z);return{x:pad+(q.x-minX)*scale,y:pad+(q.y-minY)*scale}};const poly=(pts,cls)=>{const e=document.createElementNS(NS,'polygon');e.setAttribute('points',pts.map(v=>`${v.x},${v.y}`).join(' '));e.setAttribute('class',cls);svg.appendChild(e)};for(let y=0;y<9;y++)for(let x=0;x<9;x++)poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],`gridCell c${(x+y)&1}`);for(let x=0;x<9;x++)poly([p(x,0),p(x+1,0),p(x+1,0,1),p(x,0,1)],'roomWall wallA');for(let y=0;y<9;y++)poly([p(0,y),p(0,y+1),p(0,y+1,1),p(0,y,1)],'roomWall wallB');poly([p(0,0),p(9,0),p(9,9),p(0,9)],'gridOutline');</script></body></html>
