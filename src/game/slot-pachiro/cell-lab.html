<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 基準ジオメトリ</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>箱庭基盤 / 同寸法検証</small><h1>床1マス = 箱の底面</h1></div><output>128 × 56</output></header><section class="preview"><div class="geometryGrid"><article class="geometryCard"><h2>① 床1マス</h2><svg class="iso" viewBox="0 0 240 230"><polygon class="floor" points="120,142 184,170 120,198 56,170"/><polyline class="measure" points="56,170 120,142 184,170 120,198 56,170"/></svg><p>4頂点：上(120,142) 右(184,170) 下(120,198) 左(56,170)</p></article><article class="geometryCard"><h2>② 同じ底面の箱</h2><svg class="iso" viewBox="0 0 240 230"><polygon class="floor ghost" points="120,142 184,170 120,198 56,170"/><polygon class="boxSide boxLeft" points="56,170 120,198 120,134 56,106"/><polygon class="boxSide boxRight" points="120,198 184,170 184,106 120,134"/><polygon class="boxTop" points="120,78 184,106 120,134 56,106"/><polyline class="measure baseMeasure" points="56,170 120,142 184,170 120,198 56,170"/><polyline class="measure topMeasure" points="56,106 120,78 184,106 120,134 56,106"/><line class="vertical" x1="56" y1="170" x2="56" y2="106"/><line class="vertical" x1="120" y1="142" x2="120" y2="78"/><line class="vertical" x1="184" y1="170" x2="184" y2="106"/><line class="vertical" x1="120" y1="198" x2="120" y2="134"/></svg><p>底面は①と同じ4頂点。上面も128×56の同形を64pxだけ真上へ移動。</p></article><article class="geometryCard"><h2>③ 同じ辺から壁</h2><svg class="iso" viewBox="0 0 240 230"><polygon class="floor" points="120,142 184,170 120,198 56,170"/><polygon class="wall wallLeft" points="56,170 120,142 120,78 56,106"/><polygon class="wall wallRight" points="120,142 184,170 184,106 120,78"/><polyline class="measure" points="56,170 120,142 184,170"/><polyline class="measure topMeasure" points="56,106 120,78 184,106"/><line class="vertical" x1="56" y1="170" x2="56" y2="106"/><line class="vertical" x1="120" y1="142" x2="120" y2="78"/><line class="vertical" x1="184" y1="170" x2="184" y2="106"/></svg><p>壁の下辺は①の左→上→右の2辺そのもの。箱と同じ高さ軸64px。</p></article></div></section><section class="note"><b>検証値</b><span>床と箱底面は同じ座標列をそのまま使用。幅128px・投影奥行56px。上面は縮小せず、4頂点すべて y−64 のみ。</span></section></main></body></html>
