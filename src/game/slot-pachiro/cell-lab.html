<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 基準ジオメトリ</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>箱庭基盤 / 幾何成立確認</small><h1>床・壁・箱 共通基準</h1></div><output>GRID GEOMETRY</output></header><section class="preview"><div class="geometryGrid"><article class="geometryCard"><h2>床1マス + 壁</h2><svg class="iso" viewBox="0 0 240 230" role="img" aria-label="床1マスと同じ頂点から立ち上がる壁"><polygon class="floor" points="120,142 184,170 120,198 56,170"/><polygon class="wall wallLeft" points="56,170 120,142 120,78 56,106"/><polygon class="wall wallRight" points="120,142 184,170 184,106 120,78"/><polyline class="edge" points="56,170 120,142 184,170"/><line class="vertical" x1="56" y1="170" x2="56" y2="106"/><line class="vertical" x1="120" y1="142" x2="120" y2="78"/><line class="vertical" x1="184" y1="170" x2="184" y2="106"/></svg><p>壁の下端は床の辺そのもの。高さ軸だけを上へ伸ばす。</p></article><article class="geometryCard"><h2>床1マス + 同寸箱</h2><svg class="iso" viewBox="0 0 240 230" role="img" aria-label="床1マスと完全に同じ底面の箱"><polygon class="floor ghost" points="120,142 184,170 120,198 56,170"/><polygon class="boxSide boxLeft" points="56,170 120,198 120,134 56,106"/><polygon class="boxSide boxRight" points="120,198 184,170 184,106 120,134"/><polygon class="boxTop" points="120,78 184,106 120,134 56,106"/><polyline class="edge" points="56,170 120,198 184,170"/><line class="vertical" x1="56" y1="170" x2="56" y2="106"/><line class="vertical" x1="120" y1="198" x2="120" y2="134"/><line class="vertical" x1="184" y1="170" x2="184" y2="106"/><line class="vertical" x1="120" y1="142" x2="120" y2="78"/></svg><p>箱の底面4頂点は床4頂点と完全一致。上面は同じひし形を高さ方向へ平行移動。</p></article></div></section><section class="note"><b>成立条件</b><span>床・壁・箱は別々に目分量で描かない。床4頂点を唯一の基準にし、壁は辺を押し上げ、箱は4頂点を同じ高さだけ押し上げて作る。以後の筐体・設備もこの座標系に載せる。</span></section></main></body></html>
