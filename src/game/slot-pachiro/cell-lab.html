<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スロットパチ朗 / 9×9箱庭</title><link rel="stylesheet" href="./cell-lab.css"></head><body><main class="lab"><header class="labHead"><div><small>箱庭基盤 / STEP 2</small><h1>9 × 9 箱庭</h1></div><output>9×9 / H1</output></header><section class="preview"><article class="geometryCard"><svg id="room9" class="iso" viewBox="0 0 420 330" aria-label="1×1×1基準をそのまま9×9にした部屋"></svg><div class="rules"><b>同じ基準をそのまま展開</b><span>床：9 × 9</span><span>1マス：1 × 1</span><span>外周壁：高さ1</span><span>セル数：81</span></div></article></section><section class="note"><b>9×9</b><span>1×1×1基準を変えずに、床を9×9へ並べ、奥側2辺に高さ1の外周壁を立てた状態。</span></section></main><script type="module">import{toScreen}from'./core/grid.js';const svg=document.querySelector('#room9'),NS='http://www.w3.org/2000/svg';const p=(x,y,z=0)=>{const q=toScreen(x,y,z*13);return{x:q.x-155,y:q.y+85}};const poly=(pts,cls)=>{const e=document.createElementNS(NS,'polygon');e.setAttribute('points',pts.map(v=>`${v.x},${v.y}`).join(' '));e.setAttribute('class',cls);svg.appendChild(e)};for(let y=0;y<9;y++)for(let x=0;x<9;x++)poly([p(x,y),p(x+1,y),p(x+1,y+1),p(x,y+1)],'gridCell');for(let x=0;x<9;x++)poly([p(x,0),p(x+1,0),p(x+1,0,1),p(x,0,1)],'roomWall wallA');for(let y=0;y<9;y++)poly([p(0,y),p(0,y+1),p(0,y+1,1),p(0,y,1)],'roomWall wallB');poly([p(0,0),p(9,0),p(9,9),p(0,9)],'gridOutline');</script></body></html>
