<style>
:root{--violet:#9d55ff;--gold:#d6ad52}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#030205;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;overflow-x:hidden}button{font:inherit}body{display:grid;place-items:start center;padding:max(7px,env(safe-area-inset-top)) 8px max(10px,env(safe-area-inset-bottom));background:radial-gradient(80% 44% at 50% 0,#3d1762 0,#120918 38%,#030205 80%)}.wrap{width:min(100%,430px)}.lab{text-align:center;font-size:9px;letter-spacing:.28em;color:#a28caf;margin:1px 0 6px}.machine{position:relative;isolation:isolate;padding:9px 13px 16px;border-radius:42px 42px 18px 18px;clip-path:polygon(7% 0,93% 0,100% 7%,97.5% 92%,90% 100%,10% 100%,2.5% 92%,0 7%);background:linear-gradient(105deg,#170f1f,#6d5979 3%,#17111d 8%,#08060a 20%,#110b16 50%,#08060a 80%,#21162a 92%,#7a5c83 97%,#160f1e);border:1px solid #977aa5;box-shadow:0 28px 74px #000,0 0 30px #7d23ff30,inset 0 0 0 2px #030204}.machine:before,.machine:after{content:"";position:absolute;z-index:-1;top:12%;bottom:15%;width:18px;border:1px solid #9c65be55;background:linear-gradient(90deg,#0b070e,#6a238d44 40%,#e5cfff16 53%,#12081a);box-shadow:inset 0 0 12px #b760ff25,0 0 12px #7d24ff22}.machine:before{left:2px;border-radius:14px 2px 2px 14px}.machine:after{right:2px;transform:scaleX(-1);border-radius:14px 2px 2px 14px}.spine{position:absolute;top:11%;bottom:19%;width:4px;z-index:6;background:linear-gradient(#2b1238,#d9bbf0 18%,#4c2260 42%,#e7d1f8 61%,#341341 84%,transparent);opacity:.46;filter:drop-shadow(0 0 7px #a14cff)}.spine.l{left:8px}.spine.r{right:8px}.crown{position:relative;text-align:center;padding:3px 0 8px}.crown:before{content:"";position:absolute;left:14%;right:14%;bottom:2px;height:1px;background:linear-gradient(90deg,transparent,#d6ad52,#efe0a1,#d6ad52,transparent);box-shadow:0 0 9px #d6ad5266}.title{font-family:"Yu Mincho",serif;font-weight:900;font-size:30px;letter-spacing:.1em;backg gradient(120deg,#21162c,#050407 55%);box-shadow:0 0 0 7px #130d19,8px -5px 0 -5px #a994b044}.samurai:after{content:"";position:absolute;left:34px;top:47px;width:88px;height:104px;background:linear-gradient(135deg,#2d1d42,#0b0810 46%,#030304);clip-path:polygon(31% 0,65% 0,100% 67%,72% 100%,0 100%,16% 44%);filter:drop-shadow(0 0 8px #742bb0)}.sword{position:absolute;z-index:5;left:91px;top:49px;width:146px;height:4px;background:linear-gradient(90deg,#fff,#9a6ecf 30%,#f8efff 74%,#6c338b);transform:rotate(-28deg);transform-origin:left;border-radius:99px;box-shadow:0 0 6px #fff,0 0 18px #8b35ea}.opening{position:absolute;z-index:12;right:9px;top:9px;padding:6px 9px;border-radius:4px;background:linear-gradient(135deg,#120a19e8,#35144ae8);border:1px solid #b889d166;color:#efe1ff;font:700 10px/1.1 "Yu Mincho",serif;letter-spacing:.08em;box-shadow:0 4px 10px #0008}.opening b{color:#f7da79}.hud{position:absolute;left:9px;top:9px;z-index:11;font-size:9px;color:#d4c2e1;letter-spacing:.08em}.message{position:absolute;z-index:12;left:13px;right:13px;bottom:9px;text-align:right;font-family:"Yu Mincho",serif;font-weight:700;font-size:13px;text-shadow:0 2px 7px #000,0 0 10px #000}.slash{position:absolute;z-index:10;left:-18%;top:50%;width:136%;height:3px;opacity:0;background:linear-gradient(90deg,transparent,#fff 16%,#f5e4ff 50%,#a44cff 75%,transparent);box-shadow:0 0 7px #fff,0 0 19px #b44dff;transform-origin:center}.screen.cut1 .slash{animation:cut1 .25s ease-out}.screen.cut2 .slash{animation:cut2 .27s ease-out}.screen.cut3 .slash{animation:cut3 .32s ease-out}@keyframes cut1{0%{opacity:0;transform:translateX(-32%) rotate(-28deg) scaleX(.2)}28%{opacity:1}100%{opacity:0;transform:translateX(22%) rotate(-28deg) scaleX(1)}}@keyframes cut2{0%{opacity:0;transform:translateX(26%) rotate(21deg) scaleX(.25)}32%{opacity:1}100%{opacity:0;transform:translateX(-20%) rotate(21deg) scaleX(1)}}@keyframes cut3{0%{opacity:0;transform:translateX(-15%) rotate(-4deg) scaleX(.18)}25%{opacity:1;height:4px}100%{opacity:0;transform:translateX(8%) rotate(-4deg) scaleX(1.15)}}.screen.resolve:after{content:"";position:absolute;z-index:8;inset:-20%;background:linear-gradient(112deg,transparent 40%,#fff 48%,#b95cff 50%,#fff 52%,transparent 60%);animation:resolve .4s ease-out}@keyframes resolve{from{transform:translateX(-38%)}to{transform:translateX(42%)}}.bladeBridge{position:relative;height:10px;margin:-8px 7px 1px;z-index:15}.bladeBridge:before{content:"";position:absolute;left:2%;right:2%;top:4px;height:2px;background:linear-gradient(90deg,#4a2b17,#e5d6a0 8%,#fff 25%,#c2b2cf 52%,#fff 78%,#d1ad63 93%,#4a2b17);box-shadow:0 0 5px #fff7,0 0 14px #9f43ff60;transform:scaleX(.78);transition:.18s}.machine.hit .bladeBridge:before{transform:scaleX(1);box-shadow:0 0 7px #fff,0 0 23px #b454ff}.reelDeck{position:relative;margin:0 4px;padding:10px 9px 9px;border-radius:8px 8px 15px 15px;background:linear-gradient(#08070a,#1c1521 45%,#08070b);border:1px solid #6d5578;box-shadow:0 9px 18px #000,inset 0 0 23px #000}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#020203;padding:5px;border-radius:7px;perspective:500px}.reel{position:relative;height:106px;border-radius:3px;overflow:hidden;background:linear-gradient(90deg,#8e8478,#efe5cc 13%,#fff7e9 43%,#f7edd5 74%,#877e72);box-shadow:inset 4px 0 6px #0005,inset -4px 0 6px #0005,0 0 0 1px #473f37;transition:box-shadow .16s,transform .14s}.reel:after{content:"";position:absolute;left:0;right:0;top:33.3%;height:33.3%;border-top:1px solid #c9ae8055;border-bottom:1px solid #785e3855;box-shadow:inset 0 7px 9px #fff2,inset 0 -7px 9px #0002;pointer-events:none}.strip{height:100%;display:grid;grid-template-rows:repeat(3,1fr);transform:translateZ(0)}.reel.spin .strip{filter:blur(2.8px) contrast(.88)}.sym{display:grid;place-items:center;font:900 22px "Yu Mincho",serif;color:#241823;text-shadow:0 1px #fff;border-bottom:1px solid #81776a}.sym.red{color:#ae1721}.sym.blue{color:#263e8b}.sym.gold{color:#825811}.reel.read{transform:translateY(-2px);box-shadow:0 0 0 2px #d9b85d,0 0 19px #f0c34b88,inset 4px 0 6px #0005,inset -4px 0 6px #0005}.deck{display:grid;grid-template-columns:64px 1fr 1fr 1fr 64px;align-items:center;gap:7px;padding:10px 1px 0}.lever,.bet,.stop{border:0;color:#fff;font-weight:800;box-shadow:0 5px 11px #000,inset 0 2px 3px #ffffff30;touch-action:manipulation;transition:transform .06s,filter .12s}.lever:active,.bet:active,.stop:active{transform:translateY(2px);filter:brightness(1.18)}.lever{height:47px;border-radius:22px;background:radial-gradient(circle at 38% 26%,#77717b,#28222d 42%,#050406 72%);font-size:8px;border:1px solid #817887}.bet{height:42px;border-radius:9px;background:linear-gradient(#46384e,#1b1420 58%,#0b080d);font-size:9px;border:1px solid #6e5d76}.stop{height:54px;border-radius:50%;background:radial-gradient(circle at 38% 27%,#ff6a62,#c31a29 45%,#780711 68%,#330207 74%);font-size:12px;border:2px solid #dca8aa;box-shadow:0 5px 11px #000,inset 0 2px 4px #fff6,0 0 0 2px #3c2327}.stop:disabled,.lever:disabled{opacity:.31;filter:saturate(.45)}.meters{display:flex;justify-content:space-between;padding:8px 5px 0;font:700 10px ui-monospace,monospace;color:#c2acd0}.hint{text-align:center;font-size:9px;color:#a48bb3;margin-top:5px;min-height:14px}.foot{text-align:center;font-size:8px;color:#685d70;padding:6px}.machine.pulse{animation:pulse .2s ease}@keyframes pulse{50%{filter:brightness(1.2)}}@media(max-width:380px){body{padding-left:4px;padding-right:4px}.machine{padding-left:9px;padding-right:9px}.screen{height:196px}.title{font-size:27px}.reel{height:100px}.deck{grid-template-columns:58px 1fr 1fr 1fr 58px;gap:5px}.stop{height:50px}.lever{height:44px}}@media(prefers-reduced-motion:reduce){.screen.cut1 .slash,.screen.cut2 .slash,.screen.cut3 .slash,.screen.resolve:after,.machine.pulse{animation-duration:.08s}}
</style></head><body><div class="wrap"><div class="lab">YUSOSHA // VISUAL BUILD</div><main class="machine" id="machine"><div class="spine l"></div><div class="spine r"></div><div class="crown"><div class="title">刻ノ一閃</div><div class="sub">TOKI NO ISSEN</div></div><div class="screenFrame"><section class="screen" id="screen"><div class="mist"></div><div class="moon"></div><div class="pagoda"></div><div class="samurai"><div class="sword"></div></div><div class="slash"></div><div class="hud"><span id="phase">静</span> / 刻力 <b id="power">0</b>/9</div><div class="opening" id="opening">見切り待ち</div><div class="message" id="msg">MAX BETで間合いへ。</div></section></div><div class="bladeBridge"></div><section class="reelDeck"><div class="reels" id="reels"></div><div class="deck"><button class="bet" id="bet">MAX<br>BET</button><button class="stop" data-i="0" disabled>壱</button><button class="stop" data-i="1" disabled>弐</button><button class="stop" data-i="2" disabled>参</button><button class="lever" id="lever">LEVER</button></div><div class="meters"><span>CREDIT <b id="credit">50</b></span><span>BET <b id="betv">0</b></span><span>GAME <b id="game">0</b></span></div><div class="hint" id="hint">敵の「初手」を読み、指定リールを最初に止める</div></section></main><div class="foot">Prototype-only temporary tuning / no real-money gambling</div></div><script>
const strips=[['鐘','蒼','七','桜','刀','蒼','鐘','七'],['蒼','桜','鐘','刀','七','蒼','桜','鐘'],['鐘','七','蒼','刀','桜','七','蒼','鐘']];let credit=50,bet=0,game=0,spinning=false,stopped=[true,true,true],power=0,timers=[],centers=['','',''],stopSeq=[],opening=0,quality=0;const $=s=>document.querySelector(s),reels=$('#reels'),machine=$('#machine'),screen=$('#screen');function cls(s){return s==='七'?'red':s==='蒼'?'blue':s==='鐘'?'gold':''}function render(i,offset=Math.floor(Math.random()*strips[i].length)){const out=[];for(let j=0;j<3;j++){const s=strips[i][(offset+j)%strips[i].length];out.push(`<div class="sym ${cls(s)}">${s}</div>`)}document.querySelectorAll('.reel')[i].querySelector('.strip').innerHTML=out.join('');return strips[i][(offset+1)%strips[i].length]}for(let i=0;i<3;i++){reels.insertAdjacentHTML('beforeend','<div class="reel"><div class="strip"></div></div>');render(i,i)}function ui(){$('#credit').textContent=credit;$('#betv').textContent=bet;$('#game').textContent=game;$('#power').textContent=power;$('#lever').disabled=spinning||bet<3;document.querySelectorAll('.stop').forEach((b,i)=>b.disabled=!spinning||stopped[i])}function tone(freq,d=.045,type='sine',gain=.04){try{window.ac??=new AudioContext();const a=window.ac,o=a.createOscillator(),g=a.createGain();if(a.state==='suspended')a.resume();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(gain,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}function cutFx(n){screen.classList.remove('cut1','cut2','cut3');void screen.offsetWidth;screen.classList.add(`cut${n}`);setTimeout(()=>screen.classList.remove(`cut${n}`),360)}$('#bet').onclick=()=>{if(spinning||bet===3||credit<3)return;const add=3-bet;credit-=add;bet=3;tone(170,.06,'square',.025);$('#msg').textContent='間合いに入った。レバーで敵の構えを見る。';ui()};$('#lever').onclick=()=>{if(bet<3||spinning)return;spinning=true;game++;stopped=[false,false,false];stopSeq=[];centers=['','',''];quality=0;opening=Math.floor(Math.random()*3);document.querySelectorAll('.reel').forEach(r=>r.classList.remove('read'));$('#phase').textContent='構';$('#opening').innerHTML=`敵の初手：<b>${['壱','弐','参'][opening]}</b> から見切れ`;$('#msg').textContent='初停止が読み。残る二停止で太刀筋を作る。';document.querySelectorAll('.reel').forEach((r,i)=>{r.classList.add('spin');timers[i]=setInterval(()=>render(i),78)});tone(90,.12,'sawtooth',.025);ui()};function symbolValue(s,n){if(s==='刀')return 2;if(s==='七')return n===3?3:1;if(s==='蒼')return n===2?2:1;if(s==='桜')return n===1?2:1;if(s==='鐘')return 1;return 0}function stop(i){if(!spinning||stopped[i])return;const n=stopSeq.length+1;stopped[i]=true;stopSeq.push(i);clearInterval(timers[i]);const r=document.querySelectorAll('.reel')[i];r.classList.remove('spin');const off=Math.floor(Math.random()*strips[i].length);centers[i]=render(i,off);quality+=symbolValue(centers[i],n);if(n===1&&i===opening){quality+=2;r.classList.add('read');$('#hint').textContent='見切り成功。残る停止で斬線を作れ。'}else if(n===1){$('#hint').textContent='初手を外した。出目で立て直せ。'}cutFx(n);tone(250+i*90,.07,'square',.045);machine.classList.add('pulse');setTimeout(()=>machine.classList.remove('pulse'),205);$('#phase').textContent=['構','読','断','決'][n];$('#msg').textContent=n===1?`一の太刀「${centers[i]}」。`:n===2?`二の太刀「${centers[i]}」。次で決める。`:`三の太刀「${centers[i]}」。`;if(n===3)resolve();ui()}document.querySelectorAll('.stop').forEach(b=>b.onclick=()=>stop(+b.dataset.i));function resolve(){screen.classList.add('resolve');machine.classList.add('hit');tone(680,.09,'sawtooth',.05);setTimeout(()=>tone(210,.22,'triangle',.05),55);setTimeout(()=>{screen.classList.remove('resolve');machine.classList.remove('hit')},410);const combo=centers.join('・');let reward=0;if(centers.filter(s=>s==='七').length>=2){quality+=3;reward=7}else if(centers.includes('刀'))reward=4;else reward=2;const success=quality>=5;if(success){const gain=quality>=8?2:1;power=Math.min(9,power+gain);credit+=reward;$('#msg').textContent=quality>=8?`会心「${combo}」――刻力+${gain}`:`斬「${combo}」――読みが通った。`;$('#hint').textContent=quality>=8?'会心。停止順と出目が噛み合った。':'次は別の初手が来る。'}else{$('#msg').textContent=`紙一重「${combo}」――太刀筋が浅い。`;$('#hint').textContent='初停止の見切りと中段図柄で結果が変わる。'}spinning=false;bet=0;ui()}ui();
</script></body></html>
