<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // BONUS BGM DEMO</title><style>html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 25%,#26143b,#07040b 58%,#020103);color:#f3e6bb;font-family:-apple-system,BlinkMacSystemFont,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.panel{width:min(92vw,430px);padding:28px 20px;border:1px solid #c8a75966;border-radius:22px;background:#09070bd9;box-shadow:0 20px 70px #000a;text-align:center}h1{font-size:24px;letter-spacing:.12em;margin:0 0 8px}p{opacity:.68;font-size:12px;line-height:1.7;margin:0 0 22px}.controls{display:flex;gap:12px;justify-content:center}button{min-width:120px;min-height:52px;border-radius:14px;border:1px solid #d3b36088;background:#17101f;color:#f6e4a8;font-weight:800;font-size:15px}.state{margin-top:18px;font-size:11px;letter-spacing:.16em;opacity:.65}</style></head><body><main><section class="panel"><h1>刻ノ一閃</h1><p>BONUS BGM 試聴専用<br>SE・リール音なし</p><div class="controls"><button id="play">▶ PLAY</button><button id="stop">■ STOP</button></div><div id="state" class="state">TAP PLAY</div></section></main><script>(()=>{const AC=window.AudioContext||window.webkitAudioContext;let ac,master,comp,timer,next=0,step=0;const bpm=132,beat=60/bpm/2;const scale=[220,261.63,293.66,329.63,392,440];function init(){if(ac)return;ac=new AC();master=ac.createGain();comp=ac.createDynamicsCompressor();master.gain.value=.56;comp.threshold.value=-15;comp.ratio.value=4;comp.attack.value=.006;comp.release.value=.16;master.connect(comp).connect(ac.destination)}function tone(t,f,d,g,type='triangle',attack=.006){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+attack);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(master);o.start(t);o.stop(t+d+.03)}function drum(t,strong=false){tone(t,strong?73:91,strong?.20:.13,strong?.20:.12,'sine',.002);const n=ac.createBuffer(1,Math.floor(ac.sampleRate*.05),ac.sampleRate),a=n.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.value=strong?720:1100;g.gain.setValueAtTime(strong?.08:.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+.05);s.buffer=n;s.connect(f).connect(g).connect(master);s.start(t)}function hit(t,i){const seq=[0,2,3,5,3,2,1,4,0,2,5,4,3,1,2,5],idx=seq[i%16];tone(t,scale[idx],beat*.78,.085,'sawtooth',.004);tone(t+.012,scale[idx]*2,beat*.34,.022,'triangle',.003);if(i%2===0)tone(t,110,beat*1.7,.045,'triangle',.01);if(i%4===0)drum(t,true);else if(i%2===0)drum(t,false);if(i%8===7)tone(t,659.25,beat*.8,.04,'square',.003)}function schedule(){while(next<ac.currentTime+.12){hit(next,step);next+=beat;step++}}async function start(){init();await ac.resume();if(timer)return;step=0;next=ac.currentTime+.06;schedule();timer=setInterval(schedule,25);document.getElementById('state').textContent='BONUS BGM PLAYING'}function stop(){if(timer){clearInterval(timer);timer=null}if(ac)ac.suspend();document.getElementById('state').textContent='STOPPED'}document.getElementById('play').addEventListener('click',start);document.getElementById('stop').addEventListener('click',stop);})();</script></body></html>
