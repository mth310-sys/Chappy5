<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#07040b"><title>刻ノ一閃 // Sound Run 2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="integrated" src="./play.html" title="刻ノ一閃 Sound Run 2"></iframe><script>(()=>{let ac,master,mechanical,blade,result,lastResolve='';const outer=document.getElementById('integrated');function setup(){if(ac)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C({latencyHint:'interactive'});master=ac.createGain();mechanical=ac.createGain();blade=ac.createGain();result=ac.createGain();master.gain.value=.72;mechanical.gain.value=.58;blade.gain.value=.62;result.gain.value=.66;mechanical.connect(master);blade.connect(master);result.connect(master);master.connect(ac.destination);return true}async function ready(){if(!setup())return false;if(ac.state!=='running'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function tone(bus,f,d=.05,g=.02,type='sine',delay=0,slide=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.006);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(bus);o.start(t);o.stop(t+d+.02)}function burst(bus,d=.04,g=.018,center=1800,delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,n=Math.ceil(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),v=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=center;f.Q.value=.9;v.gain.value=g;s.connect(f).connect(v).connect(bus);s.start(t)}function bet(){tone(mechanical,118,.035,.012,'square');tone(mechanical,236,.045,.009,'sine',.018)}function lever(){tone(mechanical,68,.075,.02,'triangle',0,-22);burst(mechanical,.045,.009,650,.025)}function stop(n,i){const base=[310,385,475][n-1]+i*11;burst(mechanical,.025,.014,1150+n*230);tone(mechanical,base,.042,.019,'triangle');const slashDelay=.014;burst(blade,.055,n===3?.024:.017,2400+n*320,slashDelay);tone(blade,900+n*185,.052,n===3?.018:.012,'sawtooth',slashDelay,-260);if(n===2)tone(blade,640,.07,.008,'sine',.045,180);if(n===3)tone(blade,1320,.07,.012,'triangle',.055,-420)}function resolve(text){if(text===lastResolve)return;lastResolve=text;const gap=.105;if(/会心/.test(text)){tone(result,174,.18,.022,'triangle',gap);tone(result,348,.22,.016,'sine',gap+.055);tone(result,696,.28,.012,'sine',gap+.12)}else if(/^斬/.test(text)){tone(result,164,.13,.019,'triangle',gap);tone(result,492,.16,.013,'sine',gap+.06)}else if(/紙一重/.test(text)){tone(result,142,.14,.012,'triangle',gap);burst(result,.07,.008,520,gap+.025)}}function attach(){let mid;try{mid=outer.contentDocument?.getElementById('game')}catch(_){return}if(!mid)return;const bind=()=>{let d;try{d=mid.contentDocument}catch(_){return}if(!d||d.documentElement.dataset.soundRun2)return;d.documentElement.dataset.soundRun2='1';let seq=0;d.addEventListener('pointerdown',async e=>{const b=e.target.closest('button');if(!b)return;const ok=await ready();if(!ok)return;if(b.id==='bet'){seq=0;bet()}else if(b.id==='lever'){seq=0;lever()}else if(b.classList.contains('stop')&&!b.disabled){seq=Math.min(3,seq+1);stop(seq,+b.dataset.i)}},{capture:true});const msg=d.getElementById('msg');if(msg)new MutationObserver(()=>{const t=msg.textContent||'';if(/会心|^斬「|紙一重/.test(t))resolve(t)}).observe(msg,{childList:true,subtree:true,characterData:true})};mid.addEventListener('load',bind,{once:false});bind()}outer.addEventListener('load',()=>{attach();setTimeout(attach,120)});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden&&ac.state==='running')ac.suspend()});})();</script></body></html>
