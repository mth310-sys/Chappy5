<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#03111a"><title>ノクターン・アクアリウム // Sound Run 2</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010407}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="integrated" src="./play.html" title="ノクターン Sound Run 2"></iframe><script>(()=>{let ac,master,ambience,machine,observe,memoryBus,bedOsc,bedGain,lastMemory='';const outer=document.getElementById('integrated');function setup(){if(ac)return true;const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C({latencyHint:'interactive'});master=ac.createGain();ambience=ac.createGain();machine=ac.createGain();observe=ac.createGain();memoryBus=ac.createGain();master.gain.value=.62;ambience.gain.value=.12;machine.gain.value=.48;observe.gain.value=.45;memoryBus.gain.value=.52;[ambience,machine,observe,memoryBus].forEach(x=>x.connect(master));master.connect(ac.destination);bedGain=ac.createGain();bedGain.gain.value=.022;bedOsc=ac.createOscillator();const f=ac.createBiquadFilter();bedOsc.type='sine';bedOsc.frequency.value=43;f.type='lowpass';f.frequency.value=92;bedOsc.connect(f).connect(bedGain).connect(ambience);bedOsc.start();return true}async function ready(){if(!setup())return false;if(ac.state!=='running'){try{await ac.resume()}catch(_){return false}}return ac.state==='running'}function tone(bus,f,d=.08,g=.014,type='sine',delay=0){if(!ac||ac.state!=='running')return;const t=ac.currentTime+delay,o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(g,t+.008);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v).connect(bus);o.start(t);o.stop(t+d+.02)}function tick(f=190,g=.012){tone(machine,f,.045,g,'triangle')}function select(i){const root=[272,326,392][i];tick(178+i*13,.011);tone(observe,root,.075,.015,'sine',.018);tone(observe,root*2.005,.13,.007,'sine',.052)}function collect(i,n){tick(205+i*23,.012);if(n===3)tone(observe,515+i*31,.11,.008,'sine',.025)}function memory(text){if(text===lastMemory)return;lastMemory=text;if(/DEPTH/.test(text)){tone(memoryBus,148,.34,.016,'sine');tone(memoryBus,222,.38,.012,'sine',.09);tone(memoryBus,333,.43,.01,'sine',.18);tone(memoryBus,499,.5,.007,'sine',.3)}else if(/NEW MEMORY/.test(text)){tone(memoryBus,294,.2,.013,'sine');tone(memoryBus,441,.25,.009,'sine',.09);tone(memoryBus,588,.3,.006,'sine',.18)}else if(/赤い連結|鍵と月|気泡/.test(text)){tone(memoryBus,246,.14,.009,'triangle');tone(memoryBus,369,.19,.006,'sine',.075)}}function attach(){let mid;try{mid=outer.contentDocument?.getElementById('game')}catch(_){return}if(!mid)return;const bind=()=>{let d;try{d=mid.contentDocument}catch(_){return}if(!d||d.documentElement.dataset.soundRun2)return;d.documentElement.dataset.soundRun2='1';let seq=0;d.addEventListener('pointerdown',async e=>{const b=e.target.closest('button');if(!b)return;const ok=await ready();if(!ok)return;if(b.id==='bet'){seq=0;tick(162,.008);tone(machine,243,.055,.005,'sine',.018)}else if(b.id==='lever'){seq=0;tone(machine,55,.16,.011,'sine');tone(machine,110,.19,.004,'sine',.065)}else if(b.classList.contains('stop')&&!b.disabled){const i=+b.dataset.i;seq=Math.min(3,seq+1);if(seq===1)select(i);else collect(i,seq)}},{capture:true});const log=d.getElementById('log');if(log)new MutationObserver(()=>{const t=log.textContent||'';if(/NEW MEMORY|DEPTH|赤い連結|鍵と月|気泡/.test(t))memory(t)}).observe(log,{childList:true,subtree:true,characterData:true})};mid.addEventListener('load',bind,{once:false});bind()}outer.addEventListener('load',()=>{attach();setTimeout(attach,120)});document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden&&ac.state==='running')ac.suspend()});})();</script></body></html>
