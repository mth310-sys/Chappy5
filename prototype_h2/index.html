<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>H2 Timing Risk Test</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #111; color: #f7f7f7; display: grid; place-items: center; padding: 18px; }
    main { width: min(100%, 430px); display: grid; gap: 16px; }
    h1 { margin: 0; font-size: 1.35rem; }
    .goal { margin: 0; color: #d5d5d5; line-height: 1.45; }
    .card { background: #1b1b1b; border: 1px solid #333; border-radius: 18px; padding: 18px; }
    .row { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
    .label { color: #aaa; font-size: .9rem; }
    .value { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .meter { height: 22px; background: #2d2d2d; border-radius: 999px; overflow: hidden; margin-top: 10px; position: relative; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg,#40c463,#f6c945,#ff5b57); transition: width 40ms linear; }
    .danger-line { position: absolute; left: 82%; top: 0; bottom: 0; width: 3px; background: #fff; opacity: .9; }
    .danger-copy { display:flex; justify-content:space-between; margin-top:8px; font-size:.82rem; color:#aaa; }
    button { width: 100%; border: 0; border-radius: 18px; padding: 20px; font-size: 1.35rem; font-weight: 900; touch-action: manipulation; }
    #stopButton { background: #f3f3f3; color: #111; min-height: 76px; }
    #retryButton { background: #333; color: #fff; display:none; }
    #status { min-height: 2.8em; line-height:1.4; text-align:center; font-weight:700; }
    .best { text-align:center; color:#bbb; }
    .small { margin:0; color:#999; font-size:.8rem; line-height:1.4; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>どこまで待てる？</h1>
    <p class="goal">待つほどスコアUP。白線を越える前に <strong>STOP</strong> できれば獲得。</p>
  </header>

  <section class="card" aria-label="current round">
    <div class="row"><span class="label">いま獲得できるスコア</span><span id="score" class="value">0</span></div>
    <div class="meter" aria-label="risk meter">
      <div id="fill" class="fill"></div>
      <div class="danger-line" aria-hidden="true"></div>
    </div>
    <div class="danger-copy"><span>安全</span><span>白線 = BUST</span></div>
  </section>

  <button id="stopButton" type="button">STOP</button>
  <button id="retryButton" type="button">もう一回</button>

  <div id="status" aria-live="polite">自動で上がります。好きな瞬間にSTOP。</div>
  <div class="best">BEST <strong id="bestScore">0</strong></div>
  <p class="small">HYPOTHESIS TEST: deterministic timing threshold. No randomness, economy, progression, or monetization.</p>
</main>

<script>
(() => {
  const scoreEl = document.getElementById('score');
  const fillEl = document.getElementById('fill');
  const statusEl = document.getElementById('status');
  const stopButton = document.getElementById('stopButton');
  const retryButton = document.getElementById('retryButton');
  const bestScoreEl = document.getElementById('bestScore');

  const BUST_AT = 82; // deterministic and visibly marked; not a hidden probability.
  const ROUND_MS = 4200; // HYPOTHESIS tuning value, not a validated optimum.
  const SCORE_MAX = 1000;

  let startTime = 0;
  let rafId = 0;
  let state = 'idle';
  let progress = 0;
  let best = Number(localStorage.getItem('chappy5-h2-best') || 0);
  bestScoreEl.textContent = best;

  function potentialScore(p) {
    return Math.floor((p / BUST_AT) * SCORE_MAX);
  }

  function render() {
    fillEl.style.width = `${Math.min(progress, 100)}%`;
    scoreEl.textContent = Math.max(0, potentialScore(Math.min(progress, BUST_AT)));
  }

  function finish(kind) {
    if (state !== 'running') return;
    state = kind;
    cancelAnimationFrame(rafId);
    stopButton.disabled = true;
    stopButton.style.opacity = '.45';
    retryButton.style.display = 'block';

    if (kind === 'banked') {
      const banked = potentialScore(progress);
      if (banked > best) {
        best = banked;
        localStorage.setItem('chappy5-h2-best', String(best));
        bestScoreEl.textContent = best;
        statusEl.textContent = `BANKED ${banked}！ BEST更新。もっと白線ギリギリを狙える？`;
      } else {
        statusEl.textContent = `BANKED ${banked}。もっと待てば伸びる。でも白線を越えると0。`;
      }
    } else {
      scoreEl.textContent = '0';
      statusEl.textContent = 'BUST — 待ちすぎ。次は白線の手前でSTOP。';
    }
  }

  function tick(now) {
    if (state !== 'running') return;
    progress = ((now - startTime) / ROUND_MS) * 100;
    if (progress >= BUST_AT) {
      progress = BUST_AT;
      render();
      finish('bust');
      return;
    }
    render();
    rafId = requestAnimationFrame(tick);
  }

  function startRound() {
    cancelAnimationFrame(rafId);
    state = 'running';
    progress = 0;
    render();
    statusEl.textContent = '待つほどスコアUP。白線の前でSTOP。';
    retryButton.style.display = 'none';
    stopButton.disabled = false;
    stopButton.style.opacity = '1';
    startTime = performance.now();
    rafId = requestAnimationFrame(tick);
  }

  stopButton.addEventListener('click', () => finish('banked'));
  retryButton.addEventListener('click', startRound);

  startRound();
})();
</script>
</body>
</html>
