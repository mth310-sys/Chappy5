name: Verify Chappy5

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  prototype:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify prototype structure and JavaScript syntax
        run: node scripts/verify_prototype.mjs
