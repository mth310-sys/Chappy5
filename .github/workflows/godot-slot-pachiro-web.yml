name: Godot Slot Pachiro Web

on:
  push:
    branches: [main]
    paths:
      - 'godot/slot-pachiro/**'
      - '.github/workflows/godot-slot-pachiro-web.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-slot-pachiro-web
  cancel-in-progress: true

jobs:
  export-web:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.1
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true

      - name: Export Slot Pachiro directly into main Pages tree
        working-directory: godot/slot-pachiro
        run: |
          rm -rf ../../slot-pachiro-godot
          mkdir -p ../../slot-pachiro-godot
          godot --headless --path . --export-release Web ../../slot-pachiro-godot/index.html

      - name: Commit generated Web build to main
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f slot-pachiro-godot
          if git diff --cached --quiet; then
            echo "Godot Web build is already current."
          else
            git commit -m "build: publish Slot Pachiro Godot Web"
            git push origin HEAD:main
          fi
