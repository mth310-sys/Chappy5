name: ECHO DRIFT Regression

on:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'tests/**'
      - '.github/workflows/regression.yml'
  pull_request:
    paths:
      - 'game.js'
      - 'tests/**'
      - '.github/workflows/regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run deterministic state regression
        run: node tests/regression.mjs
