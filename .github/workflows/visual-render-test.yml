name: Visual Render Test

on:
  push:
    paths:
      - 'visual_test/**'
      - '.github/workflows/visual-render-test.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/visual-server.log 2>&1 &
          sleep 2
      - name: Capture iPhone 12 viewport screenshot
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          "$BROWSER" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=390,844 \
            --force-device-scale-factor=1 \
            --virtual-time-budget=8000 \
            --screenshot=visual-test-iphone12.png \
            http://127.0.0.1:4173/visual_test/
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-iphone12
          path: visual-test-iphone12.png
          retention-days: 7
